<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dizzy execution domain, board study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --ink:#F4DCC4; --dim:#A593BD; --board:#07060a;
  --c-command:#99CCFF; --c-procedure:#FF9100; --c-event:#FFCC99;
  --c-projection:#D4709F; --c-query:#A9A3FF; --c-model:#FFEE99; --c-table:#E3C465; --c-col:#E3C465;
  --chrome:#CC99CC; --chrome-2:#9373B8; --chrome-3:#3d3252; --pad:#FFF6CF;
  --lc:"Antonio","Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",sans-serif;
  --tx:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* a black-glass board in either theme */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--tx);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ── top rail: LCARS segments, cut at 45° instead of rounded ── */
.rail{flex:none;display:flex;gap:4px;align-items:stretch;padding:10px 12px 8px;min-height:54px}
.rail>*{height:36px;flex:none}
.r-tag{background:var(--chrome);color:#000;font:600 14px/36px var(--lc);text-transform:uppercase;letter-spacing:.04em;padding:0 14px 0 26px;clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px)}
.rail h1{margin:0;padding:0 14px 0 8px;font:700 30px/36px var(--lc);text-transform:uppercase;letter-spacing:.01em;color:var(--c-procedure);white-space:nowrap}
.r-fill{flex:1 1 10px;background:var(--chrome-3)}
.seg{background:var(--k,var(--chrome));color:#000;font:600 14px/36px var(--lc);text-transform:uppercase;letter-spacing:.04em;padding:0 14px;white-space:nowrap}
.seg[aria-pressed="false"]{background:#17131d;color:var(--k);box-shadow:inset 0 -4px 0 var(--k)}
.seg:hover{filter:brightness(1.15)}
.seg.sq{padding:0;width:36px;text-align:center;font-size:18px}
.r-cap{width:30px;background:var(--chrome);clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}

/* ── the wall ── */
.stage{flex:1;position:relative;min-height:0}
#wrap{position:absolute;inset:0;overflow:auto;background:var(--board);cursor:grab;touch-action:pan-x pan-y}
#wrap.drag{cursor:grabbing}
svg#board{display:block}
#board text{font-family:var(--lc);text-transform:uppercase;letter-spacing:.03em;pointer-events:none}
#board .silk{fill:var(--dim);font-weight:400;font-size:13px;letter-spacing:.12em}
#board .silk b{font-weight:700}
.halo{fill:none;stroke:var(--board)}
.tr{fill:none;opacity:.86;transition:opacity .18s}
.sig{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:3 17;opacity:0;pointer-events:none}
.sig.live{opacity:.95;animation:march .75s linear infinite}
@keyframes march{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.comp{cursor:pointer;outline:none;transition:opacity .18s}
.comp .body{stroke:transparent;stroke-width:2;paint-order:stroke}
.comp text{fill:#000;font-weight:600}
.comp .nm{font-weight:700}
.comp .sm{font-size:9.5px;letter-spacing:.07em;opacity:.72}
.pin{fill:var(--pad)}
.comp.hot .body,.comp:focus-visible .body{stroke:#fff;stroke-width:2.5}
.comp.on .body{stroke:#fff;stroke-width:4.5}
.has-sel .comp:not(.in):not(.keep):not(.hot):not(.on){opacity:.2}
.has-sel .tr:not(.in){opacity:.12}
.has-hot .tr:not(.hot){opacity:.24}
.has-sel.has-hot .tr:not(.hot):not(.in){opacity:.1}
.tr.hot{opacity:1}
.fk{fill:none;stroke:#6b5a2a;stroke-width:2.2}
.comp .body.model-box{fill:#0c0a07;stroke:#6b5a2a;stroke-width:2}
.comp.on .body.model-box{stroke:#fff}
.tbl .hd{fill:var(--c-table)}
.tbl text.tn{fill:#000;font-weight:700;font-size:14px}
.tbl text.tc{fill:#000;font-weight:600;font-size:11px;opacity:.7}
.col{cursor:pointer}
.col .row{fill:#15120c}
.col:nth-child(odd) .row{fill:#1b170f}
.col text{font-family:var(--mono)!important;text-transform:none!important;letter-spacing:0!important;font-size:10.5px;fill:#b9a67a}
.col text.rg{fill:#7d6f52;font-size:9.5px}
.col.pk text.cn{fill:var(--c-model);font-weight:700}
.wp,.rp{fill:#3a3223}
.col.w .wp,.tbl.w>.wp{fill:var(--c-projection)}
.col.r .rp,.tbl.r>.rp{fill:var(--c-query)}
.col.w .row,.col.r .row{fill:#2c2415}
.col.w text.cn,.col.r text.cn{fill:#fff}
.col.w.r .row{fill:#33283a}
.col:hover .row{fill:#3a301c}
.col.on .row{stroke:#fff;stroke-width:1.5}
.air{stroke:#fff;stroke-width:1;opacity:.55;pointer-events:none}
.hide-flow .L-flow,.hide-fold .L-fold,.hide-read .L-read,.hide-rel .L-rel{display:none}

/* ── inspector ── */
#insp{position:absolute;right:14px;bottom:14px;width:370px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);display:flex;flex-direction:column;background:#000;box-shadow:0 0 0 1px #2a2333,0 12px 40px #000}
#insp[hidden]{display:none}
.i-head{flex:none;display:flex;gap:4px;height:32px}
.i-kind{background:var(--k);color:#000;font:600 13px/32px var(--lc);text-transform:uppercase;letter-spacing:.05em;padding:0 10px 0 20px;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%,0 14px)}
.i-head h2{flex:1;min-width:0;margin:0 6px;font:700 22px/32px var(--lc);text-transform:uppercase;letter-spacing:.02em;color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-x{background:var(--k);color:#000;font:600 13px/32px var(--lc);text-transform:uppercase;letter-spacing:.05em;padding:0 12px}
.i-body{overflow:auto;padding:12px 14px 16px}
.i-body p{margin:0 0 10px}
.i-desc{max-height:9em;overflow:auto;padding-right:6px}
.i-meta{font:400 12px/1.3 var(--lc);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center;margin:0 0 10px}
.chips span{font:400 12px/1 var(--lc);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:4px}
.chip{background:var(--k);color:#000;font:600 12.5px/22px var(--lc);text-transform:uppercase;letter-spacing:.03em;height:22px;padding:0 9px}
.cols{margin:0 0 10px;font:12px/1.55 var(--mono);color:#d9c9a8}
.cols b{color:var(--c-table);font-weight:600}
.slots{border-collapse:collapse;margin:0 0 10px;width:100%;font-size:13.5px}
.slots td{padding:2px 10px 2px 0;border-bottom:1px solid #241d2e;vertical-align:baseline}
.slots td:first-child{font-family:var(--mono);font-size:12px;color:var(--c-event)}
.slots td:last-child{text-align:right;padding-right:0;color:var(--dim);font:400 11.5px/1 var(--lc);text-transform:uppercase;letter-spacing:.07em}
pre{margin:0;max-height:260px;overflow:auto;font:11.5px/1.5 var(--mono);color:#E9D6C2;tab-size:4;border-left:6px solid var(--k);padding-left:10px}
@media (max-width:720px){
  .rail{flex-wrap:wrap} .rail h1{font-size:22px} .r-fill,.r-cap{display:none}
  #insp{left:0;right:0;bottom:0;width:auto;max-width:none;max-height:46%}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .sig.live{stroke-dasharray:none;opacity:.5} }
</style>
</head>
<body>
<header class="rail">
  <span class="r-tag" id="tag"></span>
  <h1>Execution domain</h1>
  <span class="r-fill"></span>
  <button class="seg" data-layer="flow" aria-pressed="true" style="--k:var(--c-procedure)">Flow</button>
  <button class="seg" data-layer="fold" aria-pressed="true" style="--k:var(--c-projection)">Fold</button>
  <button class="seg" data-layer="read" aria-pressed="true" style="--k:var(--c-query)">Read</button>
  <button class="seg" data-layer="rel" aria-pressed="true" style="--k:var(--c-table)">Relations</button>
  <button class="seg sq" id="z-out" aria-label="Zoom out">−</button>
  <button class="seg" id="z-fit">Fit</button>
  <button class="seg sq" id="z-in" aria-label="Zoom in">+</button>
  <button class="seg" id="clear" style="--k:var(--c-command)">Clear</button>
  <span class="r-cap"></span>
</header>
<div class="stage">
  <div id="wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="The execution feat drawn as a circuit board"></svg></div>
  <aside id="insp" aria-live="polite"></aside>
</div>

<script type="application/json" id="data">{"title":"dizzy","description":"The execution domain: what the kernel was asked to run, what it attempted, and how each attempt ended. One append-only, content-addressed log per data directory, stored separately from the domain stores (one per application domain: core and each plugin) and never in a shared transaction with any of them. Queue state, dedupe, claims and fencing, outcomes, the abandon budget, the per-store watermark vector, per-domain reactor positions and the lifecycle telemetry (one span per attempt) are projections of this log; the `telemetry` sinks below observe what the log deliberately does not record. The domain stores alone are sufficient for application correctness; this log may be compacted or deleted and is rebuilt from the stores' causation blocks.","feat":"dizzy/engine/execution.feat.yaml","nodes":[{"id":"command:boot_kernel","kind":"command","name":"boot_kernel","desc":"Validate the domain bindings, open every bound domain's store and this log under the single-writer lock, fold this log, reconcile it against each bound store, catch up lagging domains, and record what recovery did","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class boot_kernel)"},{"id":"command:close_kernel","kind":"command","name":"close_kernel","desc":"The host ends the session in an orderly way: settle the completions that already returned, release every attempt still running, then stop. A close requested during an operation is only recorded: runs stop at their next safe point and the host's own close (outside any operation) dispatches it","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class close_kernel)"},{"id":"command:compact_log","kind":"command","name":"compact_log","desc":"Rotate to a new exec-log generation seeded by a snapshot of open work","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class compact_log)"},{"id":"command:publish_facts","kind":"command","name":"publish_facts","desc":"Hand newly durable facts to in-process subscribers (host-owned exporters)","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class publish_facts)"},{"id":"command:request_command","kind":"command","name":"request_command","desc":"Record intent to run an app command (type CURIE, canonical payload, optional idempotency key, priority) from an external source; the command's domain must be bound","intrinsic":false,"rt":[],"slots":[["type","string",true],["payload","string",true],["key","string",false],["priority","integer",true],["group","string",true]],"path":"def/commands.yaml (class request_command)"},{"id":"command:retry_command","kind":"command","name":"retry_command","desc":"Operator re-opens a failed command (by command_id); attempt numbering continues","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["by","string",false],["reason","string",false]],"path":"def/commands.yaml (class retry_command)"},{"id":"command:run_next","kind":"command","name":"run_next","desc":"Claim the head of the runnable order and run its unit of work: procedure, atomic append to its domain's store, per-event fold + commit + policies across every bound domain subscribed to the event","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class run_next)"},{"id":"event:attempt_abandoned","kind":"event","name":"attempt_abandoned","desc":"Recovery found a claim with no terminal fact and no app events carrying its attempt (attempt_id, command_id, abandons_so_far, detected_by_session, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["abandons_so_far","integer",true],["detected_by_session","string",true],["t","string",true]],"path":"def/events.yaml (class attempt_abandoned)"},{"id":"event:attempt_released","kind":"event","name":"attempt_released","desc":"The session ended in an orderly way (close_kernel) while this attempt was still running (attempt_id, command_id, session_id, t). Not a failure: the command returns to the runnable order and its next claim is attempt n+1. Unlike attempt_abandoned it does not count against abandon_budget \u2014 nothing crashed. Fenced like attempt_abandoned: a release naming an attempt that is not the command's live one is kept as a stale terminal.","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["session_id","string",true],["t","string",true]],"path":"def/events.yaml (class attempt_released)"},{"id":"event:command_claimed","kind":"event","name":"command_claimed","desc":"Attempt n of a command started (attempt_id, command_id, attempt_no, session_id, group \u2014 the topology group that claimed it, mirrors the request's group unless a topology swap landed between request and claim (\u00a713), store_seq_at_claim, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["attempt_no","integer",true],["session_id","string",true],["store_seq_at_claim","integer",true],["t","string",true],["group","string",true]],"path":"def/events.yaml (class command_claimed)"},{"id":"event:command_completed","kind":"event","name":"command_completed","desc":"A unit settled (attempt_id, command_id, command_type, domain prefix \u2014 the store the unit was appended to, group \u2014 denormalized from the claim, same pattern as domain (\u00a713), outcome completed|no_result, reason?, detail?, app_events [ids], app_through? \u2014 last event in that store, absent for no_result, bound [prefix] \u2014 domains whose elements ran on the unit, dispatched [{policy, trigger_event, index, command_id, deduped}], recovered bool, timings {procedure_ns, append_ns, folds {name: ns}, policies {name: ns}}, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["command_type","string",true],["domain","string",true],["outcome","string",true],["recovered","boolean",true],["t","string",true],["group","string",true],["reason","string",false],["detail","string",false],["app_through","string",false]],"path":"def/events.yaml (class command_completed)"},{"id":"event:command_failed","kind":"event","name":"command_failed","desc":"A unit failed BEFORE anything reached the app log \u2014 terminal (attempt_id, command_id, group \u2014 denormalized from the claim (\u00a713), stage decode|procedure|contract|encode|append|abandoned, error_type, message, traceback, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["stage","string",true],["error_type","string",true],["message","string",true],["traceback","string",true],["t","string",true],["group","string",true]],"path":"def/events.yaml (class command_failed)"},{"id":"event:command_requested","kind":"event","name":"command_requested","desc":"An app command became intent (command_id, command_type CURIE, domain prefix, group \u2014 the topology group the bound GroupPlan assigns this command's type, \"default\" when no topology is bound (\u00a713), payload canonical-JSON, payload_hash, key?, source external|policy|recovered, policy CURIE?, trigger_event event-id?, trigger_domain prefix?, dispatch_index?, priority, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["command_type","string",true],["domain","string",true],["payload","string",true],["payload_hash","string",true],["source","string",true],["priority","integer",true],["t","string",true],["group","string",true],["key","string",false],["policy","string",false],["trigger_event","string",false],["trigger_domain","string",false],["dispatch_index","integer",false]],"path":"def/events.yaml (class command_requested)"},{"id":"event:command_retried","kind":"event","name":"command_retried","desc":"An operator re-opened a failed command (command_id, by, reason?, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["by","string",true],["t","string",true],["reason","string",false]],"path":"def/events.yaml (class command_retried)"},{"id":"event:domain_attached","kind":"event","name":"domain_attached","desc":"A domain was bound that this generation's map does not know, or its feat_hash changed (prefix, id, feat_hash, log_id, requires [prefix], t)","intrinsic":false,"rt":[],"slots":[["prefix","string",true],["feat_hash","string",true],["log_id","string",true],["t","string",true],["requires","string",false]],"path":"def/events.yaml (class domain_attached)"},{"id":"event:domain_caught_up","kind":"event","name":"domain_caught_up","desc":"A re-enabled domain's elements replayed the units it missed while unbound (domain prefix, from {prefix: event id}, to {prefix: event id}, units, dispatched [command_id], t)","intrinsic":false,"rt":[],"slots":[["domain","string",true],["units","integer",true],["t","string",true]],"path":"def/events.yaml (class domain_caught_up)"},{"id":"event:foreign_settled","kind":"event","name":"foreign_settled","desc":"Recovery settled a causeless (replicated / foreign) one-event unit past its store's watermark \u2014 that unit's completion (domain prefix, event event-id, bound [prefix], dispatched [{policy, trigger_event, index, command_id, deduped}], timings {folds, policies}, t)","intrinsic":false,"rt":[],"slots":[["domain","string",true],["event","string",true],["t","string",true]],"path":"def/events.yaml (class foreign_settled)"},{"id":"event:kernel_booted","kind":"event","name":"kernel_booted","desc":"A kernel process took the single-writer lock and finished recovery (session_id, pid, host, bound [prefix], unbound [prefix], through {prefix: event id}, units_settled {prefix: n}, attempts_abandoned, requests_rederived, boot_ms, t)","intrinsic":false,"rt":[],"slots":[["session_id","string",true],["pid","integer",true],["host","string",true],["attempts_abandoned","integer",true],["requests_rederived","integer",true],["boot_ms","integer",true],["t","string",true]],"path":"def/events.yaml (class kernel_booted)"},{"id":"event:log_opened","kind":"event","name":"log_opened","desc":"Genesis of an exec-log generation (log_id, generation, kernel_version, domains {prefix: {id, feat_hash, log_id, requires [prefix]}} \u2014 the full accumulated map, unbound domains included; previous {log_id, heads}?, recovered_from none|snapshot|app_log, t)","intrinsic":false,"rt":[],"slots":[["log_id","string",true],["generation","integer",true],["kernel_version","string",true],["recovered_from","string",true],["t","string",true]],"path":"def/events.yaml (class log_opened)"},{"id":"event:request_repeated","kind":"event","name":"request_repeated","desc":"An external request named an existing command_id and was answered, not re-queued (command_id, status at the time, answered_from exec|app_log, command_type CURIE?, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["status","string",true],["answered_from","string",true],["t","string",true],["command_type","string",false]],"path":"def/events.yaml (class request_repeated)"},{"id":"event:snapshot_taken","kind":"event","name":"snapshot_taken","desc":"Seeds a new generation right after log_opened (open_work [full command_requested + attempt_no + abandons + releases + live attempt, parked work included], retry state, through {prefix: event id}, reacted {domain: {prefix: event id}}, seqs {prefix: n}, covers_heads {prefix: [heads]}, answered [external commands that finished no_result: id, type, status, payload_hash, key, since \u2014 dedupe memory the app log cannot answer, carried for answered_generations compactions], bound [domains of the compacting session], session_id, t)","intrinsic":false,"rt":[],"slots":[["t","string",true],["session_id","string",false]],"path":"def/events.yaml (class snapshot_taken)"},{"id":"event:subscriber_detached","kind":"event","name":"subscriber_detached","desc":"A host subscriber raised and was detached; nothing is retried inline (subscriber, last_fact_seq, error_type, message, t)","intrinsic":false,"rt":[],"slots":[["subscriber","string",true],["last_fact_seq","integer",true],["error_type","string",true],["message","string",true],["t","string",true]],"path":"def/events.yaml (class subscriber_detached)"},{"id":"event:unit_settle_failed","kind":"event","name":"unit_settle_failed","desc":"A unit's events landed in the app log but a fold, commit or policy raised \u2014 NOT terminal; the kernel halts and the next boot replays the unit (attempt_id, command_id \u2014 both empty for a causeless foreign unit, domain prefix, stage fold|commit|policy, element qualified prefix:name, at_event event-id, at_index, error_type, message, traceback, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["domain","string",true],["stage","string",true],["element","string",true],["at_event","string",true],["at_index","integer",true],["error_type","string",true],["message","string",true],["traceback","string",true],["t","string",true]],"path":"def/events.yaml (class unit_settle_failed)"},{"id":"procedure:close_session","kind":"procedure","name":"close_session","desc":"End the session in an orderly way. close_kernel is dispatched only by a close called outside any kernel operation (the host's own call, or leaving its with block). A close called while an operation is in progress (a running step or run, a procedure, a subscriber) is only recorded, with no I/O, exactly like request_close: a host flag, not a command and not a fact, settable at any point. From then on nothing new is claimed or requested, the unit in progress finishes, and every run stops at its next safe point reporting close_requested; it is never performed implicitly. A poisoned kernel's close always cleans up at once (no fact). Supported for signal handlers: request_close only (close from a handler is unsupported: between operations it would run this whole procedure on top of the interrupted host code); KeyboardInterrupt and SystemExit poison the kernel (safe, the next boot recovers); raising any other exception into the kernel is unsupported. Refused only from one of the kernel's own pool procedures. Once close_kernel is accepted the session is closing: no command is claimed, and none is requested from outside, after it (a nested close is a no-op). Unless the kernel is halted, settle every pool completion that already returned, exactly as run_unit settles a drained unit (their policies' dispatches are recorded for the next session). Then append one attempt_released per attempt still running, in one exec transaction; those attempts are no longer in flight, and a completion that still arrives for one is discarded, never settled. Then deliver to subscribers. A halted kernel's log is consistent (its halt is recorded), so it still releases what is running; a poisoned kernel writes nothing and the next boot treats its open claims as a crash. Never waits for a running procedure. A completion it settles is reported as unit_appended, as run_unit reports one. Once the lock is released, session_closed reports how the session ended (closed, or crashed for a poisoned kernel, whose close is not dispatched) and what the close settled and released.","intrinsic":true,"rt":[]},{"id":"procedure:notify_subscribers","kind":"procedure","name":"notify_subscribers","desc":"After each exec commit, call each subscriber with the new facts in order. A subscriber that raises is detached and subscriber_detached is appended; the unit of work is never affected. Runs inline after every exec append rather than as a dispatched publish_facts.","intrinsic":true,"rt":[]},{"id":"procedure:record_request","kind":"procedure","name":"record_request","desc":"The command's domain must be bound, else raise DomainNotBound and append nothing. Derive command_id. If it is known here, or a bound store carries a unit for it, append request_repeated and return the existing status. A keyed request whose payload_hash differs raises CommandKeyConflict and appends nothing. Otherwise append command_requested, stamped with its topology group (\u00a713).","intrinsic":false,"rt":["p ":"projection:repeats","kind":"projection","name":"repeats","desc":"request_repeated \u2192 when the command it names is known here, its repeats += 1 (this generation's count of external requests answered with it instead of queued again). A command answered from the snapshot's memory or the app log has no row here and nothing changes.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/repeats/src/repeats.py","code":"from gen_int.python.projection.repeats_projection import repeats_context\nfrom gen_def.pydantic.events import RequestRepeated\n\n\ndef repeats(\n    event: RequestRepeated,\n    context: repeats_context,\n) -> None:\n    \"\"\"An external request answered with an existing command: this generation's count.\"\"\"\n    store = context.adapter.store\n    view = store.work.get(event.command_id)\n    if view is not None:  # answered from snapshot memory or the app log: no row here\n        view.repeats += 1\n","writes":["Command"],"cols":{"Command":["repeats"]}},{"id":"projection:requests","kind":"projection","name":"requests","desc":"command_requested \u2192 a command_id not yet known becomes a Command row with status requested, ordered after everything requested before it, and joins its group's runnable order if its domain is bound (parked otherwise). A known command_id is left unchanged.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/requests/src/requests.py","code":"from gen_int.python.projection.requests_projection import requests_context\nfrom gen_def.pydantic.events import CommandRequested\n\nfrom dizzy.engine.execution.state import CommandView\n\n\ndef requests(\n    event: CommandRequested,\n    context: requests_context,\n) -> None:\n    \"\"\"A new command becomes a requested row, ordered after everything requested before\n    it (runnable if its domain is bound, parked otherwise); a known one is unchanged.\"\"\"\n    store = context.adapter.store\n    if event.command_id in store.work:\n        return\n    store.insert_command(\n        CommandView(\n            request=event,\n            status=\"requested\",\n            order=store.order_base + context.envelope.seq,\n        )\n    )\n","writes":["Generation","Command"],"cols":{"Command":["command_id","command_type","domain","group","payload","payload_hash","key","source","policy","trigger_event","trigger_domain","dispatch_index","priority","requested_at","status","order"]}},{"id":"projection:retries","kind":"projection","name":"retries","desc":"command_retried \u2192 a failed command becomes requested again, failure cleared, abandons reset to 0, ordered after everything requested so far, and rejoins the runnable heap.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/retries/src/retries.py","code":"from gen_int.python.projection.retries_projection import retries_context\nfrom gen_def.pydantic.events import CommandRetried\n\nfrom dizzy.engine.errors import IntegrityError\n\n\ndef retries(\n    event: CommandRetried,\n    context: retries_context,\n) -> None:\n    \"\"\"Only a failed command can be retried: requested again, at the back of the order.\"\"\"\n    store = context.adapter.store\n    view = store.known(event.command_id, event)\n    if view.status != \"failed\":\n        raise IntegrityError(f\"retry of command {event.command_id[:12]} in status {view.status}\")\n    view.status = \"requested\"\n    view.failure = None\n    view.abandons = 0  # a retry is a fresh budget\n    view.order = store.order_base + context.envelope.seq  # a retry goes to the back\n    store.enqueue(view)\n","writes":["Generation","Command","Failure"],"cols":{"Command":["status","abandons","order"],"Failure":"*"}},{"id":"projection:settle_failures","kind":"projection","name":"settle_failures","desc":"unit_settle_failed \u2192 the command, if known and not terminal, is marked pending settlement; the kernel is halted on that attempt (on the event itself for a causeless foreign unit) until the next kernel_booted. = context.adapter.store\n    store.work = {}\n    for ow in event.open_work:\n        store.work[ow.request.command_id] = CommandView(\n            request=ow.request,\n            status=ow.status,\n            order=ow.order,\n            attempt_no=ow.attempt_no,\n            live_attempt=ow.live_attempt,\n            abandons=ow.abandons,\n            releases=ow.releases,\n            pending_settlement=ow.pending_settlement,\n            claimed_group=ow.claimed_group,\n        )\n    store.answered = {a.command_id: a for a in event.answered}\n    if event.session_id is not None:\n        store.last_session = event.session_id\n    store.through = dict(event.through)\n    store.reacted = {d: dict(m) for d, m in event.reacted.items()}\n    # Exec seqs restart at 1 in every generation: orders continue past the largest one\n    # carried, so they stay monotonic.\n    store.order_base = max((ow.order for ow in event.open_work), default=store.order_base)\n    store.rebuild_indexes()\n","writes":["Generation","Domain","Reaction","Command","Attempt","Answered"],"cols":{"Command":"*","Attempt":"*","Answered":"*","Generation":["last_session","order_base"],"Domain":["through"],"Reaction":["domain","store","event"]}},{"id":"query:app_watermark","kind":"query","name":"app_watermark","desc":"The watermark vector through {prefix: event id} and the domain map used for pairing","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/query/app_watermark/src/app_watermark.py","code":"from gen_int.python.query.app_watermark import app_watermark_query, app_watermark_context\nfrom gen_def.pydantic.query.app_watermark import AppWatermarkInput, AppWatermarkOutput, StringMapEntry\n\n\ndef app_watermark(input: AppWatermarkInput, context: app_watermark_context) -> AppWatermarkOutput:\n    through, _domains = context.adapter.state.app_watermark()\n    return AppWatermarkOutput(\n        through=[StringMapEntry(key=k, value=v) for k, v in through.items()]\n    )\n","cols":{"Domain":["prefix","through"]}},{"id":"query:causation_lookup","kind":"query","name":"causation_lookup","desc":"Whether a landed, caused unit already exists for one command_id, and its payload_hash from the cause meta \u2014 ground truth read directly from the bound domain stores' causation blocks (engine/execution/order.py's CausationIndex), independent of whether the exec log still remembers the command (compacted away, or lost and rebuilt from the app log, \u00a77). Not a projection of THIS log \u2014 record_request needs it precisely because the exec log's own command/answered memory can lag or lose this fact while a domain store's own causation block never does.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/query/causation_lookup/src/causation_lookup.py","code":"from gen_int.python.query.causation_lookup import causation_lookup_query, causation_lookup_context\nfrom gen_def.pydantic.query.causation_lookup import CausationLookupInput, CausationLookupOutput\n\n\ndef causation_lookup(\n    input: CausationLookupInput, context: causation_lookup_context\n) -> CausationLookupOutput:\n    has_unit, payload_hash = context.adapter.state.causation_lookup(input.command_id)\n    return CausationLookupOutput(has_unit=has_unit, payload_hash=payload_hash)\n","cols":{"Command":["command_id","payload_hash"]}},{"id":"query:command_status","kind":"query","name":"command_status","desc":"Status, attempts, outcome and live attempt of one command_id","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/query/command_status/src/command_status.py","code":"from gen_int.python.query.command_status import command_status_query, command_status_context\nfrom gen_def.pydantic.query.command_status import CommandStatusInput, CommandStatusOutput\n\n\ndef command_status(input: CommandStatusInput, context: command_status_context) -> CommandStatusOutput:\n    \"\"\"record_request/record_retry's own key-conflict decision tree (see the\n    query's own description, docs/design/engine-domains.m rough this generated query) and nothing else calls\n    this one. Returns no lag rather\n    than guessing a readable map.\"\"\"\n    return ReactorLagOutput(lagging_domains=[])\n","cols":{"Domain":["prefix","through"],"Reaction":["domain","store","event"]}},{"id":"model:execution","kind":"model","name":"execution","desc":"The execution domain's state as ONE relational database (def/models/execution.yaml): the generation (log id, order base, last fold position, halt, last session); the domain map, each domain's store watermark (through) and what it requires; per-domain reaction positions (reacted: how far each domain's elements processed each store); every command known here with its request and lifecycle (status requested|claimed|completed|no_result|failed, attempt_no, abandons charged by crashes, releases by orderly closes, pending settlement); the live attempt of each claimed command; each failed command's failure; the no_result dedupe memory a snapshot carries (answered); and, for this generation only, fenced stale terminals and detached subscribers. One database rather than two: one fact updates several tables (a completion moves a command's status AND its store's watermark), and the invariants span them. The runnable order (per-group min-heaps of (priority, order) over bound domains; an unbound domain's commands are parked), the round-robin cursor across groups (\u00a713) and the bound partition are INDEXES over these tables, not tables. In-memory; rebuilt by fold at boot.","intrinsic":false,"rt":[],"path":"def/models/execution.yaml","tables":[{"id":"Generation","kind":"table","rows":[["log_id","string",["PK"]],["number","integer",["req"]],["order_base","integer",["req"]],["last_seq","integer",["req"]],["halted","string",[]],["last_session","string",[]]]},{"id":"Domain","kind":"table","rows":[["prefix","string",["PK"]],["generation","Generation",["FK","req"]],["feat","string",["req"]],["feat_hash","string",["req"]],["store_log","string",["req"]],["through","st const N = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const L = D.links;
const out = (id, k) => L.filter(l => l[0] === id && l[2] === k).map(l => l[1]);
const inn = (id, k) => L.filter(l => l[1] === id && l[2] === k).map(l => l[0]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const MODEL = D.nodes.find(n => n.kind === 'model'), M = MODEL.id;
const TABLES = MODEL.tables, TB = Object.fromEntries(TABLES.map(t => [t.id, t]));
const CMDS = ['boot_kernel','request_command','run_next','retry_command','compact_log','publish_facts','close_kernel'].map(n => 'command:' + n);
const PROCS = CMDS.map(c => out(c, 'handles')[0]);
const QS = out(M, 'serves').slice().sort((a, b) => out(a, 'reads').length - out(b, 'reads').length);
const bary = e => { const p = inn(e, 'emits').map(x => PROCS.indexOf(x)); return p.reduce((a, b) => a + b, 0) / p.length; };
const EVS = D.nodes.filter(n => n.kind === 'event').map(n => n.id).sort((a, b) => bary(a) - bary(b));
const PJ = e => out(e, 'feeds')[0];

const kindOf = id => id.startsWith('table:') ? 'table' : id.startsWith('col:') ? 'col' : N[id] ? N[id].kind : 'bus';
const nameOf = id => id.startsWith('table:') ? id.slice(6) : id.startsWith('col:') ? id.slice(4) : N[id].name;
const colsOf = id => { const c = N[id].cols || {}, r = [];
  for (const t in c) (c[t] === '*' ? TB[t].rows.map(x => x[0]) : c[t]).forEach(n => r.push('col:' + t + '.' + n)); return r; };
const starOf = id => Object.keys(N[id].cols || {}).filter(t => N[id].cols[t] === '*');
const WR = {}, RD = {};                 // column -> projections that write it, queries that read it
D.nodes.forEach(n => { if (n.kind === 'projection') colsOf(n.id).forEach(c => (WR[c] = WR[c] || []).push(n.id));
                       if (n.kind === 'query') colsOf(n.id).forEach(c => (RD[c] = RD[c] || []).push(n.id)); });
const tableCols = t => TB[t].rows.map(r => 'col:' + t + '.' + r[0]);
const uniq = a => [...new Set(a)];

function slice(cmd){
  const proc = out(cmd, 'handles')[0], events = out(proc, 'emits'), queries = inn(proc, 'reads');
  return [cmd, proc, ...events, ...events.map(PJ), ...queries, M, 'foldbus', ...(queries.length ? ['readbus'] : [])];
}
function related(id){
  const k = kindOf(id);
  if (k === 'command') return slice(id);
  if (k === 'procedure') return [id, ...inn(id,'handles'), ...out(id,'emits'), ...inn(id,'reads')];
  if (k === 'event') return [id, ...inn(id,'emits'), PJ(id), M];
  if (k === 'projection') return [id, ...inn(id,'feeds'), M];
  if (k === 'query') return [id, M, ...out(id,'reads')];
  if (k === 'col') return [id, M, ...(WR[id]||[]), ...(RD[id]||[])];
  if (k === 'table') return uniq([id, M, ...tableCols(id.slice(6)).flatMap(c => [...(WR[c]||[]), ...(RD[c]||[])])]);
  return [id, ...TABLES.map(t => 'table:' + t.id)];
}

/* ════ geometry: everything is placed from the graph, sizes come from connections ════ */
const X = { edge:10, cmd:30, cmdW:140, aT:188, aP:11, proc:296, procW:190, bT:506, bP:14, ev:620, evW:180, pj:820,
            fold:1048, m:1084, tW:200, tG:36, mPadL:40, mPadR:16 };
X.mW = X.mPadL + 3*X.tW + 2*X.tG + X.mPadR; X.mR = X.m + X.mW; X.read = X.mR + 34; X.q = X.read + 32; X.qW = 152; X.qR = X.q + X.qW;
X.rT = X.qR + 14; X.rP = 9; X.host = X.rT + QS.length*X.rP + 14; X.hostW = 86; const W = X.host + X.hostW + 24;
const TOP = 70, G = {}, PADS = {};

const evH = e => Math.max(36, 16 + 18*inn(e,'emits').length);
let y = TOP; EVS.forEach(e => { const h = evH(e); G[e] = {x:X.ev, y, w:X.evW, h, cy:y + h/2}; y += h + 12; });
const evBottom = y - 12;
const ncols = p => colsOf(p).length;
EVS.forEach(e => { const p = PJ(e), g = G[e]; G[p] = {x:X.pj, y:g.y, w:Math.round(98 + 2.5*ncols(p)), h:g.h, cy:g.cy}; });

const reads = p => inn(p,'reads').sort((a, b) => QS.indexOf(a) - QS.indexOf(b));
const procH = p => Math.max(30 + 16*(1 + reads(p).length), 40 + 9*(out(p,'emits').length + reads(p).length));
const sumP = PROCS.reduce((s, p) => s + procH(p), 0), pGap = Math.max(24, (evBottom - TOP - sumP) / (PROCS.length - 1));
y = TOP; PROCS.forEach(p => { const h = procH(p); G[p] = {x:X.proc, y, w:X.procW, h, cy:y + h/2, pad:k => y0(p) + 36 + 16*k}; y += h + pGap; });
function y0(p){ return G[p].y; }
const procBottom = y - pGap;
CMDS.forEach((c, i) => { const p = PROCS[i], h = 26 + 2*out(p,'emits').length, cy = G[p].pad(0); G[c] = {x:X.cmd, y:cy - h/2, w:X.cmdW, h, cy}; });

/* the model: three columns of tables, lanes on top for long relations */
const TL = [['Generation','Domain','Reaction','DetachedSubscriber'], ['Command'], ['Attempt','Failure','Answered','StaleTerminal']];
const HD = 22, RH = 15, mPadT = 42;
const colH = c => c.reduce((s, t) => s + HD + RH*TB[t].rows.length, 0) + 18*(c.length - 1);
const mH = mPadT + Math.max(...TL.map(colH)) + 18;
const mY = TOP + 18 + Math.max(0, (evBottom - TOP - mH) / 2 - 60);
G[M] = {x:X.m, y:mY, w:X.mW, h:mH, cy:mY + mH/2};
const tcx = i => X.m + X.mPadL + i*(X.tW + X.tG);
TL.forEach((c, ci) => { let ty = mY + mPadT; c.forEach(t => { const h = HD + RH*TB[t].rows.length;
  G['table:'+t] = {x:tcx(ci), y:ty, w:X.tW, h, cy:ty + HD/2, ci};
  TB[t].rows.forEach((r, i) => { G['col:'+t+'.'+r[0]] = {x:tcx(ci), y:ty + HD + i*RH, w:X.tW, h:RH, cy:ty + HD + i*RH + RH/2}; });
  ty += h + 18; }); });

const qH = q => 34 + 14*out(q,'reads').length;
y = mY; QS.forEach(q => { const h = qH(q); G[q] = {x:X.q, y, w:X.qW, h, cy:y + h/2}; y += h + 14; });
const HOSTQ = QS.filter(q => !out(q,'reads').length);
const BOT = Math.max(evBottom, procBottom, mY + mH, y) + 34;
const H = BOT + QS.length*X.rP + 46;

/* ════ drawing helpers ════ */
function cham(pts, d = 9){             // every corner becomes a 45° cut
  const o = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){
    const [ax,ay] = pts[i-1], [bx,by] = pts[i], [cx,cy] = pts[i+1];
    const l1 = Math.hypot(bx-ax, by-ay), l2 = Math.hypot(cx-bx, cy-by);
    if (l1 < .01 || l2 < .01) continue;
    if (Math.abs((bx-ax)*(cy-by) - (by-ay)*(cx-bx)) < .01) continue;
    const k = Math.min(d, l1/2, l2/2);
    o.push([bx - (bx-ax)/l1*k, by - (by-ay)/l1*k], [bx + (cx-bx)/l2*k, by + (cy-by)/l2*k]);
  }
  o.push(pts[pts.length-1]);
  return 'M' + o.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
}
const SIG = [];
function net(layer, color, paths){     // halos first, so a net bridges others but never nicks itself
  let h = '';
  paths.forEach(p => { p.d = cham(p.pts, p.c); h += `<path class="halo" d="${p.d}" stroke-width="${p.w + 5}"/>`; });
  paths.forEach(p => { h += `<path class="tr" data-a="${p.a}" data-b="${p.b}" d="${p.d}" stroke="${color}" stroke-width="${p.w}"/>`; });
  return `<g class="L-${layer}">${h}</g>`;
}
const sig = (layer, a, b, pts, c) => SIG.push(`<path class="sig L-${layer}" data-a="${a}" data-b="${b}" d="${cham(pts, c)}"/>`);
function poly(g, c = {}){              // a block with 45° corners
  const {x, y, w, h} = g, tl = c.tl||0, tr = c.tr||0, br = c.br||0, bl = c.bl||0;
  return `${x+tl},${y} ${x+w-tr},${y} ${x+w},${y+tr} ${x+w},${y+h-br} ${x+w-br},${y+h} ${x+bl},${y+h} ${x},${y+h-bl} ${x},${y+tl}`;
}
const pin = (x, y) => `<rect class="pin" x="${x-3.5}" y="${y-4}" width="7" height="8"/>`;
const txt = (x, y, s, cls, size, anchor, max) => `<text class="${cls}" x="${x}" y="${y}" dy=".36em" font-size="${size}"${anchor ? ` text-anchor="${anchor}"` : ''}${max ? ` data-max="${max}"` : ''}>${esc(s)}</text>`;
const comp = (id, kind, label, inner, extra = '') => `<g class="comp k-${kind} ${extra}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(label)}"><title>${esc(label)}</title>${inner}</g>`;

/* ════ traces ════ */
let T_FLOW = '', T_FOLD = '', T_READ = '', T_REL = '', C = '';

// command → procedure: a straight finger into the command pin
CMDS.forEach((c, i) => { const p = PROCS[i], g = G[c], w = 5 + .7*out(p,'emits').length, pts = [[g.x + g.w, g.cy], [X.proc, g.cy]];
  T_FLOW += net('flow', 'var(--c-command)', [{pts, w, a:c, b:p}]); sig('flow', c, p, pts); });

// procedure → events: one fat trunk per procedure, a thin 45° branch per event
PROCS.forEach((p, i) => { const g = G[p], tx = X.bT + i*X.bP, es = out(p,'emits'), paths = [];
  const pinY = e => { const ins = inn(e,'emits').sort((a, b) => PROCS.indexOf(a) - PROCS.indexOf(b)), k = ins.indexOf(p); return G[e].cy + (k - (ins.length - 1)/2)*18; };
  const ys = es.map(pinY), fat = 4 + .9*es.length;
  if (es.length > 1) [Math.min(...ys), Math.max(...ys)].forEach(ye => { if (Math.abs(ye - g.cy) > 12)
    paths.push({pts:[[g.x + g.w, g.cy], [tx, g.cy], [tx, ye + (ye < g.cy ? 10 : -10)]], w:fat, a:p, b:p, c:10}); });
  es.forEach((e, k) => { const pts = [[g.x + g.w, g.cy], [tx, g.cy], [tx, ys[k]], [X.ev, ys[k]]];
    paths.push({pts, w:4, a:p, b:e, c:10}); sig('flow', p, e, pts, 10); PADS[p + '>' + e] = ys[k]; });
  T_FLOW += net('flow', 'var(--c-procedure)', paths); });

// event → projection, then every projection merges onto the fold bus into the model
const inY = G[M].cy, foldPaths = [];
EVS.forEach(e => { const p = PJ(e), g = G[e], pg = G[p], w = 4 + 2*inn(e,'emits').length, pts = [[g.x + g.w, g.cy], [pg.x, g.cy]];
  T_FOLD += net('fold', 'var(--c-event)', [{pts, w, a:e, b:p}]); sig('fold', e, p, pts);
  const full = [[pg.x + pg.w, pg.cy], [X.fold, pg.cy], [X.fold, inY], [X.m, inY]];
  foldPaths.push({pts:full, w:4, a:p, b:M, c:10}); sig('fold', p, M, full, 10); });
const pys = EVS.map(e => G[e].cy);
[Math.min(...pys), Math.max(...pys)].forEach(ye => foldPaths.unshift({pts:[[X.fold, ye + (ye < inY ? 10 : -10)], [X.fold, inY], [X.m, inY]], w:13, a:'foldbus', b:'foldbus', c:10}));
T_FOLD += net('fold', 'var(--c-projection)', foldPaths);

// model → queries on the read bus
const readPaths = [], qys = QS.map(q => G[q].cy);
[Math.min(...qys), Math.max(...qys)].forEach(ye => readPaths.push({pts:[[X.mR, inY], [X.read, inY], [X.read, ye + (ye < inY ? 10 : -10)]], w:10, a:'readbus', b:'readbus', c:10}));
QS.forEach(q => { const pts = [[X.mR, inY], [X.read, inY], [X.read, G[q].cy], [X.q, G[q].cy]]; readPaths.push({pts, w:4, a:M, b:q, c:10}); sig('read', M, q, pts, 10); });
T_READ += net('read', 'var(--c-query)', readPaths);

// queries → procedures: the return path, nested under the board and back up the left channel
const nQ = QS.length;
QS.forEach((q, j) => { const g = G[q], rs = out(q,'reads');
  if (!rs.length){ const pts = [[X.qR, g.cy], [X.host, g.cy]]; T_READ += net('read', 'var(--c-query)', [{pts, w:4, a:q, b:'host'}]); return; }
  const xr = X.rT + (nQ - 1 - j)*X.rP, yb = BOT + (nQ - 1 - j)*X.rP, xa = X.aT + j*X.aP;
  const paths = rs.map(p => { const py = G[p].pad(1 + reads(p).indexOf(q));
    const pts = [[X.qR, g.cy], [xr, g.cy], [xr, yb], [xa, yb], [xa, py], [X.proc, py]];
    sig('read', q, p, pts, 8); return {pts, w:3.5, a:q, b:p, c:8}; });
  T_READ += net('read', 'var(--c-query)', paths); });

// relations inside the model
const FKX = {Generation:[-10, 12, 19, mY + 16], Domain:[-19, 24, 27, mY + 25], Command:[0, 0, 10, 0]};
TABLES.forEach(t => t.rows.forEach(r => { if (!r[2].includes('FK') || !TB[r[1]]) return;
  const s = G['col:' + t.id + '.' + r[0]], sg = G['table:' + t.id], tg = G['table:' + r[1]], k = FKX[r[1]]; let pts;
  if (sg.ci === tg.ci) pts = [[s.x, s.cy], [s.x + k[0], s.cy], [s.x + k[0], tg.cy], [tg.x, tg.cy]];
  else if (sg.ci === tg.ci + 1){ const x = tg.x + tg.w + (tg.ci === 0 ? k[1] : k[2]); pts = [[s.x, s.cy], [x, s.cy], [x, tg.cy], [tg.x + tg.w, tg.cy]]; }
  else { const x2 = tcx(1) + X.tW + k[2], x1 = tcx(0) + X.tW + k[1]; pts = [[s.x, s.cy], [x2, s.cy], [x2, k[3]], [x1, k[3]], [x1, tg.cy], [tg.x + tg.w, tg.cy]]; }
  const d = cham(pts, 6); T_REL += `<path class="halo" d="${d}" stroke-width="6"/><path class="fk" d="${d}"/>`; }));

/* ════ components ════ */
C += `<rect x="${X.edge}" y="${TOP - 24}" width="${X.cmd - X.edge}" height="${BOT - TOP + 24}" fill="var(--chrome-2)"/>`;
CMDS.forEach((c, i) => { const g = G[c], n = out(PROCS[i],'emits').length;
  C += comp(c, 'command', `Command ${N[c].name}`, `<polygon class="body" points="${poly(g, {tr:9, br:9})}" fill="var(--c-command)"/>`
    + txt(g.x + g.w - 16, g.cy, N[c].name, 'nm', 13.5 + .25*n, 'end', g.w - 28) + pin(g.x + g.w, g.cy)); });

PROCS.forEach((p, i) => { const g = G[p], n = N[p], rs = reads(p), deg = out(p,'emits').length + rs.length;
  let s = `<polygon class="body" points="${poly(g, {tl:13})}" fill="var(--c-procedure)"/>`
    + txt(g.x + g.w - 12, g.y + 19, n.name, 'nm', Math.min(22, 14 + .55*deg), 'end', g.w - 52) + txt(g.x + 18, g.y + 18, 'U' + (i + 1), 'sm', 9.5)
    + txt(g.x + 12, g.pad(0), 'command', 'sm', 9.5) + pin(g.x, g.pad(0)) + pin(g.x + g.w, g.cy)
    + txt(g.x + g.w - 12, g.y + g.h - 10, n.intrinsic ? 'intrinsic' : n.rt.join(' '), 'sm', 9.5, 'end');
  rs.forEach((q, k) => { s += txt(g.x + 12, g.pad(k + 1), N[q].name, 'sm', 9.5) + pin(g.x, g.pad(k + 1)); });
  C += comp(p, 'procedure', `Procedure ${n.name}, emits ${out(p,'emits').length}, reads ${rs.length}`, s); });

EVS.forEach(e => { const g = G[e], ins = inn(e,'emits'), f = ins.length, slots = (N[e].slots || []).length;
  let s = `<polygon class="body" points="${poly(g, {br:11})}" fill="var(--c-event)"/>` + txt(g.x + 12, g.cy, N[e].name, 'nm', 12.5 + 1.6*(f - 1), '', g.w - 50)
    + txt(g.x + g.w - 12, g.cy - (g.h > 40 ? 0 : 0), pad2(slots), 'nm', 13, 'end') + pin(g.x + g.w, g.cy);
  ins.forEach(p => { s += pin(g.x, PADS[p + '>' + e]); });
  C += comp(e, 'event', `Event ${N[e].name}, emitted by ${f}, ${slots} slots`, s);
  const p = PJ(e), pg = G[p];
  C += comp(p, 'projection', `Projection ${N[p].name}, writes ${ncols(p)} columns`, `<polygon class="body" points="${poly(pg, {tr:9, br:9})}" fill="var(--c-projection)"/>`
    + txt(pg.x + 10, pg.cy, N[p].name, 'nm', 12.5, '', pg.w - 44) + txt(pg.x + pg.w - 13, pg.cy, pad2(ncols(p)), 'nm', 12.5, 'end') + pin(pg.x, pg.cy) + pin(pg.x + pg.w, pg.cy)); });

// the model as one big part: tables are packages, every column has a write pad and a read pad
{ const g = G[M]; let s = `<rect class="body model-box" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}"/>` + pin(g.x, inY) + pin(g.x + g.w, inY);
  C += comp(M, 'model', 'Model execution', s, 'keep');
  TABLES.forEach(t => { const tg = G['table:' + t.id]; let r = `<rect class="hd" x="${tg.x}" y="${tg.y}" width="${tg.w}" height="${HD}"/><rect class="wp" x="${tg.x + 4}" y="${tg.y + 7}" width="8" height="8"/><rect class="rp" x="${tg.x + tg.w - 12}" y="${tg.y + 7}" width="8" height="8"/>`
      + `<text class="tn" x="${tg.x + 18}" y="${tg.y + HD/2}" dy=".36em" data-max="${tg.w - 62}">${esc(t.id)}</text><text class="tc" x="${tg.x + tg.w - 18}" y="${tg.y + HD/2}" dy=".36em" text-anchor="end">${pad2(t.rows.length)}</text>`;
    t.rows.forEach(row => { const id = 'col:' + t.id + '.' + row[0], cg = G[id];
      r += `<g class="col${row[2].includes('PK') ? ' pk' : ''}" data-id="${id}"><rect class="row" x="${cg.x}" y="${cg.y}" width="${cg.w}" height="${RH - 1}"/><rect class="wp" x="${cg.x + 4}" y="${cg.y + 3.5}" width="7" height="7"/><rect class="rp" x="${cg.x + cg.w - 11}" y="${cg.y + 3.5}" width="7" height="7"/>`
        + `<text class="cn" x="${cg.x + 17}" y="${cg.cy}" dy=".34em">${esc(row[0])}</text><text class="rg" x="${cg.x + cg.w - 16}" y="${cg.cy}" dy=".34em" text-anchor="end">${esc(row[1])}</text></g>`; });
    C += `<g class="tbl comp keep" data-id="table:${t.id}" tabindex="0" role="button" aria-label="Table ${esc(t.id)}">${r}</g>`; }); }

QS.forEach(q => { const g = G[q], n = out(q,'reads').length;
  C += comp(q, 'query', `Query ${N[q].name}, read by ${n}`, `<polygon class="body" points="${poly(g, {tr:10})}" fill="var(--c-query)"/>`
    + txt(g.x + 10, g.cy, N[q].name, 'nm', 12.5 + 1.2*n, '', g.w - 44) + txt(g.x + g.w - 13, g.cy, pad2(n), 'nm', 12.5, 'end') + pin(g.x, g.cy) + pin(g.x + g.w, g.cy)); });
HOSTQ.forEach(q => { const g = {x:X.host, y:G[q].cy - 22, w:X.hostW, h:44};
  C += `<polygon points="${poly(g, {tl:9, bl:9})}" fill="var(--chrome)"/>` + txt(g.x + g.w - 12, g.y + 22, 'host', '', 14, 'end').replace('class=""', 'style="fill:#000;font-weight:700"') + pin(g.x, G[q].cy); });

/* silkscreen */
const silk = (x, s, n) => `<text class="silk" x="${x}" y="${TOP - 34}">${s}${n != null ? ` <tspan font-weight="700">${pad2(n)}</tspan>` : ''}</text>`;
let SILK = silk(X.cmd, 'J1 commands', CMDS.length) + silk(X.proc, 'Procedures', PROCS.length) + silk(X.ev, 'Events', EVS.length) + silk(X.pj, 'Projections', EVS.length)
  + silk(X.q, 'Queries', QS.length)
  + `<text class="silk" x="${X.m}" y="${mY - 12}">U8 execution <tspan font-weight="700">${pad2(TABLES.length)}</tspan> tables, pink pads are written, violet pads are read</text>`
  + `<text class="silk" x="${X.ev}" y="${BOT + QS.length*X.rP + 22}">Read return path: what the model knows flows back under the board into the procedures</text>`;

const svg = document.getElementById('board');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = `<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="10" y="10" width="1.6" height="1.6" fill="#1d1826"/></pattern></defs>`
  + `<rect id="bg" width="${W}" height="${H}" fill="url(#grid)"/>${SILK}<g class="L-rel">${T_REL}</g>${T_READ}${T_FOLD}${T_FLOW}<g id="comps">${C}</g><g id="sigs">${SIG.join('')}</g><g id="air"></g>`;
// the model box sits under the relations, tables on top
const comps = document.getElementById('comps'), mb = comps.querySelector(`[data-id="${M}"]`); svg.insertBefore(mb, svg.querySelector('.L-rel'));

function fitText(){ svg.querySelectorAll('text[data-max]').forEach(t => { t.removeAttribute('textLength'); t.removeAttribute('lengthAdjust');
  const max = +t.dataset.max; if (t.getComputedTextLength() > max){ t.setAttribute('textLength', max); t.setAttribute('lengthAdjust', 'spacingAndGlyphs'); } }); }
fitText(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

/* ════ state ════ */
let sel = null, focusId = null, hoverId = null, z = 1;
const wrap = document.getElementById('wrap'), insp = document.getElementById('insp');
const els = id => svg.querySelectorAll(`[data-id="${id}"]`);

function airwires(ids){
  const lines = [], L2 = (a, b) => lines.push(`<line class="air" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`);
  const wPad = c => { const g = G[c]; return [g.x + 7.5, g.cy]; }, rPad = c => { const g = G[c]; return [g.x + g.w - 7.5, g.cy]; };
  ids.forEach(id => { const k = kindOf(id);
    if (k === 'projection'){ const g = G[id], from = [g.x + g.w, g.cy], st = starOf(id);
      st.forEach(t => L2(from, [G['table:'+t].x + 8, G['table:'+t].cy]));
      colsOf(id).filter(c => !st.includes(c.slice(4).split('.')[0])).forEach(c => L2(from, wPad(c))); }
    if (k === 'query'){ const g = G[id]; colsOf(id).forEach(c => L2(rPad(c), [g.x, g.cy])); } });
  const f = ids[0];
  if (f && kindOf(f) === 'col'){ lines.length = 0; (WR[f]||[]).forEach(p => L2([G[p].x + G[p].w, G[p].cy], wPad(f))); (RD[f]||[]).forEach(q => L2(rPad(f), [G[q].x, G[q].cy])); }
  document.getElementById('air').innerHTML = lines.length <= 60 ? lines.join('') : '';
}
function apply(){
  const S = sel ? new Set(slice(sel)) : null, act = hoverId || focusId, A = act ? new Set(related(act)) : null;
  svg.classList.toggle('has-sel', !!S); svg.classList.toggle('has-hot', !!A);
  svg.querySelectorAll('.comp').forEach(e => { const id = e.dataset.id;
    e.classList.toggle('in', !!S && S.has(id)); e.classList.toggle('hot', !!A && A.has(id) && !e.classList.contains('tbl') && id !== M); e.classList.toggle('on', id === focusId); });
  svg.querySelectorAll('.tr,.sig').forEach(e => { const a = e.dataset.a, b = e.dataset.b, inS = !!S && S.has(a) && S.has(b);
    e.classList.toggle('in', inS); e.classList.toggle('live', inS && e.classList.contains('sig')); e.classList.toggle('hot', !!A && A.has(a) && A.has(b)); });
  // column pads
  const w = new Set(), r = new Set();
  if (act && kindOf(act) === 'col'){ if (WR[act]) w.add(act); if (RD[act]) r.add(act); }
  else if (act && kindOf(act) === 'table') tableCols(act.slice(6)).forEach(c => { if (WR[c]) w.add(c); if (RD[c]) r.add(c); });
  else if (A) A.forEach(id => { const k = kindOf(id); if (k === 'projection') colsOf(id).forEach(c => w.add(c)); if (k === 'query') colsOf(id).forEach(c => r.add(c)); });
  svg.querySelectorAll('.col').forEach(e => { e.classList.toggle('w', w.has(e.dataset.id)); e.classList.toggle('r', r.has(e.dataset.id)); e.classList.toggle('on', e.dataset.id === focusId); });
  svg.querySelectorAll('.tbl').forEach(e => { const cs = tableCols(e.dataset.id.slice(6)); e.classList.toggle('w', cs.every(c => w.has(c))); e.classList.toggle('r', cs.every(c => r.has(c))); });
  airwires(act && ['projection','query','event','col'].includes(kindOf(act)) ? (kindOf(act) === 'col' ? [act] : [...A]) : []);
}

/* ════ inspector ════ */
const chips = (label, ids) => ids.length ? `<div class="chips"><span>${label}</span>${ids.map(id => `<button class="chip" data-go="${id}" style="--k:var(--c-${kindOf(id)})">${esc(nameOf(id))}</button>`).join('')}</div>` : '';
const colList = (label, id) => { const c = N[id].cols; return `<p class="i-meta">${label}</p><p class="cols">${Object.keys(c).map(t => `<b>${t}</b> ${c[t] === '*' ? 'every column' : c[t].join(', ')}`).join('<br>')}</p>`; };
function renderInsp(){
  insp.hidden = false;
  if (!focusId){ insp.style.setProperty('--k', 'var(--chrome)');
    insp.innerHTML = `<div class="i-head"><span class="i-kind">Feat</span><h2>execution</h2><button class="i-x" id="hide">Hide</button></div><div class="i-body">
      <p>${esc(D.description.split('. ')[0])}.</p>
      <p>Read it left to right like a storming wall. Commands plug in at the edge, procedures emit events along orange trunks, each event folds into the model through its projection, and queries carry what the model knows back under the board.</p>
      <p>Select a command to power its net. Point at a projection, a query or a single column to see exactly which columns it touches. Drag to pan.</p>
      ${chips('Start with', ['command:run_next', 'command:boot_kernel', 'col:Command.status'])}</div>`; return; }
  const id = focusId, k = kindOf(id); let b = '';
  if (k === 'col'){ const [t, c] = id.slice(4).split('.'), row = TB[t].rows.find(r => r[0] === c);
    b = `<p>A column of <b>${t}</b>, typed ${esc(row[1])}${row[2].length ? ' (' + row[2].join(', ') + ')' : ''}.</p>` + chips('Written by', WR[id] || []) + chips('Read by', RD[id] || [])
      + (!(WR[id] || RD[id]) ? '<p class="i-meta">No projection or query in this study touches it</p>' : ''); }
  else if (k === 'table'){ const t = id.slice(6), cs = tableCols(t);
    b = `<p>One table of the execution model with ${cs.length} columns. Held in memory, rebuilt by folding the log at boot.</p>`
      + chips('Written by', uniq(cs.flatMap(c => WR[c] || []))) + chips('Read by', uniq(cs.flatMap(c => RD[c] || []))); }
  else { const n = N[id];
    b = `<p class="i-desc">${esc(n.desc)}</p>`;
    if (k === 'command') b += chips('Handled by', out(id,'handles'));
    if (k === 'procedure') b += chips('Handles', inn(id,'handles')) + chips('Reads', inn(id,'reads')) + chips('Emits', out(id,'emits'));
    if (k === 'event') b += chips('Emitted by', inn(id,'emits')) + chips('Folded by', out(id,'feeds'));
    if (k === 'projection') b += chips('Folds', inn(id,'feeds')) + colList('Writes', id);
    if (k === 'query') b += chips('Read by', out(id,'reads')) + colList('Reads', id);
    if (k === 'model') b += chips('Tables', TABLES.map(t => 'table:' + t.id));
    if (n.slots && n.slots.length) b += `<table class="slots">${n.slots.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2] ? 'required' : ''}</td></tr>`).join('')}</table>`;
    b += n.path ? `<p class="i-meta">${esc(n.path)}</p>` : n.intrinsic ? '<p class="i-meta">Intrinsic to the kernel, no generated implementation</p>' : '';
    if (n.code) b += `<pre><code>${esc(n.code)}</code></pre>`; }
  insp.style.setProperty('--k', `var(--c-${k})`);
  insp.innerHTML = `<div class="i-head"><span class="i-kind">${k === 'col' ? 'column' : k}</span><h2>${esc(nameOf(id))}</h2><button class="i-x" id="hide">Hide</button></div><div class="i-body">${b}</div>`;
}
function focus(id, reveal){
  focusId = id; if (id && kindOf(id) === 'command') sel = id;
  renderInsp(); apply();
  if (reveal && id){ const g = G[id]; if (g) wrap.scrollTo({left: Math.max(0, (g.x + g.w/2)*z - wrap.clientWidth/2 + 180), top: Math.max(0, g.cy*z - wrap.clientHeight/2), behavior:'smooth'}); }
}

/* ════ wiring ════ */
function setZoom(v){ z = Math.min(1.6, Math.max(.35, v)); svg.style.width = W*z + 'px'; svg.style.height = H*z + 'px'; }
const fitZ = () => (wrap.clientWidth - 4) / W;
setZoom(Math.max(fitZ(), .78));
document.getElementById('z-in').onclick = () => setZoom(z*1.2);
document.getElementById('z-out').onclick = () => setZoom(z/1.2);
document.getElementById('z-fit').onclick = () => setZoom(fitZ());
document.getElementById('clear').onclick = () => { sel = null; hoverId = null; focus(null); };
document.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); svg.classList.toggle('hide-' + b.dataset.layer, !on); });
document.getElementById('tag').textContent = 'Feat ' + pad2(D.nodes.length);

let drag = null, moved = false;
wrap.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; drag = {x:e.clientX, y:e.clientY, l:wrap.scrollLeft, t:wrap.scrollTop}; moved = false; });
window.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 5){ moved = true; wrap.classList.add('drag'); }
  if (moved){ wrap.scrollLeft = drag.l - dx; wrap.scrollTop = drag.t - dy; } });
window.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('drag'); });
svg.addEventListener('click', e => { if (moved) return; const t = e.target.closest('[data-id]');
  if (!t){ sel = null; return focus(null); } focus(t.dataset.id); });
svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.id){ e.preventDefault(); focus(e.target.dataset.id); } });
svg.addEventListener('pointerover', e => { if (drag && moved) return; const t = e.target.closest('[data-id]'), id = t ? t.dataset.id : null;
  if (id === M) return hoverId !== null && (hoverId = null, apply()); if (id !== hoverId){ hoverId = id; apply(); } });
svg.addEventListener('pointerleave', () => { if (hoverId){ hoverId = null; apply(); } });
insp.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) return focus(g.dataset.go, true); if (e.target.id === 'hide') insp.hidden = true; });

renderInsp(); apply();
</script>
</body>
</html>
