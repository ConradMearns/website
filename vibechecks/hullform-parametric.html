<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hullform: parametric sailboat simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #10263B; --paper: #EEF2F3; --panel: rgba(238,242,243,.96); --rule: #B8C6CD; --muted: #52687A;
  --accent: #0B7480; --alert: #C8372D; --amber: #B97F00; --grid: rgba(16,38,59,.055);
  --sheet: 58px;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #E3ECEF; --paper: #0F1B26; --panel: rgba(15,27,38,.96); --rule: #2B4051; --muted: #94A9B8; --accent: #4CC4CE; --alert: #FF6F62; --amber: #F2B544; --grid: rgba(227,236,239,.05); }
}
:root[data-theme="dark"] { --ink: #E3ECEF; --paper: #0F1B26; --panel: rgba(15,27,38,.96); --rule: #2B4051; --muted: #94A9B8; --accent: #4CC4CE; --alert: #FF6F62; --amber: #F2B544; --grid: rgba(227,236,239,.05); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; overflow: hidden; background: #b9d6e6; color: var(--ink);
  font-family: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* instruments */
#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 5; max-width: calc(100vw - 104px); }
.cell { background: rgba(8,24,38,.60); color: #F2F6F7; border-radius: 10px; padding: 6px 8px 5px; min-width: 47px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.cell b { display: block; font: 600 25px/1 "Barlow Condensed", Barlow, system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.cell small { display: block; margin-top: 3px; font-size: 10.5px; line-height: 1.1; opacity: .78; }
#wind { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; width: 76px; height: 76px; z-index: 5; }
#windkey { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 88px); right: 10px; width: 76px; z-index: 5; font-size: 10.5px; line-height: 1.25; color: #F2F6F7; background: rgba(8,24,38,.60); border-radius: 8px; padding: 4px 6px; text-align: left; }
#windkey i { display: inline-block; width: 9px; height: 3px; margin-right: 5px; vertical-align: middle; }

/* action bar */
#bar { position: fixed; left: 8px; right: 8px; bottom: calc(var(--sheet) + 8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; overflow-x: auto; z-index: 6; scrollbar-width: none; padding: 2px 0; transition: bottom .25s; }
#bar::-webkit-scrollbar { display: none; }
.btn { flex: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer; color: var(--ink); }
.btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:focus-visible, .tab:focus-visible, .preset:focus-visible, #grip:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* banner + toast */
#banner { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 82px); left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 12px; z-index: 7; max-width: min(92vw, 520px); }
#banner.warn { background: var(--alert); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.3; box-shadow: 0 6px 22px rgba(0,0,0,.25); }
#banner button { flex: none; background: #fff; color: #7a1b14; border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sheet) + 56px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 8; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#fatal { display: none; position: fixed; inset: 20% 8% auto 8%; background: #fff; color: #7a1b14; border: 2px solid #C8372D; border-radius: 12px; padding: 16px; z-index: 20; font-size: 15px; }

/* panel */
#panel { position: fixed; left: 0; right: 0; bottom: 0; height: 46vh; z-index: 9; display: flex; flex-direction: column;
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(calc(100% - 58px - env(safe-area-inset-bottom, 0px))); transition: transform .25s ease; }
#panel.open { transform: none; }
#grip { flex: none; height: 16px; border: 0; background: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
#grip span { width: 38px; height: 4px; border-radius: 2px; background: var(--rule); }
#tabs { flex: none; display: flex; gap: 2px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); }
#tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 8px 11px 9px; font: 600 16px "Barlow Condensed", Barlow, sans-serif; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
#presets { flex: none; display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; }
#presets::-webkit-scrollbar { display: none; }
.preset { flex: none; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--ink); }
.preset.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tabbody { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 28px; }
.pane { display: none; }
.pane.on { display: block; }
.pane h3 { margin: 0; padding: 14px 14px 4px; font: 600 15px "Barlow Condensed", Barlow, sans-serif; letter-spacing: .02em; color: var(--ink); border-top: 1px solid var(--rule); }
.pane h3:first-child { border-top: 0; }
.row { display: block; padding: 7px 14px 5px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.nm { font-size: 14px; }
output { font: 600 14px Barlow, sans-serif; font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
.row small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.row.sel { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 8px; }
.row.sel select { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; font-size: 14px; max-width: 58%; }
.row.tog { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
.row.tog input { width: 20px; height: 20px; accent-color: var(--accent); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 1px 0; cursor: pointer; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--rule) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); margin-top: -8px; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--rule) var(--p, 50%)); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }

.live { margin: 8px 14px 2px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); font-size: 13px; line-height: 1.35; color: var(--muted); }
.live b { color: var(--ink); font-variant-numeric: tabular-nums; }
/* results */
#resBody { padding: 0 14px 10px; }
#resBody h3 { padding-left: 0; padding-right: 0; }
#resBody canvas { width: 100%; display: block; margin: 6px 0 2px; }
.kv.big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 4px; }
.kv.big > div { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; background: var(--paper); }
.kv.big b { display: block; font: 600 28px/1.05 "Barlow Condensed", Barlow, sans-serif; color: var(--ink); }
.kv.big small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.25; }
.kvl > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.kvl span { color: var(--muted); }
.kvl b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); line-height: 1.4; margin: 6px 0; }
.note b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; background: var(--c); margin-right: 6px; vertical-align: middle; }

/* desktop: persistent side panel */
@media (min-width: 900px) {
  :root { --sheet: 0px; }
  #hud { max-width: none; }
  #panel { left: auto; top: 0; width: 392px; height: auto; border-radius: 0; border-top: 0; border-left: 1px solid var(--rule); transform: none; padding-top: 6px; }
  #grip { display: none; }
  #bar { right: 404px; flex-wrap: wrap; }
  #wind, #windkey { right: 404px; }
  #banner { left: calc(50% - 196px); }
  #toast { left: calc(50% - 196px); }
}
@media (prefers-reduced-motion: reduce) { #panel, #bar, #toast { transition: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-label="3D sailboat simulation"></canvas>

<div id="hud" role="status" aria-live="off">
  <div class="cell"><b id="h-spd">0.0</b><small>speed, kn</small></div>
  <div class="cell"><b id="h-heel">0</b><small>heel, &deg;</small></div>
  <div class="cell"><b id="h-lee">0</b><small>leeway, &deg;</small></div>
  <div class="cell"><b id="h-awa">0</b><small>app. wind &deg;</small></div>
  <div class="cell"><b id="h-aws">0.0</b><small>app. wind kn</small></div>
</div>
<canvas id="wind" width="152" height="152"></canvas>
<div id="windkey"><i style="background:#6ec6ff"></i>true wind<br><i style="background:#ffc247"></i>apparent</div>

<div id="banner"></div>
<div id="toast" role="status"></div>
<div id="fatal"></div>

<div id="bar">
  <button class="btn" id="bPause">Pause</button>
  <button class="btn" id="bReset">Reset boat</button>
  <button class="btn" id="bGust">Gust</button>
  <button class="btn" id="bTack">Tack</button>
  <button class="btn" id="bDump">Dump sheet</button>
  <button class="btn" id="bForce">Forces</button>
  <button class="btn" id="bView">View: orbit</button>
  <button class="btn" id="bSpeed">1&times;</button>
</div>

<div id="panel">
  <button id="grip" aria-label="Show or hide controls" aria-expanded="false"><span></span></button>
  <div id="tabs" role="tablist"></div>
  <div id="presets"></div>
  <div id="tabbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ======================================================================
   SAILCORE — parametric sailboat physics (no DOM, SI units)
   Body frame: x forward, y port, z up (right-handed). World: Z up.
   Roll phi>0 = port side up (heeled to starboard). Pitch theta>0 = bow down.
   ====================================================================== */
const RHO_W = 1025, RHO_A = 1.225, GRAV = 9.81, NU_W = 1.19e-6;
const KN = 0.514444, D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function wrapPi(a) { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; }

/* ---------- rotations ---------- */
function eulerToMat(phi, theta, psi, m) {
  const cp = Math.cos(phi), sp = Math.sin(phi), ct = Math.cos(theta), st = Math.sin(theta), cy = Math.cos(psi), sy = Math.sin(psi);
  m[0] = cy * ct; m[1] = cy * st * sp - sy * cp; m[2] = cy * st * cp + sy * sp;
  m[3] = sy * ct; m[4] = sy * st * sp + cy * cp; m[5] = sy * st * cp - cy * sp;
  m[6] = -st;     m[7] = ct * sp;                m[8] = ct * cp;
  return m;
}
function quatToMat(q, m) {
  const w = q[0], x = q[1], y = q[2], z = q[3];
  m[0] = 1 - 2 * (y * y + z * z); m[1] = 2 * (x * y - w * z); m[2] = 2 * (x * z + w * y);
  m[3] = 2 * (x * y + w * z); m[4] = 1 - 2 * (x * x + z * z); m[5] = 2 * (y * z - w * x);
  m[6] = 2 * (x * z - w * y); m[7] = 2 * (y * z + w * x); m[8] = 1 - 2 * (x * x + y * y);
}
function matToQuat(m, q) {
  const tr = m[0] + m[4] + m[8];
  if (tr > 0) { const s = Math.sqrt(tr + 1) * 2; q[0] = 0.25 * s; q[1] = (m[7] - m[5]) / s; q[2] = (m[2] - m[6]) / s; q[3] = (m[3] - m[1]) / s; }
  else if (m[0] > m[4] && m[0] > m[8]) { const s = Math.sqrt(1 + m[0] - m[4] - m[8]) * 2; q[0] = (m[7] - m[5]) / s; q[1] = 0.25 * s; q[2] = (m[1] + m[3]) / s; q[3] = (m[2] + m[6]) / s; }
  else if (m[4] > m[8]) { const s = Math.sqrt(1 + m[4] - m[0] - m[8]) * 2; q[0] = (m[2] - m[6]) / s; q[1] = (m[1] + m[3]) / s; q[2] = 0.25 * s; q[3] = (m[5] + m[7]) / s; }
  else { const s = Math.sqrt(1 + m[8] - m[0] - m[4]) * 2; q[0] = (m[3] - m[1]) / s; q[1] = (m[2] + m[6]) / s; q[2] = (m[5] + m[7]) / s; q[3] = 0.25 * s; }
}

/* ---------- presets ---------- */
const PRESETS = {
  dinghy: {
    label: 'Dinghy, daggerboard', hullType: 'mono',
    L: 4.2, B: 1.40, D: 0.45, bowN: 2.3, sternN: 3.2, transom: 0.62, floor: 0.30, bilge: 2.3, rocker: 0.10, sheer: 0.10,
    sep: 2.2, amaL: 0.62, amaB: 0.45, amaD: 0.85, amaLift: 0.12, amaStagger: 0,
    structMass: 55, foilType: 'board', foilChord: 0.28, foilSpan: 0.75, foilTaper: 0.7, foilX: 0.1, foilExt: 1.0,
    rudChord: 0.20, rudSpan: 0.75, ballast: 0, ballastDepth: 0, ballastX: 0,
    crewMass: 80, crewX: -0.25, crewZ: 0.45,
    rigMass: 14, sailArea: 7.0, sailAR: 3.4, roach: 0.12, mastX: 0.75, boomH: 0.50, camber: 0.085, bend: 0.45, stretch: 0.35, twist0: 9, flex: 10,
    jibArea: 0, jibAR: 4.0, jibX: 1.7,
    _ctl: { twa: 60, hike: 1.0, easeHeel: 22 }, _env: { tws: 12 }
  },
  cat: {
    label: 'Beach catamaran', hullType: 'cat',
    L: 5.0, B: 0.42, D: 0.50, bowN: 1.9, sternN: 2.6, transom: 0.55, floor: 0.10, bilge: 1.9, rocker: 0.22, sheer: 0.12,
    sep: 2.15, amaL: 0.62, amaB: 0.45, amaD: 0.85, amaLift: 0.12, amaStagger: 0,
    structMass: 140, foilType: 'board', foilChord: 0.26, foilSpan: 0.62, foilTaper: 0.7, foilX: 0.0, foilExt: 1.0,
    rudChord: 0.20, rudSpan: 0.70, ballast: 0, ballastDepth: 0, ballastX: 0,
    crewMass: 150, crewX: -0.2, crewZ: 0.75,
    rigMass: 28, sailArea: 15.5, sailAR: 3.1, roach: 0.15, mastX: 0.30, boomH: 0.85, camber: 0.08, bend: 0.40, stretch: 0.30, twist0: 8, flex: 8,
    jibArea: 3.6, jibAR: 3.8, jibX: 2.1,
    _ctl: { twa: 52, hike: 1.0, easeHeel: 12 }, _env: { tws: 13 }
  },
  sloop: {
    label: 'Cruising keelboat', hullType: 'mono',
    L: 8.6, B: 2.9, D: 1.35, bowN: 2.0, sternN: 2.6, transom: 0.55, floor: 0.04, bilge: 1.7, rocker: 0.30, sheer: 0.35,
    sep: 2.2, amaL: 0.62, amaB: 0.45, amaD: 0.85, amaLift: 0.12, amaStagger: 0,
    structMass: 1900, foilType: 'keel', foilChord: 1.0, foilSpan: 1.35, foilTaper: 0.55, foilX: 0.0, foilExt: 1.0,
    rudChord: 0.45, rudSpan: 1.1, ballast: 1050, ballastDepth: 1.30, ballastX: 0.0,
    crewMass: 250, crewX: -0.5, crewZ: 0.9,
    rigMass: 160, sailArea: 28, sailAR: 3.2, roach: 0.10, mastX: 0.45, boomH: 1.05, camber: 0.075, bend: 0.35, stretch: 0.30, twist0: 7, flex: 6,
    jibArea: 24, jibAR: 3.4, jibX: 3.6,
    _ctl: { twa: 50, hike: 0.0, easeHeel: 24 }, _env: { tws: 14 }
  },
  tri: {
    label: 'Trimaran', hullType: 'tri',
    L: 8.0, B: 0.70, D: 0.80, bowN: 1.9, sternN: 2.4, transom: 0.35, floor: 0.08, bilge: 1.8, rocker: 0.22, sheer: 0.25,
    sep: 3.1, amaL: 0.60, amaB: 0.46, amaD: 0.80, amaLift: 0.18, amaStagger: 0.2,
    structMass: 620, foilType: 'board', foilChord: 0.38, foilSpan: 1.1, foilTaper: 0.65, foilX: 0.2, foilExt: 1.0,
    rudChord: 0.30, rudSpan: 0.95, ballast: 0, ballastDepth: 0, ballastX: 0,
    crewMass: 220, crewX: -0.3, crewZ: 0.6,
    rigMass: 95, sailArea: 24, sailAR: 3.8, roach: 0.14, mastX: 0.9, boomH: 1.0, camber: 0.075, bend: 0.40, stretch: 0.30, twist0: 7, flex: 7,
    jibArea: 12, jibAR: 4.0, jibX: 3.4,
    _ctl: { twa: 50, hike: 0.0, easeHeel: 16 }, _env: { tws: 14 }
  }
};

/* ---------- hull geometry (parametric lofting) ---------- */
function hullSpecs(P) {
  const mk = (o) => Object.assign({
    L: P.L, B: P.B, D: P.D, bowN: P.bowN, sternN: P.sternN, transom: P.transom, floor: P.floor, bilge: P.bilge,
    rocker: P.rocker, sheer: P.sheer, xoff: 0, yoff: 0, zlift: 0, name: 'hull'
  }, o || {});
  if (P.hullType === 'cat') return [mk({ yoff: P.sep / 2, name: 'port hull' }), mk({ yoff: -P.sep / 2, name: 'starboard hull' })];
  if (P.hullType === 'tri') {
    const ama = (y, n) => ({
      L: P.L * P.amaL, B: P.B * P.amaB, D: P.D * P.amaD, rocker: P.rocker * P.amaL, sheer: P.sheer * P.amaD,
      xoff: P.amaStagger, yoff: y, zlift: P.amaLift, transom: Math.min(P.transom, 0.3), name: n
    });
    return [mk({ name: 'main hull' }), mk(ama(P.sep, 'port float')), mk(ama(-P.sep, 'starboard float'))];
  }
  return [mk({ name: 'hull' })];
}
// half-beam at the deck line, xi in [-1 (stern), +1 (bow)]
function halfBeamDeck(h, xi) {
  const a = Math.abs(xi);
  if (xi >= 0) return (h.B / 2) * Math.max(0, 1 - Math.pow(a, h.bowN));
  return (h.B / 2) * (h.transom + (1 - h.transom) * Math.max(0, 1 - Math.pow(a, h.sternN)));
}
// section shape: fraction of deck half-beam at depth fraction zeta (0 keel .. 1 deck)
function sectionFrac(h, zeta) {
  zeta = clamp(zeta, 0, 1);
  return h.floor + (1 - h.floor) * (1 - Math.pow(1 - zeta, h.bilge));
}
const zBot = (h, xi) => h.zlift + h.rocker * xi * xi;
const zDeck = (h, xi) => h.zlift + h.D + h.sheer * xi * xi;
function hullPoint(h, xi, zeta, side) {
  const zb = zBot(h, xi), zd = zDeck(h, xi);
  const b = halfBeamDeck(h, xi) * sectionFrac(h, zeta);
  return [h.xoff + xi * h.L / 2, h.yoff + side * b, zb + zeta * (zd - zb)];

}
function sailInfo() {
  const el = $('#sailinfo'); if (!el || !S || !S.sailOut.strips || !S.sailOut.strips.length) return;
  const st = S.sailOut.strips, mid = st[Math.min(3, st.length - 1)], top = st[7] || st[st.length - 1];
  el.innerHTML = 'Shape now: camber <b>' + fmt(mid.camber * 100, 1) + '%</b> at mid-sail, twist <b>' + fmt(top.twist * R2D, 0) + '\u00b0</b> at the head, dynamic pressure <b>' + fmt(mid.q, 0) + ' Pa</b>, trimmed to <b>' + fmt(S.delta * R2D, 0) + '\u00b0</b>.';
}
function hudUpdate() {
  sailInfo();
  if (!S) { hud.spd.textContent = hud.heel.textContent = hud.lee.textContent = hud.awa.textContent = hud.aws.textContent = '-'; return; }
  hud.spd.textContent = fmt(S.speed / KN, 1);
  hud.heel.textContent = fmt(Math.abs(S.roll) * R2D, 0);
  hud.lee.textContent = fmt(Math.abs(S.leeway) * R2D, 0);
  hud.awa.textContent = fmt(S.awa * R2D, 0);
  hud.aws.textContent = fmt(S.aws / KN, 1);
}
function setBanner(kind) {
  const b = $('#banner');
  if (!kind) { b.style.display = 'none'; return; }
  b.style.display = 'flex';
  if (kind === 'sink') {
    b.className = 'warn';
    b.innerHTML = '<span>The hull volume is too small for this weight and it would sink. Enlarge the hull or remove mass.</span>';
  } else {
    b.className = 'warn';
    const what = kind === 'pitchpole' ? 'Pitchpoled' : 'Capsized';
    b.innerHTML = '<span>' + what + ' at ' + fmt(S.capsizeT, 0) + ' s, apparent gust wind ' + fmt(S.capsizeWind, 0) + ' kn true.</span><button id="bnReset">Reset boat</button>';
    $('#bnReset').onclick = resetBoat;
  }
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

function setupCanvas(cv, h) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth || 300;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return { g, w, h };
}
function drawStabChart() {
  const cv = $('#chStab'); if (!cv || !stab) return;
  const { g, w, h } = setupCanvas(cv, 190);
  const ink = cssv('--ink'), rule = cssv('--rule'), muted = cssv('--muted'), acc = cssv('--accent'), alert = cssv('--alert'), amber = cssv('--amber');
  const L = 38, Rr = 8, T = 10, Bt = 24, pw = w - L - Rr, ph = h - T - Bt;
  const XM = 120, nx = Math.round(XM / 5) + 1;
  const rm = stab.RM.slice(0, nx).map(v => v / 1000), mh = Mh ? Mh.slice(0, nx).map(v => v / 1000) : null;
  let dynMh = null; if (winds && isFinite(winds.dynamic) && winds.dynamic > 0) dynMh = heelCurve(B, stab, winds.dynamic, env, ctl.reef).slice(0, nx).map(v => v / 1000);
  let ymax = Math.max(...rm) * 1.25, ymin = Math.min(0, Math.min(...rm)) * 1;
  if (mh) ymax = Math.max(ymax, Math.max(...mh) * 1.05);
  if (dynMh) ymax = Math.max(ymax, Math.max(...dynMh) * 1.05);
  ymax = Math.max(ymax, 0.05); ymin = Math.min(ymin, -ymax * 0.15);
  const X = d => L + d / XM * pw, Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * ph;
  g.clearRect(0, 0, w, h); g.font = '11px Barlow, system-ui, sans-serif'; g.fillStyle = muted; g.strokeStyle = rule; g.lineWidth = 1;
  g.textAlign = 'right';
  const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = ymin + (ymax - ymin) * i / ticks, y = Y(v); g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.globalAlpha = 0.5; g.stroke(); g.globalAlpha = 1; g.fillText(v.toFixed(Math.abs(ymax) < 5 ? 1 : 0), L - 5, y + 4); }
  g.textAlign = 'center'; for (let d = 0; d <= XM; d += 30) { g.fillText(d + '\u00b0', X(d), h - 8); }
  g.strokeStyle = ink; g.globalAlpha = 0.5; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(L + pw, Y(0)); g.stroke(); g.globalAlpha = 1;
  g.setLineDash([3, 3]); g.strokeStyle = muted; g.beginPath(); g.moveTo(X(75), T); g.lineTo(X(75), T + ph); g.stroke(); g.setLineDash([]);
  const line = (arr, color, dash, wd) => { g.strokeStyle = color; g.lineWidth = wd || 2; g.setLineDash(dash || []); g.beginPath(); arr.forEach((v, i) => { const x = X(i * 5), y = Y(v); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.setLineDash([]); };
  if (dynMh) line(dynMh, amber, [5, 4], 1.6);
  if (mh) line(mh, alert, null, 2);
  line(rm, acc, null, 2.4);
}
function drawLiveChart() {
  const cv = $('#chLive'); if (!cv) return;
  const { g, w, h } = setupCanvas(cv, 96);
  const muted = cssv('--muted'), rule = cssv('--rule'), acc = cssv('--accent'), alert = cssv('--alert');
  g.clearRect(0, 0, w, h);
  g.strokeStyle = rule; g.lineWidth = 1; for (let i = 0; i < 4; i++) { const y = 6 + i * (h - 12) / 3; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.globalAlpha = 0.5; g.stroke(); g.globalAlpha = 1; }
  if (hist.length < 2) return;
  const t1 = hist[hist.length - 1].t, t0 = t1 - 40;
  const smax = Math.max(6, ...hist.map(p => p.spd)) * 1.1, hmax = Math.max(30, ...hist.map(p => p.heel)) * 1.1;
  const trace = (key, mx, color) => { g.strokeStyle = color; g.lineWidth = 1.8; g.beginPath(); let st = false; for (const p of hist) { if (p.t < t0) continue; const x = (p.t - t0) / 40 * w, y = h - 6 - (p[key] / mx) * (h - 12); st ? g.lineTo(x, y) : g.moveTo(x, y); st = true; } g.stroke(); };
  trace('spd', smax, acc); trace('heel', hmax, alert);
  g.fillStyle = muted; g.font = '11px Barlow, system-ui, sans-serif'; g.textAlign = 'left';
  g.fillStyle = acc; g.fillText('speed, top ' + smax.toFixed(0) + ' kn', 4, 12); g.fillStyle = alert; g.fillText('heel, top ' + hmax.toFixed(0) + '\u00b0', 4, 25);
}
function kn1(v) { return (!isFinite(v) || v / KN > 100) ? 'over 100 kn' : (v <= 0 ? 'under 2 kn' : fmt(v / KN, 0) + ' kn'); }
function renderResults() {
  const root = $('#resBody'); if (!root) return;
  if (!B) return;
  if (B.sinks) { root.innerHTML = '<p class="note">This hull cannot float its own weight. Hull volume is ' + fmt(B.Vhull, 2) + ' m\u00b3 and the boat needs ' + fmt(B.M / 1.025 / 1000, 2) + ' m\u00b3 of displacement.</p>'; return; }
  const s = B.summary, mono = P.hullType === 'mono';
  const rows = [
    ['Displacement', fmt(s.M, 0) + ' kg'], ['Waterline length', fmt(s.Lwl, 2) + ' m'], ['Hull speed, 1.34\u221aL', fmt(s.hullSpeedKn, 1) + ' kn'],
    ['Draught of hull', fmt(s.draftHull, 2) + ' m'], ['Wetted surface', fmt(s.Sw, 1) + ' m\u00b2'],
    ['Sail area per displacement', fmt(s.saD, 1)], ['Overall beam', fmt(s.beamOverall, 2) + ' m'], ['Capsize screening factor', fmt(s.csf, 2) + (s.csf < 2 ? ' (under 2.0 is favourable)' : ' (2.0 and over is a warning)')]
  ];
  if (mono) rows.splice(5, 0, ['Initial metacentric height', fmt(s.GM, 2) + ' m']);
  if (stab) { rows.push(['Peak righting moment', fmt(stab.maxRM / 1000, 1) + ' kN\u00b7m at ' + fmt(stab.phiMax, 0) + '\u00b0']); rows.push(['Angle of vanishing stability', stab.avs >= 179 ? 'none found' : fmt(stab.avs, 0) + '\u00b0']); }
  let html = '<h3>Capsize resistance</h3>';
  if (winds) {
    html += '<div class="kv big"><div><b>' + kn1(winds.dynamic) + '</b><small>Sudden gust knocks it down past 75\u00b0</small></div><div><b>' + kn1(winds.steady) + '</b><small>Steady wind gives no equilibrium under 75\u00b0</small></div></div>';
    html += '<p class="note">Worst case: beam wind, sheet cleated at its worst angle, crew hiking to the limit set under Weights. Dynamic limits depend on how much damping the water gives, so treat them as a guide.</p>';
  } else html += '<p class="note">Calculating\u2026</p>';
  html += '<h3>Righting and heeling moments, kN\u00b7m</h3><canvas id="chStab"></canvas>';
  html += '<div class="legend"><span style="--c:var(--accent)">Righting, hull and crew</span><span style="--c:var(--alert)">Heeling at current wind</span><span style="--c:var(--amber)">Heeling at the gust limit</span></div>';
  if (stab && Mh) {
    let eq = null; const f0 = stab.RM[0] - Mh[0];
    if (f0 >= 0) eq = 0; else for (let i = 1; i < 16; i++) { const f1 = stab.RM[i] - Mh[i]; if (f1 >= 0 && stab.RM[i] > 0) { const pf = stab.RM[i - 1] - Mh[i - 1]; eq = stab.phi[i - 1] + 5 * (-pf) / (f1 - pf); break; } }
    html += '<p class="note">At ' + fmt(env.tws, 0) + ' kn with the sheet cleated, ' + (eq === null ? '<b>no stable heel angle exists under 75\u00b0</b>, so the boat is knocked down.' : eq === 0 ? 'the crew at full hike can hold the boat <b>upright</b>.' : 'the boat settles at a steady heel of about <b>' + fmt(eq, 0) + '\u00b0</b>.') + '</p>';
  }
  html += '<h3>Live run</h3><canvas id="chLive"></canvas>';
  html += '<h3>Design numbers</h3><div class="kvl">' + rows.map(r => '<div><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('') + '</div>';
  html += '<h3>What this model leaves out</h3><p class="note">Hull drag uses a friction line plus an empirical wave-making curve scaled by slenderness, so results are good for comparing designs and poor for absolute speed. Planing lift, wave slamming, foil ventilation and sail interaction are not modelled. Validate any real design with a tank test or CFD before cutting material.</p>';
  root.innerHTML = html;
  drawStabChart(); drawLiveChart();
}

/* ---------------- analysis (async-ish) ---------------- */
function analyse() {
  if (!B || B.sinks) { renderResults(); return; }
  stab = staticStability(B, ctl);
  liveAnalysis(false);
}
function liveAnalysis(redoStab) {
  if (!B || B.sinks) return;
  if (redoStab) stab = staticStability(B, ctl);
  if (!stab) return;
  Mh = heelCurve(B, stab, env.tws * KN, env, ctl.reef);
  winds = capsizeWinds(B, stab, env, ctl.reef);
  if (activeTab === 'res') renderResults();
}

/* ---------------- sim control ---------------- */
let rebuildTimer = 0;
function scheduleRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => rebuild(false), 130); }
function rebuild(fit) {
  B = buildBoat(P);
  buildMeshes();
  if (fit) fitCamera();
  if (B.sinks) { S = null; setBanner('sink'); }
  else { S = createState(B, env, ctl); setBanner(null); }
  hist.length = 0; acc = 0; wakeCount = 0; wakeHead = 0; wakeGeo.setDrawRange(0, 0);
  winds = null; stab = null; Mh = null;
  clearTimeout(analyse._t); analyse._t = setTimeout(analyse, 25);
  if (activeTab === 'res') renderResults();
}
function resetBoat() {
  if (!B || B.sinks) return;
  env.gustT0 = -100; env.ou = 0; env.ouDir = 0;
  S = createState(B, env, ctl); setBanner(null); hist.length = 0; wakeCount = 0; wakeHead = 0; wakeGeo.setDrawRange(0, 0); acc = 0;
}
function loadPreset(key) {
  P = JSON.parse(JSON.stringify(PRESETS[key])); ctl = makeCtl(P); env = makeEnv(P._env.tws);
  document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b.dataset.key === key));
  syncControls(); rebuild(true);
}

/* ---------------- main loop ---------------- */
let last = performance.now(), hudT = 0, histT = 0, chartT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    if (S && !paused) {
      acc += dtReal * timeScale; const dt = 1 / 240; let n = 0;
      while (acc >= dt && n < 60) { stepSim(S, B, env, ctl, dt); acc -= dt; n++; if (S.failed) break; }
      if (n >= 60) acc = 0;
      if (S.failed) { paused = true; $('#bPause').textContent = 'Run'; toast('The solver diverged. Reset the boat or soften the design.'); }
      if (S.capsized && !S._shown) { S._shown = true; setBanner(S.capsizeKind); }
      histT += dtReal; if (histT > 0.2) { histT = 0; hist.push({ t: S.t, spd: S.speed / KN, heel: Math.abs(S.roll) * R2D }); if (hist.length > 400) hist.shift(); }
      wakeTimer += dtReal * timeScale; if (wakeTimer > 0.12) { wakeTimer = 0; wakePos[wakeHead * 3] = S.p[0]; wakePos[wakeHead * 3 + 1] = S.p[1]; wakePos[wakeHead * 3 + 2] = 0.04; wakeHead = (wakeHead + 1) % WAKE_N; wakeCount = Math.min(WAKE_N, wakeCount + 1); }
    }
    if (S) {
      boat.position.set(S.p[0], S.p[1], S.p[2]); boat.quaternion.set(S.q[1], S.q[2], S.q[3], S.q[0]);
      for (const r of MESH.rud) r.rotation.z = -S.rud;
      updateSails();
      if (MESH.crew) { const reach = B.hikeReach, f = clampN(S.crewY / reach, -1, 1); MESH.crew.position.set(P.crewX - B.cg[0], S.crewY - B.cg[1], P.crewZ - B.cg[2]); MESH.crew.rotation.x = -f * 0.95; }
      updateArrows();
    } else { boat.position.set(0, 0, 0); boat.quaternion.set(0, 0, 0, 1); }
    updateWater();
    // wake draw: reorder ring buffer as a single strip
    if (wakeCount > 1) {
      if (wakeCount === WAKE_N && wakeHead !== 0) { const tmp = wakePos.slice(); const n3 = WAKE_N * 3, h3 = wakeHead * 3; wakePos.set(tmp.subarray(h3, n3), 0); wakePos.set(tmp.subarray(0, h3), n3 - h3); wakeHead = 0; wakeCount = WAKE_N; }
      wakeGeo.setDrawRange(0, wakeCount); wakeGeo.attributes.position.needsUpdate = true;
    }
    hudT += dtReal; if (hudT > 0.1) { hudT = 0; hudUpdate(); drawCompass(); }
    chartT += dtReal; if (chartT > 0.4 && activeTab === 'res' && $('#panel').classList.contains('open')) { chartT = 0; drawLiveChart(); }
    updateCamera();
    renderer.render(scene, camera);
  } catch (e) { fail('Render error: ' + e.message); console.error(e); }
}
function applyViewOffset() {
  const w = window.innerWidth, h = window.innerHeight, open = $('#panel').classList.contains('open');
  if (w >= 900) camera.setViewOffset(w, h, 196, 0, w, h);
  else if (open) camera.setViewOffset(w, h, 0, h * 0.22, w, h);
  else camera.clearViewOffset();
}
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; applyViewOffset(); camera.updateProjectionMatrix(); if (activeTab === 'res') { drawStabChart(); drawLiveChart(); } }
window.addEventListener('resize', resize);

/* ---------------- buttons and chrome ---------------- */
function togglePanel(open) {
  const p = $('#panel'); const o = open === undefined ? !p.classList.contains('open') : open;
  p.classList.toggle('open', o); $('#grip').setAttribute('aria-expanded', o);
  document.documentElement.style.setProperty('--sheet', window.innerWidth >= 900 ? '0px' : (o ? '46vh' : '58px'));
  applyViewOffset(); camera.updateProjectionMatrix();
  setTimeout(() => { if (activeTab === 'res') { drawStabChart(); drawLiveChart(); } }, 260);
}
function wireButtons() {
  $('#bPause').onclick = () => { paused = !paused; $('#bPause').textContent = paused ? 'Run' : 'Pause'; };
  $('#bReset').onclick = resetBoat;
  $('#bGust').onclick = () => { if (S) { env.gustT0 = S.t; toast('Gust incoming, +' + Math.round(env.gustSize * 100) + '% for about 9 s'); } };
  $('#bTack').onclick = () => { if (!ctl.auto) { toast('Switch the autopilot on in the Sea tab to tack.'); return; } ctl.side = -ctl.side; toast(ctl.side > 0 ? 'Starboard tack' : 'Port tack'); };
  $('#bDump').onclick = () => { ctl.release = !ctl.release; $('#bDump').classList.toggle('on', ctl.release); $('#bDump').textContent = ctl.release ? 'Sheet in' : 'Dump sheet'; };
  $('#bForce').onclick = () => { showForces = !showForces; $('#bForce').classList.toggle('on', showForces); };
  $('#bView').onclick = () => { viewMode = viewMode === 'orbit' ? 'chase' : 'orbit'; cam.shift = 0; $('#bView').textContent = viewMode === 'orbit' ? 'View: orbit' : 'View: chase'; };
  $('#bSpeed').onclick = () => { const v = [1, 2, 4, 0.5]; timeScale = v[(v.indexOf(timeScale) + 1) % v.length]; $('#bSpeed').textContent = timeScale + '\u00d7'; };
  $('#grip').onclick = () => togglePanel();
  const pr = $('#presets'); pr.innerHTML = '';
  for (const k of Object.keys(PRESETS)) { const b = mk('button', 'preset', PRESETS[k].label); b.dataset.key = k; b.onclick = () => loadPreset(k); pr.appendChild(b); }
}

/* ---------------- start ---------------- */
try {
  P = JSON.parse(JSON.stringify(PRESETS.dinghy)); ctl = makeCtl(P); env = makeEnv(P._env.tws);
  buildPanel(); wireButtons();
  document.querySelector('.preset[data-key="dinghy"]').classList.add('on');
  syncControls(); resize();
  togglePanel(window.innerWidth >= 900);
  rebuild(true);
  requestAnimationFrame(frame);
} catch (e) { fail('Startup error: ' + e.message); console.error(e); }
})();

</script>
</body>
</html>
