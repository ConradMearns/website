<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disk Forge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --scene:#d3e2ea; --panel:rgba(246,249,248,.9); --panel-solid:#f4f7f6;
  --ink:#12243a; --ink-2:#4a6078; --line:#b4c6d2; --track:#c3d2dc;
  --chip:#e9dba9; --chip-ink:#12243a;
  --accent:#b3206b; --accent-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene:#0c1a2c; --panel:rgba(17,33,53,.88); --panel-solid:#112135;
    --ink:#e3ecf2; --ink-2:#9bb0c4; --line:#2a4262; --track:#263f5e;
    --chip:#eadbae; --chip-ink:#12243a;
    --accent:#e4579d; --accent-ink:#1c0812;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --scene:#0c1a2c; --panel:rgba(17,33,53,.88); --panel-solid:#112135;
  --ink:#e3ecf2; --ink-2:#9bb0c4; --line:#2a4262; --track:#263f5e;
  --chip:#eadbae; --chip-ink:#12243a;
  --accent:#e4579d; --accent-ink:#1c0812;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--scene);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;position:relative;overflow:hidden;
  background:var(--scene);color:var(--ink);
  font:400 16px/1.35 "Alegreya Sans","Gill Sans","Gill Sans MT","Trebuchet MS",system-ui,sans-serif;
  font-variant-numeric:lining-nums tabular-nums;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none !important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,dl,dd,ul,fieldset{margin:0;padding:0}
ul{list-style:none}

#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl:focus-visible{outline-offset:-3px}
#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;max-width:36ch;margin:auto}

#pin{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#pin::before{content:"";position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;
  border:2.5px solid var(--accent);background:rgba(255,255,255,.3);box-shadow:0 0 0 1.5px rgba(8,16,28,.55)}

/* top bar */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:12px 12px 0;pointer-events:none}
#top > *{pointer-events:auto}
.mark h1{font-size:25px;line-height:1;font-weight:800;letter-spacing:-.012em}
.mark p{font-size:14px;color:var(--ink-2);margin-top:3px}
.actions{display:flex;gap:8px;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:8px 13px;font-weight:500;line-height:1.2;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.wide{width:100%;padding:11px 13px}
.btn:disabled{opacity:.5;cursor:default}
.quiet{border:1px solid var(--line);background:transparent;border-radius:5px;padding:5px 10px;font-size:14px;font-weight:500}

/* bottom dock */
#dock{position:absolute;left:8px;right:8px;bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
#views{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
#views::-webkit-scrollbar{display:none}
#views.more{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent)}
#views button{flex:none;border:0;background:transparent;border-radius:4px;padding:6px 10px;color:var(--ink-2);font-weight:500;line-height:1.2}
#views button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
#views button.water, .water dt, .water dd, p.water{font-style:italic}

#progress p{font-size:15px}
.meter{height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:6px}
#progressFill{height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0);transition:transform .12s linear}

#info{display:flex;flex-direction:column;gap:8px}
.hint{font-size:14.5px;color:var(--ink-2);max-width:62ch}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14.5px;color:var(--ink-2)}
.keys li{display:flex;align-items:center;gap:6px}
.keys i{width:14px;height:8px;border-radius:2px;display:inline-block}
.keys .sw-land{background:#c9a15f}
.keys .sw-sea{background:#3f6f8f}
.ramp{padding-bottom:2px}
.ramp-bar{height:9px;border-radius:2px;border:1px solid var(--line)}
.ramp-ticks{position:relative;height:19px;font-size:13.5px;color:var(--ink-2)}
.ramp-ticks span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.ramp-ticks span.first{transform:none}
.ramp-ticks span.last{transform:translateX(-100%)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;border-top:1px solid var(--line);padding-top:8px}
.stats dt,.rows dt{font-size:13.5px;color:var(--ink-2);line-height:1.2}
.stats dd,.rows dd{font-size:16px;font-weight:500;line-height:1.25}
.probe-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.probe-head h2{font-size:19px;font-weight:700;line-height:1.15}
.probe-head p{font-size:14px;color:var(--ink-2)}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin-top:8px}

/* settings */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:64%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel-solid);border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding:14px 16px 22px;
  transform:translateY(104%);visibility:hidden;transition:transform .26s ease, visibility 0s linear .26s}
#sheet.open{transform:none;visibility:visible;transition:transform .26s ease, visibility 0s}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2,.sub{font-size:18px;font-weight:700}
.sub{margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.field{margin-top:12px}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.frow label,.seg legend,.field > label{font-weight:500}
.frow output{color:var(--ink-2);font-size:15px}
input[type="range"]{width:100%;margin:6px 0 0;accent-color:var(--accent);height:22px}
.seedrow{display:flex;gap:8px;margin-top:5px}
#seed{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;background:transparent;padding:8px 10px}
.seg{border:0;margin-top:14px;min-width:0}
.seg legend{margin-bottom:6px}
.seg .opts{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg label{flex:1;position:relative;text-align:center;display:flex}
.seg label + label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;padding:7px 4px;font-size:15px;line-height:1.15;color:var(--ink-2)}
.seg input:checked + span{background:var(--chip);color:var(--chip-ink);font-weight:500}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.note{font-size:14px;color:var(--ink-2);margin-top:6px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
#rebuild{margin-top:18px}
#exportWrap{margin-top:16px}

@media (min-width:480px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rows{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:900px){
  #top{padding:16px 18px 0}
  #openSheet,#closeSheet{display:none}
  #sheet{left:16px;right:auto;top:76px;bottom:16px;width:322px;max-height:none;border:1px solid var(--line);border-radius:8px;
    transform:none;visibility:visible;transition:none;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #dock{left:354px;right:16px;bottom:16px;max-width:720px;margin:0 auto;padding:10px 14px 12px}
}
@media (prefers-reduced-motion: reduce){
  #sheet,#sheet.open{transition:none}
  #progressFill{transition:none}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" role="img" aria-label="3D view of the generated disk world. Arrow keys orbit, plus and minus zoom."></canvas>
<p id="fatal" hidden></p>
<div id="pin" hidden></div>

<header id="top">
  <div class="mark">
    <h1>Disk Forge</h1>
    <p id="caption"></p>
  </div>
  <div class="actions">
    <button type="button" class="btn" id="openSheet" aria-controls="sheet" aria-expanded="false">Settings</button>
    <button type="button" class="btn primary" id="newWorld">New world</button>
  </div>
</header>

<section id="dock" aria-label="Map views and readouts">
  <div id="views" role="group" aria-label="Map view">
    <button type="button" data-view="terrain" aria-pressed="true">Terrain</button>
    <button type="button" data-view="elevation" aria-pressed="false">Elevation</button>
    <button type="button" data-view="plates" aria-pressed="false">Plates</button>
    <button type="button" data-view="basins" aria-pressed="false" class="water">Watersheds</button>
    <button type="button" data-view="rain" aria-pressed="false" class="water">Rain</button>
    <button type="button" data-view="temp" aria-pressed="false">Temperature</button>
  </div>
  <div id="progress" role="status" hidden>
    <p id="progressLabel"></p>
    <div class="meter"><div id="progressFill"></div></div>
  </div>
  <div id="info"></div>
</section>

<aside id="sheet" aria-label="World settings">
  <div class="sheet-head">
    <h2>Shape the world</h2>
    <button type="button" class="quiet" id="closeSheet">Done</button>
  </div>

  <div class="field">
    <label for="seed">Seed</label>
    <div class="seedrow">
      <input id="seed" type="text" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="quiet" id="reseed">Random</button>
    </div>
  </div>
  <div class="field">
    <div class="frow"><label for="plates">Tectonic plates</label><output id="platesOut" for="plates"></output></div>
    <input id="plates" type="range" min="6" max="26" step="1" value="14">
  </div>
  <div class="field">
    <div class="frow"><label for="land">Land</label><output id="landOut" for="land"></output></div>
    <input id="land" type="range" min="12" max="60" step="1" value="32">
  </div>
  <div class="field">
    <div class="frow"><label for="erosion">Erosion</label><output id="erosionOut" for="erosion"></output></div>
    <input id="erosion" type="range" min="1" max="5" step="0.25" value="2.5">
  </div>
  <div class="field">
    <div class="frow"><label for="impacts">Giant impacts</label><output id="impactsOut" for="impacts"></output></div>
    <input id="impacts" type="range" min="0" max="10" step="1" value="4">
  </div>
  <div class="field">
    <div class="frow"><label for="hotspots">Hotspot volcano chains</label><output id="hotspotsOut" for="hotspots"></output></div>
    <input id="hotspots" type="range" min="0" max="8" step="1" value="4">
  </div>
  <fieldset class="seg">
    <legend>Climate</legend>
    <div class="opts">
      <label><input type="radio" name="climate" value="coldhub" checked><span>Cold hub</span></label>
      <label><input type="radio" name="climate" value="hothub"><span>Hot hub</span></label>
      <label><input type="radio" name="climate" value="bands"><span>North to south</span></label>
    </div>
  </fieldset>
  <fieldset class="seg">
    <legend>Grid, cells across</legend>
    <div class="opts">
      <label><input type="radio" name="grid" value="256"><span>256</span></label>
      <label><input type="radio" name="grid" value="384" checked><span>384</span></label>
      <label><input type="radio" name="grid" value="512"><span>512</span></label>
      <label><input type="radio" name="grid" value="768"><span>768</span></label>
    </div>
    <p class="note">The disk is 16,000 km wide, so a cell is 62 km at 256 and 21 km at 768.</p>
  </fieldset>
  <button type="button" class="btn primary wide" id="rebuild">Rebuild with these settings</button>

  <h3 class="sub">Display</h3>
  <div class="field">
    <div class="frow"><label for="exag">Height exaggeration</label><output id="exagOut" for="exag"></output></div>
    <input id="exag" type="range" min="5" max="120" step="1" value="40">
  </div>
  <div class="field water">
    <div class="frow"><label for="rivers">Rivers shown</label><output id="riversOut" for="rivers"></output></div>
    <input id="rivers" type="range" min="0" max="100" step="1" value="50">
  </div>
  <label class="check"><input id="sea" type="checkbox" checked>Show the sea</label>

  <div id="exportWrap" hidden>
    <button type="button" class="btn wide" id="export" disabled>Export lookup tables</button>
    <p class="note">One JSON file with height, plates, climate, flow and watersheds as typed arrays, plus the river paths.</p>
    <p class="note" id="exportNote" role="status"></p>
  </div>
</aside>

<script>
/* ===== Simulation core: everything here is pure data, no DOM ===== */
const Sim = (() => {
  'use strict';
  const R_KM = 8000;                       // disk radius
  const OFF_X = [-1, 0, 1, -1, 1, -1, 0, 1];
  const OFF_Y = [-1, -1, -1, 0, 0, 1, 1, 1];
  const OFF_L = [Math.SQRT2, 1, Math.SQRT2, 1, 1, Math.SQRT2, 1, Math.SQRT2];

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const gauss = (d, mu, sig) => { const t = (d - mu) / sig; return Math.exp(-t * t); };

  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* 2D gradient noise + fbm */
  function makeNoise(rng) {
    const p = new Uint8Array(256); for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
    const perm = new Uint8Array(512); for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    const gx = new Float32Array(256), gy = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const a = rng() * 6.283185307; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
    function n2(x, y) {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
      const X = xi & 255, Y = yi & 255;
      const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1], ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
      const d00 = gx[aa] * xf + gy[aa] * yf, d10 = gx[ba] * (xf - 1) + gy[ba] * yf;
      const d01 = gx[ab] * xf + gy[ab] * (yf - 1), d11 = gx[bb] * (xf - 1) + gy[bb] * (yf - 1);
      const a = d00 + (d10 - d00) * u, b = d01 + (d11 - d01) * u;
      return (a + (b - a) * v) * 1.5;
    }
    function fbm(x, y, oct) {
      let s = 0, a = 1, f = 1, norm = 0;
      for (let o = 0; o < oct; o++) { s += a * n2(x * f, y * f); norm += a; a *= 0.5; f *= 2.03; }
      return s / norm;
    }
    return { n2, fbm };
  }

  /* binary min-heap on (key, cell) */
  function makeHeap(cap) {
    const keys = new Float64Array(cap + 1), ids = new Int32Array(cap + 1);
    let size = 0;
    return {
      clear() { size = 0; },
      get size() { return size; },
      push(k, id) {
        let i = ++size;
        while (i > 1) { const p = i >> 1; if (keys[p] <= k) break; keys[i] = keys[p]; ids[i] = ids[p]; i = p; }
        keys[i] = k; ids[i] = id;
      },
      topKey() { return keys[1]; },
      pop() {
        const id = ids[1]; const k = keys[size], v = ids[size]; size--;
        let i = 1;
        for (;;) {
          let c = i << 1; if (c > size) break;
          if (c < size && keys[c + 1] < keys[c]) c++;
          if (keys[c] >= k) break;
          keys[i] = keys[c]; ids[i] = ids[c]; i = c;
        }
        keys[i] = k; ids[i] = v;
        return id;
      },
    };
  }

  function createWorld(P) {
    const N = P.N, n = N * N;
    const W = {
      N, n, R_KM, cellKm: (2 * R_KM) / N, params: P,
      X: new Float32Array(n), Y: new Float32Array(n), R: new Float32Array(n),
      inDisk: new Uint8Array(n), diskCells: null,
      plate: new Uint8Array(n), plate2: new Uint8Array(n), bdist: new Float32Array(n),
      conv: new Float32Array(n), shear: new Float32Array(n), crust: new Float32Array(n),
      h: new Float32Array(n), U: new Float32Array(n),
      temp: new Float32Array(n), rain: new Float32Array(n), ice: new Uint8Array(n),
      filled: new Float64Array(n), rcv: new Int32Array(n).fill(-1), rdist: new Float32Array(n),
      order: new Int32Array(n), landCount: 0, flow: new Float32Array(n), lake: new Uint8Array(n),
      basin: new Uint16Array(n), basins: [], flen: new Float32Array(n),
      off: new Int32Array(8), plates: [], impacts: [], hotspots: [], stats: {}, stage: 0, ready: false,
    };
    for (let k = 0; k < 8; k++) W.off[k] = OFF_Y[k] * N + OFF_X[k];
    const rn = 1 - 2.2 / N, list = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const c = j * N + i, x = ((i + 0.5) / N) * 2 - 1, y = ((j + 0.5) / N) * 2 - 1, r = Math.hypot(x, y);
      W.X[c] = x; W.Y[c] = y; W.R[c] = r;
      if (r <= rn) { W.inDisk[c] = 1; list.push(c); }
    }
    W.diskCells = Int32Array.from(list);
    W.heap = makeHeap(n);
    W.closed = new Uint8Array(n);
    W.tmp = new Float32Array(n);
    return W;
  }

  /* ---------- 1. plates ---------- */
  function genPlates(W, P, rng, noise) {
    const K = P.plates, plates = [];
    for (let k = 0; k < K; k++) {
      let best = null, bd = -1;
      for (let c = 0; c < 24; c++) {
        const r = Math.sqrt(rng()) * 0.93, a = rng() * 6.283185;
        const x = r * Math.cos(a), y = r * Math.sin(a);
        let d = 1e9; for (const p of plates) { const dd = Math.hypot(p.x - x, p.y - y); if (dd < d) d = dd; }
        if (d > bd) { bd = d; best = { x, y }; }
      }
      const ang = rng() * 6.283185, sp = 0.35 + rng() * 0.65;
      plates.push({ id: k, x: best.x, y: best.y, w: (rng() - 0.5) * 0.16, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        om: (rng() - 0.5) * 1.1, cont: false, hue: rng(), tone: rng() });
    }
    const idx = plates.map((_, i) => i);
    for (let i = K - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    const nc = clamp(Math.round(K * (0.3 + P.land * 0.5)), 1, K - 1);
    for (let i = 0; i < nc; i++) plates[idx[i]].cont = true;
    W.plates = plates;

    const { X, Y, diskCells } = W;
    for (let t = 0; t < diskCells.length; t++) {
      const c = diskCells[t], x = X[c], y = Y[c];
      const wx = x + 0.2 * noise.fbm(x * 1.3 + 11.3, y * 1.3 + 4.7, 4) + 0.05 * noise.fbm(x * 4 + 3.1, y * 4 + 9.2, 3) + 0.02 * noise.fbm(x * 11 + 1.7, y * 11 + 5.2, 2);

  /* ---------- 2. crust, boundaries, hotspots -> starting heights + uplift field ---------- */
  function genCrust(W, P, rng, noise, noise2) {
    const { X, Y, R, diskCells, plates, h, U, crust, bdist, conv, shear, plate, plate2, N } = W;
    const m = diskCells.length;

  function stamp(W, x0, y0, rad, fn) {

  function applyImpact(W, imp) {

  /* ---------- 3. climate: temperature bands, prevailing winds, rain shadows ---------- */
  function latOf(mode, x, y, r) {
    if (mode === 'hothub') return 1 - Math.pow(Math.min(1, r), 2.2);
    if (mode === 'bands') return (y + 1) * 0.5;
    return Math.min(1, r);
  }
  const seaTemp = (u) => -23 + 53 * Math.pow(u, 0.85);

  function climate(W, P, noise) {
    const { N, X, Y, R, diskCells, h, temp, rain, ice } = W, mode = P.climate;
    const G = 96, gn = G * G;
    const hc = new Float32Array(gn), oc = new Uint8Array(gn), ev = new Float32Array(gn), uc = new Float32Array(gn);
    const wx = new Float32Array(gn), wy = new Float32Array(gn), ind = new Uint8Array(gn);

      const ci = Math.min(N - 1, Math.floor((gi + 0.5) / G * N)), cj = Math.min(N - 1, Math.floor((gj + 0.5) / G * N));

  /* ---------- 4. hydrology: fill depressions, route flow, accumulate discharge ---------- */
  function route(W) {

    const EPS = 1e-3; closed.fill(0); heap.clear(); let cnt = 0;

      } else {

  /* stream-power incision, implicit, solved from the coast upstream */

    const cellA = cellKm * cellKm, M = 0.42;

  function diffuse(W, kd) {
    const { N, h, tmp, order, landCount, inDisk } = W;

      if (inDisk[c - 1]) { s += Math.max(h[c - 1], -40); w++; } if (inDisk[c + 1]) { s += Math.max(h[c + 1], -40); w++; }
      if (inDisk[c - N]) { s += Math.max(h[c - N], -40); w++; } if (inDisk[c + N]) { s += Math.max(h[c + N], -40); w++; }

  /* ---------- 5. final hydrology products ---------- */
  function finalize(W) {
    const { h, filled, rcv, rdist, order, flow, lake, basin, flen, landCount, cellKm, diskCells } = W;
    route(W);
    lake.fill(0); basin.fill(0); flen.fill(0);

    for (let t = 0; t < landCount; t++) { const c = order[t]; if (flen[c] > longest) longest = flen[c]; if (flow[c] > maxFlow) maxFlow = flow[c]; if (lake[c]) lakes++; }

    };
  }

  /* rivers above a discharge threshold, as chains of cells from source/confluence to the next confluence or the sea */
  function traceRivers(W, threshold) {

  /* ---------- the pipeline ---------- */
  const STAGES = ['Breaking the crust into plates', 'Raising mountains and trenches', 'Running winds and rain', 'Eroding', 'Tracing rivers and watersheds'];

  async function generate(P, hooks) {
    const rng = mulberry32(hashStr(String(P.seed)));
    const noise = makeNoise(rng), noise2 = makeNoise(rng);
    const W = createWorld(P);
    const step = async (stage, label, frac) => { W.stage = stage; if (hooks && hooks.frame) await hooks.frame(W, stage, label, frac); };

    genPlates(W, P, rng, noise);
    await step(0, STAGES[0], 0.04);

    const iters = P.iters;
    for (let k = 0; k < P.impacts; k++) {

    }

    const { h, U, diskCells } = W;
    const kdt = P.erosion / iters, upIters = Math.max(1, Math.round(iters * 0.85)), uf = 0.7 / upIters;

  function setProgress(label, frac) {
    const p = $('#progress'); p.hidden = false;
    $('#progressLabel').textContent = label; $('#progressFill').style.transform = `scaleX(${Sim.clamp(frac, 0, 1)})`;
  }

  /* ---------- parameters ---------- */
  const ADJ = ['amber', 'quiet', 'salt', 'basalt', 'pale', 'iron', 'drowned', 'high', 'ochre', 'slow', 'broken', 'far', 'green', 'cold', 'red', 'old', 'bright', 'hollow', 'long', 'storm'];
  const NOUN = ['shoal', 'caldera', 'craton', 'atoll', 'massif', 'delta', 'rift', 'shelf', 'moraine', 'estuary', 'gyre', 'trench', 'mesa', 'fjord', 'basin', 'reef', 'scarp', 'isthmus', 'tarn', 'strait'];
  const randomSeed = () => ADJ[(Math.random() * ADJ.length) | 0] + '-' + NOUN[(Math.random() * NOUN.length) | 0];
  const F = { seed: $('#seed'), plates: $('#plates'), land: $('#land'), erosion: $('#erosion'), impacts: $('#impacts'), hotspots: $('#hotspots'), exag: $('#exag'), rivers: $('#rivers'), sea: $('#sea') };
  const radio = (name) => (document.querySelector(`input[name="${name}"]:checked`) || {}).value;
  function readParams() {
    return { seed: F.seed.value.trim() || 'unnamed', N: +radio('grid') || 384, plates: +F.plates.value, land: +F.land.value / 100, erosion: +F.erosion.value,
      iters: 48, impacts: +F.impacts.value, hotspots: +F.hotspots.value, climate: radio('climate') || 'coldhub' };
  }
  const OUT = {
    plates: (v) => v, land: (v) => v + '%', erosion: (v) => (+v < 1.8 ? 'light' : +v < 3.2 ? 'moderate' : +v < 4.3 ? 'heavy' : 'severe'),
    impacts: (v) => v, hotspots: (v) => v, exag: (v) => '×' + v, rivers: (v) => (+v < 25 ? 'the greatest only' : +v < 60 ? 'major rivers' : +v < 85 ? 'and their tributaries' : 'every sizeable river'),
  };
  function syncOutputs() { for (const k in OUT) $('#' + k + 'Out').textContent = OUT[k](F[k].value); }
  function savePrefs() {
    try {
      localStorage.setItem('diskforge:v1', JSON.stringify({ seed: F.seed.value, plates: F.plates.value, land: F.land.value, erosion: F.erosion.value, impacts: F.impacts.value,
        hotspots: F.hotspots.value, exag: F.exag.value, rivers: F.rivers.value, sea: F.sea.checked, grid: radio('grid'), climate: radio('climate') }));
    } catch (e) { /* storage unavailable: settings just don't persist */ }
  }
  function loadPrefs() {
    let p = null;
    try { p = JSON.parse(localStorage.getItem('diskforge:v1') || 'null'); } catch (e) { p = null; }
    const wide = window.innerWidth >= 900;
    const pick = (name, v) => { const el = document.querySelector(`input[name="${name}"][value="${v}"]`); if (el) el.checked = true; };
    pick('grid', wide ? 512 : 384);
    if (p) {
      for (const k of ['plates', 'land', 'erosion', 'impacts', 'hotspots', 'exag', 'rivers']) if (p[k] != null && p[k] !== '') F[k].value = p[k];
      if (p.seed) F.seed.value = p.seed; if (typeof p.sea === 'boolean') F.sea.checked = p.sea;
      if (p.grid) pick('grid', p.grid); if (p.climate) pick('climate', p.climate);
    }
    if (!F.seed.value) F.seed.value = randomSeed();
    state.exag = +F.exag.value; state.riverT = +F.rivers.value / 100; state.sea = F.sea.checked;
  }

  /* ---------- build a world ---------- */
  const CANCEL = {};
  const nextFrame = (ms) => new Promise((res) => { if (ms > 0) setTimeout(() => requestAnimationFrame(res), ms); else requestAnimationFrame(res); });
  async function build() {
    const id = ++runId, P = readParams();
    savePrefs(); syncOutputs();
    state.busy = true; document.documentElement.dataset.state = 'busy';
    state.probe = null; $('#pin').hidden = true; $('#info').innerHTML = ''; $('#caption').textContent = `${P.seed}, ${P.N} cells across`;
    M.rivers.count = 0;
    setProgress(Sim.STAGES[0], 0);
    let lastStage = -1, lastDraw = 0;
    try {
      const w = await Sim.generate(P, {
        frame: async (w, stage, label, frac) => {
          if (id !== runId) throw CANCEL;
          W = w; ensureTerrain(w);
          setProgress(label, frac);
          const first = stage !== lastStage; lastStage = stage;
          if (stage === 0) buildArrows();
          if (reduced && stage < 4) { await nextFrame(0); return; }
          const now = performance.now();
          if (first || stage !== 3 || now - lastDraw > 24) { updateTerrain(); lastDraw = now; }
          await nextFrame(stage === 0 ? 520 : stage === 1 ? 480 : stage === 2 ? 260 : stage === 3 ? 18 : 0);
          if (id !== runId) throw CANCEL;
        },
      });
      if (id !== runId) return;
      W = w; updateTerrain(); buildRivers();
      state.busy = false; document.documentElement.dataset.state = 'ready';
      $('#progress').hidden = true;
      showInfo(); $('#export').disabled = false;
    } catch (e) {
      if (e === CANCEL) return;
      console.error(e);
      state.busy = false; document.documentElement.dataset.state = 'error';
      $('#progressLabel').textContent = 'The build stopped: ' + (e && e.message ? e.message : 'unknown error') + '. Try a smaller grid.';
    }
  }

  /* ---------- export the lookup tables ---------- */
  function b64(view) {
    const u8 = new Uint8Array(view.buffer, view.byteOffset, view.byteLength); let s = '';
    for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
    return btoa(s);
  }
  function exportData() {
    const w = W, n = w.n, i16 = (f) => { const a = new Int16Array(n); for (let c = 0; c < n; c++) a[c] = Sim.clamp(Math.round(f(c)), -32768, 32767); return a; };
    const u16 = (f) => { const a = new Uint16Array(n); for (let c = 0; c < n; c++) a[c] = Sim.clamp(Math.round(f(c)), 0, 65535); return a; };
    const i8 = (f) => { const a = new Int8Array(n); for (let c = 0; c < n; c++) a[c] = Sim.clamp(Math.round(f(c)), -128, 127); return a; };
    const L = (type, unit, note, arr) => ({ type, unit, note, base64: b64(arr) });
    return {
      format: 'diskforge-lookup/1', seed: w.params.seed, params: w.params,
      grid: { size: w.N, cellKm: w.cellKm, radiusKm: Sim.R_KM, order: 'row-major, index = y * size + x', axes: 'x grows east, y grows south, the hub is the centre of the grid', encoding: 'little-endian typed arrays, base64' },
      layers: {
        mask: L('uint8', '', '1 inside the disk', w.inDisk),
        height_m: L('int16', 'm', 'bedrock height, sea level is 0', i16((c) => w.h[c])),
        lake_level_m: L('int16', 'm', 'water surface where a lake stands, otherwise -32768', i16((c) => (w.lake[c] ? w.filled[c] : -32768))),
        plate: L('uint8', '', 'index into plates', w.plate),
        plate_edge_km: L('uint16', 'km', 'distance to the nearest plate boundary', u16((c) => w.bdist[c])),
        convergence: L('int8', '', 'relative plate motion at that boundary x100: positive colliding, negative spreading', i8((c) => w.conv[c] * 100)),
        temperature_c: L('int8', '°C', 'annual mean', i8((c) => w.temp[c])),
        rain_mm: L('uint16', 'mm/yr', 'annual rainfall', u16((c) => w.rain[c])),
        ice: L('uint8', '', '1 where sea ice or an ice sheet stands', w.ice),
        flow: L('float32', 'km²·m/yr', 'rain collected from everything upstream; x0.0127 is roughly m³/s', w.flow),
        receiver: L('int32', '', 'index of the cell this one drains into, -1 at the rim', w.rcv),
        watershed: L('uint16', '', 'rank of the watershed by area, 1 is the largest, 0 is sea', w.basin),
      },
      plates: w.plates.map((p) => ({ id: p.id, xKm: p.x * Sim.R_KM, yKm: p.y * Sim.R_KM, continental: p.cont, drift: [p.vx, p.vy], spin: p.om })),
      watersheds: w.basins.slice(0, 200).map((b) => ({ rank: b.rank, outletCell: b.outlet, areaKm2: Math.round(b.areaKm2), mainStemKm: Math.round(b.lengthKm) })),
      rivers: riverData.map((r) => ({ cells: r.cells, flow: r.flows.map((f) => Math.round(f)) })),
      impacts: w.impacts.map((i) => ({ xKm: i.x * Sim.R_KM, yKm: i.y * Sim.R_KM, radiusKm: Math.round(i.rk) })),
      stats: w.stats,
    };
  }
  async function doExport() {
    const note = $('#exportNote');
    if (!W || !W.ready || !downloads) return;
    note.textContent = 'Packing the layers…';
    await nextFrame(0);
    try {
      const blob = new Blob([JSON.stringify(exportData())]);
      const res = await downloads.save({ filename: `diskforge-${String(W.params.seed).replace(/[^a-z0-9-]+/gi, '_')}-${W.N}.json`, data: blob });
      note.textContent = res && res.status === 'saved' ? 'Exported the lookup tables.' : 'Export sent.';
    } catch (e) {
      const code = e && e.code;
      note.textContent = code === 'declined' ? 'Export cancelled.' : code === 'rate_limited' ? 'A save prompt is already open. Answer it, then export again.' : code === 'too_large' ? 'That file is too large to save here. Rebuild on a smaller grid and export again.' : 'Export isn’t available in this view.';
    }
  }

  /* ---------- layout bookkeeping ---------- */
  const sheet = $('#sheet'), dock = $('#dock'), topbar = $('#top');
  const isWide = () => window.innerWidth >= 900;
  function measure() {
    const wide = isWide(), open = sheet.classList.contains('open');
    const cr = canvas.getBoundingClientRect(), dr = dock.getBoundingClientRect(), tr = topbar.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
    const inset = { top: tr.bottom - cr.top, bottom: cr.bottom - dr.top + 6, left: 0 };
    if (wide) inset.left = sr.right - cr.left + 8;
    else if (open) inset.bottom = Math.max(inset.bottom, cr.bottom - sr.top + 6);
    state.inset = inset;
    if (!state.moved) state.dist = fitDistance();
    clampCam(); invalidate();
  }
  function setSheet(open) {
    sheet.classList.toggle('open', open);
    if (!isWide()) { if (open) sheet.removeAttribute('inert'); else sheet.setAttribute('inert', ''); } else sheet.removeAttribute('inert');
    $('#openSheet').setAttribute('aria-expanded', String(open));
    setTimeout(measure, reduced ? 0 : 300); measure();
  }
  new ResizeObserver(() => { if (isWide()) sheet.removeAttribute('inert'); else if (!sheet.classList.contains('open')) sheet.setAttribute('inert', ''); measure(); }).observe(document.body);
  new ResizeObserver(measure).observe(dock);

  /* ---------- wiring ---------- */
  $('#openSheet').addEventListener('click', () => setSheet(!sheet.classList.contains('open')));
  $('#closeSheet').addEventListener('click', () => setSheet(false));
  $('#newWorld').addEventListener('click', () => { F.seed.value = randomSeed(); build(); });
  $('#reseed').addEventListener('click', () => { F.seed.value = randomSeed(); });
  $('#rebuild').addEventListener('click', () => { if (!isWide()) setSheet(false); build(); });
  F.seed.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); build(); } });
  for (const k of ['plates', 'land', 'erosion', 'impacts', 'hotspots']) F[k].addEventListener('input', syncOutputs);
  F.exag.addEventListener('input', () => { state.exag = +F.exag.value; syncOutputs(); if (T) buildShell(); invalidate(); savePrefs(); });
  F.rivers.addEventListener('input', () => { state.riverT = +F.rivers.value / 100; syncOutputs(); buildRivers(); if (state.probe) showProbe(); savePrefs(); });
  F.sea.addEventListener('change', () => { state.sea = F.sea.checked; invalidate(); savePrefs(); });
  const viewsEl = $('#views');
  const viewsEdge = () => { viewsEl.classList.toggle('more', viewsEl.scrollLeft + viewsEl.clientWidth < viewsEl.scrollWidth - 4); };
  viewsEl.addEventListener('scroll', viewsEdge, { passive: true }); window.addEventListener('resize', viewsEdge); viewsEdge();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(viewsEdge);
  document.querySelectorAll('#views button').forEach((b) => b.addEventListener('click', () => {
    state.view = b.dataset.view;
    document.querySelectorAll('#views button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
    recolour(); if (state.probe) showProbe(); else showInfo();
  }));
  $('#export').addEventListener('click', doExport);
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((d) => { if (d) { downloads = d; $('#exportWrap').hidden = false; } }).catch(() => {});
  }

  loadPrefs(); syncOutputs(); readTheme(); buildStars();
  if (isWide()) sheet.classList.add('open'); else sheet.setAttribute('inert', '');
  measure();
  requestAnimationFrame(loop);
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(measure);
  build();
})();

</script>
</body>
</html>
