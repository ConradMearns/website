<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dizzy execution domain, channel study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --ink:#F4DCC4; --dim:#A593BD; --board:#050407;
  --c-command:#99CCFF; --c-procedure:#FF9100; --c-event:#FFCC99;
  --c-projection:#D4709F; --c-query:#A9A3FF; --c-model:#FFEE99; --c-table:#E3C465; --c-col:#E3C465;
  --chrome:#CC99CC; --chrome-3:#3d3252; --amber:#FFCC33; --red:#E8492F;
  --lc:"Antonio","Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",sans-serif;
  --tx:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
:root[data-cond="yellow"]{ --chrome:#FFCC33; --chrome-3:#5a4712; }
:root[data-cond="red"]{ --chrome:#E8492F; --chrome-3:#571a10; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--tx);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.rail{flex:none;display:flex;flex-wrap:wrap;gap:4px;align-items:stretch;padding:10px 12px 8px}
.rail>*{height:36px;flex:none}
.r-tag{background:var(--chrome);color:#000;font:600 14px/36px var(--lc);text-transform:uppercase;letter-spacing:.04em;padding:0 14px 0 26px;clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px)}
.rail h1{margin:0;padding:0 14px 0 8px;font:700 30px/36px var(--lc);text-transform:uppercase;letter-spacing:.01em;color:var(--c-procedure);white-space:nowrap}
.r-fill{flex:1 1 10px;background:var(--chrome-3)}
.seg{background:var(--k,var(--chrome));color:#000;font:600 14px/36px var(--lc);text-transform:uppercase;letter-spacing:.04em;padding:0 11px;white-space:nowrap}
.seg:hover{filter:brightness(1.15)}
.seg.sq{padding:0;width:36px;text-align:center;font-size:18px}
.r-cap{width:30px;background:var(--chrome);clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}

.stage{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
#wrap{flex:1;min-height:0;overflow:auto;background:var(--board);cursor:grab;touch-action:pan-x pan-y}
#wrap.drag{cursor:grabbing}
svg#board{display:block;margin:0 auto}
#board text{font-family:var(--lc);text-transform:uppercase;letter-spacing:.03em;pointer-events:none}
.comp{cursor:pointer;outline:none;transition:opacity .2s}
.comp .body{stroke:transparent;stroke-width:2;paint-order:stroke;transition:filter .15s}
.comp text{fill:#000;font-weight:600}
.comp .nm{font-weight:700}
.comp .sm{font-size:9.5px;letter-spacing:.07em;opacity:.72}
.comp.hot .body,.comp:focus-visible .body{filter:brightness(1.22) saturate(.8);stroke:#fff;stroke-width:2}
.comp.on .body{stroke:#fff;stroke-width:4}
.has-sel .comp:not(.in):not(.keep):not(.hot):not(.on),.has-sel .deco:not(.in){opacity:.22}
.has-hot:not(.has-sel) .comp:not(.hot):not(.keep):not(.on){opacity:.5}
.deco{transition:opacity .2s;pointer-events:none}
.nook{font:400 12.5px/1.32 var(--tx);color:var(--ink);overflow:hidden;height:100%}
.sig{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:3 17;opacity:0;pointer-events:none}
.sig.live{opacity:.9;animation:march .75s linear infinite}
@keyframes march{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.halo{fill:none;stroke:#0c0a07}
.fk{fill:none;stroke:#6b5a2a;stroke-width:2.2}
.tbl .hd{fill:var(--c-table)}
.tbl text.tn{fill:#000;font-weight:700;font-size:14px}
.tbl text.tc{fill:#000;font-weight:600;font-size:11px;opacity:.7}
.col{cursor:pointer}
.col .row{fill:#15120c}
.col:nth-child(odd) .row{fill:#1b170f}
.col text{font-family:var(--mono)!important;text-transform:none!important;letter-spacing:0!important;font-size:10.5px;fill:#b9a67a}
.col text.rg{fill:#7d6f52;font-size:9.5px}
.col.pk text.cn{fill:var(--c-model);font-weight:700}
.wp,.rp{fill:#3a3223}
.col.w .wp,.tbl.w>.wp{fill:var(--c-projection)}
.col.r .rp,.tbl.r>.rp{fill:var(--c-query)}
.col.w .row,.col.r .row{fill:#2c2415}
.col.w text.cn,.col.r text.cn{fill:#fff}
.col.w.r .row{fill:#33283a}
.col:hover .row{fill:#3a301c}
.col.on .row{stroke:#fff;stroke-width:1.5}
.air{stroke-width:1.1;opacity:.75;pointer-events:none}
/* trace, findings, halt */
.tp{fill:none;stroke:#fff;stroke-width:6;opacity:0;pointer-events:none}
.tracing .comp:not(.t-on):not(.keep):not(.hot):not(.on),.tracing .deco:not(.t-on){opacity:.17}
.comp.t-bad .body{fill:var(--red);animation:alarm .7s steps(2) infinite}
.comp.t-bad text{fill:#fff}
.col.trd .rp{fill:var(--c-query)} .col.tw .wp{fill:var(--c-projection)}
.col.trd .row,.col.tw .row{fill:#2c2415} .col.tw.trd .row{fill:#33283a}
.col.trd text.cn,.col.tw text.cn{fill:#fff}
.col.tbad .row{fill:#6a1a0c;animation:rowalarm .7s steps(2) infinite} .col.tbad .wp{fill:#fff} .col.tbad text{fill:#fff}
.col.tok .row{fill:#1f3a1c} .col.tok .wp{fill:#9be28a} .col.tok text.cn{fill:#c9f5bf}
.comp.flag .body{stroke:var(--amber);stroke-width:5;animation:flag 1s steps(2) infinite}
@keyframes alarm{50%{fill:#fff}}
@keyframes rowalarm{50%{fill:var(--red)}}
@keyframes flag{50%{stroke-opacity:.15}}
:root[data-cond="red"] .k-model .body{fill:var(--red)}
:root[data-cond="red"] .k-model text{fill:#fff}
:root[data-cond="red"] .r-tag,:root[data-cond="red"] .r-cap{animation:throb 1.1s ease-in-out infinite}
@keyframes throb{50%{filter:brightness(.45)}}
.r-tag,.r-cap,.r-fill{transition:background .35s}
.i-body>.span2{grid-column:span 2}
.tlog{list-style:none;margin:0;padding:0;font:12px/1.65 var(--mono);color:#e6d6bd}
.tlog li{display:grid;grid-template-columns:62px 150px minmax(0,1fr);gap:10px;animation:wipe .25s ease-out}
.tlog .lt{color:var(--dim);text-align:right}
.tlog b{font:600 12.5px/1.65 var(--lc);text-transform:uppercase;letter-spacing:.04em;color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlog li.bad{color:#fff} .tlog li.bad b{color:var(--red)}
.tlog li.ok b{color:#9be28a}
@keyframes wipe{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.status{font:600 20px/1.15 var(--lc);text-transform:uppercase;letter-spacing:.03em;color:var(--chrome);margin:0 0 6px!important}
.act{background:var(--k,var(--c-command));color:#000;font:600 14px/30px var(--lc);text-transform:uppercase;letter-spacing:.04em;height:30px;padding:0 16px;margin:4px 6px 0 0}
.find{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;text-align:left;background:none;padding:0;margin:0 0 6px}
.find b{font:600 13px/22px var(--lc);text-transform:uppercase;letter-spacing:.03em;background:var(--amber);color:#000;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find:hover span{color:#fff}
.note{border-left:6px solid var(--amber);padding-left:10px;color:#fff}

/* readout dock */
#insp{flex:none;height:214px;display:flex;flex-direction:column;background:#000;border-top:4px solid var(--k,var(--chrome))}
#insp[hidden]{display:none}
.i-head{flex:none;display:flex;gap:4px;height:30px}
.i-kind{background:var(--k);color:#000;font:600 13px/30px var(--lc);text-transform:uppercase;letter-spacing:.05em;padding:0 12px 0 14px;clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px))}
.i-head h2{margin:0 8px;font:700 22px/30px var(--lc);text-transform:uppercase;letter-spacing:.02em;color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-fill{flex:1;background:var(--k);opacity:.35}
.i-x{background:var(--k);color:#000;font:600 13px/30px var(--lc);text-transform:uppercase;letter-spacing:.05em;padding:0 14px}
.i-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:22px;padding:10px 14px 12px}
.i-body>div{overflow:auto;min-height:0}
.i-body p{margin:0 0 8px}
.i-meta{font:400 12px/1.3 var(--lc);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px 5px;align-items:center;margin:0 0 9px}
.chips span{font:400 12px/1 var(--lc);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:4px}
.chip{background:var(--k);color:#000;font:600 12.5px/22px var(--lc);text-transform:uppercase;letter-spacing:.03em;height:22px;padding:0 9px}
.cols{margin:0 0 9px;font:12px/1.55 var(--mono);color:#d9c9a8}
.cols b{color:var(--c-table);font-weight:600}
.slots{border-collapse:collapse;width:100%;font-size:13.5px}
.slots td{padding:1px 10px 1px 0;border-bottom:1px solid #241d2e;vertical-align:baseline}
.slots td:first-child{font-family:var(--mono);font-size:12px;color:var(--c-event)}
.slots td:last-child{text-align:right;padding-right:0;color:var(--dim);font:400 11.5px/1 var(--lc);text-transform:uppercase;letter-spacing:.07em}
pre{margin:0;font:11.5px/1.5 var(--mono);color:#E9D6C2;tab-size:4}
@media (max-width:820px){
  .rail{flex-wrap:wrap} .rail h1{font-size:22px} .r-fill,.r-cap,.seg[data-kind]{display:none}
  #insp{height:44%} .i-body{display:block;overflow:auto} .i-body>div{overflow:visible;margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .sig.live{stroke-dasharray:none;opacity:.45} }
</style>
</head>
<body>
<header class="rail">
  <span class="r-tag" id="tag"></span>
  <h1>Execution domain</h1>
  <span class="r-fill"></span>
  <button class="seg" data-kind="command" style="--k:var(--c-command)">Command</button>
  <button class="seg" data-kind="query" style="--k:var(--c-query)">Query</button>
  <button class="seg" data-kind="procedure" style="--k:var(--c-procedure)">Procedure</button>
  <button class="seg" data-kind="event" style="--k:var(--c-event)">Event</button>
  <button class="seg" data-kind="projection" style="--k:var(--c-projection)">Projection</button>
  <button class="seg" id="b-trace" style="--k:#fff">Trace</button>
  <button class="seg" id="b-find" style="--k:var(--amber)">Findings</button>
  <button class="seg" id="b-halt" style="--k:var(--red)">Halt</button>
  <button class="seg sq" id="z-out" aria-label="Zoom out">−</button>
  <button class="seg" id="z-fit">Fit</button>
  <button class="seg sq" id="z-in" aria-label="Zoom in">+</button>
  <button class="seg" id="clear" style="--k:var(--c-model)">Clear</button>
  <span class="r-cap"></span>
</header>
<div class="stage">
  <div id="wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="The execution feat: each command as one shape docked onto the model"></svg></div>
  <aside id="insp" aria-live="polite"></aside>
</div>

<script type="application/json" id="data">{"title":"dizzy","description":"The execution domain: what the kernel was asked to run, what it attempted, and how each attempt ended. One append-only, content-addressed log per data directory, stored separately from the domain stores (one per application domain: core and each plugin) and never in a shared transaction with any of them. Queue state, dedupe, claims and fencing, outcomes, the abandon budget, the per-store watermark vector, per-domain reactor positions and the lifecycle telemetry (one span per attempt) are projections of this log; the `telemetry` sinks below observe what the log deliberately does not record. The domain stores alone are sufficient for application correctness; this log may be compacted or deleted and is rebuilt from the stores' causation blocks.","feat":"dizzy/engine/execution.feat.yaml","nodes":[{"id":"command:boot_kernel","kind":"command","name":"boot_kernel","desc":"Validate the domain bindings, open every bound domain's store and this log under the single-writer lock, fold this log, reconcile it against each bound store, catch up lagging domains, and record what recovery did","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class boot_kernel)"},{"id":"command:close_kernel","kind":"command","name":"close_kernel","desc":"The host ends the session in an orderly way: settle the completions that already returned, release every attempt still running, then stop. A close requested during an operation is only recorded: runs stop at their next safe point and the host's own close (outside any operation) dispatches it","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class close_kernel)"},{"id":"command:compact_log","kind":"command","name":"compact_log","desc":"Rotate to a new exec-log generation seeded by a snapshot of open work","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class compact_log)"},{"id":"command:publish_facts","kind":"command","name":"publish_facts","desc":"Hand newly durable facts to in-process subscribers (host-owned exporters)","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class publish_facts)"},{"id":"command:request_command","kind":"command","name":"request_command","desc":"Record intent to run an app command (type CURIE, canonical payload, optional idempotency key, priority) from an external source; the command's domain must be bound","intrinsic":false,"rt":[],"slots":[["type","string",true],["payload","string",true],["key","string",false],["priority","integer",true],["group","string",true]],"path":"def/commands.yaml (class request_command)"},{"id":"command:retry_command","kind":"command","name":"retry_command","desc":"Operator re-opens a failed command (by command_id); attempt numbering continues","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["by","string",false],["reason","string",false]],"path":"def/commands.yaml (class retry_command)"},{"id":"command:run_next","kind":"command","name":"run_next","desc":"Claim the head of the runnable order and run its unit of work: procedure, atomic append to its domain's store, per-event fold + commit + policies across every bound domain subscribed to the event","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class run_next)"},{"id":"event:attempt_abandoned","kind":"event","name":"attempt_abandoned","desc":"Recovery found a claim with no terminal fact and no app events carrying its attempt (attempt_id, command_id, abandons_so_far, detected_by_session, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["abandons_so_far","integer",true],["detected_by_session","string",true],["t","string",true]],"path":"def/events.yaml (class attempt_abandoned)"},{"id":"event:attempt_released","kind":"event","name":"attempt_released","desc":"The session ended in an orderly way (close_kernel) while this attempt was still running (attempt_id, command_id, session_id, t). Not a failure: the command returns to the runnable order and its next claim is attempt n+1. Unlike attempt_abandoned it does not count against abandon_budget \u2014 nothing crashed. Fenced like attempt_abandoned: a release naming an attempt that is not the command's live one is kept as a stale terminal.","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["session_id","string",true],["t","string",true]],"path":"def/events.yaml (class attempt_released)"},{"id":"event:command_claimed","kind":"event","name":"command_claimed","desc":"Attempt n of a command started (attempt_id, command_id, attempt_no, session_id, group \u2014 the topology group that claimed it, mirrors the request's group unless a topology swap landed between request and claim (\u00a713), store_seq_at_claim, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["attempt_no","integer",true],["session_id","string",true],["store_seq_at_claim","integer",true],["t","string",true],["group","string",true]],"path":"def/events.yaml (class command_claimed)"},{"id":"event:command_completed","kind":"event","name":"command_completed","desc":"A unit settled (attempt_id, command_id, command_type, domain prefix \u2014 the store the unit was appended to, group \u2014 denormalized from the claim, same pattern as domain (\u00a713), outcome completed|no_result, reason?, detail?, app_events [ids], app_through? \u2014 last event in that store, absent for no_result, bound [prefix] \u2014 domains whose elements ran on the unit, dispatched [{policy, trigger_event, index, command_id, deduped}], recovered bool, timings {procedure_ns, append_ns, folds {name: ns}, policies {name: ns}}, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["command_type","string",true],["domain","string",true],["outcome","string",true],["recovered","boolean",true],["t","string",true],["group","string",true],["reason","string",false],["detail","string",false],["app_through","string",false]],"path":"def/events.yaml (class command_completed)"},{"id":"event:command_failed","kind":"event","name":"command_failed","desc":"A unit failed BEFORE anything reached the app log \u2014 terminal (attempt_id, command_id, group \u2014 denormalized from the claim (\u00a713), stage decode|procedure|contract|encode|append|abandoned, error_type, message, traceback, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["stage","string",true],["error_type","string",true],["message","string",true],["traceback","string",true],["t","string",true],["group","string",true]],"path":"def/events.yaml (class command_failed)"},{"id":"event:command_requested","kind":"event","name":"command_requested","desc":"An app command became intent (command_id, command_type CURIE, domain prefix, group \u2014 the topology group the bound GroupPlan assigns this command's type, \"default\" when no topology is bound (\u00a713), payload canonical-JSON, payload_hash, key?, source external|policy|recovered, policy CURIE?, trigger_event event-id?, trigger_domain prefix?, dispatch_index?, priority, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["command_type","string",true],["domain","string",true],["payload","string",true],["payload_hash","string",true],["source","string",true],["priority","integer",true],["t","string",true],["group","string",true],["key","string",false],["policy","string",false],["trigger_event","string",false],["trigger_domain","string",false],["dispatch_index","integer",false]],"path":"def/events.yaml (class command_requested)"},{"id":"event:command_retried","kind":"event","name":"command_retried","desc":"An operator re-opened a failed command (command_id, by, reason?, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["by","string",true],["t","string",true],["reason","string",false]],"path":"def/events.yaml (class command_retried)"},{"id":"event:domain_attached","kind":"event","name":"domain_attached","desc":"A domain was bound that this generation's map does not know, or its feat_hash changed (prefix, id, feat_hash, log_id, requires [prefix], t)","intrinsic":false,"rt":[],"slots":[["prefix","string",true],["feat_hash","string",true],["log_id","string",true],["t","string",true],["requires","string",false]],"path":"def/events.yaml (class domain_attached)"},{"id":"event:domain_caught_up","kind":"event","name":"domain_caught_up","desc":"A re-enabled domain's elements replayed the units it missed while unbound (domain prefix, from {prefix: event id}, to {prefix: event id}, units, dispatched [command_id], t)","intrinsic":false,"rt":[],"slots":[["domain","string",true],["units","integer",true],["t","string",true]],"path":"def/events.yaml (class domain_caught_up)"},{"id":"event:foreign_settled","kind":"event","name":"foreign_settled","desc":"Recovery settled a causeless (replicated / foreign) one-event unit past its store's watermark \u2014 that unit's completion (domain prefix, event event-id, bound [prefix], dispatched [{policy, trigger_event, index, command_id, deduped}], timings {folds, policies}, t)","intrinsic":false,"rt":[],"slots":[["domain","string",true],["event","string",true],["t","string",true]],"path":"def/events.yaml (class foreign_settled)"},{"id":"event:kernel_booted","kind":"event","name":"kernel_booted","desc":"A kernel process took the single-writer lock and finished recovery (session_id, pid, host, bound [prefix], unbound [prefix], through {prefix: event id}, units_settled {prefix: n}, attempts_abandoned, requests_rederived, boot_ms, t)","intrinsic":false,"rt":[],"slots":[["session_id","string",true],["pid","integer",true],["host","string",true],["attempts_abandoned","integer",true],["requests_rederived","integer",true],["boot_ms","integer",true],["t","string",true]],"path":"def/events.yaml (class kernel_booted)"},{"id":"event:log_opened","kind":"event","name":"log_opened","desc":"Genesis of an exec-log generation (log_id, generation, kernel_version, domains {prefix: {id, feat_hash, log_id, requires [prefix]}} \u2014 the full accumulated map, unbound domains included; previous {log_id, heads}?, recovered_from none|snapshot|app_log, t)","intrinsic":false,"rt":[],"slots":[["log_id","string",true],["generation","integer",true],["kernel_version","string",true],["recovered_from","string",true],["t","string",true]],"path":"def/events.yaml (class log_opened)"},{"id":"event:request_repeated","kind":"event","name":"request_repeated","desc":"An external request named an existing command_id and was answered, not re-queued (command_id, status at the time, answered_from exec|app_log, command_type CURIE?, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["status","string",true],["answered_from","string",true],["t","string",true],["command_type","string",false]],"path":"def/events.yaml (class request_repeated)"},{"id":"event:snapshot_taken","kind":"event","name":"snapshot_taken","desc":"Seeds a new generation right after log_opened (open_work [full command_requested + attempt_no + abandons + releases + live attempt, parked work included], retry state, through {prefix: event id}, reacted {domain: {prefix: event id}}, seqs {prefix: n}, covers_heads {prefix: [heads]}, answered [external commands that finished no_result: id, type, status, payload_hash, key, since \u2014 dedupe memory the app log cannot answer, carried for answered_generations compactions], bound [domains of the compacting session], session_id, t)","intrinsic":false,"rt":[],"slots":[["t","string",true],["session_id","string",false]],"path":"def/events.yaml (class snapshot_taken)"},{"id":"event:subscriber_detached","kind":"event","name":"subscriber_detached","desc":"A host subscriber raised and was detached; nothing is retried inline (subscriber, last_fact_seq, error_type, message, t)","intrinsic":false,"rt":[],"slots":[["subscriber","string",true],["last_fact_seq","integer",true],["error_ty ython-uv"],"path":"lib/python-uv/procedure/record_request/src/record_request.py","code":"from gen_int.python.procedure.record_request_protocol import record_request_protocol\nfrom gen_int.python.procedure.record_request_context import record_request_context\nfrom gen_def.pydantic.commands import RequestCommand\nfrom gen_def.pydantic.events import CommandRequested, RequestRepeated\nfrom gen_def.pydantic.query.command_status import CommandStatusInput\nfrom gen_def.pydantic.query.causation_lookup import CausationLookupInput\n\nfrom dizzy.engine.binding import curie_prefix\nfrom dizzy.engine.errors import CommandKeyConflict\nfrom dizzy.engine.execution.facts import now\nfrom dizzy.engine.ids import external_command_id, payload_hash\n\n\ndef record_request(\n    context: record_request_context,\n    command: RequestCommand,\n) -> None:\n    \"\"\"kernel.py's current ``_request``, translated to the generated\n    query+emit contract (docs/design/engine-domains.md \u00a75a.5: DIZZY-authored,\n    no mechanism escape hatch). ``command.type``/``payload``/``priority``/\n    ``group`` are already resolved by Kernel.request() before this runs \u2014\n    only app-binding knowledge can resolve them, which this procedure never\n    touches.\"\"\"\n    import json\n\n    payload = json.loads(command.payload)\n    cid = external_command_id(command.type, payload, command.key)\n    ph = payload_hash(payload)\n\n    status = context.query.command_status(CommandStatusInput(command_id=cid))\n    if status.found:\n        stored = status.payload_hash\n        if command.key is not None and stored not in (\"\", ph):\n            raise CommandKeyConflict(cid, command.key, stored, ph)\n        context.emit.request_repeated(\n            RequestRepeated(\n                command_id=cid, status=status.status, answered_from=\"exec\", t=now(), command_type=command.type\n            )\n        )\n        return\n\n    causation = context.query.causation_lookup(CausationLookupInput(command_id=cid))\n    if causation.has_unit:\n        stored = causation.payload_hash or \"\"\n        if command.key is not None and stored and stored != ph:\n            raise CommandKeyConflict(cid, command.key, stored, ph)\n        context.emit.request_repeated(\n            RequestRepeated(\n                command_id=cid, status=\"completed\", answered_from=\"app_log\", t=now(), command_type=command.type\n            )\n        )\n        return\n\n    context.emit.command_requested(\n        CommandRequested(\n            command_id=cid,\n            command_type=command.type,\n            domain=curie_prefix(command.type),\n            payload=command.payload,\n            payload_hash=ph,\n            source=\"external\",\n            priority=command.priority,\n            t=now(),\n            group=command.group,\n            key=command.key,\n        )\n    )\n"},{"id":"procedure:record_retry","kind":"procedure","name":"record_retry","desc":"Only a failed command may be retried; append command_retried so it becomes runnable again with attempt numbering continued.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/procedure/record_retry/src/record_retry.py","code":"from gen_int.python.procedure.record_retry_protocol import record_retry_protocol\nfrom gen_int.python.procedure.record_retry_context import record_retry_context\nfrom gen_def.pydantic.commands import RetryCommand\nfrom gen_def.pydantic.events import CommandRetried\nfrom gen_def.pydantic.query.command_status import CommandStatusInput\n\nfrom dizzy.engine.errors import NotRetryable\nfrom dizzy.engine.execution.facts import now\n\n\ndef record_retry(\n    context: record_retry_context,\n    command: RetryCommand,\n) -> None:\n    \"\"\"kernel.py's current ``retry()``, translated to the generated\n    query+emit contract. The domain-still-bound check (``DomainNotBound``)\n    is NOT here: it needs the app Bindings, which this procedure has no\n    access to by design \u2014 Kernel.retry() (step 10) che ive, so a lifecycle the log lost (an abandon + re-claim, a retry + re-claim) is re-appended first. A refold/catch-up halt synthesizes no request. Then every open attempt of a bound domain with no landed unit is abandoned (the process died with it running); at abandon_budget the command fails with stage=abandoned. An attempt an orderly close released is no longer open, so it is never abandoned. Open attempts of unbound domains stay open (parked). Finally append kernel_booted. Runs before the kernel can host this domain (it produces the log the domain is hosted over), so the kernel calls it directly at open rather than dispatching boot_kernel \u2014 and calls session_opened, the sink declared here, right after it (from the generated build_intrinsic_extras). Units recovery settles are not reported as unit_appended: their append happened in the session that died.","intrinsic":true,"rt":[]},{"id":"procedure:rotate","kind":"procedure","name":"rotate","desc":"Write gen-(N+1).db holding log_opened(previous) and snapshot_taken(open work incl. parked, watermark vector, reactor positions) with the full domain map, fsync it, atomically replace the CURRENT pointer, then delete generations beyond retain_generations. Open state is carried forward, never truncated; no_result external dedupe memory for answered_generations compactions.","intrinsic":true,"rt":[]},{"id":"procedure:run_unit","kind":"procedure","name":"run_unit","desc":"The st loop body: pick the next runnable command, fairly round-robined across topology groups when a GroupPlan is bound (one group, \"default\", when it is not (\u00a713)); claim (append command_claimed, stamped with its group), decode, run the procedure with a buffered emit \u2014 on the ONE thread that ever calls this step for an inline group's command, or handed to that pool group's worker pool and returned to for a later step once its result is drained \u2014 encode and round-trip each event (an event of another domain is a contract failure), append the unit to its domain's store in ONE transaction with a causation block per event (carrying `after`, the heads of required stores), then per event fold + commit + policies of every bound domain subscribed to its type, with a per-call dispatch that derives command ids. Finally ONE exec transaction holds command_requested for each new dispatch plus command_completed. Failures before the app append are terminal command_failed; failures after it are unit_settle_failed and halt the kernel. Idle (nothing runnable, nothing in flight) appends nothing. Right after the app append commits \u2014 before folds and policies, inline or drained from a pool \u2014 unit_appended reports the unit's events with their types.","intrinsic":true,"rt":[]},{"id":"query:unit_trace","kind":"query","name":"unit_trace","desc":"The causal tree rooted at one command_id: request \u2192 attempts \u2192 app events \u2192 folds \u2192 policies \u2192 dispatched commands, with durations and named outcomes","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/query/unit_trace/src/unit_trace.py","code":"from gen_int.python.query.unit_trace import unit_trace_query, unit_trace_context\nfrom gen_def.pydantic.query.unit_trace import UnitTraceInput, UnitTraceOutput, UnitTraceNode, UnitTraceAttempt\n\n\ndef _node(data: dict) -> UnitTraceNode:\n    return UnitTraceNode(\n        command_id=data[\"command_id\"],\n        command_type=data[\"command_type\"],\n        domain=data[\"domain\"],\n        source=data[\"source\"],\n        outcome=data[\"outcome\"],\n        attempts=[UnitTraceAttempt(**a) for a in data[\"attempts\"]],\n        children=[_node(c) for c in data[\"children\"]],\n    )\n\n\ndef unit_trace(input: UnitTraceInput, context: unit_trace_context) -> UnitTraceOutput:\n    data = context.adapter.state.unit_trace(input.command_id)\n    if data is None:\n        return UnitTraceOutput(found=False, node=None)\n    return UnitTraceOutput(found=True, node=_node(data))\n","cols":{"Command":["comm store\n    view = store.known(event.command_id, event)\n    if view.status != \"requested\":\n        raise IntegrityError(\n            f\"claim {event.attempt_id[:12]} of command {event.command_id[:12]} \"\n            f\"in status {view.status} (only requested work is claimable)\"\n        )\n    view.status = \"claimed\"\n    view.live_attempt = event.attempt_id\n    view.attempt_no = max(view.attempt_no, event.attempt_no)\n    view.claimed_group = event.group\n    store.claimed(view)\n","writes":["Command","Attempt"],"cols":{"Command":["status","attempt_no"],"Attempt":"*"}},{"id":"projection:completions","kind":"projection","name":"completions","desc":"command_completed naming the live attempt (or a non-terminal command with no live attempt, as for a recovered unit) \u2192 status := completed or no_result, live attempt and pending settlement cleared; and when it carries app_through (a no_result does not), the store's watermark through[domain] := app_through and reacted[d][domain] := app_through for every domain d in the completion's `bound` that reads that store (d itself, or a domain that requires it). Any other completion is kept as a stale terminal and changes nothing.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/completions/src/completions.py","code":"from gen_int.python.projection.completions_projection import completions_context\nfrom gen_def.pydantic.events import CommandCompleted\n\nfrom dizzy.engine.log import ExecRecord\n\n\ndef completions(\n    event: CommandCompleted,\n    context: completions_context,\n) -> None:\n    \"\"\"A settled unit: the command's outcome, and the watermark and reactions it moves.\"\"\"\n    store = context.adapter.store\n    view = store.known(event.command_id, event)\n\n    # The fence: a terminal counts only when it names the live attempt, or the command\n    # has no live attempt and is not terminal (a recovered unit whose claim this\n    # generation never saw). Anything else is kept as a stale ":"projection:repeats","kind":"projection","name":"repeats","desc":"request_repeated \u2192 when the command it names is known here, its repeats += 1 (this generation's count of external requests answered with it instead of queued again). A command answered from the snapshot's memory or the app log has no row here and nothing changes.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/repeats/src/repeats.py","code":"from gen_int.python.projection.repeats_projection import repeats_context\nfrom gen_def.pydantic.events import RequestRepeated\n\n\ndef repeats(\n    event: RequestRepeated,\n    context: repeats_context,\n) -> None:\n    \"\"\"An external request answered with an existing command: this generation's count.\"\"\"\n    store = context.adapter.store\n    view = store.work.get(event.command_id)\n    if view is not None:  # answered from snapshot memory or the app log: no row here\n        view.repeats += 1\n","writes":["Command"],"cols":{"Command":["repeats"]}},{"id":"projection:requests","kind":"projection","name":"requests","desc":"command_requested \u2192 a command_id not yet known becomes a Command row with status requested, ordered after everything requested before it, and joins its group's runnable order if its domain is bound (parked otherwise). A known command_id is left unchanged.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/requests/src/requests.py","code":"from gen_int.python.projection.requests_projection import requests_context\nfrom gen_def.pydantic.events import CommandRequested\n\nfrom dizzy.engine.execution.state import CommandView\n\n\ndef requests(\n    event: CommandRequested,\n    context: requests_context,\n) -> None:\n    \"\"\"A new command becomes a requested row, ordered after everything requested before\n    it (runnable if its domain is bound, parked otherwise); a known one is unchanged.\"\"\"\n    store = context.adapter.store\n    if event.command_id in store.work:\n        return\n s","procedure:record_retry","reads"],["command:compact_log","procedure:rotate","handles"],["procedure:rotate","event:log_opened","emits"],["procedure:rotate","event:snapshot_taken","emits"],["query:open_work","procedure:rotate","reads"],["query:app_watermark","procedure:rotate","reads"],["command:publish_facts","procedure:notify_subscribers","handles"],["procedure:notify_subscribers","event:subscriber_detached","emits"],["command:close_kernel","procedure:close_session","handles"],["procedure:close_session","event:attempt_released","emits"],["procedure:close_session","event:command_requested","emits"],["procedure:close_session","event:command_completed","emits"],["procedure:close_session","event:command_failed","emits"],["procedure:close_session","event:unit_settle_failed","emits"],["event:command_requested","projection:requests","feeds"],["projection:requests","model:execution","writes"],["event:command_claimed","projection:claims","feeds"],["projection:claims","model:execution","writes"],["event:command_completed","projection:completions","feeds"],["projection:completions","model:execution","writes"],["event:command_failed","projection:failures","feeds"],["projection:failures","model:execution","writes"],["event:unit_settle_failed","projection:settle_failures","feeds"],["projection:settle_failures","model:execution","writes"],["event:attempt_abandoned","projection:abandons","feeds"],["projection:abandons","model:execution","writes"],["event:attempt_released","projection:releases","feeds"],["projection:releases","model:execution","writes"],["event:command_retried","projection:retries","feeds"],["projection:retries","model:execution","writes"],["event:snapshot_taken","projection:snapshots","feeds"],["projection:snapshots","model:execution","writes"],["event:foreign_settled","projection:foreign_watermark","feeds"],["projection:foreign_watermark","model:execution","writes"],["event:domain_caught_up","projection:reactors","feeds"],["projection:reactors","model:execution","writes"],["event:log_opened","projection:pairing","feeds"],["projection:pairing","model:execution","writes"],["event:domain_attached","projection:attachments","feeds"],["projection:attachments","model:execution","writes"],["event:kernel_booted","projection:boots","feeds"],["projection:boots","model:execution","writes"],["event:request_repeated","projection:repeats","feeds"],["projection:repeats","model:execution","writes"],["event:subscriber_detached","projection:detachments","feeds"],["projection:detachments","model:execution","writes"],["model:execution","query:next_runnable","serves"],["model:execution","query:command_status","serves"],["model:execution","query:open_work","serves"],["model:execution","query:open_attempts","serves"],["model:execution","query:app_watermark","serves"],["model:execution","query:reactor_lag","serves"],["model:execution","query:unit_trace","serves"],["model:execution","query:causation_lookup","serves"]],"lint":{"event-not-past-tense":{"severity":"warning","summary":"an event is a fact: name it in the past tense"},"command-reads-like-event":{"severity":"warning","summary":"a command is an intent: name it imperatively"},"event-unconsumed":{"severity":"warning","summary":"no policy or projection consumes the event"},"command-unhandled":{"severity":"warning","summary":"no procedure handles the command"},"procedure-emits-nothing":{"severity":"warning","summary":"the procedure declares no events"},"model-unwritten":{"severity":"warning","summary":"no projection writes the model"},"query-no-model":{"severity":"info","summary":"the query reads no model"},"event-grain":{"severity":"info","summary":"one event's slots are a strict subset of another's"},"model-empty":{"severity":"warning","summary":"the model declares no tables"},"model-disconnected":{"severity":"warning","summary":"the model's tables share no foreign key"},"model-string-fk":{"severity":"warning","summary":"a string column holds another table's key"},"model-string-id":{"severity":"info","summary":"a string id column that matches no table of the model"},"model-json-column":{"severity":"warning","summary":"a *_json column: a table hiding inside a string"},"model-no-identifier":{"severity":"warning","summary":"a table without an identifier (or a composite unique_keys)"}}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const N = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const L = D.links;
const out = (id, k) => L.filter(l => l[0] === id && l[2] === k).map(l => l[1]);
const inn = (id, k) => L.filter(l => l[1] === id && l[2] === k).map(l => l[0]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const uniq = a => [...new Set(a)];
const MODEL = D.nodes.find(n => n.kind === 'model'), M = MODEL.id;
const TABLES = MODEL.tables, TB = Object.fromEntries(TABLES.map(t => [t.id, t]));
const SIDES = [['boot_kernel','compact_log','publish_facts'], ['request_command','run_next','retry_command','close_kernel']].map(s => s.map(n => 'command:' + n));
const CMDS = SIDES.flat();
const QORD = out(M, 'serves');
const PJ = e => out(e, 'feeds')[0];
const procOf = c => out(c, 'handles')[0];
const reads = p => inn(p, 'reads').sort((a, b) => QORD.indexOf(a) - QORD.indexOf(b));

const kindOf = id => id.startsWith('table:') ? 'table' : id.startsWith('col:') ? 'col' : N[id].kind;
const nameOf = id => id.startsWith('table:') ? id.slice(6) : id.startsWith('col:') ? id.slice(4) : N[id].name;
const colsOf = id => { const c = N[id].cols || {}, r = [];
  for (const t in c) (c[t] === '*' ? TB[t].rows.map(x => x[0]) : c[t]).forEach(n => r.push('col:' + t + '.' + n)); return r; };
const starOf = id => Object.keys(N[id].cols || {}).filter(t => N[id].cols[t] === '*');
const ncols = id => colsOf(id).length;
const WR = {}, RD = {};
D.nodes.forEach(n => { if (n.kind === 'projection') colsOf(n.id).forEach(c => (WR[c] = WR[c] || []).push(n.id));
                       if (n.kind === 'query') colsOf(n.id).forEach(c => (RD[c] = RD[c] || []).push(n.id)); });
const tableCols = t => TB[t].rows.map(r => 'col:' + t + '.' + r[0]);
const slice = c => { const p = procOf(c), es = out(p, 'emits'); return [c, p, ...es, ...es.map(PJ), ...reads(p)]; };
function related(id){
  const k = kindOf(id);
  if (k === 'command') return slice(id);
  if (k === 'procedure') return slice(inn(id, 'handles')[0]);
  if (k === 'event') return [id, PJ(id)];
  if (k === 'projection') return [id, ...inn(id, 'feeds')];
  if (k === 'col') return [id, ...(WR[id] || []), ...(RD[id] || [])];
  if (k === 'table') return uniq([id, ...tableCols(id.slice(6)).flatMap(c => [...(WR[c] || []), ...(RD[c] || [])])]);
  return [id];
}

/* ════ layout: the model in the middle, one composite shape per command docked on its sides ════ */
const U = { cmdW:160, tr0:164, tr1:186, ev0:196, evW:168, wg0:367, wgN:486, wg1:567, rail:579 };
const X = { margin:24, tW:196, tG:36, mPadL:40, mPadR:16 };
X.mW = X.mPadL + 3*X.tW + 2*X.tG + X.mPadR;
X.m = X.margin + U.rail + 3; X.mR = X.m + X.mW; const W = X.mR + 3 + U.rail + X.margin;
const TOP = 26, BAR = 36, yS = TOP + BAR + 6, HA = 28;
const evH = e => Math.round(20 + 2.4*(N[e].slots || []).length);
const G = {};
let SH = '', SIG = '';

const poly = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
const comp = (id, c, kind, label, inner, port) => `<g class="comp k-${kind}" data-id="${id}" data-c="${c}"${port ? ` data-port="${port[0]},${port[1]}"` : ''} tabindex="0" role="button" aria-label="${esc(label)}"><title>${esc(label)}</title>${inner}</g>`;

function cluster(cmd, side, y0){
  const x0 = side ? W - X.margin : X.margin, ux = u => side ? x0 - u : x0 + u;
  const P = pts => poly(pts.map(([u, y]) => [ux(u), y]));
  const T = (u, y, s, cls, size, end, max) => `<text class="${cls}" x="${ux(u)}" y="${y}" dy=".36em" font-size="${size}" text-anchor="${(end ? !side : side) ? 'end' : 'start'}"${max ? ` data-max="${max}"` : ''}>${esc(s)}</text>`;
  const p = procOf(cmd), es = out(p, 'emits'), rs = reads(p), deg = es.length + rs.length, edge = side ? X.mR : X.m;
  const y1 = y0 + HA + 4;
  // rows: one per emitted event, as tall as the event has slots
  let y = y1; const rows = es.map(e => { const h = evH(e), r = {e, y, h}; y += h + 4; return r; });
  let rowsH = y - 4 - y1; if (rowsH < 44){ rows[rows.length-1].h += 44 - rowsH; rowsH = 44; }
  rows.forEach(r => r.cy = r.y + r.h/2);
  // where each projection lands on the model's edge: as thick as the columns it writes
  const ends = rows.map(r => 4 + 1.6*ncols(PJ(r.e))), eTot = ends.reduce((a, b) => a + b, 0) + 3*(ends.length - 1);
  let b = y1 + Math.max(0, (rowsH - eTot)/2); rows.forEach((r, i) => { r.b0 = b; r.b1 = b + ends[i]; b += ends[i] + 3; });
  const H = Math.max(rowsH, eTot), tEnd = rows[rows.length-1].cy + 6;
  let s = '', deco = '';

  // command: the tab the whole shape hangs from
  s += comp(cmd, cmd, 'command', `Command ${N[cmd].name}`, `<polygon class="body" points="${P([[0,y0+HA],[0,y0+13],[13,y0],[U.cmdW,y0],[U.cmdW,y0+HA]])}" fill="var(--c-command)"/>` + T(U.cmdW - 12, y0 + HA/2, N[cmd].name, 'nm', 15, true, U.cmdW - 30));

  // read band: leaves the model, carries a copy of each query, elbows down into the procedure
  if (rs.length){
    deco += `<polygon points="${P([[U.tr0,y0+HA],[U.tr0,y0+11],[U.tr0+11,y0],[202,y0],[192,y0+HA]])}" fill="var(--c-query)"/>`;
    let u = 195;
    rs.forEach(q => { const w = 46 + 7*ncols(q);
      s += comp(q, cmd, 'query', `Query ${N[q].name}, reads ${ncols(q)} columns`, `<polygon class="body" points="${P([[u,y0+HA],[u+10,y0],[u+w+10,y0],[u+w,y0+HA]])}" fill="var(--c-query)"/>` + T(u + 14, y0 + HA/2, N[q].name, 'nm', 11.5, false, w - 34) + T(u + w - 2, y0 + HA/2, pad2(ncols(q)), 'nm', 11.5, true), [edge, y0 + HA/2]);
      u += w + 3; });
    deco += `<polygon points="${P([[u+3.2,y0+19],[u+6.8,y0+9],[U.wg1,y0+9],[U.wg1,y0+19]])}" fill="var(--c-query)" opacity=".55"/><polygon points="${P([[U.wg1,y0],[U.rail,y0],[U.rail,y0+HA],[U.wg1,y0+HA]])}" fill="var(--c-query)"/>`;
    SIG += `<path class="sig" data-c="${cmd}" d="M${ux(U.rail)} ${y0+14}L${ux(U.tr0+11)} ${y0+14}L${ux(U.tr0+11)} ${y1+4}"/>`;
  }

  // procedure: an elbow, then a trunk, then a tooth per event
  const elbow = rowsH > 150, hP = elbow ? Math.min(132, Math.max(62, 44 + 5*deg)) : H;
  const pts = elbow ? [[0,y1],[U.tr1,y1],[U.tr1,tEnd],[U.tr0,tEnd],[U.tr0,y1+hP+12],[U.tr0-12,y1+hP],[22,y1+hP],[0,y1+hP-22]]
                    : [[0,y1],[U.tr1,y1],[U.tr1,Math.max(tEnd, y1+hP)],[18,y1+hP],[0,y1+hP-18]].map((q, i) => i === 2 ? [U.tr1, y1 + hP] : q);
  let teeth = rows.map(r => `<polygon points="${P([[U.tr1-1,r.cy-6],[U.ev0,r.cy-6],[U.ev0,r.cy+6],[U.tr1-1,r.cy+6]])}" fill="var(--c-procedure)"/>`).join('');
  const fs = Math.min(26, 14 + .9*deg), n = N[p];
  s += comp(p, cmd, 'procedure', `Procedure ${n.name}, emits ${es.length}, reads ${rs.length}`, `<polygon class="body" points="${P(pts)}" fill="var(--c-procedure)"/>${teeth}`
    + T(U.tr0 - 12, y1 + (hP < 50 ? 15 : 22), n.name, 'nm', hP < 50 ? 14 : fs, true, U.tr0 - 26)
    + T(U.tr0 - 12, y1 + (hP < 50 ? 32 : 30 + fs*.55), (n.intrinsic ? 'intrinsic' : n.rt.join(' ')) + '  ' + pad2(rs.length) + ' in ' + pad2(es.length) + ' out', 'sm', 9.5, true));
  if (elbow){ const nx = side ? x0 - U.tr0 + 14 : x0 + 4, nh = tEnd - (y1 + hP) - 14;
    deco += `<foreignObject x="${nx}" y="${y1 + hP + 10}" width="${U.tr0 - 18}" height="${nh}"><div xmlns="http://www.w3.org/1999/xhtml" class="nook">${esc(brief(n.desc, nh > 200 ? 330 : 150))}</div></foreignObject>`; }
  SIG += `<path class="sig" data-c="${cmd}" d="M${ux(U.tr0+11)} ${y1+2}L${ux(U.tr0+11)} ${tEnd-6}"/>`;

  // events and their projections: each projection is a wedge stretched from the event to the model
  rows.forEach(r => { const e = r.e, pj = PJ(e), fan = inn(e, 'emits').length, sl = (N[e].slots || []).length, bm = (r.b0 + r.b1)/2;
    s += comp(e, cmd, 'event', `Event ${N[e].name}, ${sl} slots${fan > 1 ? ', emitted by ' + fan + ' procedures' : ''}`,
      `<polygon class="body" points="${P([[U.ev0,r.y],[U.ev0+U.evW,r.y],[U.ev0+U.evW,r.y+r.h-9],[U.ev0+U.evW-9,r.y+r.h],[U.ev0,r.y+r.h]])}" fill="var(--c-event)"/>`
      + T(U.ev0 + 10, r.cy, N[e].name, 'nm', Math.min(17, 12 + .38*sl), false, U.evW - (fan > 1 ? 62 : 44)) + T(U.ev0 + U.evW - 11, r.cy, pad2(sl), 'nm', 13, true)
      + (fan > 1 ? T(U.ev0 + U.evW - 32, r.cy, '×' + fan, 'sm', 10, true) : ''));
    s += comp(pj, cmd, 'projection', `Projection ${N[pj].name}, writes ${ncols(pj)} columns`,
      `<polygon class="body" points="${P([[U.wg0,r.y],[U.wgN,r.y],[U.wg1,r.b0],[U.rail,r.b0],[U.rail,r.b1],[U.wg1,r.b1],[U.wgN,r.y+r.h],[U.wg0,r.y+r.h]])}" fill="var(--c-projection)"/>`
      + T(U.wg0 + 9, r.cy, N[pj].name, 'nm', 12.5, false, U.wgN - U.wg0 - 40) + T(U.wgN - 8, r.cy, pad2(ncols(pj)), 'nm', 12.5, true), [edge, bm]);
    SIG += `<path class="sig" data-c="${cmd}" d="M${ux(U.tr1)} ${r.cy}L${ux(U.wgN)} ${r.cy}L${ux(U.wg1)} ${bm}L${ux(U.rail)} ${bm}"/>`; });

  const tpath = (role, pts, e) => { SIG += `<path class="tp" data-role="${role}" data-c="${cmd}"${e ? ` data-e="${e}"` : ''} d="M${pts.map(([u, yy]) => ux(u) + ' ' + yy).join('L')}"/>`; };
  tpath('cmd', [[8, y0 + 14], [U.cmdW - 6, y0 + 14]]);
  if (rs.length) tpath('band', [[U.rail, y0 + 14], [U.tr0 + 11, y0 + 14], [U.tr0 + 11, y1 + 8]]);
  rows.forEach(r => { tpath('emit', [[U.tr0 + 11, y1 + 8], [U.tr0 + 11, r.cy], [U.ev0 + U.evW - 14, r.cy]], r.e);
    tpath('fold', [[U.ev0 + U.evW, r.cy], [U.wgN, r.cy], [U.wg1, (r.b0 + r.b1)/2], [U.rail, (r.b0 + r.b1)/2]], r.e); });
  SH += `<g class="deco" data-c="${cmd}">${deco}</g>${s}`;
  return y1 + H;
}
function brief(t, max){ let o = ''; for (const s of t.split(/(?<=\.)\s+/)){ if ((o + ' ' + s).length > max && o) break; o = (o + ' ' + s).trim(); } return o.length > max + 60 ? o.slice(0, max) + '…' : o; }

const stack = gaps => SIDES.map((cs, side) => { let y = yS; cs.forEach(c => { y = cluster(c, side, y) + gaps[side]; }); return y - gaps[side]; });
const dry = stack([26, 26]), tall = Math.max(...dry);            // measure, then spread each side to the full height
SH = ''; SIG = '';
const bottoms = stack(SIDES.map((cs, i) => 26 + (tall - dry[i]) / Math.max(1, cs.length - 1)));

/* the model: tables as packages, relations as thin traces, every column with a write pad and a read pad */
const TL = [['Generation','Domain','Reaction','DetachedSubscriber'], ['Command'], ['Attempt','Failure','Answered','StaleTerminal']];
const HD = 22, RH = 15, mPadT = 42;
const colH = c => c.reduce((s, t) => s + HD + RH*TB[t].rows.length, 0) + 18*(c.length - 1);
const yB = Math.max(...bottoms, yS + mPadT + Math.max(...TL.map(colH)) + 20);
const tTop = yS + mPadT + Math.max(0, (yB - yS - mPadT - Math.max(...TL.map(colH)) - 20) / 2);
const tcx = i => X.m + X.mPadL + i*(X.tW + X.tG);
TL.forEach((c, ci) => { let ty = tTop; c.forEach(t => { const h = HD + RH*TB[t].rows.length;
  G['table:'+t] = {x:tcx(ci), y:ty, w:X.tW, h, cy:ty + HD/2, ci};
  TB[t].rows.forEach((r, i) => { G['col:'+t+'.'+r[0]] = {x:tcx(ci), y:ty + HD + i*RH, w:X.tW, h:RH, cy:ty + HD + i*RH + RH/2}; });
  ty += h + 18; }); });
const H = yB + 16 + 30;

function cham(pts, d = 6){
  const o = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){
    const [ax,ay] = pts[i-1], [bx,by] = pts[i], [cx,cy] = pts[i+1];
    const l1 = Math.hypot(bx-ax, by-ay), l2 = Math.hypot(cx-bx, cy-by), k = Math.min(d, l1/2, l2/2);
    o.push([bx - (bx-ax)/l1*k, by - (by-ay)/l1*k], [bx + (cx-bx)/l2*k, by + (cy-by)/l2*k]);
  }
  o.push(pts[pts.length-1]);
  return 'M' + o.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
}
let REL = '', MOD = '';
const FKX = {Generation:[-10, 12, 19, tTop - 26], Domain:[-19, 24, 27, tTop - 17], Command:[0, 0, 10, 0]};
TABLES.forEach(t => t.rows.forEach(r => { if (!r[2].includes('FK') || !TB[r[1]]) return;
  const s = G['col:' + t.id + '.' + r[0]], sg = G['table:' + t.id], tg = G['table:' + r[1]], k = FKX[r[1]]; let pts;
  if (sg.ci === tg.ci) pts = [[s.x, s.cy], [s.x + k[0], s.cy], [s.x + k[0], tg.cy], [tg.x, tg.cy]];
  else if (sg.ci === tg.ci + 1){ const x = tg.x + tg.w + (tg.ci === 0 ? k[1] : k[2]); pts = [[s.x, s.cy], [x, s.cy], [x, tg.cy], [tg.x + tg.w, tg.cy]]; }
  else { const x2 = tcx(1) + X.tW + k[2], x1 = tcx(0) + X.tW + k[1]; pts = [[s.x, s.cy], [x2, s.cy], [x2, k[3]], [x1, k[3]], [x1, tg.cy], [tg.x + tg.w, tg.cy]]; }
  const d = cham(pts); REL += `<path class="halo" d="${d}" stroke-width="6"/><path class="fk" d="${d}"/>`; }));
TABLES.forEach(t => { const tg = G['table:' + t.id];

  cols.forEach(c => { const e = svg.querySelector(`.col[data-id="${c}"]`); e.classList.remove('tbad', 'tok'); e.classList.add(cls); (byT[c.slice(4).split('.')[0]] = byT[c.slice(4).split('.')[0]] || []).push(c); });

  emit: (c, e, text, bad) => () => { clock += .2; const d = packet(tp('emit', c, e), bad); later(() => { lit(inst(e, c), bad); log('event', N[e].name, text, bad ? 'bad' : ''); }, d); return d + 300; },

document.getElementById('clear').onclick = () => { stopTrace(); showTrace = false; setCond('green'); sel = null; hoverId = null; focus(null); };
document.getElementById('tag').textContent = 'Feat ' + pad2(D.nodes.length);
document.querySelectorAll('[data-kind]').forEach(b => { const on = v => () => { hoverKind = v; apply(); };
  b.addEventListener('pointerenter', on(b.dataset.kind)); b.addEventListener('pointerleave', on(null)); b.addEventListener('focus', on(b.dataset.kind)); b.addEventListener('blur', on(null)); });

let drag = null, moved = false;
wrap.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; drag = {x:e.clientX, y:e.clientY, l:wrap.scrollLeft, t:wrap.scrollTop}; moved = false; });
window.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 5){ moved = true; wrap.classList.add('drag'); }
  if (moved){ wrap.scrollLeft = drag.l - dx; wrap.scrollTop = drag.t - dy; } });
window.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('drag'); });
svg.addEventListener('click', e => { if (moved) return; const t = e.target.closest('[data-id]');
  if (!t){ sel = null; return focus(null); } focus(t.dataset.id, t); });
svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.id){ e.preventDefault(); focus(e.target.dataset.id, e.target); } });
svg.addEventListener('pointerover', e => { if (drag && moved) return; const t = e.target.closest('[data-id]'), id = t ? t.dataset.id : null;
  if (t !== hoverEl){ hoverId = id === M ? null : id; hoverEl = id === M ? null : t; apply(); } });
svg.addEventListener('pointerleave', () => { if (hoverId){ hoverId = null; hoverEl = null; apply(); } });
insp.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) return focus(g.dataset.go, null, true);
  const f = e.target.closest('[data-find]'); if (f) return focus(FINDINGS[+f.dataset.find][0], null, true);
  if (e.target.id === 't-boot') return runBoot(); if (e.target.id === 't-again') return runHappy();
  if (e.target.id === 'hide'){ insp.hidden = true; } });

renderInsp(); setZoom(Math.max(fitZ(), .6)); apply();
</script>
