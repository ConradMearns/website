<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea cliff generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EFE9DA; --ink:#1C2B30; --muted:#5A696A; --line:#D2C9B1;
  --sea:#1B6F70; --ochre:#8F5F12; --chip:#E3DBC6;
  --sky-top:#8FBBD1; --sky-bot:#E4ECE3;
  --hud:rgba(239,233,218,.82);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12262C; --ink:#E9E5D7; --muted:#9BAFAD; --line:#2B454B;
    --sea:#63BDB5; --ochre:#E0B35A; --chip:#1B343B;
    --sky-top:#15303D; --sky-bot:#587781;
    --hud:rgba(18,38,44,.78);
  }
}
:root[data-theme="dark"]{
  --paper:#12262C; --ink:#E9E5D7; --muted:#9BAFAD; --line:#2B454B;
  --sea:#63BDB5; --ochre:#E0B35A; --chip:#1B343B;
  --sky-top:#15303D; --sky-bot:#587781;
  --hud:rgba(18,38,44,.78);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  font-size:16px;line-height:1.35;overflow:hidden;
}
#app{display:flex;flex-direction:column;height:100%}
#stage{
  position:relative;flex:1 1 auto;min-height:0;
  background:linear-gradient(var(--sky-top),var(--sky-bot) 62%);
}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#hud{
  position:absolute;left:10px;top:10px;max-width:70%;
  background:var(--hud);padding:8px 12px;border-radius:3px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;
}
#hud h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
#stats{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
#actions{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
button{
  font:inherit;font-weight:500;color:var(--ink);background:var(--hud);
  border:1px solid var(--line);border-radius:3px;min-height:40px;padding:6px 12px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
button:focus-visible,input:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
#panel{
  flex:0 0 44%;min-height:0;display:flex;flex-direction:column;
  border-top:2px solid var(--ink);background:var(--paper);
}
#panel[hidden]{display:none}
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto}
#tabs button{
  flex:1 0 auto;background:none;border:0;border-radius:0;border-bottom:3px solid transparent;
  min-height:44px;padding:8px 14px;color:var(--muted);backdrop-filter:none;-webkit-backdrop-filter:none;
}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sea);font-weight:700}
#body{overflow-y:auto;padding:10px 14px 18px;flex:1 1 auto}
.group[hidden]{display:none}
.row{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:baseline;margin:10px 0 2px}
.row label{font-weight:500}
.row output{color:var(--ochre);font-weight:700;font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;margin:4px 0 0;accent-color:var(--sea);height:28px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;margin-top:6px;font-weight:700}
.check.stage{margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.check.stage:first-child{margin-top:0;padding-top:0;border-top:0}
.check input{width:20px;height:20px;accent-color:var(--sea);flex:0 0 auto}
.hint{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.notes p{margin:0 0 10px;max-width:62ch}
.notes b{color:var(--sea)}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
@media (min-width:820px){
  #app{flex-direction:row}
  #panel{flex:0 0 350px;border-top:0;border-left:2px solid var(--ink)}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="3D view of the generated coast. Drag to orbit, pinch or scroll to zoom."></canvas>
    <div id="hud"><h1>Sea cliff generator</h1><p id="stats">Generating</p></div>
    <div id="actions">
      <button id="reseed" type="button">New seed</button>
      <button id="togglePanel" type="button">Hide controls</button>
    </div>
    <div id="err">This view needs WebGL, which this browser did not provide.</div>
  </div>
  <section id="panel" aria-label="Generator controls">
    <div id="tabs" role="tablist"></div>
    <div id="body"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/*GEN-START*/
// =====================================================================
//  GENERATOR
//  Everything in this block is a pure function of (world x, y, z, seed,
//  params). No stage reads a neighbouring block, so chunks can be built
//  in any order -- the constraint a chunk-column worldgen pass has.
// =====================================================================
const CH = 32;      // chunk edge, blocks
const WH = 96;      // world height used by this demo
const SEA = 32;     // blocks with y < SEA are below still water
const ROCK = 1, SAND = 2, GRASS = 3, SOIL = 4, BOULDER = 5;

// ---- hashing and value noise ----------------------------------------
function hash2(ix, iz, seed) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iz | 0, 668265263) ^ Math.imul(seed | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hash1(i, seed) { return hash2(i, 7919, seed); }
function vnoise(x, z, seed) {                 // smooth, range -1..1
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed);
  const c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
function fbm(x, z, seed, oct) {
  let s = 0, a = 1, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, z * f, seed + i * 101); n += a; a *= 0.5; f *= 2; }
  return s / n;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function makeGenerator(P) {
  const seed = P.seed | 0;
  const th = P.swell * Math.PI / 180;
  const swx = Math.sin(th), swz = Math.cos(th);   // direction the swell travels (toward +z = toward land)

  // ---- STAGE 0: coast field ------------------------------------------
  // c(x,z) ~ blocks to the shoreline. Positive inland, negative at sea.
  // Here it is a formula (a straight coast bent by noise). In a real
  // world it would be derived from the ocean map as a blurred distance.
  let lastBig = 0;
  function coastMain(x, z) {
    const big = fbm(x / 85, z / 85, seed + 11, 3) * 1.8; // headlands (+) and bays (-)
    const small = fbm(x / 22, z / 22, seed + 23, 2);     // coves and points
    lastBig = big;
    return (z - P.coastZ) + big * P.coastWarp + small * P.coastWarp * 0.22;
  }

  // Sea stacks: remnants left offshore when the cliff retreated. One
  // candidate per 26-block cell, kept only if it sits just off the coast.
  const SC = 26;
  const stackOut = { v: -1e9, r: 0, top: 1 };
  function stackField(x, z) {
    stackOut.v = -1e9;
    if (P.stacks <= 0) return stackOut;
    const cx = Math.floor(x / SC), cz = Math.floor(z / SC);
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      const ix = cx + dx, iz = cz + dz;
      if (hash2(ix, iz, seed + 900) > P.stacks) continue;
      const px = (ix + 0.2 + 0.6 * hash2(ix, iz, seed + 901)) * SC;
      const pz = (iz + 0.2 + 0.6 * hash2(ix, iz, seed + 902)) * SC;
      const cm = coastMain(px, pz);
      if (cm > -5 || cm < -32) continue;
      const r = 2.6 + 4.2 * hash2(ix, iz, seed + 903);
      const d = Math.hypot(x - px, z - pz) + vnoise(x / 4, z / 4, seed + 905) * 0.9;
      const v = r - d;
      if (v > stackOut.v) { stackOut.v = v; stackOut.r = r; stackOut.top = 0.4 + 0.5 * hash2(ix, iz, seed + 904); }
    }
    return stackOut;
  }

  // ---- per-column inputs ---------------------------------------------
  function column(x, z) {
    const cM = coastMain(x, z);
    const headland = clamp(lastBig * 1.4, -1, 1);

    // STAGE 1: exposure. How squarely this shore faces the swell,
    // boosted on headlands (refraction focuses energy there) and cut in
    // bays. This single number drives every erosion stage below.
    const g = 3;
    const gx = coastMain(x + g, z) - coastMain(x - g, z);
    const gz = coastMain(x, z + g) - coastMain(x, z - g);
    const facing = Math.max(0, (gx * swx + gz * swz) / (Math.hypot(gx, gz) || 1));
    let e = clamp((0.15 + 0.85 * facing) * (0.78 + 0.3 * headland), 0, 1);

    let c = cM, isStack = false, stackR = 0, topFrac = 1;
    if (cM < 8 && cM > -45) {
      const s = stackField(x, z);
      if (s.v > c) { c = s.v; isStack = true; stackR = s.r; topFrac = s.top; e = 0.85; }
    }

    // plateau height behind the cliff
    const top = SEA + P.cliffH * topFrac * (0.86 + 0.14 * fbm(x / 48, z / 48, seed + 31, 2))
              + vnoise(x / 13, z / 13, seed + 37) * 1.5;

    // STAGE 3b: wave-cut platform. The notch eats the cliff foot, the
    // cliff above falls, and what is left is a bench just under the
    // waterline whose width scales with exposure.
    const s = -c;
    let bed;
    if (P.sNotch) {
      const platW = 1.5 + P.notch * e * 1.4;
      if (s <= platW) {
        bed = SEA - 2;
        if (vnoise(x / 3.1, z / 3.1, seed + 43) > 0.55) bed -= 1;        // rock pools
      } else {
        bed = SEA - 2 - smooth(0, 3, s - platW) * 2.5 - (s - platW) * 0.4
            + vnoise(x / 6, z / 6, seed + 41) * 0.9;
      }
    } else {
      bed = s <= 0 ? SEA - 2 : SEA - 1.5 - s * 0.5 + vnoise(x / 6, z / 6, seed + 41) * 0.9;
    }
    const bedTop = Math.max(3, Math.floor(bed));

    // STAGE 5: deposition. Sand settles where exposure is low; fallen
    // blocks pile at the cliff foot where it is high.
    let sandTop = -1, boulder = 0;
    if (P.sBeach) {
      const amt = P.beach * smooth(0.42, 0.75, 1 - e);
      if (amt > 0.12 && c > -12 && c < 12) sandTop = Math.floor(SEA - 3 + (c + 12) * 0.4 * (0.4 + 0.6 * amt));
      if (e > 0.35 && c > -7 && c < 1.5) {
        boulder = Math.max(0, Math.floor((vnoise(x / 2.2, z / 2.2, seed + 700) - 0.3) * 4.5 * (1 - Math.abs(c + 2.5) / 5)));
      }
    }

    // STAGE 4 inputs: joints. Limestone breaks along near-vertical
    // fracture planes. Two sets; each plane gets a random strength.
    const J = [];
    if (P.sJoints && P.cave > 0) {
      for (let k = 0; k < 2; k++) {
        const a = (k === 0 ? 0.18 : -0.6) + (hash1(k, seed + 399) - 0.5) * 0.3;
        const u = x * Math.cos(a) + z * Math.sin(a) + vnoise(x / 28, z / 28, seed + 420 + k) * 2.5;
        const sp = P.jspace * (k === 0 ? 1 : 1.6);
        const ci = Math.floor(u / sp);
        const pos = (ci + 0.25 + 0.5 * hash1(ci, seed + 400 + k)) * sp;
        const major = hash1(ci, seed + 410 + k);
        J.push({ dist: Math.abs(u - pos), major, len: P.cave * (0.35 + 0.9 * major) * (0.35 + 0.65 * e) });
      }
    }

    const dipOff = x * P.dip + z * P.dip * 0.4 + vnoise(x / 40, z / 40, seed + 301) * 1.5;
    return { c, e, top, bedTop, sandTop, boulder, J, isStack, stackR, dipOff };
  }

  // ---- STAGES 2 + 3a: how far the rock face is pushed inland at height y
  function recession(col, y) {
    let R = 0, hard = 1;
    if (P.sStrata) {
      // STAGE 2: bedding. Tilted layers of random hardness; soft beds
      // weather back, hard beds stand proud as ledges.
      const layer = Math.floor((y + col.dipOff) / P.thick);
      hard = hash1(layer, seed + 300);
      if (y >= SEA - 2) R += P.ledge * Math.pow(1 - hard, 1.5);
    }
    if (P.sNotch) {
      // STAGE 3a: wave notch. Energy is concentrated in a band around
      // the waterline. Everything above retreats by a fraction of the
      // notch depth (the overhang collapsing).
      const d = (y - (SEA + 1)) / 2.6;
      const band = Math.exp(-d * d);
      R += P.notch * col.e * (band * (0.55 + 0.45 * (1 - hard)) + (y >= SEA - 1 ? 0.4 : 0));
    }
    if (col.isStack) R = Math.min(R, col.stackR * 0.5);   // never sever a stack
    return R;
  }

  // cliff profile: land surface height for a column c' blocks inland
  function landTop(col, cp) {
    if (cp <= 0) return -1;
    const t = Math.min(1, cp / P.slopeW), r = 1 - (1 - t) * (1 - t);
    return SEA - 1 + (col.top - (SEA - 1)) * r;
  }

  // ---- STAGE 4: the sea widens joints into caves, and the strongest
  // into open clefts. A cave longer than a headland is wide becomes an arch.
  function jointCarves(col, y) {
    for (let k = 0; k < col.J.length; k++) {
      const j = col.J[k];
      if (col.c >= j.len) continue;
      const t = col.c <= 0 ? 1 : 1 - col.c / j.len, st = Math.sqrt(t);
      let hw = (1.1 + 2.4 * j.major) * st, hc = (3 + 9 * j.major) * st;
      if (col.isStack) { if (col.stackR < 4.6) continue; hw *= 0.5; hc *= 0.6; }
      const yy = (y - (SEA - 2)) / hc;
      if (yy >= 0 && yy < 1 && j.dist < Math.max(0.75, hw) * Math.sqrt(1 - yy * yy)) return true;
      if (j.major > 0.7 && !col.isStack && col.c < j.len * 0.55 && y >= SEA - 2 && j.dist < 0.75 + 0.9 * t) return true;
    }
    return false;
  }

  // ---- fill one chunk --------------------------------------------------
  function genChunk(cx, cz, world) {
    const { blocks, expo, dip, W, D } = world;
    for (let lz = 0; lz < CH; lz++) for (let lx = 0; lx < CH; lx++) {
      const wx = cx * CH + lx, wz = cz * CH + lz;
      const col = column(wx + 0.5, wz + 0.5);
      expo[wz * W + wx] = col.e; dip[wz * W + wx] = col.dipOff;
      const ground = Math.max(col.bedTop, col.sandTop);
      const yMax = Math.min(WH - 1, Math.ceil(col.top) + 2);
      let topY = -1;
      for (let y = 0; y <= yMax; y++) {
        let t = 0;
        if (y <= col.bedTop) t = ROCK;
        else { const cp = col.c - recession(col, y); if (cp > 0 && y <= landTop(col, cp)) t = ROCK; }
        if (t && y >= SEA - 2 && jointCarves(col, y)) t = 0;
        if (!t && y <= col.sandTop) t = SAND;
        if (!t && col.boulder && y <= ground + col.boulder) t = BOULDER;
        if (t) { blocks[(y * D + wz) * W + wx] = t; topY = y; }
      }
      // soil and scrub on the plateau
      if (topY >= SEA + 6 && blocks[(topY * D + wz) * W + wx] === ROCK) {
        const cp = col.c - recession(col, topY);
        if (cp / P.slopeW >= 0.8 || (col.isStack && cp > 2.2)) {
          blocks[(topY * D + wz) * W + wx] = GRASS;
          if (blocks[((topY - 1) * D + wz) * W + wx] === ROCK) blocks[((topY - 1) * D + wz) * W + wx] = SOIL;
        }
      }
    }
  }
  return { genChunk, hardness: (y, dipOff) => P.sStrata ? hash1(Math.floor((y + dipOff) / P.thick), seed + 300) : 0.8 };
}

function generateWorld(P) {
  const W = P.chunks * CH, D = P.chunks * CH;
  P.coastZ = D * 0.4;
  const world = { W, D, blocks: new Uint8Array(W * D * WH), expo: new Float32Array(W * D), dip: new Float32Array(W * D) };
  const gen = makeGenerator(P);
  for (let cz = 0; cz < P.chunks; cz++) for (let cx = 0; cx < P.chunks; cx++) gen.genChunk(cx, cz, world);
  world.hardness = gen.hardness;
  return world;
}

// =====================================================================
//  MESHING (plain face culling, baked light and ambient occlusion)
// =====================================================================
const FACES = [
  { n: [1, 0, 0], u: [0, 1, 0], v: [0, 0, 1], sh: 0.80 },
  { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0], sh: 0.70 },
  { n: [0, 1, 0], u: [0, 0, 1], v: [1, 0, 0], sh: 1.00 },
  { n: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1], sh: 0.45 },
  { n: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0], sh: 0.60 },
  { n: [0, 0, -1], u: [0, 1, 0], v: [1, 0, 0], sh: 0.93 },
];
const CORN = [[-1, -1], [1, -1], [1, 1], [-1, 1]];

function buildMesh(world, view) {
  const { blocks, W, D, expo, dip } = world;
  const pos = [], col = [], idx = [];
  const solid = (x, y, z) => y < 0 ? 1 : (x < 0 || z < 0 || x >= W || z >= D || y >= WH) ? 0 : (blocks[(y * D + z) * W + x] ? 1 : 0);
  const rgb = [0, 0, 0];
  function blockColor(t, x, y, z) {
    const j = (hash2(x * 31 + y, z * 17 - y, 5) - 0.5) * 0.06;
    let r, g, b;
    if (t === ROCK || t === BOULDER) {
      if (view.exposure && y >= SEA - 1) {
        const e = expo[z * W + x];                         // sheltered blue -> exposed red
        r = 0.2 + 0.75 * smooth(0.3, 0.8, e); g = 0.35 + 0.5 * (1 - Math.abs(e - 0.5) * 2); b = 0.85 - 0.75 * smooth(0.2, 0.7, e);
      } else {
        const h = world.hardness(y, dip[z * W + x]);
        r = 0.74 + 0.14 * h; g = 0.62 + 0.22 * h; b = 0.43 + 0.33 * h;   // ochre soft beds, pale hard beds
        if (t === BOULDER) { r *= 0.86; g *= 0.86; b *= 0.86; }
      }
      if (y >= SEA - 1 && y <= SEA + 1) { r *= 0.60; g *= 0.65; b *= 0.58; }   // wet band
    } else if (t === SAND) { r = 0.90; g = 0.82; b = 0.62; }
    else if (t === GRASS) { r = 0.44; g = 0.52; b = 0.27; }
    else { r = 0.47; g = 0.37; b = 0.26; }
    r += j; g += j; b += j;
    if (y < SEA - 1) {                                           // water tints what lies under it
      const f = Math.min(1, (SEA - 1 - y) / 12) * 0.8;
      r = r * 0.85 * (1 - f) + 0.06 * f; g = g * 0.9 * (1 - f) + 0.27 * f; b = b * 0.9 * (1 - f) + 0.31 * f;
    }
    if (view.borders && (x % CH === 0 || z % CH === 0)) { r *= 0.6; g *= 0.6; b *= 0.75; }
    rgb[0] = r; rgb[1] = g; rgb[2] = b;
  }
  let nv = 0;
  const lt = [0, 0, 0, 0];
  for (let y = 0; y < WH; y++) for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const t = blocks[(y * D + z) * W + x];
    if (!t) continue;
    let colored = false;
    for (let f = 0; f < 6; f++) {
      const F = FACES[f], n = F.n, u = F.u, v = F.v;
      const ax = x + n[0], ay = y + n[1], az = z + n[2];
      if (solid(ax, ay, az)) continue;
      if (!colored) { blockColor(t, x, y, z); colored = true; }
      for (let k = 0; k < 4; k++) {
        const su = CORN[k][0], sv = CORN[k][1];
        const s1 = solid(ax + su * u[0], ay + su * u[1], az + su * u[2]);
        const s2 = solid(ax + sv * v[0], ay + sv * v[1], az + sv * v[2]);
        const cc = solid(ax + su * u[0] + sv * v[0], ay + su * u[1] + sv * v[1], az + su * u[2] + sv * v[2]);
        const ao = (s1 && s2) ? 0 : 3 - (s1 + s2 + cc);
        lt[k] = ao;
        const l = F.sh * (0.5 + ao * 0.1667);
        pos.push(x + 0.5 + 0.5 * (n[0] + su * u[0] + sv * v[0]),
                 y + 0.5 + 0.5 * (n[1] + su * u[1] + sv * v[1]),
                 z + 0.5 + 0.5 * (n[2] + su * u[2] + sv * v[2]));
        col.push(rgb[0] * l, rgb[1] * l, rgb[2] * l);
      }
      if (lt[0] + lt[2] >= lt[1] + lt[3]) idx.push(nv, nv + 1, nv + 2, nv, nv + 2, nv + 3);
      else idx.push(nv + 1, nv + 2, nv + 3, nv + 1, nv + 3, nv);
      nv += 4;
    }
  }

    const wm = buildWaterMap(world);

      sp.vel[j * 3] = nx * (0.3 + 1.6 * Math.random()) + (Math.random() - 0.5) * 1.6;
      sp.vel[j * 3 + 1] = up;
      sp.vel[j * 3 + 2] = nz * (0.3 + 1.6 * Math.random()) + (Math.random() - 0.5) * 1.6;
      sp.max[j] = sp.life[j] = 0.7 + Math.random() * 0.9; sp.size[j] = 0.35 + Math.random() * 0.45;
    }
  }
}
function stepSpray(dt) {
  for (let j = 0; j < NP; j++) {
    if (sp.life[j] <= 0) { sp.alpha[j] = 0; continue; }
    sp.life[j] -= dt; sp.vel[j * 3 + 1] -= 11 * dt;
    sp.pos[j * 3] += sp.vel[j * 3] * dt; sp.pos[j * 3 + 1] += sp.vel[j * 3 + 1] * dt; sp.pos[j * 3 + 2] += sp.vel[j * 3 + 2] * dt;
    sp.alpha[j] = sp.pos[j * 3 + 1] < SEA - 0.6 ? 0 : Math.max(0, sp.life[j] / sp.max[j]) * 0.9;
  }
  const a = spray.geometry.attributes; a.position.needsUpdate = true; a.aAlpha.needsUpdate = true; a.aSize.needsUpdate = true;
}

let simT = 0, lastFrame = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0); lastFrame = now;
  if (!V.paused && world) {
    simT += dt;
    water.material.uniforms.uTime.value = simT;
    if (V.water) { emitSpray(dt, simT); stepSpray(dt); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---- boot --------------------------------------------------------------
(function boot() {
  buildUI();
  const panel = document.getElementById('panel'), tog = document.getElementById('togglePanel');
  tog.addEventListener('click', () => { panel.hidden = !panel.hidden; tog.textContent = panel.hidden ? 'Show controls' : 'Hide controls'; });
  document.getElementById('reseed').addEventListener('click', () => { P.seed = (Math.random() * 9000 | 0) + 1000; regenerate(); });
  try {
    if (!window.THREE) throw new Error('three.js did not load');
    initScene();
  } catch (err) {
    document.getElementById('err').style.display = 'flex'; statsEl.textContent = 'Unavailable'; return;
  }
  placeCamera();
  regenerate();
  requestAnimationFrame(frame);
})();
</script>
