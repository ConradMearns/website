<style>
/* Layout: a drafting table. The model sits on the sheet (left); the sheet notes and controls sit in the margin (right). Sheet numbers A-01..A-10 are the real build order. */
:root{
  --paper:#ECEEE7; --sheet:#E2E6DD; --ink:#1C2320; --ink-2:#56615A; --rule:#C4CBC0; --chip:#DCE1D5;
  --accent:#A3660E; --accent-ink:#FFFFFF; --blue:#2D5C8A; --ground:#D3DACC; --grid:#BAC3B3;
  --pass:#2E7547; --warn:#A3660E; --fail:#AE382C;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141816; --sheet:#1A1F1C; --ink:#E2E6DC; --ink-2:#98A39B; --rule:#2D3530; --chip:#232A25;
  --accent:#E0A446; --accent-ink:#1B1406; --blue:#80AAD6; --ground:#232A25; --grid:#323D35;
  --pass:#6CBF89; --warn:#E0A446; --fail:#E57A6D; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#141816; --sheet:#1A1F1C; --ink:#E2E6DC; --ink-2:#98A39B; --rule:#2D3530; --chip:#232A25;
  --accent:#E0A446; --accent-ink:#1B1406; --blue:#80AAD6; --ground:#232A25; --grid:#323D35;
  --pass:#6CBF89; --warn:#E0A446; --fail:#E57A6D; color-scheme:dark }

html,body{height:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--paper)}
.brand{flex:none}
.brand .mark{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.03em;text-transform:uppercase;line-height:.95;display:block}
.brand .sub{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.sheets{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.sheets a{flex:none;display:flex;flex-direction:column;padding:5px 10px 6px;border-radius:3px;text-decoration:none;color:var(--ink-2);border:1px solid transparent}
.sheets a:hover{color:var(--ink);background:var(--chip)}
.sheets .no{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;line-height:1.2}
.sheets .nm{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.sheets a[aria-current="step"]{color:var(--ink);border-color:var(--ink);background:var(--sheet)}
.sheets a.done .no{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:transparent;border-radius:3px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.playing{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
.view{position:relative;min-width:0;min-height:0;background:var(--sheet);overflow:hidden}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.titleblock{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:12px;display:grid;grid-template-columns:auto auto;border:1.5px solid var(--ink);background:var(--paper);font-family:var(--f-mono);font-size:11px;line-height:1.25;pointer-events:none;max-width:calc(100% - 24px)}
.titleblock > div{padding:5px 8px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.titleblock > div:nth-child(2n){border-right:0}
.titleblock > div:nth-last-child(-n+2){border-bottom:0}
.titleblock .k{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.titleblock .big{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;line-height:1}
.hint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--ink-2);pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}

.panel{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper)}
.panel-body{flex:1;overflow:auto;padding-block:20px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-height:0}
.panel-nav{display:flex;gap:8px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--rule);background:var(--paper)}
.panel-nav .btn{flex:1}

.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
p{margin:0;max-width:65ch}
.lede{color:var(--ink-2)}
.algo{border-left:2px solid var(--accent);padding-left:12px;font-size:14px}
.algo b{font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}

.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets span{font-size:13px;color:var(--ink-2);margin-right:2px}
.chipbtn{border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chipbtn:hover{border-color:var(--ink)}

.rooms{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.room-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.tog{display:flex;align-items:center;gap:9px;cursor:pointer;min-width:0}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog .sw{flex:none;width:16px;height:16px;border-radius:3px;border:1.5px solid var(--ink-2);background:transparent;position:relative}
.tog input:checked + .sw{background:var(--c);border-color:var(--c)}
.tog input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.tog .nm{font-weight:600}
.tog .sub{display:block;font-size:12px;color:var(--ink-2);font-weight:400;line-height:1.2}
.room-row.off .seg,.room-row.off .count{opacity:.35;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--ink-2);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 9px;font-family:var(--f-mono);font-size:12px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;min-width:66px;justify-content:flex-end}
.count button{width:22px;height:22px;border:1px solid var(--ink-2);background:transparent;border-radius:3px;cursor:pointer;line-height:1;padding:0}
.fields{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.field select,.field input{background:var(--paper);border:1px solid var(--ink-2);border-radius:3px;padding:6px 8px;font-family:var(--f-body);font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.field input{width:84px}
.field .row{display:flex;gap:6px}
.brief{margin:0;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;font-size:16px;line-height:1.45}
.brief::before{content:"The brief";display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:500;padding:4px 6px;border-bottom:1px solid var(--ink)}
td{padding:6px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip);border:1px solid var(--rule);white-space:nowrap}
.tag.door{border-color:var(--blue);color:var(--blue);background:transparent}
.tag.avoid{border-color:var(--fail);color:var(--fail);background:transparent}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.stat{background:var(--paper);padding:8px 10px}
.stat .k{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.spark{width:100%;height:auto;display:block}
.edges{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.edges li{display:flex;gap:8px;align-items:baseline}
.edges .k{flex:none;width:62px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.edges .k.door{color:var(--blue)} .edges .k.avoid{color:var(--fail)} .edges .k.entry{color:var(--ink-2)} .edges .k.routed{color:var(--warn)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.checks li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:2px 0;border-radius:3px;border:1px solid;align-self:start;margin-top:2px}
.pill.pass{color:var(--pass);border-color:var(--pass)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.fail{color:var(--fail);border-color:var(--fail);background:color-mix(in srgb,var(--fail) 10%,transparent)}
.checks .nm{font-weight:600}
.checks .d{font-size:13px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.houses{display:flex;flex-direction:column;gap:6px;font-size:14px}
.houses div{padding:6px 0;border-bottom:1px solid var(--rule)}
.houses b{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-right:6px;font-weight:500}
a.inline{color:var(--accent)}

.count:empty{display:none}
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(220px,40%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--rule)}
  .top{flex-wrap:wrap;gap:6px 10px;padding-block:8px 6px}
  .brand{flex:1;min-width:0}
  .brand .mark{font-size:22px}
  .brand .sub{display:none}
  #playAll{padding:5px 10px;font-size:13px}
  .sheets{order:3;flex-basis:100%;margin-inline:-4px;scroll-snap-type:x proximity;scrollbar-width:none}
  .sheets::-webkit-scrollbar{display:none}
  .sheets a{padding:4px 8px 5px;scroll-snap-align:start}
  .sheets .nm{font-size:14px}
  .titleblock{right:calc(8px + env(safe-area-inset-right,0px));bottom:8px;font-size:10px}
  .titleblock .big{font-size:17px}
  .titleblock > div:nth-child(n+3){display:none}
  .titleblock > div:nth-child(-n+2){border-bottom:0}
  .hint{display:none}
  .panel-body{padding-block:16px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
  .panel-nav{padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:6px}
  .panel-nav .btn{padding:9px 8px}
  h1{font-size:27px}
  .lede,.algo{font-size:14px}
  .stats{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .stat .v{font-size:20px}
  .room-row{gap:8px}
  .tog .sub{font-size:11.5px}
  .seg button{padding:4px 8px}
  .count{min-width:0}
  td,th{padding:5px 4px}
  table{font-size:13px}
  .field input{width:72px}
}
@media (max-width:350px){
  .seg button{padding:4px 6px}
  .tog .sub{display:none}
  .brand .mark{font-size:20px}
}
@media (pointer:coarse){
  .seg button,.count button,.chipbtn{min-height:32px}
  .count button{width:30px;height:30px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>

</div>

/* ---------- 6–8. Voxels: walls; roof, loft and dormers; details ---------- */

/* ---------- 9. Verify: rebuild the house graph from voxels alone ---------- */

  // 5 sealed: flood outside air in 3D; no room cell may be reached

  const nx=X1-X0+1, ny=Y1+1, nz=Z1-Z0+1; const vis=new Uint8Array(nx*ny*nz);

    const lk=cellars.filter(r=>winBy[r.id]||rebuilt.some(d=>(rr(d.a)===r.id&&d.b==='out')||(rr(d.b)===r.id&&d.a==='out')));

    const bad=[];

        const v=g(x,1,z); if(!v||(v.m!=='hearth'&&v.m!=='forge')) continue;

  }

  return {regions,rebuilt,checks,dist,maxd,regMaps,levels,statusOfRegion,areaRows,ladderEdge};
}

function buildHouse(req,townKey,seed,opt){
  opt=opt||{};
  const st=TOWNS[townKey];
  const rng=mulberry32((seed*7919+hashStr(townKey))>>>0);
  const rooms=makeProgram(req);
  const H={req:clone(req),townKey,st,seed,rooms};
  H.graphEdges=makeGraph(rooms);
  H.roomAt=(x,z,f)=>{f=f||0;for(const r of rooms){if(r.floor!==f)continue;const R=H.rects[r.id];if(R&&x>R.x0&&x<R.x1&&z>R.z0&&z<R.z1)return r;}return null;};
  makeMassing(H,rng);
  solveLayout(H,rng,opt);
  placeDoors(H);
  H.flood=planFlood(H);
  buildVoxels(H);
  H.check=verify(H);
  const g=mulberry32(seed+11);
  H.graphInit=rooms.map(()=>[(g()-0.5)*12,(g()-0.5)*12]);
  return H;
}

  check(H){

function getTown(){
  const key=S.town+':'+S.seed+':'+JSON.stringify(S.req);
  if(S.townCache&&S.townCache.key===key) return S.townCache;
  const rng=mulberry32((hashStr(S.town)^(S.seed*2654435761))>>>0);
  const houses=[S.H]; const pk=Object.keys(PRESETS);
  for(let i=0;i<6;i++){
    const req=Object.assign(clone(PRESETS[pk[Math.floor(rng()*pk.length)]].req),{shape:i%3===0?2:1,loft:S.req.loft});
    for(const k of ORDER){ if(k==='hall') continue; if(rng()<0.25) req[k].on=req[k].on?0:1; if(rng()<0.45) req[k].q=clamp(req[k].q+(rng()<0.5?-1:1),0,2); }
    req.sleep.n=1+Math.floor(rng()*3);
    houses.push(buildHouse(req,S.town,1+Math.floor(rng()*9999),{restarts:2,iters:2500}));
  }
  const o=TOWNS[S.town].overhang, gap=3;
  const back=houses.filter((_,i)=>i%2===0), front=houses.filter((_,i)=>i%2===1);
  const rowLen=row=>row.reduce((s,h)=>s+h.BW+1+2*o,0)+gap*(row.length-1);
  const L=Math.max(rowLen(back),rowLen(front));
  const placeRow=(row,flip)=>{let x=-rowLen(row)/2; row.forEach(h=>{const w=h.BW+1+2*o; h._px=Math.round(x+w/2); h._flip=flip; h._pz=flip?Math.ceil(h.BD/2)+3+o:-(Math.ceil(h.BD/2)+3+o); x+=w+gap;});};
  placeRow(back,false); placeRow(front,true);
  const depth=2*(Math.max(...houses.map(h=>h.BD))+4+o);
  S.townCache={key,houses,length:L,depth};
  return S.townCache;
}

function needTags(r){return Object.keys(r.needs).map(k=>`<span class="tag">${NEED_TEXT[k]}</span>`).join('');}
function briefSentence(req){
  const st=TOWNS[S.town]; const parts=[];
  for(const k of ['hall','kitchen','smithy','workshop']) if(req[k].on) parts.push(`a ${QW[req[k].q]} ${CATALOG[k].label.toLowerCase()}`);
  if(req.sleep.on) parts.push(`${req.sleep.n} ${QW[req.sleep.q]} sleeping room${req.sleep.n>1?'s':''}${req.loft&&st.loft?' up in the roof':''}`);
  const store=[]; if(req.cellar.on) store.push('food'); if(req.tools.on) store.push('tools'); if(req.bulk.on) store.push('bulk goods');
  if(store.length) parts.push(`storage for ${joinAnd(store)}`);
  const form=['kept to one tight block','free to grow a wing or two','free to sprawl'][req.shape];
  return `I need ${joinAnd(parts)}, ${form}, in the ${st.name} style.`;
}
function sparkSvg(H,hist,key,label){
  const w=300,h=64,pad=6; const cs=hist.map(x=>x.c); const mx=Math.max(...cs), mn=Math.min(...cs);
  const sx=i=>pad+(w-2*pad)*i/(hist.length-1); const sy=c=>pad+(h-2*pad-12)*(1-(Math.sqrt(c)-Math.sqrt(mn))/Math.max(0.001,Math.sqrt(mx)-Math.sqrt(mn)));
  H._spark=H._spark||{}; H._spark[key]={x:sx,y:sy};
  const d=hist.map((x,i)=>`${i?'L':'M'}${sx(i).toFixed(1)},${sy(x.c).toFixed(1)}`).join('');
  const area=d+`L${sx(hist.length-1)},${h-12}L${sx(0)},${h-12}Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} cost falling over ${hist[hist.length-1].i} iterations">
    <line x1="${pad}" x2="${w-pad}" y1="${h-12}" y2="${h-12}" stroke="var(--rule)"/>
    <path d="${area}" fill="var(--accent)" opacity="0.12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    <circle id="spark-${key}" cx="${sx(0)}" cy="${sy(hist[0].c)}" r="3.5" fill="var(--accent)"/>
    <text x="${pad}" y="${h-1}" font-size="10" font-family="var(--f-mono)" fill="var(--ink-2)">${label}</text>
    <text x="${w-pad}" y="${h-1}" text-anchor="end" font-size="10" font-family="var(--f-mono)" fill="var(--ink-2)">${hist[hist.length-1].i.toLocaleString()} iterations · best ${hist[hist.length-1].c.toFixed(1)}</text>
  </svg>`;
}

      <div class="stats">
        <div class="stat"><span class="k">Shape</span><span class="v" style="font-size:18px">${H.shapeName.split(' · ')[0]}</span></div>
        <div class="stat"><span class="k">Footprint</span><span class="v">${H.BW+1}×${H.BD+1}</span></div>
        <div class="stat"><span class="k">Storeys</span><span class="v">${H.loft?'1½':'1'}</span></div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Volume</th><th>Rooms</th><th>Roof</th></tr></thead><tbody>
      ${H.wings.map(w=>`<tr><td><span class="dot" style="background:${ZONE_COLOR[w.zone]}"></span>${ZONE_TEXT[w.zone]}${w.kind==='leanto'?'<div class="small muted">lean-to, walls '+w.h+' high</div>':''}</td><td>${w.rooms.filter(r=>r.floor===0).map(r=>r.name).join(', ')}</td><td class="small">${roofText(w)}</td></tr>`).join('')}
      ${H.loft?`<tr><td><span class="dot" style="background:var(--accent)"></span>Loft<div class="small muted">floor at ${hM+1}, headroom 2</div></td><td>${up.map(r=>r.name).join(', ')}, landing</td><td class="small">inside the main roof</td></tr>`:''}
      </tbody></table></div>
      ${H.massNotes.length?`<p class="small"><b>Notes.</b> ${H.massNotes.join(' ')}</p>`:''}
      <p class="small muted">Change Massing on the brief to compare a tight block with a sprawling one.</p>`;
  },
  plan(H){
    const p=H.parts; const unmet=[];
    for(const e of H.edges){ if(e.kind==='ladder') continue; const A=H.rooms[e.a],B=H.rooms[e.b]; if(A.floor!==B.floor) continue; const s=shared(H.rects[e.a],H.rects[e.b]); if(e.kind==='door'&&!s) unmet.push(`${A.name} and ${B.name} do not share a wall`); if(e.kind==='avoid'&&s) unmet.push(`${A.name} and ${B.name} share a wall`);}
    for(const r of H.rooms){ if(r.floor!==0) continue; const e=extRuns(H.rects[r.id],H.fp); if(r.needs.light&&e.total<1) unmet.push(`${r.name} has no outside wall for windows`); if(r.needs.entry&&e.front<1) unmet.push(`${r.name} is not on the front`);}
    return `<p class="eyebrow">Sheet A-05 · Plan</p>
      <h1>Cut each volume into rooms</h1>
      <p class="lede">Every volume from the massing sheet gets its own slicing tree: each branch cuts its rectangle in two, across or along, in proportion to the area of the rooms beneath it. All the trees are scored together, so a door across a wing joint counts like any other.${H.loftHist?' The loft is solved second, inside the band of the roof with standing headroom, with an extra cost for keeping the landing above the hall so the ladder can reach it.':''}</p>
      <p class="algo"><b>Simulated annealing over slicing trees.</b> Each step mutates one tree (swap two rooms, flip a cut, nudge a cut by a block, move a room) and keeps the change if the cost drops. Early on it also accepts some worse layouts to climb out of dead ends. ${H.restartCosts.length} runs; the best is replayed.</p>
      <div class="stats">
        <div class="stat"><span class="k">Floor</span><span class="v" id="livePhase">Ground</span></div>
        <div class="stat"><span class="k">Iteration</span><span class="v mono" id="liveIter">0</span></div>
        <div class="stat"><span class="k">Cost</span><span class="v mono" id="liveCost">${H.hist[0].c.toFixed(1)}</span></div>
      </div>
      ${sparkSvg(H,H.hist,'g','Ground floor')}
      ${H.loftHist?sparkSvg(H,H.loftHist,'l','Loft'):''}
      <div class="tbl-wrap"><table><thead><tr><th>Ground-floor cost term</th><th class="num">Score</th></tr></thead><tbody>
        <tr><td>Area off target</td><td class="num">${p.area.toFixed(1)}</td></tr>
        <tr><td>Rooms too thin or stretched</td><td class="num">${p.shape.toFixed(1)}</td></tr>
        <tr><td>Planned doors without a shared wall</td><td class="num">${p.door.toFixed(1)}</td></tr>
        <tr><td>Kept-apart rooms touching</td><td class="num">${p.avoid.toFixed(1)}</td></tr>
        <tr><td>Missing outside walls</td><td class="num">${p.ext.toFixed(1)}</td></tr>
        ${H.loftParts?`<tr><td>Loft: landing not over the hall</td><td class="num">${H.loftParts.ladder.toFixed(1)}</td></tr><tr><td>Loft: rooms with no way to get light</td><td class="num">${H.loftParts.light.toFixed(1)}</td></tr>`:''}
      </tbody></table></div>
      ${unmet.length?`<p class="small"><b>Compromises.</b> ${unmet.join('; ')}. The next sheet routes around these.</p>`:'<p class="small muted">Every adjacency and exposure rule is met.</p>'}`;
  },
  circulation(H){
    const name=id=>id===-1?'outside':H.rooms[id].name;
    const kind={front:'Front',exterior:'Outside',planned:'Door',routed:'Routed'};
    return `<p class="eyebrow">Sheet A-06 · Circulation</p>
      <h1>Doors, a ladder, then a walk</h1>
      <p class="lede">Doors go in the middle of each shared wall the graph asks for.${H.ladder?' The ladder goes where the landing overlaps the hall, against a wall and away from doors.':''} Then a flood fill starts at the outside doors and spreads room by room${H.ladder?', up the ladder and through the loft':''}. Any room it misses gets a door to a reachable neighbour.</p>
      <p class="algo"><b>Greedy placement plus breadth-first search.</b> The flood is the cheap version of the final check: if a cell never lights up, nobody could ever stand there.</p>
      <ul class="edges">${H.doors.map(d=>`<li><span class="k ${d.kind==='routed'?'routed':d.b===-1?'entry':'door'}">${kind[d.kind]}</span><span>${name(d.a)} ↔ ${name(d.b)}${d.f?' <span class="muted small">loft</span>':''}</span></li>`).join('')}
      ${H.ladder?`<li><span class="k door">Ladder</span><span>${H.rooms[H.ladder.room].name} ↑ Landing</span></li>`:''}</ul>
      ${H.doorNotes.length?`<p class="small"><b>Routing notes.</b> ${H.doorNotes.join(' ')}</p>`:''}
      ${H.flood.unreached.length?`<p class="small" style="color:var(--fail)">${H.flood.unreached.length} floor cells could not be reached.</p>`:`<p class="small muted">All ${H.flood.cells.length} floor and door cells reached in ${H.flood.max} steps.</p>`}`;
  },
  walls(H){
    const cnt={}; for(const v of H.layers.walls.values()) cnt[v.m]=(cnt[v.m]||0)+1; const st=H.st;
    return `<p class="eyebrow">Sheet A-07 · Walls</p>
      <h1>Extrude the plan</h1>
      <p class="lede">Every ground-floor room outline becomes wall on a foundation course: ${st.wallH} blocks high in the main volumes${H.wings.some(w=>w.kind==='leanto')?`, ${st.leanH} in the lean-to`:''}. ${st.timber?`Timber posts mark every corner, every junction with an inside wall and every ${st.postSpacing} blocks, with a beam along the top.`:'Corners get dressed stones on alternating courses.'}</p>
      <p class="algo"><b>Rule-based extrusion.</b> A cell is wall if it lies on a room boundary, and outside wall if any neighbour is beyond the footprint. Outside cells are then classified by the style: corner, junction or post spacing. Door cells are cut out with a lintel above.</p>
      <div class="stats">
        <div class="stat"><span class="k">Wall</span><span class="v">${cnt.wall||0}</span></div>
        <div class="stat"><span class="k">${st.timber?'Timber':'Quoins'}</span><span class="v">${(st.timber?cnt.frame:cnt.quoin)||0}</span></div>
        <div class="stat"><span class="k">Floor</span><span class="v">${(cnt.floor||0)+(cnt.stone||0)}</span></div>
        <div class="stat"><span class="k">Door blocks</span><span class="v">${cnt.door||0}</span></div>
      </div>`;
  },
  roof(H){
    const st=H.st; const pitch={0.5:'1 in 2',1:'1 in 1',1.5:'3 in 2'}[st.pitch]||st.pitch;
    const up=H.rooms.filter(r=>r.floor===1&&!r.generated);
    return `<p class="eyebrow">Sheet A-08 · Roof & loft</p>
      <h1>The part that says “house”</h1>
      <p class="lede">Each volume gets its own roof: ${H.wings.map(w=>roofText(w).split(',')[0]).filter((v,i,a)=>a.indexOf(v)===i).join(' and ')}, rising ${pitch}${H.wings.some(w=>w.kind==='leanto')?' (lean-tos fall at 1 in 2)':''}. Where they overlap the higher one wins, and the walls under each roof are filled up to meet it.</p>
      <p class="algo"><b>Max of height fields.</b> Height at each cell is the eave plus pitch × distance to the nearest eave edge. A wing’s field reaches into the main block up to its ridge, so a lower wing roof dies into the main slope as a valley.${H.loft?' The loft is the band of the main roof with at least two blocks of headroom; knee walls close it off, and each sleeping room away from a gable gets a dormer cut into the slope.':''}</p>
      <div class="stats">
        <div class="stat"><span class="k">Ridge</span><span class="v">${H.ridge+1} m</span></div>
        <div class="stat"><span class="k">Volumes</span><span class="v">${H.wings.length}</span></div>
        <div class="stat"><span class="k">Loft rooms</span><span class="v">${up.length}</span></div>
        <div class="stat"><span class="k">Dormers</span><span class="v">${H.dormers.length}</span></div>
      </div>`;
  },
  details(H){
    return `<p class="eyebrow">Sheet A-09 · Details</p>
      <h1>Chimneys, windows, contents</h1>
      <p class="lede">Hearth rooms get a stack, on a gable end where possible, run two blocks past the roof. Rooms that need light get windows spaced along each stretch of outside wall. Furniture lines the walls of each room and never cuts the path between its doors${H.ladder?'; a ladder joins the hall to the landing':''}.</p>
      <p class="algo"><b>Scored placement.</b> Candidate cells are scored (gable end over back wall over interior, centred over off-centre, away from doors and the ladder) and the best one wins. This is the layer an NCA or WFC detailer would replace.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Room</th><th class="num">Windows</th><th class="num">Furniture</th></tr></thead><tbody>
      ${H.rooms.map(r=>`<tr><td><span class="dot" style="background:${r.color}"></span>${r.name}${r.floor?' <span class="small muted">loft</span>':''}</td><td class="num">${H.windows[r.id]}</td><td class="num">${H.furniture[r.id]}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted">${H.chimneys.length} chimney stack${H.chimneys.length===1?'':'s'}${H.dormers.length?`, ${H.dormers.length} dormer${H.dormers.length>1?'s':''}`:''}${H.porch?', a covered porch at the front door':''}.</p>`;
  },
  check(H){
    const V=H.check; const counts={pass:0,warn:0,fail:0}; V.checks.forEach(c=>counts[c.status]++);
    return `<p class="eyebrow">Sheet A-10 · Check</p>
      <h1>Read the house back</h1>
      <p class="lede">This sheet ignores the plan. It looks only at the finished blocks: it flood-fills each floor to find enclosed spaces, reads door blocks and the ladder as edges, rebuilds the room graph, and compares it to the brief. It also floods outside air in 3D to prove every room is sealed.</p>
      <p class="algo"><b>Round trip.</b> Plan → voxels → recovered plan. Green floor is a recovered room; red is a space that matches nothing, cannot be reached, or lets the weather in.${H.loft?' The loft is lifted off the ground floor so both levels show.':''}</p>
      <div class="stats"><div class="stat"><span class="k">Pass</span><span class="v" style="color:var(--pass)">${counts.pass}</span></div><div class="stat"><span class="k">Warn</span><span class="v" style="color:var(--warn)">${counts.warn}</span></div><div class="stat"><span class="k">Fail</span><span class="v" style="color:var(--fail)">${counts.fail}</span></div></div>
      <ul class="checks">${V.checks.map(c=>`<li><span class="pill ${c.status}">${c.status}</span><div><div class="nm">${c.name}</div><div class="d">${c.detail}</div></div></li>`).join('')}</ul>`;
  },
  town(H){
    const T=getTown(); const st=TOWNS[S.town];
    return `<p class="eyebrow">Sheet A-11 · Town</p>
      <h1>${st.name}</h1>
      <p class="lede">Six more briefs drawn at random, each run through the same pipeline with the same style. Different rooms and different massing, so no two houses match, but they clearly belong together.</p>
      <p class="algo"><b>Style is a parameter set here:</b> wall height, roof type and pitch, framing, window rhythm, porch, palette, preferred wing slots and whether lofts are allowed. This is the slot a learned style vector would plug into.</p>
      <div class="houses">${T.houses.map((h,i)=>`<div><b>${i===0?'YOURS':'H-'+String(i+1).padStart(2,'0')}</b>${h.shapeName}, ${h.rooms.filter(r=>!r.generated).length} rooms</div>`).join('')}</div>
      <div class="presets"><span>Try another style</span>${Object.entries(TOWNS).filter(([k])=>k!==S.town).map(([k,t])=>`<button type="button" class="chipbtn" data-town="${k}">${t.name}</button>`).join('')}<button type="button" class="chipbtn" id="reroll2">Reroll town</button></div>`;
  },
};

/* ---------------- Navigation ---------------- */
const sheetsEl=$('#sheets'), panelEl=$('#panel'), tblock=$('#tblock');
sheetsEl.innerHTML=STEPS.map((s,i)=>`<a href="#${s.id}" data-i="${i}"><span class="no">${s.sheet}</span><span class="nm">${s.name}</span></a>`).join('');
let updater=null;
function renderStep(resetT){
  const s=STEPS[S.step], H=S.H;
  sheetsEl.querySelectorAll('a').forEach((a,i)=>{a.removeAttribute('aria-current');if(i===S.step)a.setAttribute('aria-current','step');a.classList.toggle('done',i<S.step);});
  const cur=sheetsEl.children[S.step]; if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest',inline:'nearest'});
  const top=panelEl.scrollTop; panelEl.innerHTML=PANELS[s.id](H); panelEl.scrollTop=resetT?0:top;
  tblock.innerHTML=`<div><span class="k">Sheet</span><span class="big">${s.sheet}</span></div><div><span class="k">Title</span><span class="big">${s.name}</span></div><div><span class="k">Style · seed</span>${TOWNS[S.town].name} · ${S.seed}</div><div><span class="k">Scale</span>1 block = 1 m</div>`;
  $('#prev').disabled=S.step===0; $('#next').disabled=S.step===STEPS.length-1;
  clearStage();
  updater=(s.id==='walls'||s.id==='roof'||s.id==='details')?SCENES.voxelStep(H,s.id):SCENES[s.id](H);
  S.t=0; if(updater) updater(0);
}
function go(i,fromHash){
  i=clamp(i,0,STEPS.length-1); S.step=i;
  const want='#'+STEPS[i].id; if(!fromHash&&location.hash!==want){ try{history.replaceState(null,'',want);}catch(e){location.hash=want;} }
  renderStep(true);
}
function stopAuto(){S.autoplay=false;$('#playAll').classList.remove('playing');$('#playAll').textContent='Play through';}
window.addEventListener('hashchange',()=>{const i=STEPS.findIndex(s=>'#'+s.id===location.hash);if(i>=0&&i!==S.step){stopAuto();go(i,true);}});
sheetsEl.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();stopAuto();go(+a.dataset.i);});
$('#prev').addEventListener('click',()=>{stopAuto();go(S.step-1);});
$('#next').addEventListener('click',()=>{stopAuto();go(S.step+1);});
$('#replay').addEventListener('click',()=>renderStep(false));
$('#playAll').addEventListener('click',()=>{ if(S.autoplay){stopAuto();return;} S.autoplay=true; const b=$('#playAll'); b.classList.add('playing'); b.textContent='Stop'; go(S.step===STEPS.length-1?0:S.step); });

let regenTimer=null;
function regenerate(){ clearTimeout(regenTimer); regenTimer=setTimeout(()=>{ S.H=buildHouse(S.req,S.town,S.seed); S.townCache=null; renderStep(false); },40); }
panelEl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const row=b.closest('.room-row');
  if(b.dataset.preset){S.req=Object.assign(clone(PRESETS[b.dataset.preset].req),{shape:S.req.shape,loft:S.req.loft});regenerate();return;}
  if(b.dataset.town){S.town=b.dataset.town;regenerate();return;}
  if(b.dataset.shape!==undefined){S.req.shape=+b.dataset.shape;regenerate();return;}
  if(b.id==='reroll'||b.id==='reroll2'){S.seed=1+Math.floor(Math.random()*9999);regenerate();return;}
  if(row&&row.dataset.type&&b.dataset.q!==undefined){S.req[row.dataset.type].q=+b.dataset.q;regenerate();return;}
  if(row&&b.dataset.n!==undefined){const r=S.req.sleep;r.n=clamp(r.n+(+b.dataset.n),1,4);regenerate();return;}
});
panelEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='loftIn'){S.req.loft=t.checked?1:0;regenerate();}
  else if(t.id&&t.id.startsWith('on-')){S.req[t.id.slice(3)].on=t.checked?1:0;regenerate();}
  else if(t.id==='townSel'){S.town=t.value;regenerate();}
  else if(t.id==='seedIn'){const v=parseInt(t.value,10);if(v>0){S.seed=v;regenerate();}}
});

let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  S.t+=dt; if(updater) updater(S.t);
  if(S.autoplay){ const s=STEPS[S.step]; if(S.t>s.dur+1.1){ if(S.step<STEPS.length-1) go(S.step+1); else stopAuto(); } }
  if(camTween&&controls){camTween.k=Math.min(1,camTween.k+dt/0.75);const e=1-Math.pow(1-camTween.k,3);camera.position.lerpVectors(camTween.p0,camTween.p1,e);controls.target.lerpVectors(camTween.t0,camTween.t1,e);if(camTween.k>=1)camTween=null;}
  if(controls) controls.update();
  if(renderer) renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function themeChanged(){applyTheme(); renderStep(false);}
const mq=window.matchMedia('(prefers-color-scheme: dark)'); if(mq.addEventListener) mq.addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
applyTheme(); resize();
S.H=buildHouse(S.req,S.town,S.seed);
const start=STEPS.findIndex(s=>'#'+s.id===location.hash);
S.step=start>=0?start:0;
renderStep(true);
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderStep(false));

})();
</script>

</body></html>
