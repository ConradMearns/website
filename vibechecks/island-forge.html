      {id:"rad1",type:"radiator",x:460,y:194,params:{eps:0.8,A:1,Tspace:4}},
    ], wires:[ {a:["tm1","t"],b:["rad1","t"]} ]},
    blurb:"A hot mass radiating to deep space is nonlinear (T⁴), so the affine probe fails — but the structure pattern-matches a known analytic template: T(t)=T₀(1+3kT₀³t)^(−⅓). The crossing of Tmark is computed by inverting the formula, not by watching for it." },
  tankd: { title:"Fluid · template (Torricelli)", doc:{ comps:[
      {id:"tnk1",type:"tank",x:140,y:190,params:{A:0.5,V0:1,rho:1000}},
      {id:"vlv1",type:"valve",x:380,y:194,params:{k:1.2e-4,law:"sqrt",gT:600,gW:15}},
      {id:"drn1",type:"drain",x:600,y:196,params:{}},
    ], wires:[ {a:["tnk1","f"],b:["vlv1","a"]},{a:["vlv1","b"],b:["drn1","f"]} ]},
    blurb:"√Δp outflow matches the Torricelli template: V(t)=(√V₀−ct/2)². The tank knows its own future — 'empty at t=…' is an exact event, committed to the ledger before a single step is taken. Switch the valve law to linear and it reclassifies to LINEAR instead." },
  forge: { title:"Centrifuge forge · everything at once", doc:{ comps:[
      {id:"bat1",type:"battery",x:100,y:150,params:{V:110,on:true}},
      {id:"gnd1",type:"ground",x:114,y:280,params:{}},
      {id:"mot1",type:"motor",x:330,y:70,params:{k:0.4,Rw:2}},
      {id:"fly1",type:"flywheel",x:540,y:70,params:{J:1.5,w0:0}},
      {id:"brg1",type:"bearing",x:720,y:74,params:{b:0.25}},
      {id:"htr1",type:"heater",x:330,y:240,params:{R:2,on:true}},
      {id:"mlt1",type:"melt",x:540,y:236,params:{C:2500,T0:293,Tmelt:600,kSep:0.03,wRef:40}},
      {id:"rad1",type:"radiator",x:750,y:242,params:{eps:0.4,A:0.3,Tspace:4}},
      {id:"tnk1",type:"tank",x:540,y:420,params:{A:0.3,V0:0.4,rho:2800}},
      {id:"vlv1",type:"valve",x:740,y:424,params:{k:3e-4,law:"sqrt",gT:600,gW:15}},
      {id:"drn1",type:"drain",x:930,y:426,params:{}},
    ], wires:[
      {a:["bat1","p"],b:["mot1","p"]},{a:["bat1","n"],b:["mot1","n"]},{a:["bat1","n"],b:["gnd1","p"]},
      {a:["bat1","p"],b:["htr1","p"]},{a:["bat1","n"],b:["htr1","n"]},
      {a:["mot1","shaft"],b:["fly1","shaft"]},{a:["fly1","shaft"],b:["brg1","shaft"]},
      {a:["htr1","out"],b:["mlt1","t"]},{a:["mlt1","t"],b:["rad1","t"]},
      {a:["fly1","w"],b:["mlt1","spin"]},
      {a:["mlt1","T"],b:["vlv1","gate"]},
      {a:["tnk1","f"],b:["vlv1","a"]},{a:["vlv1","b"],b:["drn1","f"]},
    ]},
    blurb:"One bus feeds a motor and a heater; the motor spins a drum, the heater melts the crucible. Two dashed modulation wires cross island boundaries carrying no energy: drum ω² drives separation, and melt temperature is the freeze plug on the tap valve. Watch the tap island sleep at 0 ticks until the plug melts — then wake, drain, and sleep again. Toggle the heater or battery mid-run to slam events into the ledger." },
  blank: { title:"Blank bench", doc:{comps:[],wires:[]},
    blurb:"Author your own machine: place parts, bond ports of matching color, run signal wires from bottom ports into top ports. The compiler re-partitions and re-classifies on every edit." },
};
function loadExample(key){
  const ex=EXAMPLES[key];
  doc = JSON.parse(JSON.stringify(ex.doc));
  nextNum = 1 + doc.comps.length*3;
  selected=null; pendingPort=null; eventsLog=[]; chartBufs.clear();
  simT=0; running=false; $("#runBtn").textContent="▶ Run";
  view={x:40,y:20,s:1};
  model=null; recompile(false);
  $("#blurb").textContent = ex.blurb;
  document.querySelectorAll(".extab").forEach(b=>b.classList.toggle("on", b.dataset.ex===key));
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function showIO(exporting){
  const modal=$("#ioModal"); modal.style.display="flex";
  const ta=$("#ioText");
  if (exporting) ta.value = JSON.stringify(doc, null, 1);
  else ta.value="";
  $("#ioApply").style.display = exporting?"none":"inline-block";
  $("#ioTitle").textContent = exporting?"Copy this JSON to save your system":"Paste system JSON";
}
function applyIO(){
  try{
    const d=JSON.parse($("#ioText").value);
    if (!Array.isArray(d.comps)||!Array.isArray(d.wires)) throw new Error("bad shape");
    for (const c of d.comps){ if(!LIB[c.type]) throw new Error("unknown part: "+c.type);
      c.params = {...defaultParams(c.type), ...(c.params||{})}; }
    doc=d; nextNum=1+doc.comps.length*3; selected=null; simT=0; chartBufs.clear(); eventsLog=[];
    model=null; recompile(false);
    $("#ioModal").style.display="none";
  }catch(e){ alert("Couldn't parse: "+e.message); }
}

/* ============================================================
   BOOT
   ============================================================ */
function buildPalette(){
  const pal=$("#palette");
  for (const [cat,name] of CATS){
    const col = cat==="x"?"#e8b8ff":DOMAINS[cat].color;
    pal.append(el("div",{class:"palCat",style:`color:${col}`},name));
    for (const [type,L] of Object.entries(LIB)){
      if (L.cat!==cat) continue;
      const item=el("button",{class:"palItem",onclick:()=>{
        const r=svgRoot().getBoundingClientRect();
        addComp(type, (r.width/2-view.x)/view.s-40+(doc.comps.length%5)*24, (r.height/2-view.y)/view.s-30+(doc.comps.length%5)*20);
      }});
      const sv=el("svg",{viewBox:"0 0 24 24",class:"palIcon"});
      sv.append(el("path",{d:GLYPH[type]||"",stroke:col,fill:"none","stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round"}));
      item.append(sv, el("span",{},L.label));
      pal.append(item);
    }
  }
}
function setupTabs(){
  document.querySelector('.ptab[data-tab="isl"]').classList.add("on");
  document.querySelectorAll(".ptab").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll(".ptab").forEach(x=>x.classList.toggle("on",x===b));
      $("#inspBody").style.display = b.dataset.tab==="insp"?"block":"none";
      $("#islBody").style.display  = b.dataset.tab==="isl"?"block":"none";
      $("#evBody").style.display   = b.dataset.tab==="ev"?"block":"none";
    });
  });
}
window.addEventListener("DOMContentLoaded", ()=>{
  buildPalette(); setupCanvas(); setupTabs();
  $("#runBtn").addEventListener("click",()=>{
    running=!running; $("#runBtn").textContent=running?"❚❚ Pause":"▶ Run";
  });
  $("#resetBtn").addEventListener("click",resetSim);
  $("#speedSel").addEventListener("change",e=>{ speed=parseFloat(e.target.value); });
  $("#exportBtn").addEventListener("click",()=>showIO(true));
  $("#importBtn").addEventListener("click",()=>showIO(false));
  $("#ioApply").addEventListener("click",applyIO);
  $("#ioClose").addEventListener("click",()=>$("#ioModal").style.display="none");
  document.querySelectorAll(".extab").forEach(b=>b.addEventListener("click",()=>loadExample(b.dataset.ex)));
  loadExample("forge");
  requestAnimationFrame(t=>{ lastFrame=t; requestAnimationFrame(frame); });
});

</script>
