<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dizzy execution domain, LCARS study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --ink:#F4DCC4; --dim:#A593BD;
  --c-command:#99CCFF; --c-procedure:#FF9100; --c-event:#FFCC99;
  --c-projection:#D4709F; --c-query:#A9A3FF; --c-model:#FFEE99; --c-table:#E3C465;
  --chrome:#CC99CC; --chrome-2:#9373B8; --chrome-3:#54446E;
  --amber:#FFCC33; --red:#E8492F;
  --gap:4px; --side:166px;
  --lc:"Antonio","Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",sans-serif;
  --tx:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* LCARS is a black-glass console in either theme */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
:root[data-cond="yellow"]{ --chrome:#FFCC33; --chrome-2:#C99A1E; --chrome-3:#6B5413; }
:root[data-cond="red"]{ --chrome:#E8492F; --chrome-2:#B5301C; --chrome-3:#5E1A10; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--tx)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lc{font-family:var(--lc);text-transform:uppercase;letter-spacing:.03em}
.frame{max-width:1560px;margin:0 auto;padding:14px}

/* ── upper frame: identity, condition, composition bar ── */
.upper{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:auto 26px}
.u-side{grid-row:1/3;background:var(--chrome);border-radius:0 0 0 64px;color:#000;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 12px 36px;font:600 15px/1 var(--lc);transition:background .4s}
.u-body{position:relative;padding:2px 0 18px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;min-height:132px}
.u-body::before,.l-body::before{content:"";position:absolute;left:0;width:28px;height:28px}
.u-body::before{bottom:0;background:radial-gradient(circle at 100% 0,transparent 27.4px,var(--chrome) 28px)}
.cond h2{margin:0 0 4px;font:600 22px/1.1 var(--lc);text-transform:uppercase;letter-spacing:.03em;color:var(--chrome)}
.cond p{margin:0;max-width:64ch;color:var(--ink)}
.cond .sub{color:var(--dim);margin-top:6px}
.cond ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;max-width:74ch}
.find{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;padding:0}
.find b{font:600 14px/1 var(--lc);text-transform:uppercase;letter-spacing:.03em;background:var(--amber);color:#000;padding:5px 10px 4px;border-radius:11px 0 0 11px;white-space:nowrap}
.find:hover span{color:#fff}
.act{background:var(--c-command);color:#000;font:600 15px/1 var(--lc);text-transform:uppercase;letter-spacing:.03em;height:32px;padding:0 18px;border-radius:16px;margin-top:10px}
.ident{text-align:right}
.ident h1{margin:0;font:700 clamp(34px,5.2vw,68px)/.92 var(--lc);text-transform:uppercase;letter-spacing:.01em;color:var(--c-procedure)}
.ident p{margin:8px 0 0;font:400 14px/1 var(--lc);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.bar{display:flex;gap:var(--gap);min-width:0}
.bar>*{height:26px;flex:none}
.bar .lead{width:54px;background:var(--chrome);transition:background .4s}
.bar .fill{flex:1 1 20px;background:var(--chrome-3);transition:background .4s}
.bar .cap{width:34px;border-radius:0 13px 13px 0;background:var(--chrome);transition:background .4s}
.lg{background:var(--k);color:#000;font:600 14px/26px var(--lc);text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:0 10px;min-width:104px;white-space:nowrap;overflow:hidden}
.lg b{font-weight:700;margin-left:6px}
.bb{background:var(--chrome);color:#000;font:600 14px/26px var(--lc);text-transform:uppercase;letter-spacing:.03em;padding:0 16px;white-space:nowrap;transition:background .4s}
.bb.y{background:var(--amber)} .bb.r{background:var(--red)}
.bb:hover,.lg:hover,.sb:hover,.act:hover{filter:brightness(1.18)}

/* ── lower frame: entry points down the side, display inside ── */
.lower{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:26px auto;margin-top:8px}
.l-side{grid-row:1/3;display:flex;flex-direction:column;gap:var(--gap)}
.l-elbow{height:92px;background:var(--chrome-2);border-radius:64px 0 0 0;color:#000;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 12px 8px;font:600 15px/1 var(--lc);transition:background .4s}
.l-bar .lead{background:var(--chrome-2)} .l-bar .cap{background:var(--chrome-2)}
.l-body{position:relative;padding:24px 0 0 30px;min-width:0}
.l-body::before{top:0;background:radial-gradient(circle at 100% 100%,transparent 27.4px,var(--chrome-2) 28px)}
.sb{position:relative;height:54px;overflow:visible;background:var(--c-command);color:#000;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:6px 12px 6px;font:600 14px/1 var(--lc);text-transform:uppercase;letter-spacing:.02em;text-align:right;white-space:nowrap}
.sb:nth-of-type(even){background:#7FB3E8}
.sb i{font-style:normal;font-weight:700;font-size:13px;opacity:.7}
.sb[aria-current="true"]{background:#fff}
.sb[aria-current="true"]::after{content:"";position:absolute;right:-18px;top:50%;width:14px;height:8px;margin-top:-4px;background:#fff}
.l-rest{flex:1;min-height:60px;background:var(--chrome-3);border-radius:0 0 0 28px;transition:background .4s}

.main{display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,33%,500px);gap:30px;align-items:start}
.flow{container-type:inline-size;overflow-x:auto;padding:4px 4px 24px}
.slice{display:grid;grid-template-columns:minmax(170px,max-content) 20px minmax(190px,max-content) 28px minmax(0,1fr);grid-template-rows:34px auto;width:max-content;min-width:100%}
.pill,.e,.p,.q,.proc-name{font:600 15px/1 var(--lc);text-transform:uppercase;letter-spacing:.03em;color:#000;white-space:nowrap}
.cmd{grid-column:1;grid-row:1;height:34px;border-radius:17px;background:var(--c-command);text-align:right;padding:0 16px}
.lnk{grid-column:2;grid-row:1;align-self:center;height:10px;margin-left:3px;background:var(--c-command)}
.cmd-desc{grid-column:1;grid-row:2;width:0;min-width:100%;padding:14px 18px 0 2px;margin:0;font-size:14px;color:var(--ink)}
.proc{grid-column:3/5;grid-row:1/3;position:relative;overflow:hidden;background:var(--c-procedure);border-radius:0 38px 14px 0;display:flex;flex-direction:column;cursor:pointer}
.proc-name{height:34px;flex:none;background:none;display:flex;justify-content:space-between;align-items:center;padding:0 34px 0 10px}
.proc-name small{font:600 11px/1 var(--lc);letter-spacing:.08em;opacity:.65}
.nook{flex:1;margin-right:28px;background:var(--bg);border-top-right-radius:18px;padding:14px 0 14px;display:flex;flex-direction:column;gap:7px;align-items:flex-end;min-height:70px;cursor:default}
.nook .cap2{align-self:stretch;width:0;min-width:calc(100% - 18px);margin:0 16px 2px 2px}
.qrow{display:flex;align-items:center}
.q{height:28px;min-width:138px;border-radius:14px 0 0 14px;background:var(--c-query);text-align:left;padding:0 10px 0 14px}
.stub{flex:none;width:16px;height:8px;background:var(--c-procedure)}
.qrow .stub{width:14px;background:var(--c-query)}
.pulse{position:absolute;right:0;top:0;width:28px;height:56px;margin-top:-56px;background:linear-gradient(transparent,#fff);opacity:0;pointer-events:none}
.cap2{font-size:13.5px;line-height:1.3;color:var(--dim)}
.emits{grid-column:5;grid-row:1;align-self:center;margin:0;padding-left:18px;font-size:13px;line-height:1.2;width:0;min-width:100%}
.evs{grid-column:5;grid-row:2;padding-top:14px;display:grid;grid-template-columns:16px max-content 36px max-content auto;justify-content:start;align-items:center;row-gap:7px}
.ev{display:contents}
.e{height:28px;min-width:150px;background:var(--c-event);text-align:right;padding:0 10px}
.n{text-align:center;font:700 18px/1 var(--lc);color:var(--c-event)}
.p{height:28px;min-width:120px;background:var(--c-projection);border-radius:0 14px 14px 0;text-align:left;padding:0 12px 0 10px}
.w{margin-left:12px;font:400 12.5px/1 var(--lc);text-transform:uppercase;letter-spacing:.06em;color:var(--c-table);white-space:nowrap}
@container (max-width:860px){ .w{visibility:hidden;width:0;margin:0;overflow:hidden} }

/* shared element states */
.hot{filter:brightness(1.22) saturate(.75)}
.on:not(.sb):not(.proc):not(.seg){box-shadow:0 0 0 2px #000,0 0 0 4px #fff}
.proc.on .proc-name{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.flag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--amber);animation:blink 1s steps(2) infinite}
.flag{position:relative;overflow:hidden}
.alarm{animation:alarm .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes alarm{50%{background:var(--red);fill:var(--red)}}
:root[data-cond="red"] .u-side,:root[data-cond="red"] .l-elbow,:root[data-cond="red"] .bar .lead,:root[data-cond="red"] .bar .cap{animation:throb 1.2s ease-in-out infinite}
@keyframes throb{50%{filter:brightness(.45)}}

/* ── the hub dial ── */
.hub svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.seg{cursor:pointer;outline:none}
.seg path,.seg circle{transition:opacity .25s}
.seg.dim path{opacity:.36} .seg.dim text{opacity:.6}
.seg.hot{filter:none} .seg.hot path,.seg.hot circle{opacity:1;filter:brightness(1.25)} .seg.hot text{opacity:1}
.seg:focus-visible path,.seg:focus-visible circle{stroke:#fff;stroke-width:2.5}
.seg.on path,.seg.on circle{opacity:1;stroke:#fff;stroke-width:4;stroke-linejoin:round} .seg.on text{opacity:1}
.seg.flag path{stroke:var(--amber);stroke-width:3;animation:blink 1s steps(2) infinite}
.seg text{font:600 10.5px/1 var(--lc);text-transform:uppercase;letter-spacing:.04em;fill:#000;pointer-events:none}
.seg text.num{font-weight:700;font-size:11.5px}
.seg text.big{font-size:13px;font-weight:700}
.ticks{fill:none;stroke:var(--chrome-3);stroke-width:5;stroke-dasharray:1.5 8.32;transform-origin:260px 260px;animation:spin 240s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hub .cap2{margin:6px 0 0;text-align:center}

/* ── readout ── */
.readout{margin-top:22px;min-height:180px}
.r-head{display:flex;align-items:stretch;gap:var(--gap);height:30px}
.r-kind{background:var(--k);color:#000;border-radius:15px 0 0 15px;font:600 14px/30px var(--lc);text-transform:uppercase;letter-spacing:.04em;padding:0 10px 0 16px}
.r-fill{flex:1;background:var(--k);border-radius:0 15px 15px 0;opacity:.55}
.r-head h2{margin:0 6px;font:700 24px/30px var(--lc);text-transform:uppercase;letter-spacing:.02em;color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-body{padding:12px 0 0;animation:wipe .35s ease-out}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.r-desc{margin:0;max-height:10.2em;overflow:auto;padding-right:8px}
.r-meta{margin:10px 0 0;font:400 12.5px/1.3 var(--lc);text-transform:uppercase;letter-spacing:.07em;color:var(--dim);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:var(--gap) 6px;align-items:center;margin-top:12px}
.chips span{font:400 12.5px/1 var(--lc);text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-right:4px}
.chip{background:var(--k);color:#000;font:600 13px/24px var(--lc);text-transform:uppercase;letter-spacing:.03em;height:24px;padding:0 12px;border-radius:12px}
.slots{border-collapse:collapse;margin-top:12px;width:100%;font-size:14px}
.slots td{padding:2px 12px 2px 0;border-bottom:1px solid #2a2233;vertical-align:baseline}
.slots td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--c-event)}
.slots td:last-child{text-align:right;padding-right:0;color:var(--dim);font:400 12px/1 var(--lc);text-transform:uppercase;letter-spacing:.07em}
.code{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;margin-top:14px}
.code i{background:var(--k);border-radius:5px;opacity:.7}
pre{margin:0;max-height:300px;overflow:auto;font:12px/1.5 var(--mono);color:#E9D6C2;tab-size:4}

@media (max-width:1020px){ .main{grid-template-columns:minmax(0,1fr)} .hub svg{max-width:460px} }
@media (max-width:760px){
  .frame{padding:10px}
  .upper,.lower{display:flex;flex-direction:column;gap:var(--gap)}
  .l-body{padding-top:14px!important} .l-side .sb{min-width:0;overflow:hidden}
  .u-side,.l-elbow,.l-rest,.u-body::before,.l-body::before,.sb[aria-current="true"]::after{display:none}
  .u-body{grid-template-columns:minmax(0,1fr);padding-left:0} .ident{text-align:left;order:-1}
  .l-side{flex-direction:row;flex-wrap:wrap}
  .sb{flex:1 1 30%;height:46px} .l-body{padding-left:0}
  .bar{flex-wrap:wrap} .lg{flex:1 1 30%!important;min-width:0} .bb{flex:1 1 30%;padding:0 6px} .bar .lead,.bar .cap,.bar .fill{display:none}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="frame">
  <header class="upper">
    <div class="u-side" id="feat-code"></div>
    <div class="u-body">
      <div class="cond" id="cond" aria-live="polite"></div>
      <div class="ident"><h1>Execution domain</h1><p id="feat-path"></p></div>
    </div>
    <div class="bar u-bar" id="legend"></div>
  </header>

  <div class="lower">
    <nav class="l-side" id="side" aria-label="Entry commands"><div class="l-elbow">Entry</div></nav>
    <div class="bar l-bar">
      <span class="lead"></span><span class="fill"></span>
      <button class="bb" id="b-trace">Replay trace</button>
      <button class="bb y" id="b-find">Show findings</button>
      <button class="bb r" id="b-halt">Simulate halt</button>
      <span class="cap"></span>
    </div>
    <div class="l-body">
      <div class="main">
        <section class="flow" id="flow" aria-label="Selected command, traced to its events"></section>
        <aside>
          <div class="hub">
            <svg id="dial" viewBox="0 0 520 520" role="group" aria-label="The execution model and everything that writes or reads it"></svg>
            <p class="cap2">Projections fold in from the left, queries read out to the right. A longer bar touches more tables, or serves more procedures.</p>
          </div>
          <section class="readout" id="readout" aria-live="polite"></section>
        </aside>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="data">{"title":"dizzy","description":"The execution domain: what the kernel was asked to run, what it attempted, and how each attempt ended. One append-only, content-addressed log per data directory, stored separately from the domain stores (one per application domain: core and each plugin) and never in a shared transaction with any of them. Queue state, dedupe, claims and fencing, outcomes, the abandon budget, the per-store watermark vector, per-domain reactor positions and the lifecycle telemetry (one span per attempt) are projections of this log; the `telemetry` sinks below observe what the log deliberately does not record. The domain stores alone are sufficient for application correctness; this log may be compacted or deleted and is rebuilt from the stores' causation blocks.","feat":"dizzy/engine/execution.feat.yaml","nodes":[{"id":"command:boot_kernel","kind":"command","name":"boot_kernel","desc":"Validate the domain bindings, open every bound domain's store and this log under the single-writer lock, fold this log, reconcile it against each bound store, catch up lagging domains, and record what recovery did","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class boot_kernel)"},{"id":"command:close_kernel","kind":"command","name":"close_kernel","desc":"The host ends the session in an orderly way: settle the completions that already returned, release every attempt still running, then stop. A close requested during an operation is only recorded: runs stop at their next safe point and the host's own close (outside any operation) dispatches it","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class close_kernel)"},{"id":"command:compact_log","kind":"command","name":"compact_log","desc":"Rotate to a new exec-log generation seeded by a snapshot of open work","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class compact_log)"},{"id":"command:publish_facts","kind":"command","name":"publish_facts","desc":"Hand newly durable facts to in-process subscribers (host-owned exporters)","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class publish_facts)"},{"id":"command:request_command","kind":"command","name":"request_command","desc":"Record intent to run an app command (type CURIE, canonical payload, optional idempotency key, priority) from an external source; the command's domain must be bound","intrinsic":false,"rt":[],"slots":[["type","string",true],["payload","string",true],["key","string",false],["priority","integer",true],["group","string",true]],"path":"def/commands.yaml (class request_command)"},{"id":"command:retry_command","kind":"command","name":"retry_command","desc":"Operator re-opens a failed command (by command_id); attempt numbering continues","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["by","string",false],["reason","string",false]],"path":"def/commands.yaml (class retry_command)"},{"id":"command:run_next","kind":"command","name":"run_next","desc":"Claim the head of the runnable order and run its unit of work: procedure, atomic append to its domain's store, per-event fold + commit + policies across every bound domain subscribed to the event","intrinsic":false,"rt":[],"slots":[],"path":"def/commands.yaml (class run_next)"},{"id":"event:attempt_abandoned","kind":"event","name":"attempt_abandoned","desc":"Recovery found a claim with no terminal fact and no app events carrying its attempt (attempt_id, command_id, abandons_so_far, detected_by_session, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["abandons_so_far","integer",true],["detected_by_session","string",true],["t","string",true]],"path":"def/events.yaml (class attempt_abandoned)"},{"id":"event:attempt_released","kind":"event","name":"attempt_released","desc":"The session ended in an orderly way (close_kernel) while this attempt was still running (attempt_id, command_id, session_id, t). Not a failure: the command returns to the runnable order and its next claim is attempt n+1. Unlike attempt_abandoned it does not count against abandon_budget \u2014 nothing crashed. Fenced like attempt_abandoned: a release naming an attempt that is not the command's live one is kept as a stale terminal.","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["session_id","string",true],["t","string",true]],"path":"def/events.yaml (class attempt_released)"},{"id":"event:command_claimed","kind":"event","name":"command_claimed","desc":"Attempt n of a command started (attempt_id, command_id, attempt_no, session_id, group \u2014 the topology group that claimed it, mirrors the request's group unless a topology swap landed between request and claim (\u00a713), store_seq_at_claim, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["attempt_no","integer",true],["session_id","string",true],["store_seq_at_claim","integer",true],["t","string",true],["group","string",true]],"path":"def/events.yaml (class command_claimed)"},{"id":"event:command_completed","kind":"event","name":"command_completed","desc":"A unit settled (attempt_id, command_id, command_type, domain prefix \u2014 the store the unit was appended to, group \u2014 denormalized from the claim, same pattern as domain (\u00a713), outcome completed|no_result, reason?, detail?, app_events [ids], app_through? \u2014 last event in that store, absent for no_result, bound [prefix] \u2014 domains whose elements ran on the unit, dispatched [{policy, trigger_event, index, command_id, deduped}], recovered bool, timings {procedure_ns, append_ns, folds {name: ns}, policies {name: ns}}, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["command_type","string",true],["domain","string",true],["outcome","string",true],["recovered","boolean",true],["t","string",true],["group","string",true],["reason","string",false],["detail","string",false],["app_through","string",false]],"path":"def/events.yaml (class command_completed)"},{"id":"event:command_failed","kind":"event","name":"command_failed","desc":"A unit failed BEFORE anything reached the app log \u2014 terminal (attempt_id, command_id, group \u2014 denormalized from the claim (\u00a713), stage decode|procedure|contract|encode|append|abandoned, error_type, message, traceback, t)","intrinsic":false,"rt":[],"slots":[["attempt_id","string",true],["command_id","string",true],["stage","string",true],["error_type","string",true],["message","string",true],["traceback","string",true],["t","string",true],["group","string",true]],"path":"def/events.yaml (class command_failed)"},{"id":"event:command_requested","kind":"event","name":"command_requested","desc":"An app command became intent (command_id, command_type CURIE, domain prefix, group \u2014 the topology group the bound GroupPlan assigns this command's type, \"default\" when no topology is bound (\u00a713), payload canonical-JSON, payload_hash, key?, source external|policy|recovered, policy CURIE?, trigger_event event-id?, trigger_domain prefix?, dispatch_index?, priority, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["command_type","string",true],["domain","string",true],["payload","string",true],["payload_hash","string",true],["source","string",true],["priority","integer",true],["t","string",true],["group","string",true],["key","string",false],["policy","string",false],["trigger_event","string",false],["trigger_domain","string",false],["dispatch_index","integer",false]],"path":"def/events.yaml (class command_requested)"},{"id":"event:command_retried","kind":"event","name":"command_retried","desc":"An operator re-opened a failed command (command_id, by, reason?, t)","intrinsic":false,"rt":[],"slots":[["command_id","string",true],["by","string",true],["t","string",true],["reason","string",false]],"path":"def/events.yaml (class command_retried)"},{"id":"event:do ython-uv"],"path":"lib/python-uv/procedure/record_request/src/record_request.py","code":"from gen_int.python.procedure.record_request_protocol import record_request_protocol\nfrom gen_int.python.procedure.record_request_context import record_request_context\nfrom gen_def.pydantic.commands import RequestCommand\nfrom gen_def.pydantic.events import CommandRequested, RequestRepeated\nfrom gen_def.pydantic.query.command_status import CommandStatusInput\nfrom gen_def.pydantic.query.causation_lookup import CausationLookupInput\n\nfrom dizzy.engine.binding import curie_prefix\nfrom dizzy.engine.errors import CommandKeyConflict\nfrom dizzy.engine.execution.facts import now\nfrom dizzy.engine.ids import external_command_id, payload_hash\n\n\ndef record_request(\n    context: record_request_context,\n    command: RequestCommand,\n) -> None:\n    \"\"\"kernel.py's current ``_request``, translated to the generated\n    query+emit contract (docs/design/engine-domains.md \u00a75a.5: DIZZY-authored,\n    no mechanism escape hatch). ``command.type``/``payload``/``priority``/\n    ``group`` are already resolved by Kernel.request() before this runs \u2014\n    only app-binding knowledge can resolve them, which this procedure never\n    touches.\"\"\"\n    import json\n\n    payload = json.loads(command.payload)\n    cid = external_command_id(command.type, payload, command.key)\n    ph = payload_hash(payload)\n\n    status = context.query.command_status(CommandStatusInput(command_id=cid))\n    if status.found:\n        stored = status.payload_hash\n        if command.key is not None and stored not in (\"\", ph):\n            raise CommandKeyConflict(cid, command.key, stored, ph)\n        context.emit.request_repeated(\n            RequestRepeated(\n                command_id=cid, status=status.status, answered_from=\"exec\", t=now(), command_type=command.type\n            )\n        )\n        return\n\n    causation = context.query.causation_lookup(CausationLookupInput(command_id=cid path":"lib/python-uv/projection/releases/src/releases.py","code":"from gen_int.python.projection.releases_projection import releases_context\nfrom gen_def.pydantic.events import AttemptReleased\n\nfrom dizzy.engine.log import ExecRecord\n\n\ndef releases(\n    event: AttemptReleased,\n    context: releases_context,\n) -> None:\n    \"\"\"An orderly close released the live attempt: never charged, runnable again.\"\"\"\n    store = context.adapter.store\n    view = store.known(event.command_id, event)\n\n    if view.live_attempt != event.attempt_id:\n        store.stale_terminals.append(\n            ExecRecord(seq=context.envelope.seq, id=context.envelope.event_id, fact=event)\n        )\n        return\n\n    view.live_attempt = None\n    view.claimed_group = None\n    view.releases += 1  # an orderly close is not a crash: abandons unchanged\n    view.status = \"requested\"\n    store.enqueue(view)\n","writes":["Command","Attempt","StaleTerminal"]},{"id":"projection:repeats","kind":"projection","name":"repeats","desc":"request_repeated \u2192 when the command it names is known here, its repeats += 1 (this generation's count of external requests answered with it instead of queued again). A command answered from the snapshot's memory or the app log has no row here and nothing changes.","intrinsic":false,"rt":["python-uv"],"path":"lib/python-uv/projection/repeats/src/repeats.py","code":"from gen_int.python.projection.repeats_projection import repeats_context\nfrom gen_def.pydantic.events import RequestRepeated\n\n\ndef repeats(\n    event: RequestRepeated,\n    context: repeats_context,\n) -> None:\n    \"\"\"An external request answered with an existing command: this generation's count.\"\"\"\n    store = context.adapter.store\n    view = store.work.get(event.command_id)\n    if view is not None:  # answered from snapshot memory or the app log: no row here\n        view.repeats += 1\n","writes":["Command"]},{"id":"projection:requests","kind":"projection","name":"reque her\n    than guessing a readable map.\"\"\"\n    return ReactorLagOutput(lagging_domains=[])\n"},{"id":"model:execution","kind":"model","name":"execution","desc":"The execution domain's state as ONE relational database (def/models/execution.yaml): the generation (log id, order base, last fold position, halt, last session); the domain map, each domain's store watermark (through) and what it requires; per-domain reaction positions (reacted: how far each domain's elements processed each store); every command known here with its request and lifecycle (status requested|claimed|completed|no_result|failed, attempt_no, abandons charged by crashes, releases by orderly closes, pending settlement); the live attempt of each claimed command; each failed command's failure; the no_result dedupe memory a snapshot carries (answered); and, for this generation only, fenced stale terminals and detached subscribers. One database rather than two: one fact updates several tables (a completion moves a command's status AND its store's watermark), and the invariants span them. The runnable order (per-group min-heaps of (priority, order) over bound domains; an unbound domain's commands are parked), the round-robin cursor across groups (\u00a713) and the bound partition are INDEXES over these tables, not tables. In-memory; rebuilt by fold at boot.","intrinsic":false,"rt":[],"path":"def/models/execution.yaml","tables":[{"id":"Generation","kind":"table","rows":[["log_id","string",["PK"]],["number","integer",["req"]],["order_base","integer",["req"]],["last_seq","integer",["req"]],["halted","string",[]],["last_session","string",[]]]},{"id":"Domain","kind":"table","rows":[["prefix","string",["PK"]],["generation","Generation",["FK","req"]],["feat","string",["req"]],["feat_hash","string",["req"]],["store_log","string",["req"]],["through","string",[]]]},{"id":"Reaction","kind":"table","rows":[["id","integer",["PK"]],["domain","Domain",["FK","UQ","req"]],["store","Domain",["FK","UQ","req"]],["event"," age","rows":["decode","procedure","contract","encode","append","abandoned"]}]}],"links":[["command:boot_kernel","procedure:recover","handles"],["procedure:recover","event:log_opened","emits"],["procedure:recover","event:domain_attached","emits"],["procedure:recover","event:domain_caught_up","emits"],["procedure:recover","event:command_requested","emits"],["procedure:recover","event:command_retried","emits"],["procedure:recover","event:command_completed","emits"],["procedure:recover","event:foreign_settled","emits"],["procedure:recover","event:unit_settle_failed","emits"],["procedure:recover","event:attempt_abandoned","emits"],["procedure:recover","event:command_failed","emits"],["procedure:recover","event:kernel_booted","emits"],["query:open_attempts","procedure:recover","reads"],["query:app_watermark","procedure:recover","reads"],["query:reactor_lag","procedure:recover","reads"],["query:command_status","procedure:recover","reads"],["command:request_command","procedure:record_request","handles"],["procedure:record_request","event:command_requested","emits"],["procedure:record_request","event:request_repeated","emits"],["query:command_status","procedure:record_request","reads"],["query:causation_lookup","procedure:record_request","reads"],["command:run_next","procedure:run_unit","handles"],["procedure:run_unit","event:command_claimed","emits"],["procedure:run_unit","event:command_requested","emits"],["procedure:run_unit","event:command_completed","emits"],["procedure:run_unit","event:command_failed","emits"],["procedure:run_unit","event:unit_settle_failed","emits"],["query:next_runnable","procedure:run_unit","reads"],["query:command_status","procedure:run_unit","reads"],["command:retry_command","procedure:record_retry","handles"],["procedure:record_retry","event:command_retried","emits"],["query:command_status","procedure:record_retry","reads"],["command:compact_log","procedure:rotate","handles"],["procedure:rotate","event:log_opened","emits"],["procedure:rotate","event:snapshot_taken","emits"],["query:open_work","procedure:rotate","reads"],["query:app_watermark","procedure:rotate","reads"],["command:publish_facts","procedure:notify_subscribers","handles"],["procedure:notify_subscribers","event:subscriber_detached","emits"],["command:close_kernel","procedure:close_session","handles"],["procedure:close_session","event:attempt_released","emits"],["procedure:close_session","event:command_requested","emits"],["procedure:close_session","event:command_completed","emits"],["procedure:close_session","event:command_failed","emits"],["procedure:close_session","event:unit_settle_failed","emits"],["event:command_requested","projection:requests","feeds"],["projection:requests","model:execution","writes"],["event:command_claimed","projection:claims","feeds"],["projection:claims","model:execution","writes"],["event:command_completed","projection:completions","feeds"],["projection:completions","model:execution","writes"],["event:command_failed","projection:failures","feeds"],["projection:failures","model:execution","writes"],["event:unit_settle_failed","projection:settle_failures","feeds"],["projection:settle_failures","model:execution","writes"],["event:attempt_abandoned","projection:abandons","feeds"],["projection:abandons","model:execution","writes"],["event:attempt_released","projection:releases","feeds"],["projection:releases","model:execution","writes"],["event:command_retried","projection:retries","feeds"],["projection:retries","model:execution","writes"],["event:snapshot_taken","projection:snapshots","feeds"],["projection:snapshots","model:execution","writes"],["event:foreign_settled","projection:foreign_watermark","feeds"],["projection:foreign_watermark","model:execution","writes"],["event:domain_caught_up","projection:reactors","feeds"],["projection:reactors","model:execution","writes"],["event:log_opened","projection:pairing","feeds"],["projection:pairing","model:execution","writes"],["event:domain_attached","projection:attachments","feeds"],["projection:attachments","model:execution","writes"],["event:kernel_booted","projection:boots","feeds"],["projection:boots","model:execution","writes"],["event:request_repeated","projection:repeats","feeds"],["projection:repeats","model:execution","writes"],["event:subscriber_detached","projection:detachments","feeds"],["projection:detachments","model:execution","writes"],["model:execution","query:next_runnable","serves"],["model:execution","query:command_status","serves"],["model:execution","query:open_work","serves"],["model:execution","query:open_attempts","serves"],["model:execution","query:app_watermark","serves"],["model:execution","query:reactor_lag","serves"],["model:execution","query:unit_trace","serves"],["model:execution","query:causation_lookup","serves"]],"lint":{"event-not-past-tense":{"severity":"warning","summary":"an event is a fact: name it in the past tense"},"command-reads-like-event":{"severity":"warning","summary":"a command is an intent: name it imperatively"},"event-unconsumed":{"severity":"warning","summary":"no policy or projection consumes the event"},"command-unhandled":{"severity":"warning","summary":"no procedure handles the command"},"procedure-emits-nothing":{"severity":"warning","summary":"the procedure declares no events"},"model-unwritten":{"severity":"warning","summary":"no projection writes the model"},"query-no-model":{"severity":"info","summary":"the query reads no model"},"event-grain":{"severity":"info","summary":"one event's slots are a strict subset of another's"},"model-empty":{"severity":"warning","summary":"the model declares no tables"},"model-disconnected":{"severity":"warning","summary":"the model's tables share no foreign key"},"model-string-fk":{"severity":"warning","summary":"a string column holds another table's key"},"model-string-id":{"severity":"info","summary":"a string id column that matches no table of the model"},"model-json-column":{"severity":"warning","summary":"a *_json column: a table hiding inside a string"},"model-no-identifier":{"severity":"warning","summary":"a table without an identifier (or a composite unique_keys)"}}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const N = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const L = D.links;
const out = (id, k) => L.filter(l => l[0] === id && l[2] === k).map(l => l[1]);
const inn = (id, k) => L.filter(l => l[1] === id && l[2] === k).map(l => l[0]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MODEL = D.nodes.find(n => n.kind === 'model');
const TABLES = MODEL.tables;
const KINDS = [['command','Commands'],['procedure','Procedures'],['event','Events'],['projection','Projections'],['model','Model'],['query','Queries']];
const CMDS = ['boot_kernel','request_command','run_next','retry_command','compact_log','publish_facts','close_kernel'].map(n => 'command:' + n);
const ABBR = {Generation:'Gen',Domain:'Dom',Reaction:'React',Command:'Cmd',Attempt:'Att',Failure:'Fail',Answered:'Ans',StaleTerminal:'Stale',DetachedSubscriber:'Detach'};
const pad = n => String(n).padStart(2, '0');
const kindOf = id => id.startsWith('table:') ? 'table' : N[id].kind;
const nameOf = id => id.startsWith('table:') ? id.slice(6) : N[id].name;

function slice(cmd){
  const proc = out(cmd, 'handles')[0];
  const events = out(proc, 'emits');
  return { cmd, proc, queries: inn(proc, 'reads'), events, projs: events.map(e => out(e, 'feeds')[0]) };
}
const cmdsFor = id => {               // which entry commands reach this element
  const k = kindOf(id);
  if (k === 'table') return [];
  return CMDS.filter(c => { const s = slice(c);
    return k === 'command' ? c === id : k === 'procedure' ? s.proc === id : k === 'event' ? s.events.includes(id)
         : k === 'projection' ? s.projs.includes(id) : k === 'query' ? s.queries.includes(id) : false; });
};
function related(id){                 // what lights up alongside an element
  const k = kindOf(id), r = [id];
  if (k === 'event'){ const p = out(id,'feeds')[0]; r.push(p, ...N[p].writes.map(t => 'table:'+t)); }
  if (k === 'projection'){ r.push(...inn(id,'feeds'), ...N[id].writes.map(t => 'table:'+t)); }
  if (k === 'table'){ const t = id.slice(6); D.nodes.filter(n => n.kind==='projection' && n.writes.includes(t)).forEach(p => r.push(p.id, ...inn(p.id,'feeds'))); }
  if (k === 'query') r.push(...out(id,'reads'));
  if (k === 'procedure') r.push(...inn(id,'reads'), ...out(id,'emits'));
  if (k === 'command') r.push(...out(id,'handles'));
  if (k === 'model') r.push(...TABLES.map(t => 'table:'+t.id));
  return r;
}
const els = id => document.querySelectorAll(`[data-id="${id}"]`);

/* ── state ── */
let sel = 'command:run_next', focusId = null, cond = 'green', condNote = '';
const FINDINGS = [
  ['query:reactor_lag', 'command:boot_kernel', 'Always answers "no lag". Its input has no field for the map of which stores a domain reads, so it cannot compute one.'],
  ['command:publish_facts', 'command:publish_facts', 'Never dispatched. notify_subscribers runs inline after every append instead.'],
  ['command:boot_kernel', 'command:boot_kernel', 'Never dispatched. The kernel calls recover directly, before it can host this domain.'],
];
const ALARM = ['event:unit_settle_failed','projection:settle_failures','table:Generation','table:Command'];

/* ── chrome ── */
document.getElementById('feat-path').textContent = D.feat.split('/').slice(-3).join(' / ');
document.getElementById('feat-code').textContent = 'Feat ' + pad(D.nodes.length);
document.getElementById('legend').innerHTML = '<span class="lead"></span>' + KINDS.map(([k, label]) => {
  const c = D.nodes.filter(n => n.kind === k).length;
  return `<button class="lg" data-kind="${k}" style="--k:var(--c-${k});flex:${c} 1 0">${label}<b>${pad(c)}</b></button>`;
}).join('') + '<span class="cap"></span>';
document.getElementById('side').insertAdjacentHTML('beforeend', CMDS.map(c => {
  const s = slice(c);
  return `<button class="sb" data-id="${c}" data-sel="1"><i>${pad(s.queries.length)}-${pad(s.events.length)}</i>${esc(N[c].name)}</button>`;
}).join('') + '<div class="l-rest"></div>');

/* ── the hub dial ── */
const C = 260, rad = a => a * Math.PI / 180;
const P = (r, a) => [C + r * Math.cos(rad(a)), C + r * Math.sin(rad(a))];
function sector(r0, r1, a0, a1){
  const g = 1.7, d0 = g / r0 * 180 / Math.PI, d1 = g / r1 * 180 / Math.PI, f = n => n.toFixed(2);
  const [x0,y0] = P(r1,a0+d1), [x1,y1] = P(r1,a1-d1), [x2,y2] = P(r0,a1-d0), [x3,y3] = P(r0,a0+d0);
  return `M${f(x0)} ${f(y0)}A${r1} ${r1} 0 0 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${r0} ${r0} 0 0 0 ${f(x3)} ${f(y3)}Z`;
}
function radial(r0, r1, mid, name, num){
  const right = Math.cos(rad(mid)) >= 0, rot = right ? mid : mid + 180, s = right ? 1 : -1;
  return `<text transform="rotate(${rot} ${C} ${C})" x="${C + s*(r0+7)}" y="${C}" dy=".36em" data-max="${r1-r0-30}" text-anchor="${right?'start':'end'}">${esc(name)}</text>`
       + `<text class="num" transform="rotate(${rot} ${C} ${C})" x="${C + s*(r1-6)}" y="${C}" dy=".36em" text-anchor="${right?'end':'start'}">${num}</text>`;
}
function tangent(r, mid, txt, cls='', max=40){
  const [x,y] = P(r, mid), rot = Math.sin(rad(mid)) < 0 ? mid + 90 : mid - 90;
  return `<text class="${cls}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})" dy=".36em" data-max="${max}" text-anchor="middle">${esc(txt)}</text>`;
}
(function buildDial(){
  const g = (id, fill, label, inner) => `<g class="seg" data-id="${id}" tabindex="0" role="button" aria-label="${esc(label)}" style="fill:${fill}"><title>${esc(label)}</title>${inner}</g>`;
  let h = '<circle class="ticks" cx="260" cy="260" r="251"/>';
  const projs = L.filter(l => l[2] === 'feeds').map(l => l[1]);       // lifecycle order
  const pa = 230 / projs.length;
  projs.forEach((id, i) => { const a0 = 65 + i*pa, n = N[id].writes.length, r1 = 186 + 9*n;
    h += g(id, 'var(--c-projection)', `Projection ${N[id].name}, writes ${n} table${n>1?'s':''}`, `<path d="${sector(98, r1, a0, a0+pa)}"/>` + radial(98, r1, a0+pa/2, N[id].name, n)); });
  const qs = out(MODEL.id, 'serves'), qa = 110 / qs.length;
  qs.forEach((id, i) => { const a0 = 305 + i*qa, n = out(id,'reads').length, r1 = 196 + 11*n;
    h += g(id, 'var(--c-query)', `Query ${N[id].name}, read by ${n} procedure${n===1?'':'s'}`, `<path d="${sector(98, r1, a0, a0+qa)}"/>` + radial(98, r1, a0+qa/2, N[id].name, n)); });
  const ta = 360 / TABLES.length;
  TABLES.forEach((t, i) => { const a0 = -90 + i*ta, mid = a0 + ta/2;
    h += g('table:'+t.id, 'var(--c-table)', `Table ${t.id}, ${t.rows.length} columns`, `<path d="${sector(50, 92, a0, a0+ta)}"/>` + tangent(79, mid, ABBR[t.id] || t.id) + tangent(63, mid, t.rows.length, 'num')); });
  h += g(MODEL.id, 'var(--c-model)', 'Model execution', `<circle cx="260" cy="260" r="45"/><text class="big" x="260" y="258" text-anchor="middle">execution</text><text x="260" y="273" text-anchor="middle">model</text>`);
  document.getElementById('dial').innerHTML = h;
})();

function fitDial(){
  document.querySelectorAll('#dial text[data-max]').forEach(t => {
    t.removeAttribute('textLength'); t.removeAttribute('lengthAdjust');
    const max = +t.dataset.max;
    if (t.getComputedTextLength() > max){ t.setAttribute('textLength', max); t.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
  });
}
fitDial();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDial);

/* ── the command page ── */
function renderFlow(){
  const s = slice(sel), c = N[s.cmd], p = N[s.proc];
  const q = s.queries.map(id => `<div class="qrow"><button class="q" data-id="${id}">${esc(N[id].name)}</button><i class="stub"></i></div>`).join('');
  const ev = s.events.map((id, i) => { const pj = N[s.projs[i]];
    return `<div class="ev"><i class="stub"></i><button class="e" data-id="${id}">${esc(N[id].name)}</button><span class="n" title="${(N[id].slots||[]).length} slots">${pad((N[id].slots||[]).length)}</span><button class="p" data-id="${pj.id}">${esc(pj.name)}</button><span class="w">${pj.writes.map(esc).join(' / ')}</span></div>`; }).join('');
  document.getElementById('flow').innerHTML = `<div class="slice">
    <button class="pill cmd" data-id="${c.id}">${esc(c.name)}</button><i class="lnk"></i>
    <p class="cmd-desc">${esc(first(c.desc))}</p>
    <div class="proc" data-id="${p.id}">
      <button class="proc-name"><small>${p.intrinsic ? 'Intrinsic' : esc(p.rt.join(' ') || 'Declared')}</small>${esc(p.name)}</button>
      <div class="nook"><p class="cap2">${s.queries.length ? `Reads ${s.queries.length} quer${s.queries.length>1?'ies':'y'} before it decides.` : 'Reads nothing from the model.'}</p>${q}</div>
      <i class="pulse"></i>
    </div>
    <p class="cap2 emits">Emits ${s.events.length} event${s.events.length>1?'s':''}. Each number counts slots, each pink cap folds the event into the model.</p>
    <div class="evs">${ev}</div></div>`;
}
const first = t => { const m = t.match(/^.*?[.:](?=\s|$)/); return (m ? m[0] : t).replace(/:$/, '.'); };

function applyState(){
  const s = slice(sel), inSlice = new Set([s.cmd, s.proc, ...s.queries, ...s.events, ...s.projs, MODEL.id]);
  s.projs.forEach(p => N[p].writes.forEach(t => inSlice.add('table:'+t)));
  document.querySelectorAll('.seg').forEach(g => g.classList.toggle('dim', !inSlice.has(g.dataset.id)));
  document.querySelectorAll('.sb').forEach(b => b.setAttribute('aria-current', b.dataset.id === sel));
  document.querySelectorAll('[data-id]').forEach(el => {
    el.classList.toggle('on', el.dataset.id === focusId && !el.classList.contains('sb'));
    el.classList.toggle('flag', cond === 'yellow' && FINDINGS.some(f => f[0] === el.dataset.id));
    el.classList.toggle('alarm', cond === 'red' && ALARM.includes(el.dataset.id) && !el.classList.contains('seg'));
  });
  document.querySelectorAll('.seg').forEach(g => { const t = g.querySelector('path,circle'); t.classList.toggle('alarm', cond === 'red' && ALARM.includes(g.dataset.id)); });
}
function setHot(ids){
  document.querySelectorAll('.hot').forEach(e => e.classList.remove('hot'));
  ids.forEach(id => els(id).forEach(e => { if (!e.classList.contains('sb')) e.classList.add('hot'); }));
}

/* ── readout ── */
function chips(label, ids, attr='data-id'){
  if (!ids.length) return '';
  return `<div class="chips"><span>${label}</span>${ids.map(id => `<button class="chip" ${attr}="${id}" style="--k:var(--c-${kindOf(id)})">${esc(nameOf(id))}</button>`).join('')}</div>`;
}
function renderReadout(){
  const id = focusId, k = kindOf(id), box = document.getElementById('readout');
  let body = '', meta = '';
  if (k === 'table'){
    const t = TABLES.find(t => 'table:'+t.id === id);
    body = `<p class="r-desc">One table of the execution model, with ${t.rows.length} columns. The kernel holds it in memory and rebuilds it by folding the log at boot.</p>`
      + chips('Written by', related(id).filter(x => kindOf(x) === 'projection'))
      + `<table class="slots">${t.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2].filter(f => f !== 'req').join(' ')}</td></tr>`).join('')}</table>`;
  } else {
    const n = N[id];
    body = `<p class="r-desc">${esc(n.desc)}</p>`;
    meta = n.path ? `<p class="r-meta">${esc(n.path)}</p>` : n.intrinsic ? '<p class="r-meta">Intrinsic to the kernel, no generated implementation</p>' : '';
    if (k === 'event') body += chips('Folded by', out(id,'feeds')) + chips('Emitted by', inn(id,'emits'));
    if (k === 'projection') body += chips('Folds', inn(id,'feeds')) + chips('Writes', n.writes.map(t => 'table:'+t));
    if (k === 'query') body += chips('Read by', out(id,'reads'));
    if (k === 'procedure') body += chips('Reads', inn(id,'reads'));
    if (k === 'model') body += chips('Tables', TABLES.map(t => 'table:'+t.id));
    if (k !== 'command' && !cmdsFor(id).includes(sel)) body += chips('Open from', cmdsFor(id), 'data-cmd');
    else if (k !== 'command' && cmdsFor(id).length > 1) body += chips('Also reached from', cmdsFor(id).filter(c => c !== sel), 'data-cmd');
    if (n.slots && n.slots.length) body += `<table class="slots">${n.slots.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2] ? 'required' : ''}</td></tr>`).join('')}</table>`;
    body += meta;
    if (n.code) body += `<div class="code"><i></i><pre><code>${esc(n.code)}</code></pre></div>`;
  }
  box.style.setProperty('--k', `var(--c-${k})`);
  box.innerHTML = `<div class="r-head"><span class="r-kind">${k}</span><h2>${esc(nameOf(id))}</h2><span class="r-fill"></span></div><div class="r-body">${body}</div>`;
}

/* ── condition ── */
function renderCond(){
  document.documentElement.dataset.cond = cond;
  const box = document.getElementById('cond');
  if (cond === 'yellow') box.innerHTML = `<h2>Condition yellow, ${FINDINGS.length} findings</h2><ul>${FINDINGS.map((f, i) =>
      `<li><button class="find" data-find="${i}"><b>${esc(nameOf(f[0]))}</b><span>${esc(f[2])}</span></button></li>`).join('')}</ul><p class="sub">Read off the feat's own descriptions for this study, not from the linter.</p>`;
  else if (cond === 'red') box.innerHTML = `<h2>Red alert, kernel halted</h2><p>A unit's events landed in the store, then a fold raised. settle_failures marked the command pending and set the halt. Nothing new is claimed until the next boot replays the unit.</p><button class="act" id="b-boot">Boot kernel to replay</button>`;
  else box.innerHTML = `<h2>Condition green</h2><p>${esc(condNote || D.description.split('. ')[0] + '.')}</p><p class="sub">Lint is valid with no findings. Pick an entry command on the left to trace it into the model.</p>`;
}

/* ── motion: one signal, from the command to the hub ── */
function flash(el, delay){
  const svg = el instanceof SVGElement, t = svg ? el.querySelector('path,circle') : el, prop = svg ? 'fill' : 'backgroundColor';
  const c = getComputedStyle(t)[prop];
  t.animate([{[prop]:'#ffffff'}, {[prop]:c}], {duration:700, delay, easing:'ease-out'});
}
const flashAll = (id, delay) => els(id).forEach(el => { if (!el.classList.contains('sb')) flash(el, delay); });
function trace(only){
  if (RM) return;
  const s = slice(sel), step = 95, t0 = 480;
  flashAll(s.cmd, 0);
  flash(document.querySelector('.lnk'), 110);
  flashAll(s.proc, 220);
  s.queries.forEach((q, i) => flashAll(q, 300 + i*70));
  const pulse = document.querySelector('.pulse'), h = pulse.parentElement.offsetHeight;
  pulse.animate([{transform:'translateY(34px)', opacity:1}, {transform:`translateY(${h+56}px)`, opacity:1}], {duration: Math.max(420, s.events.length*step + 200), delay: 330, easing:'linear'});
  const tables = new Set();
  s.events.forEach((e, i) => { if (only && e !== only) return; const t = t0 + i*step, p = s.projs[i];
    flashAll(e, t); flashAll(p, t + 150);
    N[p].writes.forEach(tb => { tables.add(tb); flashAll('table:'+tb, t + 330); }); });
  flashAll(MODEL.id, t0 + s.events.length*step + 420);
}

function select(cmd, o = {}){
  sel = cmd; focusId = o.focus || cmd;
  renderFlow(); renderReadout(); applyState();
  if (o.trace !== false) trace(o.only);
}
function focus(id){ focusId = id; renderReadout(); applyState(); }

/* ── wiring ── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cmd],[data-find],[data-id],#b-trace,#b-find,#b-halt,#b-boot');
  if (!t) return;
  if (t.id === 'b-trace') return trace();
  if (t.id === 'b-find'){ cond = cond === 'yellow' ? 'green' : 'yellow'; condNote = ''; renderCond(); return applyState(); }
  if (t.id === 'b-halt'){ cond = 'red'; renderCond(); return select('command:run_next', {focus:'event:unit_settle_failed', only:'event:unit_settle_failed'}); }
  if (t.id === 'b-boot'){ cond = 'green'; condNote = 'kernel_booted folded through boots, which clears the halt and records the new session. The unit that failed to settle is replayed.'; renderCond(); return select('command:boot_kernel', {focus:'projection:boots'}); }
  if (t.dataset.find){ const f = FINDINGS[+t.dataset.find]; return select(f[1], {focus:f[0]}); }
  if (t.dataset.cmd) return select(t.dataset.cmd, {focus: focusId});
  if (t.dataset.sel) return select(t.dataset.id);
  focus(t.dataset.id);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('seg')){ e.preventDefault(); focus(e.target.dataset.id); }
});
const hover = e => { const k = e.target.closest('[data-kind]'), t = e.target.closest('[data-id]');
  if (k) return setHot(D.nodes.filter(n => n.kind === k.dataset.kind).map(n => n.id).concat(k.dataset.kind === 'model' ? TABLES.map(t => 'table:'+t.id) : []));
  setHot(t && !t.dataset.sel ? related(t.dataset.id) : []); };
document.addEventListener('pointerover', hover);
document.addEventListener('focusin', hover);
document.addEventListener('pointerleave', () => setHot([]));

renderCond();
select(sel, {trace:false});
setTimeout(trace, 450);
</script>
</body>
</html>
