version: 0

subjects:
  - id: goal-graph
    name: the goal graph system itself
    aliases: [goalc, goal system, this repo]
  - id: website
    name: the website repo (conradmearns site)
    aliases: [this repo, the site]

goals:
  # ── self-hosting root ────────────────────────────────────────────────
  - id: g-governed
    text: Goals are governed by a provenanced goal graph
    mode: maintain
    subject: goal-graph
    grade: heuristic
    status: confirmed
    derived_from:
      - quote: "we will have a pile of text from which to derive goals - the objective is provenance"
        source: corpus/2026-07-22-goal-system-design.md
        role: states
    supported_by: [s-layers]

  - id: g-provenance
    text: Every confirmed node traces to source text
    mode: maintain
    subject: goal-graph
    grade: deterministic
    status: confirmed
    derived_from:
      - quote: "The main idea is to record - not infer"
        source: corpus/2026-07-22-goal-system-design.md
        role: states
    supported_by: [sn-lint-provenance]

  - id: g-determinism
    text: All leaf goals terminate in deterministic evidence
    mode: maintain
    subject: goal-graph
    grade: deterministic
    status: confirmed
    derived_from:
      - quote: "some rules may be that all goals should terminate with deterministic leaves"
        source: corpus/2026-07-22-goal-system-design.md
        role: states
    supported_by: [sn-lint-grades]

  - id: g-evidence-fresh
    text: Evidence for confirmed leaves is within its TTL
    mode: maintain
    subject: goal-graph
    grade: deterministic
    status: confirmed
    derived_from:
      - quote: "How will we save and record evidence over time? ... how much of this information is outdated?"
        source: corpus/2026-07-22-goal-system-design.md
        role: states
    supported_by: [sn-staleness]

  - id: g-action-linked
    text: Every failing goal has an open seed tracking the fix
    mode: maintain
    subject: goal-graph
    grade: deterministic
    status: candidate          # gray — seeds not yet adopted in this repo
    derived_from:
      - quote: "I wonder if that might work to add the tasking / action layer, so we can keep goal systems distinct"
        source: corpus/2026-07-22-goal-system-design.md
        role: states
    supported_by: [sn-orphan-failures]

  # ── website subject ──────────────────────────────────────────────────
  - id: g-site-reachable
    text: Every page is reachable from index.html by following links
    mode: maintain
    subject: website
    grade: deterministic
    status: candidate
    derived_from:
      - quote: "All pages should be accessible from the index.html - in a like tree fashion."
        source: corpus/2026-07-22-site-tree-goal.md
        role: states
    supported_by: [sn-site-reachable]

  - id: g-site-not-flat
    text: index.html does not directly list every page (navigation stays tree-shaped)
    mode: avoid
    subject: website
    grade: heuristic          # needs a threshold to become deterministic — see gap-002
    status: candidate
    derived_from:
      - quote: "They dont need to be listed all under index.html, this we should avoid."
        source: corpus/2026-07-22-site-tree-goal.md
        role: states
    supported_by: []

  # ── from the why experiment ──────────────────────────────────────────
  - id: g-portfolio
    text: The website is a portfolio of every project I build
    mode: maintain
    subject: website
    grade: heuristic          # deterministic needs a project registry — see gap-004
    status: candidate
    derived_from:
      - quote: "I want to add it because I want this website to be a portfolio of all the projects I build."
        source: corpus/2026-07-23-why-experiment.md
        role: states
    supported_by: [s-portfolio-pages]

  - id: g-bastion-page
    text: A bastion project page exists and is reachable
    mode: achieve
    subject: website
    grade: deterministic
    status: candidate
    derived_from:
      - quote: "establish the bastion project page"
        source: corpus/2026-07-23-why-experiment.md
        role: states
      - quote: "bastion is a project that connects a homelab server to a cloud server, and routes web connections to the homelab for media access like pictures."
        source: corpus/2026-07-23-why-experiment.md
        role: motivates
    supported_by: [sn-bastion-page]

  - id: g-career-tracked
    text: Career accomplishments and progression are tracked in a single place — this site
    mode: maintain
    subject: website
    grade: heuristic
    status: candidate
    derived_from:
      - quote: "I need a single place to track my accomplishments and career progression, otherwise I lose track or forget."
        source: corpus/2026-07-23-why-experiment.md
        role: states
    supported_by: [s-resume-on-site]

  - id: g-resume-on-site
    text: The resume lives on the site, reachable from index
    mode: maintain
    subject: website
    grade: deterministic
    status: candidate
    derived_from:
      - quote: "I want the resume on the site specifically so I know where to find it."
        source: corpus/2026-07-23-why-experiment.md
        role: states
    supported_by: [sn-resume-exists]

  - id: g-resume-fresh
    text: The resume has been updated within the last 6 months
    mode: maintain
    subject: website
    grade: deterministic
    status: candidate
    derived_from:
      - quote: "6mo or so is probably the freshness I'm looking for. certainly once a year"
        source: corpus/2026-07-23-why-experiment.md
        role: states
    supported_by: [sn-resume-fresh]

  - id: g-no-social-media
    text: People can access what I am up to without social media
    mode: maintain
    subject: website
    grade: heuristic
    status: candidate
    derived_from:
      - quote: "I want to facilitate people's access to what I am up to without social media"
        source: corpus/2026-07-23-why-experiment.md
        role: states
      - quote: "I guess to steer some of my own attention to my website? if I don't pay attention to my own site - I'll never get an itch to make it better?"
        source: corpus/2026-07-23-why-experiment.md
        role: motivates
    supported_by: [s-now-page]

  - id: g-now-fresh
    text: A /now page exists and is recently updated
    mode: maintain
    subject: website
    grade: deterministic      # window undefined — see gap-005
    status: candidate
    derived_from:
      - quote: "add a /now status"
        source: corpus/2026-07-23-why-experiment.md
        role: states
    supported_by: []

strategies:
  - id: s-portfolio-pages
    text: Argue portfolio-ness project by project — each built project gets a
      reachable page on the site
    status: candidate
    supported_by: [g-bastion-page]

  - id: s-resume-on-site
    text: Track career in one place by keeping the resume on the site,
      reachable and fresh
    status: candidate
    supported_by: [g-resume-on-site, g-resume-fresh]

  - id: s-now-page
    text: Give people a social-media-free window via a /now page kept fresh
    status: candidate
    supported_by: [g-now-fresh]

  - id: s-layers
    text: Argue the graph is trustworthy layer by layer — provenance of
      structure, determinism of leaves, freshness of evidence, linkage to action
    status: confirmed
    reviewed_by: conrad
    reviewed_at: 2026-07-22
    supported_by: [g-provenance, g-determinism, g-evidence-fresh, g-action-linked]

solutions:
  - id: sn-lint-provenance
    kind: check
    recipe: just evidence-lint-provenance
    ttl: 24h
    grade: deterministic

  - id: sn-lint-grades
    kind: check
    recipe: just evidence-lint-grades
    ttl: 24h
    grade: deterministic

  - id: sn-staleness
    kind: check
    recipe: just evidence-staleness
    ttl: 24h
    grade: deterministic

  - id: sn-orphan-failures
    kind: check
    recipe: just evidence-orphan-failures
    ttl: 24h
    grade: deterministic

  - id: sn-site-reachable
    kind: check
    recipe: just evidence-site-reachable
    ttl: 24h
    grade: deterministic

  - id: sn-bastion-page
    kind: check
    recipe: just evidence-bastion-page
    ttl: 24h
    grade: deterministic

  - id: sn-resume-exists
    kind: check
    recipe: just evidence-resume-exists
    ttl: 24h
    grade: deterministic

  - id: sn-resume-fresh
    kind: check
    recipe: just evidence-resume-fresh
    ttl: 24h
    grade: deterministic
# gaps live in gaps.jsonl (append-only events) or are derived at read time —
# never here. goals.yaml is pure structure.
