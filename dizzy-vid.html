ss=\"hl crossing\" style=\"left: 1130px; --at: 9.45s; --out: 10.4s\"><\/div>\n  <div class=\"hl crossing\" style=\"left: 1442px; --at: 9.50s; --out: 10.4s\"><\/div>\n  <div class=\"hl crossing\" style=\"left: 1472px; --at: 9.55s; --out: 10.4s\"><\/div>\n  <div class=\"veil\"><\/div>\n  <div class=\"peak-line\"><\/div>\n  <div class=\"stem\"><\/div>\n  <div class=\"terms\"><\/div>\n  <div class=\"terms-top\"><\/div>\n  <div class=\"prop p1\"  style=\"--at: 7.0s; --out: 14.0s; --gat: 10.6s; --gx: 351px;  --gy: -9px\">The log only grows.<\/div>\n  <div class=\"prop p2\"  style=\"--at: 8.1s; --out: 14.0s; --gat: 10.7s; --gx: 384px;  --gy: -19px\">Every model is a fold of the log.<\/div>\n  <div class=\"prop two-step p3a\" style=\"--at: 9.2s; --out: 14.0s; --gat: 10.4s; --gx: -346px; --gy: 220px\">Each part uses only<\/div>\n  <div class=\"prop two-step p3b\" style=\"--at: 9.2s; --out: 14.0s; --gat: 10.4s; --gx: -41px;  --gy: 179px\">what it declares.<\/div>\n  <div class=\"statement with-line shown\" style=\"--at: 0.3s; --out: 6.2s\">Above: the domain.<br>Below: the infrastructure between the parts.<\/div>\n  <div class=\"statement with-line shown\" style=\"--at: 6.6s; --out: 9.9s\">Infrastructure only needs a few properties.<\/div>\n  <div class=\"statement with-line shown\" style=\"--at: 10.3s; --out: 14.0s\">DIZZY is the contract between them.<\/div>\n<\/div>\n<script>/*STAGE*/<\/script>\n<\/body>\n<\/html>\n"}, {"title": "4 Guaranteed", "duration": 16600, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Scene 4: what is guaranteed<\/title>\n<style>/*THEME*/<\/style>\n<style>\n  /* Scene-local layout and motion. Colours, type and shared motion come from theme.css.\n     Timeline (s):\n       beat 13 recoverable  0.0 - 7.0   model loop replaces the business loop, database lost, log replayed\n       beat 14 bounded      7.0 - 10.8  notify_on_rejection reaches for the database, stopped at the line\n       beat 15 verified     10.8 - 15.95 a recorded run, then its replay, matched chip by chip\n       still rest frame     15.95 - 16.6\n     Rest-frame elements carry no opacity or transform animation of their own: in Chromium that\n     puts them on compositor layers even before and after the animation runs, which changes their\n     text antialiasing and breaks the pixel match at the joins. Instead their opacity reads a\n     registered custom property (1 unless animated), the event log moves by animating `left`, and\n     every such animation has fill mode none with keyframes ending at the natural value. */\n  /* ---------- rest-frame elements: leave and return ---------- */\n  @property --f13 { syntax: '<number>'; inherits: false; initial-value: 1; }\n  @property --fdb { syntax: '<number>'; inherits: false; initial-value: 1; }\n  @property --f15 { syntax: '<number>'; inherits: false; initial-value: 1; }\n  /* beat 13: the business loop (cards, hops, queues) leaves for the model loop and comes back.\n     active 0.3s to 7.35s (7.05s): out in 0.35s, back from 6.95s */\n  .loop-q, .loop-1, .loop-2, .loop-3, .loop-4, .loop-5,\n  .stage > svg.wires:first-of-type, .infra-queue-a, .infra-queue-b {\n    opacity: var(--f13);\n    animation: hide-13 7.05s linear 0.3s none;\n  }\n  @keyframes hide-13 {\n    0%     { --f13: 1; animation-timing-function: ease-in; }\n    4.96%  { --f13: 0; }\n    94.33% { --f13: 0; animation-timing-function: ease-out; }\n    100%   { --f13: 1; }\n  }\n  /* beat 13: the event log slides left to sit under the model loop, and back. active 0.55s to 6.95s */\n  .infra-log { animation: log-13 6.4s linear 0.55s none; }\n  @keyframes log-13 {\n    0%     { left: 704px; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    9.38%  { left: 140px; }\n    93.75% { left: 140px; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    100%   { left: 704px; }\n  }\n  /* the database: in beat 13 a scene-local copy (#db2) stands in for it and moves (0.6s to 6.95s);\n     in beat 15 it and the runtime band fade to make room for the run rows */\n  .infra-db  { opacity: calc(var(--fdb) * var(--f15)); animation: gone 6.35s linear 0.6s none, hide-15 5.15s linear 10.8s none; }\n  .infra-run { opacity: var(--f15); animation: hide-15 5.15s linear 10.8s none; }\n  @keyframes gone { from { --fdb: 0; } to { --fdb: 0; } }\n  /* active 10.8s to 15.95s: out in 0.4s, back from 15.75s (after the run rows have gone) */\n  @keyframes hide-15 {\n    0%     { --f15: 1; animation-timing-function: ease-in; }\n    7.77%  { --f15: 0; }\n    96.12% { --f15: 0; animation-timing-function: ease-out; }\n    100%   { --f15: 1; }\n  }\n  /* ---------- small local helpers ---------- */\n  .ring  { border: 4px solid var(--ink); opacity: 0; animation: pulse 0.5s ease both; animation-delay: var(--at, 0s); }\n  @keyframes pulse { 0% { opacity: 0; } 30% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }\n  .ok-mark { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }\n  /* ---------- beat 13: the model loop ---------- */\n  .mc { width: 272px; min-width: 0; height: 94px; font-size: 22px; padding-left: 18px; padding-right: 6px; }\n  #m-deb  { left: 140px;  top: 335px; }\n  #m-cred { left: 140px;  top: 465px; }\n  #m-proj { left: 596px;  top: 400px; }\n  #m-model { left: 1052px; top: 392px; width: 272px; height: 110px; min-width: 0; font-size: 22px; padding-top: 26px;\n             animation: pop var(--quick) var(--ease) both, dim 0.3s ease forwards, undim 0.4s ease forwards, fade-out var(--quick) ease-in forwards;\n             animation-delay: 1.3s, 2.75s, 5.25s, 6.2s; }\n  @keyframes dim   { to { opacity: 0.25; } }\n  @keyframes undim { from { opacity: 0.25; } to { opacity: 1; } }\n  #m-query { left: 1508px; top: 400px; }\n  /* the database, moved up beside the log and enlarged: geometry animates from the rest-frame box and back.\n     active 0.6s to 6.95s (6.35s); opacity 0 outside, so it never shows at a join */\n  #db2 { left: 880px; top: 690px; width: 620px; height: 230px; min-width: 0; padding: 22px 0 0; opacity: 0;\n         animation: db-13 6.35s linear 0.6s none; }\n  @keyframes db-13 {\n    0%     { opacity: 1; left: 508px; top: 842px; width: 220px; height: 76px; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    4.72%  { opacity: 1; left: 880px; top: 842px; width: 220px; height: 76px; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    10.24% { opacity: 1; left: 880px; top: 690px; width: 620px; height: 230px; }\n    91.34% { opacity: 1; left: 880px; top: 690px; width: 620px; height: 230px; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    96.06% { opacity: 1; left: 880px; top: 842px; width: 220px; height: 76px; animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    100%   { opacity: 1; left: 508px; top: 842px; width: 220px; height: 76px; }\n  }\n  /* the balances table inside the database */\n  #table { left: 1066px; top: 762px; width: 248px; height: 140px; background: var(--flow);\n           border: 2px solid var(--rule); border-radius: 6px; }\n  #table .cell { position: absolute; font-family: var(--mono); font-size: 34px; line-height: 50px; color: var(--ink); }\n  #table .k  { left: 30px; font-weight: 700; }\n  #table .v  { right: 30px; text-align: right; }\n  #table .r1 { top: 14px; }\n  #table .r2 { top: 72px; }\n  #table .rule { position: absolute; left: 16px; right: 16px; top: 68px; height: 2px; background: var(--rule); }\n  .cell.on  { animation: fade-in 0.2s ease-out both; animation-delay: var(--at); }\n  .cell.off { animation: fade-out 0.2s ease-in forwards; animation-delay: var(--out); }\n  .cell.on.off { animation: fade-in 0.2s ease-out both, fade-out 0.2s ease-in forwards; animation-delay: var(--at), var(--out); }\n  .hl { position: absolute; left: 8px; width: 228px; height: 54px; background: var(--paper-deep); border-radius: 4px; opacity: 0;\n        animation: pulse 0.7s ease both; animation-delay: var(--at); }\n  /* deleting the database: a strike across it */\n  .strike { stroke: var(--refuse); stroke-width: 7; stroke-linecap: round; fill: none;\n            stroke-dasharray: 1 1.2; stroke-dashoffset: 1.1;\n            animation: strike-draw 0.3s var(--ease-in-out) both, fade-out 0.3s ease-in forwards;\n            animation-delay: var(--at), var(--out); }\n  @keyframes strike-draw { from { stroke-dashoffset: 1.1; } to { stroke-dashoffset: 0; } }\n  #lost { left: 1530px; top: 780px; font-family: var(--sans); font-size: 32px; font-weight: 600; color: var(--refuse); }\n  /* the replay: event tokens rise out of the log into balance_ledger; writes run down into the database */\n  #replay-cap { left: 470px; top: 808px; width: 160px; text-align: center; font-size: 30px; font-weight: 600; color: var(--ink-soft); }\n  .rtok { left: 0; top: 0; min-width: 0; padding: 10px 18px; font-size: 26px; white-space: nowrap;\n          offset-path: path(\"M 550 714 L 550 522\"); offset-rotate: 0deg; offset-anchor: center;\n          opacity: 0; animation: rise-tok 0.6s cubic-bezier(0.45, 0, 0.4, 1) both; animation-delay: var(--at); }\n  @keyframes rise-tok {\n    0%   { offset-distance: 0%; opacity: 0; }\n    18%  { opacity: 1; }\n    75%  { opacity: 1; }\n    100% { offset-distance: 100%; opacity: 0; }\n  }\n  .wdot { left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--edge-data);\n          offset-path: path(\"M 868 447 L 888 447 Q 900 447 900 459 L 900 750 L 960 750\"); offset-rotate: 0deg; offset-anchor: center;\n          opacity: 0; animation: wdot 0.4s linear both; animation-delay: var(--at); }\n  @keyframes wdot { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }\n  #same { left: 1530px; top: 776px; display: flex; align-items: center; gap: 12px;\n          font-family: var(--sans); font-size: 34px; font-weight: 600; color: var(--ok); }\n  /* ---------- beat 14: the refused reach ---------- */\n  /* dash 1, gap 1.1, offset 1.05 when hidden: no zero-length dash, so no round-cap dot is left */\n  .reach { stroke-width: 5; stroke-dasharray: 1 1.1; stroke-dashoffset: 1.05;\n           animation: reach-draw 0.6s var(--ease-in-out) both, reach-undraw 0.45s var(--ease-in-out) forwards;\n           animation-delay: var(--at), var(--back); }\n  @keyframes reach-draw   { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }\n  @keyframes reach-undraw { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 1.05; } }\n  #stop { left: 1025px; top: 588px; width: 68px; height: 68px; }\n  #not-declared { left: 760px; top: 552px; width: 250px; text-align: right;\n                  font-family: var(--sans); font-size: 32px; font-weight: 600; color: var(--refuse); }\n  #line-flash { left: 939px; top: 615px; width: 240px; height: 14px; border-radius: 3px; background: var(--refuse); opacity: 0;\n                animation: flash 0.9s ease both; animation-delay: 8.0s; }\n  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 35% { opacity: 0.2; } 55% { opacity: 1; } 100% { opacity: 0; } }\n  #db-target { left: 502px; top: 836px; width: 232px; height: 88px; border: 4px solid var(--refuse); border-radius: 8px; }\n  /* ---------- beat 15: a recorded run and its replay ---------- */\n  .tok { left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); border: 4px solid var(--paper);\n         offset-anchor: center; offset-rotate: 0deg; opacity: 0;\n         animation: run 0.6s cubic-bezier(0.45, 0, 0.55, 1) both; animation-delay: var(--at); }\n  .tok-1 { offset-path: var(--hop1-dip); }\n  .tok-2 { offset-path: var(--hop2-dip); }\n  .tok-3 { offset-path: var(--hop3-dip); }\n  .tok-4 { offset-path: var(--hop4-dip); }\n  @keyframes run {\n    0%   { offset-distance: 0%; opacity: 0; }\n    6%   { opacity: 1; }\n    94%  { opacity: 1; }\n    100% { offset-distance: 100%; opacity: 0; }\n  }\n  .row-label { left: 140px; width: 170px; font-size: 22px; line-height: 1.3; }\n  #lab-rec { top: 822px; }\n  #lab-rep { top: 924px; }\n  .chip { min-width: 0; height: 58px; padding: 0; font-size: 26px; line-height: 58px; text-align: center; }\n  .chip.c1 { left: 317px;  width: 260px; }\n  .chip.c2 { left: 804px;  width: 310px; }\n  .chip.c3 { left: 1353px; width: 240px; }\n  .chip.rec { top: 820px; }\n  .chip.rep { top: 912px; }\n  /* recorded: the chip drops out of the infrastructure box it passed through */\n  .chip.rec { animation: record 0.45s var(--ease) both, fade-out var(--quick) ease-in forwards; animation-delay: var(--at), 15.35s; }\n  @keyframes record { from { opacity: 0; translate: 0 -66px; scale: 0.7; } to { opacity: 1; translate: 0 0; scale: 1; } }\n  .chip.rep, .tick { animation: pop var(--quick) var(--ease) both, fade-out var(--quick) ease-in forwards; animation-delay: var(--at), 15.35s; }\n  .tick { top: 921px; width: 40px; height: 40px; }\n  .tick.c1 { left: 590px; }\n  .tick.c2 { left: 1127px; }\n  .tick.c3 { left: 1606px; }\n<\/style>\n<\/head>\n<body data-duration=\"16600\">\n<div class=\"stage\">\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <defs>\n      <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\" />\n      <\/marker>\n    <\/defs>\n    <path class=\"wire hop hop-1\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop hop-2\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop hop-3\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop hop-4\" marker-end=\"url(#ah)\" />\n    <path class=\"wire ask\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\" d=\"M 618 362 L 618 394\" />\n  <\/svg>\n  <div class=\"note query loop-q\"><span class=\"kind\">query<\/span>get_balance<\/div>\n  <div class=\"note command loop-1\"><span class=\"kind\">command<\/span>transfer_funds<\/div>\n  <div class=\"fn procedure loop-2\"><span class=\"kind\">procedure<\/span>execute_transfer<\/div>\n  <div class=\"note event loop-3\"><span class=\"kind\">event<\/span>transfer_rejected<\/div>\n  <div class=\"fn policy loop-4\"><span class=\"kind\">policy<\/span>notify_on_rejection<\/div>\n  <div class=\"note command loop-5\"><span class=\"kind\">command<\/span>send_notice<\/div>\n  <div class=\"line\"><\/div>\n  <div class=\"label line-label above\">the domain<\/div>\n  <div class=\"label line-label below\">the infrastructure<br>between the parts<\/div>\n  <div class=\"line-name\">DIZZY<\/div>\n  <div class=\"infra infra-queue-a\">queue<\/div>\n  <div class=\"infra infra-log\">event log<\/div>\n  <div class=\"infra infra-queue-b\">queue<\/div>\n  <div class=\"infra infra-db\">database<\/div>\n  <div class=\"infra infra-run\">runtime: one process<\/div>\n  <div class=\"statement with-line in out\" style=\"--at: 0.2s; --out: 6.2s\">Recoverable. <em>Lose a database, replay the log.<\/em> <span class=\"tag guarantee\">guarantee<\/span><\/div>\n  <div id=\"db2\" class=\"infra\">database<\/div>\n  <svg class=\"wires in fade out\" viewBox=\"0 0 1920 1080\" style=\"--at: 1.45s; --out: 6.2s\">\n    <defs>\n      <marker id=\"ah4\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\" />\n      <\/marker>\n    <\/defs>\n    <path class=\"wire data\" d=\"M 412 382 L 508 382 Q 520 382 520 394 L 520 742\" />\n    <path class=\"wire data\" marker-end=\"url(#ah4)\" d=\"M 412 512 L 508 512 Q 520 512 520 524 L 520 742 L 550 742 L 550 459 Q 550 447 562 447 L 589 447\" />\n    <path class=\"wire data\" marker-end=\"url(#ah4)\" d=\"M 868 447 L 888 447 Q 900 447 900 459 L 900 750 L 1030 750 L 1030 459 Q 1030 447 1042 447 L 1045 447\" />\n    <path class=\"wire ask\" marker-start=\"url(#ah4)\" marker-end=\"url(#ah4)\" d=\"M 1331 447 L 1332 447 Q 1344 447 1344 459 L 1344 750 L 1474 750 L 1474 459 Q 1474 447 1486 447 L 1501 447\" />\n  <\/svg>\n  <div id=\"m-deb\"  class=\"note event mc in pop out\" style=\"--at: 1.1s; --out: 6.2s\"><span class=\"kind\">event<\/span>funds_debited<\/div>\n  <div id=\"m-cred\" class=\"note event mc in pop out\" style=\"--at: 1.15s; --out: 6.2s\"><span class=\"kind\">event<\/span>funds_credited<\/div>\n  <div id=\"m-proj\" class=\"fn projection mc in pop out\" style=\"--at: 1.2s; --out: 6.2s\"><span class=\"kind\">projection<\/span>balance_ledger<\/div>\n  <div id=\"m-model\" class=\"db\"><span class=\"kind\">model<\/span>balances<\/div>\n  <div id=\"m-query\" class=\"note query mc in pop out\" style=\"--at: 1.4s; --out: 6.2s\"><span class=\"kind\">query<\/span>get_balance<\/div>\n  <div id=\"table\" class=\"in fade out\" style=\"--at: 1.5s; --out: 6.2s\">\n    <div class=\"hl\" style=\"top: 12px; --at: 4.15s\"><\/div>\n    <div class=\"hl\" style=\"top: 12px; --at: 4.65s\"><\/div>\n    <div class=\"hl\" style=\"top: 70px; --at: 5.15s\"><\/div>\n    <div class=\"rule\"><\/div>\n    <span class=\"cell k r1 off\" style=\"--out: 2.65s\">A<\/span><span class=\"cell v r1 off\" style=\"--out: 2.65s\">70<\/span>\n    <span class=\"cell k r2 off\" style=\"--out: 2.65s\">B<\/span><span class=\"cell v r2 off\" style=\"--out: 2.65s\">30<\/span>\n    <span class=\"cell k r1 on\" style=\"--at: 4.2s\">A<\/span>\n    <span class=\"cell v r1 on off\" style=\"--at: 4.2s; --out: 4.6s\">100<\/span>\n    <span class=\"cell v r1 on\" style=\"--at: 4.7s\">70<\/span>\n    <span class=\"cell k r2 on\" style=\"--at: 5.2s\">B<\/span><span class=\"cell v r2 on\" style=\"--at: 5.2s\">30<\/span>\n  <\/div>\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <path class=\"strike\" pathLength=\"1\" style=\"--at: 2.65s; --out: 3.3s\" d=\"M 900 702 L 1480 908\" />\n    <path class=\"strike\" pathLength=\"1\" style=\"--at: 2.8s; --out: 3.3s\" d=\"M 900 908 L 1480 702\" />\n  <\/svg>\n  <div id=\"lost\" class=\"in fade out\" style=\"--at: 2.75s; --out: 3.3s\">lost<\/div>\n  <div id=\"replay-cap\" class=\"in fade out\" style=\"--at: 3.1s; --out: 5.6s\">replay<\/div>\n  <div class=\"note event rtok\" style=\"--at: 3.2s\">credit A 100<\/div>\n  <div class=\"note event rtok\" style=\"--at: 3.7s\">debit A 30<\/div>\n  <div class=\"note event rtok\" style=\"--at: 4.2s\">credit B 30<\/div>\n  <div class=\"ring\" style=\"left: 590px; top: 394px; width: 284px; height: 106px; border-radius: 53px; --at: 3.75s\"><\/div>\n  <div class=\"ring\" style=\"left: 590px; top: 394px; width: 284px; height: 106px; border-radius: 53px; --at: 4.25s\"><\/div>\n  <div class=\"ring\" style=\"left: 590px; top: 394px; width: 284px; height: 106px; border-radius: 53px; --at: 4.75s\"><\/div>\n  <div class=\"wdot\" style=\"--at: 3.8s\"><\/div>\n  <div class=\"wdot\" style=\"--at: 4.3s\"><\/div>\n  <div class=\"wdot\" style=\"--at: 4.8s\"><\/div>\n  <div id=\"same\" class=\"in pop out\" style=\"--at: 5.35s; --out: 6.2s\">\n    <svg width=\"44\" height=\"44\" viewBox=\"0 0 24 24\"><path class=\"ok-mark\" d=\"M 4 12.5 L 9.5 18 L 20 6\" /><\/svg>\n    same table\n  <\/div>\n  <div class=\"statement with-line in out\" style=\"--at: 7.0s; --out: 10.4s\">Bounded. <em>A part touches only what it declares.<\/em> <span class=\"tag guarantee\">guarantee<\/span><\/div>\n  <div id=\"db-target\" class=\"in fade out\" style=\"--at: 7.75s; --out: 9.7s\"><\/div>\n  <div id=\"line-flash\"><\/div>\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <path class=\"wire refused reach\" pathLength=\"1\" style=\"--at: 7.4s; --back: 9.7s\" d=\"M 1272 497 L 1059 620\" />\n  <\/svg>\n  <div id=\"stop\" class=\"in pop out\" style=\"--at: 7.98s; --out: 9.65s\">\n    <svg width=\"68\" height=\"68\" viewBox=\"0 0 68 68\">\n      <circle cx=\"34\" cy=\"34\" r=\"29\" fill=\"var(--paper)\" stroke=\"var(--refuse)\" stroke-width=\"7\" />\n      <path d=\"M 13.5 54.5 L 54.5 13.5\" stroke=\"var(--refuse)\" stroke-width=\"7\" stroke-linecap=\"round\" />\n    <\/svg>\n  <\/div>\n  <div id=\"not-declared\" class=\"in fade out\" style=\"--at: 8.1s; --out: 9.65s\">not declared<\/div>\n  <div class=\"statement with-line in out\" style=\"--at: 10.8s; --out: 15.35s\">Verified. <em>Replay a recorded run<br>and get the same events.<\/em> <span class=\"tag guarantee\">guarantee<\/span><\/div>\n  <div id=\"lab-rec\" class=\"label row-label in fade out\" style=\"--at: 11.0s; --out: 15.35s\">recorded<br>run<\/div>\n  <div id=\"lab-rep\" class=\"label row-label in fade out\" style=\"--at: 13.75s; --out: 15.35s\">replay<\/div>\n  <div class=\"tok tok-1\" style=\"--at: 11.15s\"><\/div>\n  <div class=\"tok tok-2\" style=\"--at: 11.75s\"><\/div>\n  <div class=\"tok tok-3\" style=\"--at: 12.35s\"><\/div>\n  <div class=\"tok tok-4\" style=\"--at: 12.95s\"><\/div>\n  <div class=\"note command chip rec c1\" style=\"--at: 11.4s\">transfer_funds<\/div>\n  <div class=\"note event chip rec c2\" style=\"--at: 12.0s\">transfer_rejected<\/div>\n  <div class=\"note command chip rec c3\" style=\"--at: 13.2s\">send_notice<\/div>\n  <div class=\"note command chip rep c1\" style=\"--at: 13.85s\">transfer_funds<\/div>\n  <div class=\"note event chip rep c2\" style=\"--at: 14.15s\">transfer_rejected<\/div>\n  <div class=\"note command chip rep c3\" style=\"--at: 14.45s\">send_notice<\/div>\n  <div class=\"tick c1\" style=\"--at: 14.0s\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\"><path class=\"ok-mark\" d=\"M 4 12.5 L 9.5 18 L 20 6\" /><\/svg><\/div>\n  <div class=\"tick c2\" style=\"--at: 14.3s\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\"><path class=\"ok-mark\" d=\"M 4 12.5 L 9.5 18 L 20 6\" /><\/svg><\/div>\n  <div class=\"tick c3\" style=\"--at: 14.6s\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\"><path class=\"ok-mark\" d=\"M 4 12.5 L 9.5 18 L 20 6\" /><\/svg><\/div>\n<\/div>\n<script>/*STAGE*/<\/script>\n<\/body>\n<\/html>\n"}, {"title": "5 Designed for", "duration": 8200, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Scene 5: what it is designed for<\/title>\n<style>/*THEME*/<\/style>\n<style>\n  /* Scene-local only. Colours, type and motion helpers come from theme.css.\n     No rest-frame element is animated: everything that moves is added after the rest-frame markup. */\n  /* ---- execute_transfer singled out: an outline 8px clear of the card (482,400 272x94) ---- */\n  #outline {\n    left: 470px; top: 388px; width: 296px; height: 118px;\n    border: 4px solid var(--ink); border-radius: 52px;\n  }\n  /* the stem from the outline down to the panel */\n  #stem { left: 616px; top: 504px; width: 4px; height: 34px; background: var(--ink); }\n  /* ---- language marks on the two function cards ---- */\n  .lang {\n    width: 64px; height: 36px;\n    font-family: var(--mono); font-size: 24px; line-height: 32px; text-align: center;\n    color: var(--ink); background: var(--flow);\n    border: 2px solid var(--ink-soft); border-radius: 18px;\n    transform-origin: center;\n  }\n  .lang.rs { color: var(--paper); background: var(--ink); border-color: var(--ink); }\n  #lang-proc-py, #lang-proc-rs { left: 676px;  top: 381px; }\n  #lang-pol-py                 { left: 1360px; top: 381px; }\n  #lang-proc-py {\n    animation: pop var(--quick) var(--ease) both, flip-out 0.15s ease-in forwards;\n    animation-delay: 0.8s, 3.85s;\n  }\n  #lang-proc-rs {\n    animation: flip-in 0.15s ease-out both, fade-out var(--quick) ease-in forwards;\n    animation-delay: 4.0s, 7.2s;\n  }\n  @keyframes flip-out { from { transform: scaleY(1); } to { transform: scaleY(0); } }\n  @keyframes flip-in  { from { transform: scaleY(0); } to { transform: scaleY(1); } }\n  /* ---- the panel: a frame that grows out from under the card, then its content ---- */\n  #frame {\n    left: 140px; top: 536px; width: 1640px; height: 482px;\n    background: var(--flow); border: 2px solid var(--ink-soft); border-radius: 10px;\n    animation: frame-open 0.7s var(--ease-in-out) both, frame-close 0.6s var(--ease-in-out) forwards;\n    animation-delay: 1.0s, 6.65s;\n  }\n  @keyframes frame-open {\n    0%   { left: 472px; top: 508px; width: 296px; height: 6px; opacity: 0; }\n    12%  { opacity: 1; }\n    100% { left: 140px; top: 536px; width: 1640px; height: 482px; opacity: 1; }\n  }\n  @keyframes frame-close {\n    0%   { left: 140px; top: 536px; width: 1640px; height: 482px; opacity: 1; }\n    88%  { left: 472px; top: 508px; width: 296px; height: 6px; opacity: 1; }\n    100% { left: 472px; top: 508px; width: 296px; height: 6px; opacity: 0; }\n  }\n  #pc { left: 140px; top: 536px; width: 1640px; height: 482px; }\n  #pc > * { position: absolute; }\n  /* the pinned declaration: never moves, never changes */\n  #decl {\n    left: 2px; top: 2px; width: 1636px; height: 82px;\n    padding: 24px 0 0 26px;\n    background: var(--paper-deep);\n    border-bottom: 2px solid var(--rule);\n    border-radius: 8px 8px 0 0;\n    font-family: var(--sans); font-size: 24px; color: var(--ink-soft);\n    white-space: nowrap;\n  }\n  #decl .kw { display: inline-block; margin-right: 10px; vertical-align: middle; }\n  #decl .grp { display: inline-block; margin-right: 40px; vertical-align: middle; }\n  .chip {\n    display: inline-block; vertical-align: middle;\n    padding: 3px 12px; margin-right: 8px;\n    font-family: var(--mono); font-size: 24px; line-height: 34px; color: var(--ink);\n    background: var(--c); border-radius: 5px;\n  }\n  .chip.query { color: #fff; }\n  /* the legend on the panel's top edge: what makes the declaration fixed */\n  #legend {\n    left: 22px; top: -20px; height: 40px;\n    padding: 5px 16px 0 12px;\n    background: var(--flow); border: 2px solid var(--ink); border-radius: 4px;\n    white-space: nowrap;\n  }\n  #legend svg { width: 26px; height: 26px; vertical-align: -5px; margin-right: 8px; }\n  #legend .label { color: var(--ink); font-size: 22px; }\n  #legend svg path { fill: var(--ink); }\n  #legend svg line { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }\n  /* the body: the only part that is replaced */\n  #body { left: 2px; top: 86px; width: 1636px; height: 394px; overflow: hidden; border-radius: 0 0 8px 8px; }\n  .impl { position: absolute; left: 0; top: 0; width: 1636px; height: 394px; padding: 14px 26px 0; }\n  .impl .file {\n    display: inline-block; height: 36px; padding: 1px 14px 0;\n    font-family: var(--mono); font-size: 22px; line-height: 32px; color: var(--ink);\n    border: 2px solid var(--rule); border-radius: 5px; background: var(--paper);\n  }\n  .impl pre {\n    margin-top: 12px;\n    font-family: var(--mono); font-size: 24px; line-height: 32px; color: var(--ink);\n  }\n  .impl .k { color: var(--ink-soft); }\n  /* the names the declaration gives, where the body uses them */\n  .u-q { box-shadow: inset 0 -4px 0 var(--query); }\n  .u-e { box-shadow: inset 0 -4px 0 var(--event); }\n  #py { animation: body-out 0.35s ease-in forwards; animation-delay: 3.8s; }\n  #rs { animation: body-in 0.45s var(--ease) both;  animation-delay: 4.05s; }\n  @keyframes body-out { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: -70px 0; } }\n  @keyframes body-in  { from { opacity: 0; translate: 70px 0; } to { opacity: 1; translate: 0 0; } }\n  /* ---- the caption, right of the query card, above the loop ---- */\n  #cap { left: 824px; top: 276px; font-family: var(--display); font-size: 42px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }\n<\/style>\n<\/head>\n<body data-duration=\"8200\">\n<div class=\"stage\">\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <defs>\n      <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\" />\n      <\/marker>\n    <\/defs>\n    <path class=\"wire hop hop-1\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop hop-2\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop hop-3\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop hop-4\" marker-end=\"url(#ah)\" />\n    <path class=\"wire ask\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\" d=\"M 618 362 L 618 394\" />\n  <\/svg>\n  <div class=\"note query loop-q\"><span class=\"kind\">query<\/span>get_balance<\/div>\n  <div class=\"note command loop-1\"><span class=\"kind\">command<\/span>transfer_funds<\/div>\n  <div class=\"fn procedure loop-2\"><span class=\"kind\">procedure<\/span>execute_transfer<\/div>\n  <div class=\"note event loop-3\"><span class=\"kind\">event<\/span>transfer_rejected<\/div>\n  <div class=\"fn policy loop-4\"><span class=\"kind\">policy<\/span>notify_on_rejection<\/div>\n  <div class=\"note command loop-5\"><span class=\"kind\">command<\/span>send_notice<\/div>\n  <div class=\"line\"><\/div>\n  <div class=\"label line-label above\">the domain<\/div>\n  <div class=\"label line-label below\">the infrastructure<br>between the parts<\/div>\n  <div class=\"line-name\">DIZZY<\/div>\n  <div class=\"infra infra-queue-a\">queue<\/div>\n  <div class=\"infra infra-log\">event log<\/div>\n  <div class=\"infra infra-queue-b\">queue<\/div>\n  <div class=\"infra infra-db\">database<\/div>\n  <div class=\"infra infra-run\">runtime: one process<\/div>\n  <div class=\"statement with-line in out\" style=\"--at: 0.3s; --out: 7.2s\">Changeable. <em>Rewrite one part; the rest stays.<\/em> <span class=\"tag aim\">designed for<\/span><\/div>\n  <div id=\"stem\" class=\"in fade out\" style=\"--at: 1.2s; --out: 6.9s\"><\/div>\n  <div id=\"outline\" class=\"in fade out\" style=\"--at: 0.55s; --out: 7.2s\"><\/div>\n  <div id=\"lang-proc-py\" class=\"lang\">py<\/div>\n  <div id=\"lang-proc-rs\" class=\"lang rs\">rs<\/div>\n  <div id=\"lang-pol-py\" class=\"lang in pop out\" style=\"--at: 0.95s; --out: 7.2s\">py<\/div>\n  <div id=\"frame\"><\/div>\n  <div id=\"pc\" class=\"in fade out\" style=\"--at: 1.65s; --out: 6.25s\">\n    <div id=\"decl\"><span class=\"grp\"><span class=\"kw\">takes<\/span><span class=\"chip command\">transfer_funds<\/span><\/span><span class=\"grp\"><span class=\"kw\">asks<\/span><span class=\"chip query\">get_balance<\/span><\/span><span class=\"grp\"><span class=\"kw\">emits<\/span><span class=\"chip event\">funds_debited<\/span><span class=\"chip event\">funds_credited<\/span><span class=\"chip event\">transfer_rejected<\/span><\/span><\/div>\n    <div id=\"legend\"><svg viewBox=\"0 0 26 26\"><path d=\"M 8 2 L 18 2 L 16.5 9 L 20.5 13.5 L 20.5 15.5 L 5.5 15.5 L 5.5 13.5 L 9.5 9 Z\" /><line x1=\"13\" y1=\"15.5\" x2=\"13\" y2=\"24\" /><\/svg><span class=\"label\">declared in the feat<\/span><\/div>\n    <div id=\"body\">\n      <div id=\"py\" class=\"impl\"><span class=\"file\">execute_transfer.py<\/span>\n<pre><span class=\"k\">def<\/span> execute_transfer(context: execute_transfer_context, command: TransferFunds) -&gt; None:\n    balance = context.query.<span class=\"u-q\">get_balance<\/span>(GetBalanceInput(account=command.payer))\n    <span class=\"k\">if<\/span> balance.amount &lt; command.amount:\n        context.emit.<span class=\"u-e\">transfer_rejected<\/span>(TransferRejected(payer=command.payer, amount=command.amount))\n    <span class=\"k\">else<\/span>:\n        context.emit.<span class=\"u-e\">funds_debited<\/span>(FundsDebited(payer=command.payer, amount=command.amount))\n        context.emit.<span class=\"u-e\">funds_credited<\/span>(FundsCredited(payee=command.payee, amount=command.amount))<\/pre><\/div>\n      <div id=\"rs\" class=\"impl\"><span class=\"file\">execute_transfer.rs<\/span>\n<pre><span class=\"k\">pub fn<\/span> execute_transfer(context: &amp;execute_transfer_context, command: TransferFunds) -&gt; Result&lt;(), Error&gt; {\n    <span class=\"k\">let<\/span> balance = (context.query.<span class=\"u-q\">get_balance<\/span>)(GetBalanceInput { account: command.payer.clone() })?;\n    <span class=\"k\">if<\/span> balance.amount &lt; command.amount {\n        (context.emit.<span class=\"u-e\">transfer_rejected<\/span>)(TransferRejected { payer: command.payer, amount: command.amount });\n    } <span class=\"k\">else<\/span> {\n        (context.emit.<span class=\"u-e\">funds_debited<\/span>)(FundsDebited { payer: command.payer, amount: command.amount });\n        (context.emit.<span class=\"u-e\">funds_credited<\/span>)(FundsCredited { payee: command.payee, amount: command.amount });\n    }\n    Ok(())\n}<\/pre><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"cap\" class=\"in out\" style=\"--at: 4.1s; --out: 6.25s\">90% Python. The critical step in Rust.<\/div>\n<\/div>\n<script>/*STAGE*/<\/script>\n<\/body>\n<\/html>\n"}, {"title": "6 System and close", "duration": 21200, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Scene 6: the system and the close<\/title>\n<style>/*THEME*/<\/style>\n<style>\n  /* Scene 6 timing (seconds from the start of the scene)\n     0.0 - 0.5   the rest frame, still (pixel-identical to scenes/00_rest_frame.html)\n     0.5         hand-over to the moving copy (see below); the line labels fade\n     0.5 - 2.5   beat 17, the camera pulls back: the loop (in .zoom) shrinks to one feature at\n                 (420, 426); the system map (.map) comes in around it with the same motion, cut\n                 off at the line; the line moves down to y 700; the infrastructure re-lays out\n                 into wide rows (runtime, database, event log, then the queues merge)\n     2.4 - 6.2   statement 17\n     2.5 - 3.1   the system's hops appear; the new infrastructure boxes take over from the old\n     6.6 - 11.6  beat 18, statement 18; nothing above the line moves\n     6.9         what each box runs on today appears\n     7.4 / 8.3 / 9.2 / 10.1   swaps: queue, database, runtime, event log\n     11.6 - 12.1 the system and the infrastructure clear; 12.0 - 13.0 the line returns to y 620\n     12.9 - 15.3 beat 19: the five arrive, left to right\n     16.4        the five clear\n     16.8 / 17.3 beat 20: DIZZY, then the c const blob = (data, type) => URL.createObjectURL(new Blob([data], { type }));
const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const face = '@font-face { font-family: "Ubuntu Sans"; src: url("' + blob(bytes(FONTS.sans), 'font/woff2') + '") format("woff2"); font-weight: 100 800; font-stretch: 75% 100%; font-display: block; }\n'
           + '@font-face { font-family: "Ubuntu Sans Mono"; src: url("' + blob(bytes(FONTS.mono), 'font/woff2') + '") format("woff2"); font-weight: 100 700; font-display: block; }\n';
for (const s of SCENES) {
  s.url = blob(s.html.replace('/*THEME*/', () => face + THEME).replace('/*STAGE*/', () => STAGE), 'text/html');
}

// Plays the scenes in order. Space plays and pauses; click a segment to seek. ?bare hides the bar.
  const S = SCENES;
  const f = document.getElementById('f');
  const bar = document.getElementById('bar');
  if (new URLSearchParams(location.search).has('bare')) document.body.classList.add('bare');

  let i = -1, playing = true, pending = 0;
  const fills = S.map((s) => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.flex = s.duration;
    seg.innerHTML = '<i></i><span></span>';
    seg.querySelector('span').textContent = s.title;
    bar.appendChild(seg);
    seg.addEventListener('click', (e) => {
      const r = seg.getBoundingClientRect();
      go(S.indexOf(s), s.duration * (e.clientX - r.left) / r.width);
    });
    return seg.querySelector('i');
  });

  const post = (m) => f.contentWindow.postMessage(m, '*');

  function paint(t) {
    fills.forEach((el, n) => { el.style.width = n < i ? '100%' : n > i ? '0' : (100 * t / S[i].duration) + '%'; });
  }

  function go(n, t = 0) {
    pending = t;
    if (n === i) { post({ type: 'seek', t }); paint(t); return; }
    i = n;
    f.src = S[n].url;
    paint(t);
  }

  addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'ready') { post({ type: 'seek', t: pending }); if (playing) post({ type: 'play' }); }
    if (m.type === 'time') paint(m.t);
    if (m.type === 'ended') { if (i + 1 < S.length) go(i + 1); else { playing = false; paint(S[i].duration); } }
  });

  addEventListener('keydown', (e) => {
    if (e.key !== ' ') return;
    e.preventDefault();
    playing = !playing;
    post({ type: playing ? 'play' : 'pause' });
  });

  go(0);
</script>
