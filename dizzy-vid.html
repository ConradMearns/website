const THEME = "/* DIZZY explainer: shared theme. Scenes link this file and add their own <style>. */\n\n:root {\n  /* surface: the light theme of `dizzy canvas` (canvas/theme.yaml on the canvas-edit branch) */\n  --paper: #f6f7f9;\n  --paper-deep: #e9ecf0;\n  --flow: #ffffff;\n  --ink: #18202b;\n  --ink-soft: #5d6876;\n  --ink-faint: #a9b1bc;\n  --rule: #dde2e8;\n  --accent: #0e6a87;\n\n  /* components: the canvas `kinds` colours, exactly. Do not adjust these. */\n  --command: #4ab6d9;\n  --procedure: #f39a4f;\n  --event: #abcc51;\n  --policy: #eb6092;\n  --element: #5b6ee1;\n  --projection: #2bb3a0;\n  --model: #f9d342;\n  --query: #8a6fd1;\n  --querier: #8a6fd1;   /* the canvas has no querier kind; it shares the query colour */\n\n  /* edges: the canvas `edges` colours */\n  --edge-reactivity: #8a94a6;\n  --edge-data: #5b8f88;\n  --edge-return: #c2410c;\n\n  /* infrastructure, below the line */\n  --infra: #4b586b;\n  --infra-fill: #e3e7ec;\n\n  /* signals */\n  --ok: #1f8a5b;\n  --refuse: #c8321f;\n  --dizzy: #18202b;\n\n  /* type */\n  --display: \"Ubuntu Sans\", \"Ubuntu\", \"Noto Sans\", sans-serif;\n  --sans: \"Ubuntu Sans\", \"Ubuntu\", \"Noto Sans\", sans-serif;\n  --mono: \"Ubuntu Sans Mono\", \"Ubuntu Mono\", \"DejaVu Sans Mono\", monospace;\n\n  /* motion */\n  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);\n  --ease-in-out: cubic-bezier(0.6, 0, 0.3, 1);\n  --quick: 0.4s;\n  --move: 0.8s;\n  --slow: 1.4s;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body {\n  width: 100%;\n  height: 100%;\n  overflow: hidden;\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--sans);\n}\n\n/* The stage is always 1920x1080. stage.js scales it to the window. */\n.stage {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  width: 1920px;\n  height: 1080px;\n  transform: translate(-50%, -50%);\n  transform-origin: center;\n  background: var(--paper);\n  overflow: hidden;\n}\n\n/* Everything on the stage is absolutely placed. */\n.stage > *, .abs { position: absolute; }\n\n/* ---- statements: the one line of text each beat carries ---- */\n\n.statement {\n  left: 140px;\n  top: 96px;\n  width: 1640px;\n  font-family: var(--display);\n  font-size: 62px;\n  line-height: 1.2;\n  font-weight: 600;\n  letter-spacing: -0.02em;\n}\n.statement.small { font-size: 46px; }\n.statement.center { text-align: center; }\n.statement em { font-style: normal; color: var(--ink-soft); }\n\n.caption {\n  font-family: var(--sans);\n  font-size: 30px;\n  color: var(--ink-soft);\n}\n\n.label {\n  font-family: var(--sans);\n  font-size: 22px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-soft);\n}\n\n/* ---- components ---- */\n\n/* data (command, event, query): a square-cornered note */\n.note {\n  padding: 18px 22px;\n  min-width: 250px;\n  font-family: var(--mono);\n  font-size: 26px;\n  color: var(--ink);\n  background: var(--c, var(--paper-deep));\n  border-radius: 7px;\n  box-shadow: 0 1px 0 rgba(24, 32, 43, 0.12), 0 12px 22px -16px rgba(24, 32, 43, 0.45);\n}\n/* functions (procedure, policy, projection, querier): a capsule, in the same solid colour, with a darker edge */\n.fn {\n  padding: 16px 28px;\n  min-width: 250px;\n  font-family: var(--mono);\n  font-size: 26px;\n  color: var(--ink);\n  background: var(--c, var(--paper-deep));\n  border: 3px solid color-mix(in srgb, var(--c, var(--ink-faint)) 78%, var(--ink));\n  border-radius: 40px;\n}\n/* a model: a database */\n.db {\n  padding: 30px 26px 18px;\n  min-width: 230px;\n  font-family: var(--mono);\n  font-size: 26px;\n  text-align: center;\n  background: var(--model);\n  border: 3px solid color-mix(in srgb, var(--model) 78%, var(--ink));\n  border-radius: 50% / 22px;\n}\n.note .kind, .fn .kind, .db .kind {\n  display: block;\n  margin-bottom: 4px;\n  font-family: var(--sans);\n  font-size: 16px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  opacity: 0.6;\n}\n\n.command    { --c: var(--command); }\n.event      { --c: var(--event); }\n.query      { --c: var(--query); }\n.note.query, .fn.querier { color: #fff; }             /* white reads better on this one, as on the canvas */\n.element    { --c: var(--element); }\n.note.element { color: #fff; }\n.procedure  { --c: var(--procedure); }\n.policy     { --c: var(--policy); }\n.projection { --c: var(--projection); }\n.querier    { --c: var(--querier); }\n\n/* infrastructure boxes, below the line: plain and grey on purpose */\n.infra {\n  padding: 18px 26px;\n  min-width: 220px;\n  font-family: var(--mono);\n  font-size: 24px;\n  text-align: center;\n  color: var(--infra);\n  background: var(--infra-fill);\n  border: 2px solid var(--infra);\n  border-radius: 6px;\n}\n\n/* ---- the line ---- */\n\n.line {\n  left: 0;\n  top: 620px;          /* every scene that shows the line puts it here */\n  width: 1920px;\n  height: 4px;\n  background: var(--dizzy);\n  transform-origin: left center;\n}\n.line-label { left: 140px; }\n.line-label.above { top: 572px; }\n.line-label.below { top: 642px; width: 270px; font-size: 19px; line-height: 1.35; }\n\n/* ---- code ---- */\n\n.code {\n  padding: 28px 34px;\n  font-family: var(--mono);\n  font-size: 26px;\n  line-height: 1.5;\n  white-space: pre;\n  color: var(--ink);\n  background: var(--flow);\n  border: 2px solid var(--rule);\n  border-radius: 8px;\n}\n.code .file {\n  display: block;\n  margin: -6px 0 14px;\n  font-family: var(--sans);\n  font-size: 20px;\n  color: var(--ink-soft);\n}\n.code .k { color: var(--ink-soft); }\n\n/* ---- claim tags ---- */\n\n.tag {\n  padding: 8px 18px;\n  font-family: var(--sans);\n  font-size: 20px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  border-radius: 4px;\n}\n.tag.guarantee { color: var(--paper); background: var(--ink); border: 2px solid var(--ink); }\n.tag.aim { color: var(--ink); background: transparent; border: 2px dashed var(--ink); }\n\n/* ---- arrows (inline SVG) ---- */\n\nsvg.wires { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }\n.wire { fill: none; stroke: var(--edge-reactivity); stroke-width: 3; stroke-linecap: round; }   /* command, event: a message */\n.wire.data { stroke: var(--edge-data); }                    /* event to projection to model */\n.wire.ask { stroke: var(--edge-data); stroke-dasharray: 3 11; }   /* query: call and response */\n.wire.refused { stroke: var(--refuse); }\n/* to draw a wire on: give the path pathLength=\"1\" and add class \"draw\" */\n.wire.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--move) var(--ease-in-out) both; animation-delay: var(--at, 0s); }\n\n/* ---- motion ----\n   All motion is CSS animation, so stage.js can scrub it.\n   Set when it happens with --at, and when it leaves with --out:\n     <div class=\"statement in out\" style=\"--at: 0.5s; --out: 5s\">...<\/div>\n*/\n\n.in       { animation: rise var(--move) var(--ease) both; animation-delay: var(--at, 0s); }\n.in.fade  { animation-name: fade-in; }\n.in.pop   { animation-name: pop; animation-duration: var(--quick); }\n.in.grow  { animation-name: grow-x; }      /* for .line */\n.out      { animation: fade-out var(--quick) ease-in forwards; animation-delay: var(--out, 0s); }\n.in.out {\n  animation: rise var(--move) var(--ease) both, fade-out var(--quick) ease-in forwards;\n  animation-delay: var(--at, 0s), var(--out, 0s);\n}\n.in.fade.out { animation-name: fade-in, fade-out; }\n.in.pop.out  { animation-name: pop, fade-out; animation-duration: var(--quick), var(--quick); }\n\n@keyframes rise     { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: 0 0; } }\n@keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }\n@keyframes fade-out { to { opacity: 0; } }\n@keyframes pop      { from { opacity: 0; scale: 0.86; } to { opacity: 1; scale: 1; } }\n@keyframes grow-x   { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n@keyframes draw     { to { stroke-dashoffset: 0; } }\n\n/* ---- the resting frame ----\n   The fixed layout that scenes 3 to 6 share, so that cuts between them are invisible.\n   See scenes/00_rest_frame.html (the rest frame) and scenes/00_bare_loop.html (the same loop\n   before the line exists). Do not move these. */\n\n:root {\n  /* The four hops between the cards. \"flat\" is a straight arrow; \"dip\" goes down through the line,\n     into the infrastructure box that carries it, and back up. Same path structure, so `d` animates.\n     Also usable as offset-path for a token (on an element at left: 0; top: 0 of the stage). */\n  --hop1-flat: path(\"M 412 447 L 420 447 Q 432 447 432 447 L 432 447 L 462 447 L 462 447 Q 462 447 474 447 L 475 447\");\n  --hop1-dip:  path(\"M 412 447 L 420 447 Q 432 447 432 459 L 432 742 L 462 742 L 462 459 Q 462 447 474 447 L 475 447\");\n  --hop2-flat: path(\"M 754 447 L 762 447 Q 774 447 774 447 L 774 447 L 804 447 L 804 447 Q 804 447 816 447 L 817 447\");\n  --hop2-dip:  path(\"M 754 447 L 762 447 Q 774 447 774 459 L 774 742 L 804 742 L 804 459 Q 804 447 816 447 L 817 447\");\n  --hop3-flat: path(\"M 1096 447 L 1104 447 Q 1116 447 1116 447 L 1116 447 L 1146 447 L 1146 447 Q 1146 447 1158 447 L 1159 447\");\n  --hop3-dip:  path(\"M 1096 447 L 1104 447 Q 1116 447 1116 459 L 1116 742 L 1146 742 L 1146 459 Q 1146 447 1158 447 L 1159 447\");\n  --hop4-flat: path(\"M 1438 447 L 1446 447 Q 1458 447 1458 447 L 1458 447 L 1488 447 L 1488 447 Q 1488 447 1500 447 L 1501 447\");\n  --hop4-dip:  path(\"M 1438 447 L 1446 447 Q 1458 447 1458 459 L 1458 742 L 1488 742 L 1488 459 Q 1488 447 1500 447 L 1501 447\");\n}\n\n.loop-1, .loop-2, .loop-3, .loop-4, .loop-5, .loop-q { width: 272px; min-width: 0; font-size: 22px; padding-left: 18px; padding-right: 6px; }\n.loop-1, .loop-2, .loop-3, .loop-4, .loop-5 { top: 400px; height: 94px; }\n.loop-1 { left: 140px; }\n.loop-2 { left: 482px; }\n.loop-3 { left: 824px; }\n.loop-4 { left: 1166px; }\n.loop-5 { left: 1508px; }\n.loop-q { left: 482px; top: 262px; height: 94px; }   /* the query card above the procedure */\n\n/* the hops: <path class=\"wire hop hop-1\" marker-end=\"url(#ah)\" /> with no d attribute */\n.hop-1 { --flat: var(--hop1-flat); --dip: var(--hop1-dip); }\n.hop-2 { --flat: var(--hop2-flat); --dip: var(--hop2-dip); }\n.hop-3 { --flat: var(--hop3-flat); --dip: var(--hop3-dip); }\n.hop-4 { --flat: var(--hop4-flat); --dip: var(--hop4-dip); }\n.hop { d: var(--dip); }                       /* the rest frame: every hop crosses the line */\n.hop.flat { d: var(--flat); }                 /* the bare loop: before the line exists */\n.hop.sag { d: var(--flat); animation: sag var(--slow) var(--ease-in-out) forwards; animation-delay: var(--at, 0s); }\n.hop.lift { animation: lift var(--slow) var(--ease-in-out) forwards; animation-delay: var(--at, 0s); }\n@keyframes sag  { from { d: var(--flat); } to { d: var(--dip); } }\n@keyframes lift { from { d: var(--dip); } to { d: var(--flat); } }\n\n/* infrastructure, each box under the hop it carries */\n.infra-queue-a, .infra-log, .infra-queue-b { top: 716px; height: 76px; min-width: 0; padding-top: 22px; }\n.infra-queue-a { left: 347px;  width: 200px; }    /* carries command -> procedure */\n.infra-log     { left: 704px;  width: 510px; }    /* carries procedure -> event -> policy */\n.infra-queue-b { left: 1373px; width: 200px; }    /* carries policy -> command */\n.infra-db      { left: 508px;  top: 842px; width: 220px; height: 76px; min-width: 0; padding-top: 22px; }\n.infra-run     { left: 140px;  top: 958px; width: 1640px; height: 58px; min-width: 0; padding-top: 13px; }\n\n.line-name {            /* the word DIZZY on the line, at the right */\n  left: 1588px; top: 594px; width: 192px; height: 56px; padding-top: 7px; text-align: center;\n  font-family: var(--sans); font-size: 34px; font-weight: 700; letter-spacing: 0.2em; text-indent: 0.2em;\n  color: var(--paper); background: var(--dizzy); border-radius: 4px;\n}\n.statement.with-line { top: 72px; }   /* where the statement sits when the line is on screen */\n.statement .tag { display: inline-block; vertical-align: middle; margin-left: 18px; position: relative; top: -6px; letter-spacing: 0.12em; }\n\n/* the system box of scenes 1 and 2: see scenes/00_system_box.html */\n.system { left: 1100px; top: 420px; width: 400px; height: 400px; border: 3px solid var(--ink); background: var(--flow); border-radius: 28px; }\n.tangle path { fill: none; stroke: var(--ink-soft); stroke-width: 3; stroke-linecap: round; }\n";
const STAGE = "// DIZZY explainer: the scene clock.\n//\n// A scene is one HTML file with <body data-duration=\"ms\"> and a .stage of 1920x1080.\n// All motion in a scene is CSS animation (or Web Animations). This script pauses every\n// animation and drives them all from one clock, so a scene can be paused, scrubbed, and\n// captured frame by frame. Nothing in a scene may use setTimeout, setInterval or\n// requestAnimationFrame for motion.\n//\n// Standalone:  open the scene file. Space plays and pauses, arrows step 0.5s, click the bar to seek.\n//              ?t=3000 opens paused at 3s. ?bare hides the bar.\n// Embedded:    index.html loads the scene in an iframe and sends {type: play | pause | seek, t}.\n// Capture:     window.__seek(ms) sets the clock; window.__duration is the length.\n\n(function () {\n  const W = 1920, H = 1080;\n  const stage = document.querySelector('.stage');\n  const duration = Number(document.body.dataset.duration || 8000);\n  const params = new URLSearchParams(location.search);\n  const embedded = window.parent !== window;\n\n  function fit() {\n    const s = Math.min(innerWidth / W, innerHeight / H);\n    stage.style.transform = `translate(-50%, -50%) scale(${s})`;\n  }\n  addEventListener('resize', fit);\n  fit();\n\n  let t = Number(params.get('t') || 0);\n  let playing = !embedded && !params.has('t');\n  let last = null;\n  let bar = null, fill = null, clock = null;\n\n  // Keep every animation ever seen: one that has finished with fill `backwards` or `none`\n  // drops out of document.getAnimations(), and would otherwise never be rewound on a seek back.\n  const known = new Set();\n\n  function apply() {\n    for (const a of document.getAnimations()) known.add(a);\n    for (const a of known) {\n      if (a.playState !== 'paused') a.pause();\n      a.currentTime = t;\n    }\n    if (fill) fill.style.width = (100 * t / duration) + '%';\n    if (clock) clock.textContent = (t / 1000).toFixed(1) + ' / ' + (duration / 1000).toFixed(1) + 's';\n  }\n\n  function seek(ms) {\n    t = Math.max(0, Math.min(duration, ms));\n    apply();\n  }\n\n  function frame(now) {\n    if (playing) {\n      if (last !== null) t += now - last;\n      last = now;\n      if (t >= duration) {\n        t = duration;\n        playing = false;\n        last = null;\n        apply();\n        if (embedded) parent.postMessage({ type: 'ended' }, '*');\n      } else {\n        apply();\n        if (embedded) parent.postMessage({ type: 'time', t }, '*');\n      }\n    } else {\n      last = null;\n    }\n    requestAnimationFrame(frame);\n  }\n\n  window.__seek = seek;\n  window.__duration = duration;\n\n  addEventListener('message', (e) => {\n    const m = e.data || {};\n    if (m.type === 'play') playing = true;\n    if (m.type === 'pause') playing = false;\n    if (m.type === 'seek') seek(m.t || 0);\n  });\n\n  if (!embedded && !params.has('bare')) {\n    bar = document.createElement('div');\n    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:22px;background:rgba(24,32,43,.12);cursor:pointer;z-index:99';\n    fill = document.createElement('div');\n    fill.style.cssText = 'height:100%;width:0;background:rgba(24,32,43,.55)';\n    clock = document.createElement('div');\n    clock.style.cssText = 'position:fixed;right:10px;bottom:28px;font:13px monospace;color:#5d6876;z-index:99';\n    bar.appendChild(fill);\n    document.body.append(bar, clock);\n    bar.addEventListener('click', (e) => seek(duration * e.clientX / innerWidth));\n    addEventListener('keydown', (e) => {\n      if (e.key === ' ') { if (!playing && t >= duration) t = 0; playing = !playing; e.preventDefault(); }\n      if (e.key === 'ArrowRight') { playing = false; seek(t + 500); }\n      if (e.key === 'ArrowLeft') { playing = false; seek(t - 500); }\n      if (e.key === '0' || e.key === 'Home') seek(0);\n    });\n  }\n\n  // Wait for fonts so text measures the same on every run, then start the clock.\n  (document.fonts ? document.fonts.ready : P const SCENES = [{"title": "1 The problem", "duration": 20800, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>1. The problem<\/title>\n<style>/*THEME*/<\/style>\n<style>\n  /* Scene 1: the problem (storyboard v3). Lehman's three kinds of program, drawn the same way:\n     a box with lines inside. Beats 1 to 6, one continuous shot. Ends on the system box\n     (scenes/00_system_box.html).\n     The E-type box IS the reference .system, and its lines ARE the nine reference .tangle paths.\n     Every animation on .system, .tangle and its paths has fill `backwards` and is finished by 16.8s,\n     so nothing is applied to them at the end (fill `none` or a held value renders differently).\n     Animations of the same property are listed latest-ending first, so that the one currently\n     running (or the next one due) is the one that applies.\n     Row layout (beats 1 to 4): three 300px boxes, centres x = 400, 890, 1380, y = 600.\n     The E box is the 400px reference box at scale 0.75, moved 80px right and 20px up. */\n  /* ---------------- E: the system box ---------------- */\n  .system {\n    animation:\n      def5 0.4s  var(--ease-in-out) 16.35s backwards,\n      def4 0.45s var(--ease-in-out) 15.9s backwards,\n      def3 0.5s  var(--ease-in-out) 15.35s backwards,\n      def2 0.6s  var(--ease-in-out) 14.55s backwards,\n      def1 0.8s  var(--ease-in-out) 12.35s backwards,\n      e-move 0.9s var(--ease-in-out) 13.1s backwards,\n      e-dim 7s linear 3.5s backwards,\n      sys-in var(--move) var(--ease) 1.1s backwards;\n  }\n  .tangle {\n    transform-origin: 1300px 620px;\n    animation:\n      def5 0.4s  var(--ease-in-out) 16.35s backwards,\n      def4 0.45s var(--ease-in-out) 15.9s backwards,\n      def3 0.5s  var(--ease-in-out) 15.35s backwards,\n      def2 0.6s  var(--ease-in-out) 14.55s backwards,\n      def1 0.8s  var(--ease-in-out) 12.35s backwards,\n      e-move 0.9s var(--ease-in-out) 13.1s backwards;\n  }\n  /* in the row: three-quarter size, third in line; beat 5 brings it to the reference position */\n  @keyframes e-move { from { translate: 80px -20px; scale: 0.75; } to { translate: 0 0; scale: 1; } }\n  @keyframes sys-in { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }\n  /* dimmed while S (beat 2) and P (beat 3) are described */\n  @keyframes e-dim { 0% { opacity: 1; } 7.14% { opacity: 0.45; } 92.86% { opacity: 0.45; } 100% { opacity: 1; } }\n  /* each change squashes the box a little harder than the last */\n  @keyframes def1 { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.035, 0.965); } 65% { transform: scale(0.982, 1.018); } }\n  @keyframes def2 { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.05, 0.95); }   65% { transform: scale(0.975, 1.025); } }\n  @keyframes def3 { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.065, 0.935); } 65% { transform: scale(0.967, 1.033); } }\n  @keyframes def4 { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.08, 0.92); }   65% { transform: scale(0.96, 1.04); } }\n  @keyframes def5 { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.095, 0.905); } 65% { transform: scale(0.952, 1.048); } }\n  /* the nine reference paths, drawn one pass at a time (lengths measured, rounded up) */\n  .tangle path { animation: trace var(--d) var(--ease-in-out) var(--at) backwards; }\n  @keyframes trace {\n    from { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }\n    to   { stroke-dasharray: var(--len); stroke-dashoffset: 0; }\n  }\n  .tangle path:nth-child(1) { --len: 458; --at: 12.35s; --d: 0.8s; }\n  .tangle path:nth-child(2) { --len: 380; --at: 14.55s; --d: 0.55s; }\n  .tangle path:nth-child(3) { --len: 407; --at: 14.63s; --d: 0.55s; }\n  .tangle path:nth-child(4) { --len: 401; --at: 15.35s; --d: 0.45s; }\n  .tangle path:nth-child(5) { --len: 417; --at: 15.42s; --d: 0.45s; }\n  .tangle path:nth-child(6) { --len: 410; --at: 15.9s;  --d: 0.4s; }\n  .tangle path:nth-child(7) { --len: 418; --at: 15.96s; --d: 0.4s; }\n  .tangle path:nth-child(8) { --len: 354; --at: 16.35s; --d: 0.35s; }\n  .tangle path:nth-child(9) { --len: 326; --at: 16.4s;  --d: 0.35s; }\n  /* ---------------- the shared grammar: a box with lines inside ---------------- */\n  /* the same box as .system at three-quarter size: 3px border and 28px radius become 2.25 and 21 */\n  .kbox { width: 300px; height: 300px; border: 2.25px solid var(--ink); background: var(--flow); border-radius: 21px;\n          animation: sys-in var(--move) var(--ease) var(--at) both; }\n  .klines { width: 300px; height: 300px; overflow: visible; }\n  .khead { width: 300px; text-align: center; font-family: var(--sans); font-size: 34px; font-weight: 600; color: var(--ink);\n           animation: fade-in var(--move) var(--ease) var(--at) both; }\n  .kex { width: 360px; text-align: center; font-family: var(--sans); font-size: 30px; line-height: 1.15; color: var(--ink-soft);\n         animation: fade-in var(--move) var(--ease) var(--at) both; }\n  .kex code { font-family: var(--mono); color: var(--ink); }\n  /* a kind's group: full stage, so children keep stage coordinates; beat 5 shrinks it to the left */\n  .kind { left: 0; top: 0; width: 1920px; height: 1080px; }\n  .kind > * { position: absolute; }\n  #S { transform-origin: 400px 600px;\n       animation: s-dim 0.5s ease 6.7s both, back-s 0.9s var(--ease-in-out) 13.1s both, fade-out 0.4s ease-in 19.2s forwards; }\n  #P { transform-origin: 890px 600px;\n       animation: p-dim 7s linear 3.5s both, back-p 0.9s var(--ease-in-out) 13.1s both, fade-out 0.4s ease-in 19.2s forwards; }\n  @keyframes s-dim { to { opacity: 0.45; } }\n  @keyframes p-dim { 0% { opacity: 1; } 7.14% { opacity: 0.45; } 45.71% { opacity: 0.45; } 52.86% { opacity: 1; }\n                     92.86% { opacity: 1; } 100% { opacity: 0.45; } }\n  @keyframes back-s { to { translate: -90px 20px; scale: 0.75; } }\n  @keyframes back-p { to { translate: -  14.5s forwards; }\n  .pin  { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round;\n          stroke-dasharray: 1 2; stroke-dashoffset: 1;\n          animation: draw 0.7s var(--ease-in-out) 7.95s both, pin-1 0.7s var(--ease-in-out) 9.15s forwards, pin-2 0.7s var(--ease-in-out) 14.75s forwards; }\n  @keyframes pout-1 { from { d: path(\"M 60 135 C 130 135, 150 70, 210 75 C 270 80, 280 125, 340 65\"); }\n                      to   { d: path(\"M 60 95 C 120 55, 170 150, 220 130 C 270 110, 290 60, 340 90\"); } }\n  @keyframes pout-2 { from { d: path(\"M 60 95 C 120 55, 170 150, 220 130 C 270 110, 290 60, 340 90\"); }\n                      to   { d: path(\"M 60 102.5 C 120 67.5, 170 142.5, 220 125 C 270 107.5, 290 67.5, 340 82.5\"); } }\n  @keyframes pband-1 { from { d: path(\"M 60 111 C 130 111, 150 46, 210 51 C 270 56, 280 101, 340 41 L 340 89 C 280 149, 270 104, 210 99 C 150 94, 130 159, 60 159 Z\"); }\n                       to   { d: path(\"M 60 71 C 120 31, 170 126, 220 106 C 270 86, 290 36, 340 66 L 340 114 C 290 84, 270 134, 220 154 C 170 174, 120 79, 60 119 Z\"); } }\n  @keyframes pband-2 { from { d: path(\"M 60 71 C 120 31, 170 126, 220 106 C 270 86, 290 36, 340 66 L 340 114 C 290 84, 270 134, 220 154 C 170 174, 120 79, 60 119 Z\"); }\n                       to   { d: path(\"M 60 78.5 C 120 43.5, 170 118.5, 220 101 C 270 83.5, 290 43.5, 340 58.5 L 340 106.5 C 290 91.5, 270 131.5, 220 149 C 170 166.5, 120 91.5, 60 126.5 Z\"); } }\n  @keyframes pdot-1 { to { translate: var(--ax) var(--ay); } }\n  @keyframes pdot-2 { from { translate: var(--ax) var(--ay); } to { translate: var(--bx) var(--by); } }\n  @keyframes pin-1  { from { d: path(\"M 60 270 C 130 270, 150 140, 210 150 C 270 160, 280 250, 340 130\"); }\n                      to   { d: path(\"M 60 190 C 120 110, 170 300, 220 260 C 270 220, 290 120, 340 180\"); } }\n  @keyframes pin-2  { from { d: path(\"M 60 190 C 120 110, 170 300, 220 260 C 270 220, 290 120, 340 180\"); }\n s=\"pdot\" r=\"8\" cx=\"286\" cy=\"195\" style=\"--at: 7.49s; --ax: 5px; --ay: -25px; --bx: 5px; --by: -24px\" />\n      <circle class=\"pdot\" r=\"8\" cx=\"306\" cy=\"184\" style=\"--at: 7.43s; --ax: 4px; --ay: -20px; --bx: 4px; --by: -22px\" />\n      <circle class=\"pdot\" r=\"8\" cx=\"329\" cy=\"159\" style=\"--at: 7.61s; --ax: 2px; --ay: 17px; --bx: 2px; --by: 8px\" />\n      <path class=\"pin\" pathLength=\"1\" d=\"M 60 270 C 130 270, 150 140, 210 150 C 270 160, 280 250, 340 130\" />\n    <\/svg>\n    <div class=\"kex\" style=\"left: 710px; top: 768px; --at: 6.9s\">a forecast<\/div>\n  <\/div>\n  <div class=\"ring r-needs\">\n    <div class=\"rl right\">user needs<\/div>\n    <svg viewBox=\"0 0 80 80\">\n      <circle cx=\"26\" cy=\"36\" r=\"10\" /><path d=\"M 6 76 C 6 54, 46 54, 46 76\" />\n      <path d=\"M 48 6 H 72 Q 77 6 77 11 V 29 Q 77 34 72 34 H 62 L 55 41 V 34 H 48 Q 43 34 43 29 V 11 Q 43 6 48 6 Z\" />\n      <path d=\"M 50 15 H 70\" /><path class=\"newline\" d=\"M 50 24 H 64\" />\n    <\/svg>\n  <\/div>\n  <div class=\"ring r-know\">\n    <div class=\"rl above\">stakeholder<br>knowledge<\/div>\n    <svg viewBox=\"0 0 80 80\">\n      <circle cx=\"54\" cy=\"24\" r=\"9\" /><path d=\"M 38 56 C 38 42, 70 42, 70 56\" />\n      <circle class=\"solid\" cx=\"30\" cy=\"32\" r=\"11\" /><path class=\"solid\" d=\"M 10 72 C 10 50, 50 50, 50 72 Z\" />\n    <\/svg>\n  <\/div>\n  <div class=\"ring r-infra\">\n    <div class=\"rl right\">infrastructure<br>requirements<\/div>\n    <svg viewBox=\"0 0 80 80\">\n      <rect x=\"10\" y=\"8\" width=\"60\" height=\"18\" rx=\"3\" /><rect x=\"10\" y=\"31\" width=\"60\" height=\"18\" rx=\"3\" /><rect x=\"10\" y=\"54\" width=\"60\" height=\"18\" rx=\"3\" />\n      <path d=\"M 20 17 H 22 M 20 40 H 22 M 20 63 H 22\" /><path d=\"M 48 17 H 60 M 48 40 H 60 M 48 63 H 60\" />\n    <\/svg>\n  <\/div>\n  <div class=\"ring r-expert\">\n    <div class=\"rl below\">domain<br>experts<\/div>\n    <svg viewBox=\"0 0 80 80\">\n      <path d=\"M 40 6 L 68 17 L 40 28 L 12 17 Z\" /><path d=\"M 64 19 V 31\" />\n      <circle cx=\"40\" cy=\"38\" r=\"10\" /><path d=\"M 18 78 C 18 56, 62 56, 62 78\" />\n    <\/svg>\n  <\/div>\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <g class=\"ar\" style=\"--at: 11.2s; --d: 0.5s; --out: 12.9s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1488 447 C 1496 398, 1556 392, 1590 438\" /><path class=\"ar-head\" d=\"M 1595 444 L 1573 433 L 1591 420 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 11.9s; --d: 0.5s; --out: 12.9s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1598 532 C 1600 576, 1574 600, 1542 602\" /><path class=\"ar-head\" d=\"M 1534 602 L 1555 590 L 1557 612 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 13.9s; --d: 0.35s; --out: 15.0s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1096 770 C 1060 772, 1040 800, 1034 844\" /><path class=\"ar-head\" d=\"M 1033 852 L 1025 829 L 1047 832 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 14.25s; --d: 0.35s; --out: 15.0s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1054 905 C 1090 905, 1116 880, 1120 832\" /><path class=\"ar-head\" d=\"M 1121 824 L 1130 847 L 1108 845 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 14.85s; --d: 0.3s; --out: 15.7s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1440 416 C 1450 380, 1500 372, 1540 374\" /><path class=\"ar-head\" d=\"M 1548 374 L 1525 384 L 1527 362 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 15.1s; --d: 0.3s; --out: 15.7s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1590 422 C 1592 455, 1565 485, 1512 490\" /><path class=\"ar-head\" d=\"M 1504 491 L 1525 478 L 1527 500 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 15.45s; --d: 0.25s; --out: 16.2s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1504 760 C 1550 760, 1580 800, 1586 846\" /><path class=\"ar-head\" d=\"M 1587 854 L 1573 834 L 1595 831 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 15.68s; --d: 0.25s; --out: 16.2s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1546 900 C 1510 900, 1482 880, 1474 832\" /><path class=\"ar-head\" d=\"M 1473 824 L 1487 844 L 1465 848 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 15.95s; --d: 0.2s; --out: 16.7s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1096 500 C 1060 492, 1040 465, 1033 424\" /><path class=\"ar-head\" d=\"M 1032 416 L 1046 436 L 1025 440 Z\" />\n    <\/g>\n    <g class=\"ar\" style=\"--at: 16.15s; --d: 0.2s; --out: 16.7s\">\n      <path class=\"ar-line\" pathLength=\"1\" d=\"M 1054 368 C 1100 368, 1138 388, 1149 410\" /><path class=\"ar-head\" d=\"M 1153 417 L 1133 402 L 1153 393 Z\" />\n    <\/g>\n  <\/svg>\n  <div class=\"statement in out\" style=\"--at: 0.3s; --out: 3.3s\">In 1980, Lehman described three kinds of program.<\/div>\n  <div class=\"statement in out\" style=\"--at: 3.5s; --out: 6.5s\"><b>S-type.<\/b> <em>Specified once, then finished.<\/em><\/div>\n  <div class=\"statement in out\" style=\"--at: 6.7s; --out: 9.8s\"><b>P-type.<\/b> <em>Fitted to a problem;<br>it changes when the problem does.<\/em><\/div>\n  <div class=\"statement in out\" style=\"--at: 10.0s; --out: 13.1s\"><b>E-type.<\/b> <em>Part of the world it serves; each changes the other.<\/em><\/div>\n  <div class=\"statement in out\" style=\"--at: 13.3s; --out: 16.4s\">Every change costs more than the last.<\/div>\n  <div class=\"veil\"><\/div>\n  <div class=\"statement in out\" style=\"--at: 16.7s; --out: 19.7s\">So how do you assure something<br>that never stops changing?<\/div>\n<\/div>\n<script>/*STAGE*/<\/script>\n<\/body>\n<\/html>\n"}, {"title": "2 The shape", "duration": 15600, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Scene 2: the shape<\/title>\n<style>/*THEME*/<\/style>\n<style>\n  /* Scene-local layout and motion only. Colours, type and component shapes come from theme.css.\n     The tangle, the nodes and the loop are one object. The bare-loop cards and hops exist from\n     the first frame, hidden and drawn small inside the system box; every animation on them runs\n     *from* that in-box state *to* their own styles, with fill `backwards`, so at the end nothing\n     holds a value on them and the last frame is the bare loop exactly.\n     Timeline (s)\n       0.0  the system box, still\n       0.3  \"You can't specify what it will do.\"\n       0.5  the tangle straightens into five straight strokes between six points (to 2.1)\n       2.0  six plain nodes open on those points: white, ink edge (to 2.6)\n       2.2  \"You can specify its shape.\"\n       2.4  the strokes become arrows (crossfade to the hops, to 2.9)\n       2.9  the nodes take the component colours (to 3.5)\n       3.4  the box dissolves (to 3.9)\n       3.8  nodes and arrows travel out and grow to the bare loop (to 5.0); names fade in 4.7\n       5.4  statement leaves\n       5.8  \"Declare the domain.\"  The file writes itself, 6.0 to 8.7\n       9.3  \"The people who know the domain can read it.\"  A person stands beside the file.\n       9.9  a token runs the loop; each card it reaches lights its declaration (to 13.5)\n      13.9  the person draws a check\n      14.6  statement, file and person leave; 15.0 to 15.6 the bare loop, still\n  */\n  /* ---------- beat 7: from the tangle to the loop ---------- */\n  /* Reference elements fade by colour (stroke, background, border to transparent), not by opacity,\n     so no compositor layer can change their antialiasing at the joins. The box and the tangle leave\n     the frame entirely (display: none) once faded, so nothing of them is left at the end. */\n  /* the tangle: each curve straightens onto the line between two node centres, then fades */\n  .tangle path { animation-duration: 1.6s, 0.4s; animation-delay: 0.5s, 2.5s; animation-fill-mode: forwards;\n                 animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1), ease-in; }\n  @keyframes tg-fade { to { stroke: transparent; } }\n  /* the box dissolves */\n  .tangle { animation: gone 0.01s 2.95s forwards; }\n  .system { animation: box-out 0.5s ease-in 3.4s forwards, gone 0.01s 3.95s forwards; }\n  @keyframes box-out { to { border-color: transparent; background-color: transparent; } }\n  @keyframes gone { to { display: none; } }\n  .tangle path:nth-child(1) { animation-name: tg-h4, tg-fade; }\n  .tangle path:nth-child(2) { animation-name: tg-h1, tg-fade; }\n  .tangle path:nth-child(3) { animation-name: tg-q, tg-fade; }\n  .tangle path:nth-child(4) { animation-name: tg-h2, tg-fade; }\n  .tangle path:nth-child(5) { animation-name: tg-h2, tg-fade; }\n  .tangle path:nth-child(6) { animation-name: tg-h3, tg-fade; }\n  .tangle path:nth-child(7) { animation-name: tg-h1, tg-fade; }\n  .tangle path:nth-child(8) { animation-name: tg-h4r, tg-fade; }\n  .tangle path:nth-child(9) { animation-name: tg-h3, tg-fade; }\n  @keyframes tg-h1  { to { d: path(\"M 1140 662 C 1167 662, 1193 662, 1220 662\"); } }\n  @keyframes tg-h2  { to { d: path(\"M 1220 662 C 1247 662, 1273 662, 1300 662\"); } }\n  @keyframes tg-h3  { to { d: path(\"M 1300 662 C 1327 662, 1353 662, 1380 662\"); } }\n  @keyframes tg-h4  { to { d: path(\"M 1380 662 C 1407 662, 1433 662, 1460 662\"); } }\n  @keyframes tg-h4r { to { d: path(\"M 1460 662 C 1433 662, 1407 662, 1380 662\"); } }\n  @keyframes tg-q   { to { d: path(\"M 1220 662 C 1220 634, 1220 606, 1220 578\"); } }\n  /* the cards: in the box (56 x 34, centred on the tangle's points), neutral, nameless */\n  .loop-1 { --bx: 1112px; --by: 645px; }\n  .loop-2 { --bx: 1192px; --by: 645px; }\n  .loop-3 { --bx: 1272px; --by: 645px; }\n  .loop-4 { --bx: 1352px; --by: 645px; }\n  .loop-5 { --bx: 1432px; --by: 645px; }\n  .loop-q { --bx: 1192px; --by: 561px; }\n  .loop-1, .loop-2, .loop-3, .loop-4, .loop-5, .loop-q {\n    animation: node-geo 3s 2s backwards,\n               node-tint 0.6s ease-in-out 2.9s backwards, node-name 0.5s ease-out 4.7s backwards;\n  }\n  /* notes have no border: their neutral ink edge is an inset outline */\n  .loop-1, .loop-3, .loop-5, .loop-q {\n    animation: node-geo 3s 2s backwards,\n               node-tint 0.6s ease-in-out 2.9s backwards, node-name 0.5s ease-out 4.7s backwards,\n               node-edge 0.6s ease-in-out 2.9s backwards;\n    outline-offset: -3px;\n  }\n  @keyframes node-geo {\n    0%   { visibility: hidden; left: calc(var(--bx) + 28px); top: calc(var(--by) + 17px); width: 0; height: 0; padding: 0;\n           animation-timing-function: cubic-bezier(0.22, 0.8, 0.24, 1); }\n    20%  { left: var(--bx); top: var(--by); width: 56px; height: 34px; padding: 0; }\n    60%  { left: var(--bx); top: var(--by); width: 56px; height: 34px; padding: 0;\n           animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n    /* 100%: the card's own place and size */\n  }\n  @keyframes node-tint { from { background: var(--flow); border-color: var(--ink); } }\n  @keyframes node-edge { from { outline: 3px solid var(--ink); } to { outline: 3px solid transparent; } }\n  @keyframes node-name { from { color: transparent; } }\n  /* the hops: arrows between the in-box nodes, then out with them (same timing as node-geo 60%..100%) */\n  svg.wires .hop-1 { animation: hop1-box 5s backwards, wire-in 0.4s ease-out 2.4s backwards; }\n  svg.wires .hop-2 { animation: hop2-box 5s backwards, wire-in 0.4s ease-out 2.4s backwards; }\n  svg.wires .hop-3 { animation: hop3-box 5s backwards, wire-in 0.4s ease-out 2.4s backwards; }\n  svg.wires .hop-4 { animation: hop4-box 5s backwards, wire-in 0.4s ease-out 2.4s backwards; }\n  svg.wires .wire.ask { animation: ask-box 5s backwards, wire-in 0.4s ease-out 2.4s backwards; }\n  @keyframes wire-in { from { stroke: transparent; } }\n  @keyframes hop1-box {\n    0%, 76% { d: path(\"M 1168 662 L 1170.41 662 Q 1174.03 662 1174.03 662 L 1174.03 662 L 1183.08 662 L 1183.08 662 Q 1183.08 662 1186.7 662 L 1187 662\");\n              animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n  }\n  @keyframes hop2-box {\n    0%, 76% { d: path(\"M 1248 662 L 1250.41 662 Q 1254.03 662 1254.03 662 L 1254.03 662 L 1263.08 662 L 1263.08 662 Q 1263.08 662 1266.7 662 L 1267 662\");\n              animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n  }\n  @keyframes hop3-box {\n    0%, 76% { d: path(\"M 1328 662 L 1330.41 662 Q 1334.03 662 1334.03 662 L 1334.03 662 L 1343.08 662 L 1343.08 662 Q 1343.08 662 1346.7 662 L 1347 662\");\n              animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n  }\n  @keyframes hop4-box {\n    0%, 76% { d: path(\"M 1408 662 L 1410.41 662 Q 1414.03 662 1414.03 662 L 1414.03 662 L 1423.08 662 L 1423.08 662 Q 1423.08 662 1426.7 662 L 1427 662\");\n              animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n  }\n  @keyframes ask-box {\n    0%, 76% { d: path(\"M 1220 601 L 1220 639\"); animation-timing-function: cubic-bezier(0.6, 0, 0.3, 1); }\n  }\n  /* the statement of beat 7: the first sentence steps back when the second arrives */\n  .st7 span { display: inline-block; }\n  .st7a { animation: rise var(--move) var(--ease) 0.3s both, dim 0.8s ease 2.2s both; }\n  @keyframes dim { to { color: var(--ink-soft); } }\n  /* ---------- beat 8: the feat file ---------- */\n  #feat { left: 330px; top: 532px; width: 1450px; height: 482px; padding: 0;\n          background: var(--flow); border: 2px solid var(--rule); border-radius: 8px; }\n  #feat .fname { position: absolute; left: 30px; top: 14px; font-family: var(--mono); font-size: 24px;\n                 color: var(--ink-soft); }\n  #feat .col { position: absolute; top: 60px; }\n  #feat .col.a { left: 30px; }\n  #feat .col.b { left: 744px; }\n  .ln { position: relative; height: 31px; padding-left: 24px; font-family: var(--mono); font-size: 24px;\n        line-height: 31px; white-space: pre; color: var(--ink);\n        animation: type 0.35s linear both; animation-delay: var(--at); }\n  .ln .k { color: var(--ink-soft); }\n  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -40px 0 -40px); } }\n  /* the colour bar of an item, one segment per line; first/last leave a gap between items */\n  .ln > b { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--c); }\n  .ln > b.f { top: 4px; border-radius: 2px 2px 0 0; }\n  .ln > b.l { bottom: 4px; border-radius: 0 0 2px 2px; }\n  /* a lit line: a band behind it, lit when the token reaches its card */\n  .ln > i { position: absolute; left: -12px; right: -16px; top: 0; bottom: 0; z-index: -1;\n            background: color-mix(in srgb, var(--accent) 17%, transparent);\n            animation: lit 1.0s ease both; animation-delay: var(--lt); }\n  .ln { isolation: isolate; }\n  @keyframes lit { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0.5; } }\n  /* ---------- beat 9: a reader ---------- */\n  #person { left: 140px; top: 560px; width: 170px; height: 440px; overflow: visible; }\n  #person .p { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }\n  #person .head { animation: nod 0.7s ease-in-out 13.9s both; }\n  @keyframes nod { 0%, 100% { translate: 0 0; } 45% { translate: 0 9px; } }\n  #person .arm { transform-origin: 85px 206px; transform-box: view-box;\n                 animation: raise 0.5s var(--ease) 13.5s both; }\n  @keyframes raise { from { rotate: 0deg; } to { rotate: -100deg; } }\n  #person .check { fill: none; stroke: var(--ok); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;\n                   stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.5s var(--ease-in-out) 14.0s both; }\n  /* rings around the card the token is at */\n  .ring { width: 290px; height: 112px; border: 3px solid var(--ink); opacity: 0;\n          animation: ring 1.0s ease both; animation-delay: var(--at); }\n  .ring.sq { border-radius: 13px; }\n  .ring.cap { border-radius: 56px; }\n  @keyframes ring { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }\n  #r1 { left: 131px;  top: 391px; }\n  #r2 { left: 473px;  top: 391px; }\n  #r3 { left: 815px;  top: 391px; }\n  #r4 { left: 1157px; top: 391px; }\n  #r5 { left: 1499px; top: 391px; }\n  #rq { left: 473px;  top: 253px; }\n  /* the token: one per hop, along the hop's own path */\n  .tok { left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--ink);\n         offset-path: var(--p); offset-rotate: 0deg;\n         animation: tok 0.5s linear both; animation-delay: var(--at); }\n  @keyframes tok {\n    0%   { offset-distance: 0%; opacity: 0; }\n    20%  { opacity: 1; }\n    80%  { opacity: 1; }\n    100% { offset-distance: 100%; opacity: 0; }\n  }\n  .statement u { text-decoration: none; font-style: normal; box-shadow: inset 0 -0.11em 0 var(--accent); }\n<\/style>\n<\/head>\n<body data-duration=\"15600\">\n<div class=\"stage\">\n  <div class=\"system\"><\/div>\n  <svg class=\"wires tangle\" viewBox=\"0 0 1920 1080\">\n    <path d=\"M 1150 480 C 1260 700, 1380 430, 1450 760\" />\n    <path d=\"M 1140 620 C 1300 520, 1330 780, 1460 560\" />\n    <path d=\"M 1180 770 C 1220 560, 1420 640, 1400 460\" />\n    <path d=\"M 1230 450 C 1180 620, 1460 700, 1300 790\" />\n    <path d=\"M 1145 700 C 1290 760, 1340 500, 1465 480\" />\n    <path d=\"M 1330 445 C 1250 560, 1250 700, 1420 780\" />\n    <path d=\"M 1160 540 C 1320 470, 1400 620, 1240 780\" />\n    <path d=\"M 1460 660 C 1340 600, 1260 660, 1150 760\" />\n    <path d=\"M 1270 470 C 1420 520, 1220 640, 1440 700\" />\n  <\/svg>\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <defs>\n      <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\" />\n      <\/marker>\n    <\/defs>\n    <path class=\"wire hop flat hop-1\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop flat hop-2\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop flat hop-3\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop flat hop-4\" marker-end=\"url(#ah)\" />\n    <path class=\"wire ask\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\" d=\"M 618 362 L 618 394\" />\n  <\/svg>\n  <div class=\"note query loop-q\"><span class=\"kind\">query<\/span>get_balance<\/div>\n  <div class=\"note command loop-1\"><span class=\"kind\">command<\/span>transfer_funds<\/div>\n  <div class=\"fn procedure loop-2\"><span class=\"kind\">procedure<\/span>execute_transfer<\/div>\n  <div class=\"note event loop-3\"><span class=\"kind\">event<\/span>transfer_rejected<\/div>\n  <div class=\"fn policy loop-4\"><span class=\"kind\">policy<\/span>notify_on_rejection<\/div>\n  <div class=\"note command loop-5\"><span class=\"kind\">command<\/span>send_notice<\/div>\n  <div class=\"statement st7 out\" style=\"--out: 5.4s\"><span class=\"st7a\">You can't validate that what it will do is correct,<\/span><br><span class=\"in\" style=\"--at: 2.2s\"><u>but<\/u> you can specify its shape.<\/span><\/div>\n  <div class=\"statement in out\" style=\"--at: 5.8s; --out: 8.9s\">Declare the domain.<\/div>\n  <div id=\"feat\" class=\"in fade out\" style=\"--at: 5.8s; --out: 14.6s\">\n    <div class=\"fname in fade\" style=\"--at: 6.0s\">transfer.feat.yaml<\/div>\n    <div class=\"col a\">\n<div class=\"ln\" style=\"--at: 6.15s\"><span class=\"k\">commands:<\/span><\/div>\n<div class=\"ln command\" style=\"--at: 6.26s; --lt: 9.9s\"><b class=\"f l\"><\/b><i><\/i>  transfer_funds: someone wants to move money<\/div>\n<div class=\"ln command\" style=\"--at: 6.37s; --lt: 13.5s\"><b class=\"f l\"><\/b><i><\/i>  send_notice: tell the customer<\/div>\n<div class=\"ln\" style=\"--at: 6.48s\"><span class=\"k\">events:<\/span><\/div>\n<div class=\"ln event\" style=\"--at: 6.59s\"><b class=\"f l\"><\/b>  funds_debited: money left the account<\/div>\n<div class=\"ln event\" style=\"--at: 6.70s\"><b class=\"f l\"><\/b>  funds_credited: money reached the account< ss=\"l\"><\/b><i><\/i>    <span class=\"k\">emits:<\/span> [send_notice]<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"statement in out\" style=\"--at: 9.3s; --out: 14.6s\">The people who know the domain can read it.<\/div>\n  <svg id=\"person\" class=\"in fade out\" style=\"--at: 9.4s; --out: 14.6s\" viewBox=\"0 0 170 440\">\n    <g class=\"head\"><circle class=\"p\" cx=\"85\" cy=\"150\" r=\"34\" /><\/g>\n    <path class=\"p\" d=\"M 85 184 L 85 330 M 85 330 L 50 432 M 85 330 L 120 432 M 85 206 L 42 290\" />\n    <path class=\"p arm\" d=\"M 85 206 L 132 284\" />\n    <path class=\"check\" pathLength=\"1\" d=\"M 46 54 L 74 82 L 130 18\" />\n  <\/svg>\n  <div id=\"rq\" class=\"ring sq\" style=\"--at: 10.5s\"><\/div>\n  <div id=\"r1\" class=\"ring sq\" style=\"--at: 9.9s\"><\/div>\n  <div id=\"r2\" class=\"ring cap\" style=\"--at: 10.5s\"><\/div>\n  <div id=\"r3\" class=\"ring sq\" style=\"--at: 11.5s\"><\/div>\n  <div id=\"r4\" class=\"ring cap\" style=\"--at: 12.5s\"><\/div>\n  <div id=\"r5\" class=\"ring sq\" style=\"--at: 13.5s\"><\/div>\n  <div class=\"tok\" style=\"--p: var(--hop1-flat); --at: 10.0s\"><\/div>\n  <div class=\"tok\" style=\"--p: var(--hop2-flat); --at: 11.0s\"><\/div>\n  <div class=\"tok\" style=\"--p: var(--hop3-flat); --at: 12.0s\"><\/div>\n  <div class=\"tok\" style=\"--p: var(--hop4-flat); --at: 13.0s\"><\/div>\n<\/div>\n<script>/*STAGE*/<\/script>\n<\/body>\n<\/html>\n"}, {"title": "3 The line", "duration": 15200, "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Scene 3: the line<\/title>\n<style>/*THEME*/<\/style>\n<style>\n  /* Scene-local only. Colours, type and motion come from theme.css.\n     Rest-frame elements keep their markup exactly. Their entrances are set here by selector and are\n     filled backwards only, so once an entrance is over no animation is in effect on them and they render\n     as in scenes/00_rest_frame.html. The hops use the theme's .hop.sag (filled forwards to the dip). */\n  .stage > .line { animation: grow-x 0.9s var(--ease-in-out) 0.3s backwards; }\n  .stage > .line-label.above { animation: fade-in 0.8s ease 1.0s backwards; }\n  .stage > .line-label.below { animation: fade-in 0.8s ease 1.15s backwards; }\n  .stage > .infra-queue-a { animation: rise 0.8s var(--ease) 1.0s backwards; }\n  .stage > .infra-log     { animation: rise 0.8s var(--ease) 1.15s backwards; }\n  .stage > .infra-queue-b { animation: rise 0.8s var(--ease) 1.3s backwards; }\n  .stage > .infra-db      { animation: fade-in 0.8s ease 5.6s backwards; }   /* last, quietly */\n  .stage > .infra-run     { animation: fade-in 0.8s ease 5.9s backwards; }\n  /* DIZZY lands on the line with weight (beat 12): it falls, stops dead at 1.35x, holds through the\n     peak, and settles to its plain size. It is lifted above the dimming veil only while the animation\n     runs (z-index in the keyframes): a z-index in its own style changes its corner pixels at the cut. */\n  .stage > .line-name {\n    transform-origin: 100% 50%;\n    animation: land 3.55s linear 11.05s backwards;\n  }\n  @keyframes land {\n    0%     { z-index: 1; opacity: 0; translate: 0 -90px; scale: 1.35; animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }\n    3.5%   { opacity: 1; }\n    9.86%  { translate: 0 0; scale: 1.35; animation-timing-function: linear; }\n    85.92% { scale: 1.35; animation-timing-function: var(--ease-in-out); }\n    100%   { z-index: 1; opacity: 1; translate: 0 0; scale: 1; }\n  }\n  /* Things that come and go. The element's own opacity is 0; it enters (filled backwards), a hold keeps\n     it visible, and it leaves; nothing is in effect before or after. --at, --out; --fi, --fo durations. */\n  .stage > .shown, .stage > .hl {\n    opacity: 0;\n    animation-name: var(--in-name, fade-in), hold, leave;\n    animation-duration: var(--fi, 0.4s), calc(var(--out) - var(--at) - var(--fi, 0.4s)), var(--fo, 0.4s);\n    animation-delay: var(--at), calc(var(--at) + var(--fi, 0.4s)), var(--out);\n    animation-timing-function: var(--ease), linear, ease-in;\n    animation-fill-mode: backwards, none, none;\n  }\n  .stage > .shown { --in-name: rise; --fi: var(--move); }\n  @keyframes hold  { from, to { opacity: 1; } }\n  @keyframes leave { from { opacity: 1; } to { opacity: 0; } }\n  /* beat 10: the token, one crossing of the chain, one element per hop, pausing inside the box */\n  .token {\n    left: 0; top: 0; width: 16px; height: 16px;   /* 16, not 18: crossing the bottom of a queue box it then only grazes the word \"queue\" */\n    border-radius: 50%;\n    background: var(--ink);\n    offset-rotate: 0deg;\n    opacity: 0;\n    animation: token 0.85s linear none;\n    animation-delay: var(--at);\n  }\n  .token-1 { offset-path: var(--hop1-dip); }\n  .token-2 { offset-path: var(--hop2-dip); }\n  .token-3 { offset-path: var(--hop3-dip); }\n  .token-4 { offset-path: var(--hop4-dip); }\n  /* 46% of a dip is 14px inside its box, on the way down, clear of the box's own text */\n  @keyframes token {\n    0%   { offset-distance: 0%;   opacity: 0; animation-timing-function: var(--ease-in-out); }\n    5%   { opacity: 1; }\n    35%  { offset-distance: 46%;  animation-timing-function: linear; }\n    70%  { offset-distance: 46%;  animation-timing-function: var(--ease-in-out); }\n    95%  { offset-distance: 100%; opacity: 1; }\n    100% { offset-distance: 100%; opacity: 0; }\n  }\n  /* the box the token is in lights briefly: an accent edge and a faint accent wash over the box */\n  .light {\n    top: 716px; height: 76px;\n    border: 3px solid var(--accent);\n    border-radius: 6px;\n    background: color-mix(in srgb, var(--accent) 14%, transparent);\n    --fi: 0.15s; --fo: 0.3s;\n  }\n  .light-qa  { left: 347px;  width: 200px; }\n  .light-log { left: 704px;  width: 510px; }\n  .light-qb  { left: 1373px; width: 200px; }\n  /* beat 11: what each property is about, outlined in the accent */\n  .ring-box { border: 3px solid var(--accent); border-radius: 11px; }\n  .about-log { left: 700px; top: 712px; width: 518px; height: 84px; }\n  .about-db  { left: 502px; top: 836px; width: 232px; height: 88px; }\n  .leader-db { left: 738px; top: 896px; width: 30px; height: 3px; background: var(--accent); }\n  .crossing {\n    top: 606px; width: 32px; height: 32px;\n    border: 3px solid var(--accent);\n    border-radius: 50%;\n    --in-name: pop;\n  }\n  /* beat 11 and 12: the three properties. The two lines of the third are separate elements, so that they\n     can close up into one line when they gather: across first, then down, so they never overlap.\n     --gx/--gy: where it goes in the contract; --gat: when it starts to go. */\n  .prop {\n    height: 41px;\n    font-family: var(--sans);\n    font-size: 34px;\n    line-height: 41px;\n    font-weight: 500;\n    white-space: pre;\n    color: var(--ink);\n    opacity: 0;\n  }\n  .stage > .prop {\n    animation-name: rise, hold, leave, go, stay;\n    animation-duration: var(--move), calc(var(--out) - var(--at) - var(--move)), var(--quick),\n                        var(--move), calc(var(--out) + var(--quick) - var(--gat) - var(--move));\n    animation-delay: var(--at), calc(var(--at) + var(--move)), var(--out),\n                     var(--gat), calc(var(--gat) + var(--move));\n    animation-timing-function: var(--ease), linear, ease-in, var(--ease-in-out), linear;\n    animation-fill-mode: backwards, none, none, none, none;\n  }\n  .stage > .prop.two-step { animation-name: rise, hold, leave, go-two-step, stay; }\n  @keyframes go   { from { translate: 0 0; } to { translate: var(--gx) var(--gy); } }\n  @keyframes go-two-step {\n    0%   { translate: 0 0; }\n    50%  { translate: var(--gx) 0; }\n    100% { translate: var(--gx) var(--gy); }\n  }\n  @keyframes stay { from, to { translate: var(--gx) var(--gy); } }\n  .p1  { left: 809px;  top: 808px; }                                   /* under the event log */\n  .p2  { left: 776px;  top: 877px; }                                   /* right of the database */\n  .p3a { left: 1506px; top: 520px; }                                   /* at the crossings, right of hop 4 */\n  .p3b { left: 1506px; top: 561px; }\n  /* beat 12: the veil dims everything but the line, the name, the terms and the statement */\n  .veil {\n    left: 0; top: 0; width: 1920px; height: 1080px;\n    background: var(--paper);\n    opacity: 0;\n    animation: veil 4.3s linear 10.3s none;\n  }\n  @keyframes veil {\n    0%     { opacity: 0; animation-timing-function: var(--ease); }\n    13.95% { opacity: 0.45; }\n    86.05% { opacity: 0.45; animation-timing-function: ease-in-out; }\n    100%   { opacity: 0; }\n  }\n  /* the line at the peak: 10px, accent, swept across the full width; then back to 4px ink, then gone,\n     leaving the plain .line beneath it */\n  .peak-line {\n    left: 0; top: 617px; width: 1920px; height: 10px;\n    background: var(--accent);\n    transform-origin: 0 50%;\n    opacity: 0;\n    animation: peak-line 4.3s linear 10.3s none;\n  }\n  @keyframes peak-line {\n    0%     { opacity: 1; scale: 0 1; background: var(--accent); animation-timing-function: var(--ease-in-out); }\n    16.28% { scale: 1 1; }\n    88.37% { scale: 1 1; background: var(--accent); animation-timing-function: var(--ease-in-out); }\n    97.67% { opacity: 1; scale: 1 0.4; background: var(--dizzy); }\n    100%   { opacity: 0; scale: 1 0.4; background: var(--dizzy); }\n  }\n  /* the contract's terms, hung from the name */\n  .terms {\n    left: 1120px; top: 710px; width: 660px; height: 219px;\n    background: var(--flow);\n    border: 2px solid var(--rule);         /* quiet edges: the terms pass over them on the way in */\n    border-radius: 0 0 8px 8px;\n  }\n  .terms-top { left: 1120px; top: 710px; width: 660px; height: 4px; background: var(--accent); }\n  .terms { opacity: 0; animation: terms 4.2s linear 10.4s none; }\n  /* the accent edge it hangs from arrives once the third term has dropped through it */\n  .terms-top { opacity: 0; animation: terms-top 3.5s linear 11.1s none; }\n  @keyframes terms-top {\n    0%     { opacity: 0; }\n    11.43% { opacity: 1; }\n    92.86% { opacity: 1; }\n    100%   { opacity: 0; }\n  }\n  /* the stem drops from the name once the name has landed and the third term has passed */\n  .stem {\n    left: 1682px; top: 627px; width: 4px; height: 84px; background: var(--accent);\n    transform-origin: 50% 0;\n    opacity: 0;\n    animation: stem 3.3s linear 11.3s none;\n  }\n  @keyframes stem {\n    0%     { opacity: 1; scale: 1 0; animation-timing-function: var(--ease); }\n    9.09%  { scale: 1 1; }\n    92.42% { opacity: 1; }\n    100%   { opacity: 0; scale: 1 1; }\n  }\n  @keyframes terms {\n    0%   { opacity: 0; }\n    9.52%  { opacity: 1; }\n    94.05% { opacity: 1; }   /* the panel leaves after its terms */\n    100% { opacity: 0; }\n  }\n<\/style>\n<\/head>\n<body data-duration=\"15200\">\n<div class=\"stage\">\n  <svg class=\"wires\" viewBox=\"0 0 1920 1080\">\n    <defs>\n      <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\n        <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"context-stroke\" />\n      <\/marker>\n    <\/defs>\n    <path class=\"wire hop sag hop-1\" style=\"--at: 1.2s\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop sag hop-2\" style=\"--at: 1.45s\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop sag hop-3\" style=\"--at: 1.7s\" marker-end=\"url(#ah)\" />\n    <path class=\"wire hop sag hop-4\" style=\"--at: 1.95s\" marker-end=\"url(#ah)\" />\n    <path class=\"wire ask\" marker-start=\"url(#ah)\" marker-end=\"url(#ah)\" d=\"M 618 362 L 618 394\" />\n  <\/svg>\n  <div class=\"note query loop-q\"><span class=\"kind\">query<\/span>get_balance<\/div>\n  <div class=\"note command loop-1\"><span class=\"kind\">command<\/span>transfer_funds<\/div>\n  <div class=\"fn procedure loop-2\"><span class=\"kind\">procedure<\/span>execute_transfer<\/div>\n  <div class=\"note event loop-3\">
