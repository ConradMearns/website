 "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "At noon my brother John came to me, and I corrected as well as I could his Greek speech", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "wherein he do express very great kindness for my brother, and my father intends that my brother shall go to him.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "he gave my father directions what to do about getting my brother an exhibition, and spoke very well of my brother.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}], "type": "goal", "text": "Advance brother John's education (speech for the Apposition, place at Cambridge, an exhibition)", "subject": "sub-pepys", "pending": true, "trace": "absorbing-satisfied", "observability": "checkable", "ascription": "intrinsic", "status": "none", "gap": true}, "g-free-parl": {"id": "g-free-parl", "supported_by": ["g-secluded", "st-city-pressure"], "spans": [{"quote": "to acquaint him with their desires for a free and full Parliament, which is at present the desires, and the hopes, and expectation of all", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "Great talk that many places have declared for a free Parliament", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "All the world is at a loss to think what Monk will do: the City saying that he will be for them, and the Parliament saying he will be for them.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "calling on Mr. Fage, who told me how the City have some hopes of Monk.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "The news this day is a letter that speaks absolutely Monk’s concurrence with this Parliament, and nothing else, which yet I hardly believe.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "There seem es of her being with child, but on the last day of the year", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}], "type": "goal", "text": "Have a child (hopes of his wife being with child)", "subject": "sub-pepys", "pending": true, "mode": "achieve", "trace": "oscillating", "observability": "checkable", "ascription": "intrinsic", "status": "none", "gap": true}, "g-estate": {"id": "g-estate", "supported_by": ["sol-accounts", "st-implicit-g-estate"], "spans": [{"quote": "My own private condition very handsome, and esteemed rich, but indeed very poor", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}], "type": "goal", "text": "Maintain and grow his private estate (condition handsome, esteemed rich)", "subject": "sub-pepys", "pending": true, "mode": "maintain", "fundamental": true, "trace": "oscillating", "observability": "checkable", "ascription": "intrinsic", "status": "none", "gap": true}, "sol-accounts": {"id": "sol-accounts", "supported_by": [], "spans": [{"quote": "I staid at home all the afternoon, looking over my accounts", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "I sat up late making up my accounts before he go.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "Up early in finishing my accounts", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "spent the afternoon in casting up my accounts, and do find myself to be worth L40 and more, which I did not think, but am afraid that I have forgot something.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}], "type": "solution", "recipe": "cast up and balance personal accounts", "ttl": "7d", "pending": true, "status": "none"}, "g-office-keep": {"id": "g-office-keep", "supported_by": ["st-hold-office"], "spans": [{"quote": "besides my goods of my house, and my office, which at present is somewhat uncertain", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "I confess I was at a great loss, all the day after, to bethink myself how to carry this business.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "she told me she was afraid that Mr. Downing may have a mind to pick some hole in my coat", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}, {"quote": "for I was afraid that he would have told me something of removing me from my office; but he did not, but that he would do me any service that lay in his power.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}], "type": "goal", "text": "Keep his clerkship at the Exchequer office (not be removed)", "subject": "sub-pepys", "pending": true, "mode": "maintain", "trace": "oscillating", "observability": "checkable", "ascription": "intrinsic", "status": "none", "gap": true}, "st-hold-office": {"id": "st-hold-office", "supported_by": [], "spans": [{"quote": "but I think it not safe yet to change this for a public employment.", "source": "corpus/sample-pepys-jan1660-full.md", "role": "states"}], "type": "strategy", "text": "Hold the present clerkship rather than exchange it for an unsettled public employment", "pending": true, "status": "none"}, "g-clerk-council": {"id": "g-clerk-council", "supported_by": [], "spans": [{"quote": "that he had got me to be one of the Clerks of the Council; at which I was a little stumbled, and could not tell what to do", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}, {"quote": "I could discern that Hawly had a mind that I would get to be Clerk of the Council, I suppose that he might have the greater salary", "source": "corpus/sample-pepys-jan1660-full.md", "role": "reported"}], "type": "goal", "text": "Pepys to become one of the Clerks of the Council", "subject": "sub-pepys", "pending": true, "trace": "absorbing-satisfied", "observability": "checkable", "ascription": "ascribed", "status": "none", "gap": true}, "g-pay-debts": {"id": "g-pay-debt function __boot() {

function quadrant(n) {
  if (n.type !== "goal" || !n.trace || !n.observability) return null;
  if (n.trace === "absorbing-satisfied")
    return n.observability === "checkable" ? "task" : "noise";
  return n.observability === "checkable" ? "obj" : "fund";
}

function edgesHTML(id, G) {

    `<div class="quote">“${esc(s.quote)}”<span class="src">${esc(s.source)}</span></div>`).join("") +
    (e.note ? `<div class="edge-note">${esc(e.note)}</div>` : "");
  Object.entries(G.supports_meta || {}).forEach(([key, m]) => {
    const [p, c] = key.split("<-");
    if (p === id) rows.push(`<details class="e-supports"><summary>supported by ${esc(c)}</summary>${quote(m)}</details>`);
    if (c === id) rows.push(`<details class="e-supports"><summary>supports ${esc(p)}</summary>${quote(m)}</details>`);
  });
  G.relates.forEach(r => {
    if (r.frm === id) rows.push(`<details class="e-${esc(r.effect)}"><summary>⇄ ${esc(r.effect)} ${esc(r.to)}</summary>${quote(r)}</details>`);
    if (r.to === id) rows.push(`<details class="e-${esc(r.effect)}"><summary>⇄ ${esc(r.effect === "helps" ? "helped" : r.effect === "hurts" ? "hurt" : "broken")} by ${esc(r.frm)}</summary>${quote(r)}</details>`);
  });
  return rows.length ? `<div class="edges">${rows.join("")}</div>` : "";
}

function treeHTML(G, q) {
  const N = G.nodes;
  const isKid = new Set();
  Object.values(N).forEach(n => n.supported_by.forEach(c => isKid.add(c)));
  const roots = Object.keys(N).filter(id => !isKid.has(id));
  const match = n => !q || n.id.toLowerCase().includes(q) ||
    (n.text || n.name || "").toLowerCase().includes(q);
  const anyMatch = id => match(N[id]) || N[id].supported_by.some(anyMatch);
  function li(id) {
    const n = N[id];
    if (!showTasks && quadrant(n) === "task") return "";
    if (q && !anyMatch(id)) return "";
    const kids = n.supported_by.map(li).join("");
    const st = n.pending ? "pending" : (n.status || "none");
    return `<li class="node${n.pending ? " pending" : ""}" data-id="${esc(id)}">
      <div class="row" role="button" tabindex="0">

        ${n.mode ? `<span class="badge mode">${esc(n.mode)}</span>` : ""}
        ${quadrant(n) ? `<span class="badge q-${quadrant(n)}">${QUAD[quadrant(n)]}</span>` : ""}

      </div>
      <div class="detail">
        <div class="meta-row">${esc(n.type)}${n.subject ? " · subject: " + esc(n.subject) : ""}${n.grade ? " · " + esc(n.grade) : ""}${n.trace ? " · " + esc(n.trace) : ""}${n.observability ? " · " + esc(n.observability) : ""}${n.ascription ? " · " + esc(n.ascription) : ""}${n.pending ? " · pending approval" : ""}</div>
        ${(n.spans || []).map(s => `<div class="quote">“${esc(s.quote)}”<span class="src">${esc(s.source)}</span></div>`).join("")}
        ${edgesHTML(id, G)}
      </div>
      ${kids ? `<ul>${kids}</ul>` : ""}</li>`;
  }
  return roots.map(li).join("");
}

// ---- dual network views ----
function mkNet(canvas, G) {
  const ctx = canvas.getContext("2d");
  const S = { G, canvas, ctx, nodes: [], byId: {}, edges: [],
              heat: 1, sel: null, drag: null, tx: 0, ty: 0, scale: 1 };
  const ids = Object.keys(G.nodes).filter(id =>
    showTasks || quadrant(G.nodes[id]) !== "task");
  const W = canvas.clientWidth || 400, H = canvas.clientHeight || 300;
  ids.forEach((id, i) => {
    const a = 2.39996 * i, r = 14 * Math.sqrt(i + 1);
    S.byId[id] = { id, n: G.nodes[id], x: W / 2 + r * Math.cos(a),
                   y: H / 2 + r * Math.sin(a), vx: 0, vy: 0 };
  });
  S.nodes = Object.values(S.byId);
  ids.forEach(p => G.nodes[p].supported_by.forEach(c => {
    if (S.byId[c]) S.edges.push({ a: S.byId[p], b: S.byId[c], kind: "supports" }); }));
  G.relates.forEach(r => { if (S.byId[r.frm] && S.byId[r.to])
    S.edges.push({ a: S.byId[r.frm], b: S.byId[r.to], kind: r.effect }); });
  if (layout === "layers") layerize(S);
  return S;
}

function layerize(S) {
  const G = S.G, W = S.canvas.clientWidth || 400, H = S.canvas.clientHeight || 300;
  const kids = {}, hasParent = new Set();
  Object.keys(G.nodes).forEach(p => G.nodes[p].supported_by.forEach(c => {
    (kids[p] = kids[p] || []).push(c); hasParent.add(c); }));
  const depth = {}, placed = new Set([...Object.keys(kids),
    ...Object.keys(G.nodes).filter(n => hasParent.has(n))]);
  function dep(n, path) {
    if (path.has(n)) return 0;
    if (depth[n] !== undefined) return depth[n];
    let d = 0;
    Object.keys(kids).forEach(p => { if ((kids[p] || []).includes(n))
      d = Math.max(d, dep(p, new Set([...path, n])) + 1); });
    return depth[n] = d;
  }
  placed.forEach(n => dep(n, new Set()));
  const maxD = Math.max(0, ...Object.values(depth));
  const layers = [];
  S.nodes.forEach(n => {
    const L = placed.has(n.id) ? (depth[n.id] || 0) : maxD + 1;
    (layers[L] = layers[L] || []).push(n);
  });
  const nL = layers.length;
  layers.forEach((row, li) => {
    if (!row) return;
    row.sort((a, b2) => a.id < b2.id ? -1 : 1);
    row.forEach((n, xi) => {
      n.x = (W / (row.length + 1)) * (xi + 1);
      n.y = 40 + (H - 100) * (nL > 1 ? li / (nL - 1) : 0.5);
      n.vx = n.vy = 0;
    });
  });
  S.heat = 0;
}

function tick(S) {
  const N = S.nodes, W = S.canvas.clientWidth || 400, H = S.canvas.clientHeight || 300;
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const a = N[i], b2 = N[j];
    let dx = a.x - b2.x, dy = a.y - b2.y, d2 = dx * dx + dy * dy || 1;
    if (d2 < 260 * 260) { const f = 2600 / d2;
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f; b2.vx -= dx * f; b2.vy -= dy * f; }
  }
  S.edges.forEach(e => {
    const rest = e.kind === "supports" ? 78 : 130,
          k = e.kind === "supports" ? 0.035 : 0.008;
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y,
          d = Math.sqrt(dx * dx + dy * dy) || 1, f = k * (d - rest) / d;
    e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f;
  });
  N.forEach(n => {
    n.vx += (W / 2 - n.x) * 0.004; n.vy += (H / 2 - n.y) * 0.004;
    if (n !== S.drag) { n.x += n.vx * S.heat; n.y += n.vy * S.heat; }
    n.vx *= 0.72; n.vy *= 0.72;
  });
  S.heat = Math.max(0.12, S.heat * 0.995);
}

function draw(S) {
  const cvs = S.canvas, ctx = S.ctx, dpr = devicePixelRatio || 1,
        W = cvs.clientWidth, H = cvs.clientHeight;
  if (!W) return;
  if (cvs.width !== W * dpr) { cvs.width = W * dpr; cvs.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.translate(S.tx, S.ty); ctx.scale(S.scale, S.scale);
  const q = $("filter").value.toLowerCase();
  const hit = n => !q || n.id.toLowerCase().includes(q) ||
    (n.n.text || n.n.name || "").toLowerCase().includes(q);
  S.edges.forEach(e => {
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y);
    if (e.kind === "supports") { ctx.setLineDash([]);

    else { ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6; ctx.globalAlpha = .8;
      ctx.strokeStyle = cssVar(e.kind === "helps" ? "--pass" : "--fail"); }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (e.kind === "supports") {
      const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2,
            dx = e.a.x - e.b.x, dy = e.a.y - e.b.y, d = Math.hypot(dx, dy) || 1;
      ctx.beginPath(); ctx.moveTo(mx, my);
      ctx.lineTo(mx - (dx / d) * 7 - (dy / d) * 3.5, my - (dy / d) * 7 + (dx / d) * 3.5);
      ctx.lineTo(mx - (dx / d) * 7 + (dy / d) * 3.5, my - (dy / d) * 7 - (dx / d) * 3.5);
      ctx.closePath(); ctx.fillStyle = cssVar("--ink-dim"); ctx.globalAlpha = .55;
      ctx.fill(); ctx.globalAlpha = 1; }
  });
  ctx.font = "10px " + cssVar("--mono").split(",")[0];
  S.nodes.forEach(n => {
    const qd = quadrant(n.n);
    const col = cssVar(qd === "task" ? "--fail" : qd === "fund" ? "--star"
                       : TYPECOL[n.n.type] || "--ink-dim"),

    else if (qd === "fund") { ctx.moveTo(n.x, n.y - R - 1); ctx.lineTo(n.x + R + 1, n.y);

      ctx.strokeStyle = cssVar("--accent"); ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = cssVar(n.n.pending ? "--ink-dim" : "--ink");
    ctx.fillText(n.id, n.x + R + 4, n.y + 3);
    ctx.globalAlpha = 1;
  });
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

  let pointer = null;
  const pick = (x, y) => {
    const S = sims[key], px = (x - S.tx) / S.scale, py = (y - S.ty) / S.scale;
    return S.nodes.find(n => (n.x - px) ** 2 + (n.y - py) ** 2 < 144);
  };
  canvas.addEventListener("pointerdown", e => {
    if (!sims) return;
    const S = sims[key], r = canvas.getBoundingClientRect(),
          x = e.clientX - r.left, y = e.clientY - r.top;
    const n = pick(x, y);
    pointer = { x, y, n, moved: false };
    if (n) { S.drag = n; S.heat = Math.max(S.heat, 0.5); }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!pointer || !sims) return;
    const S = sims[key], r = canvas.getBoundingClientRect(),
          x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.hypot(x - pointer.x, y - pointer.y) > 4) pointer.moved = true;
    if (pointer.n) { pointer.n.x = (x - S.tx) / S.scale; pointer.n.y = (y - S.ty) / S.scale; }
    else { S.tx += x - pointer.x; S.ty += y - pointer.y; pointer.x = x; pointer.y = y; }
  });
  canvas.addEventListener("pointerup", () => {
    if (!sims) return;
    const S = sims[key];
    if (pointer && !pointer.moved) { S.sel = pointer.n || null;
      Object.keys(sims).forEach(k2 => { if (k2 !== key) sims[k2].sel = null; });
      netDetail(S.sel, S.G); }
    S.drag = null; pointer = null;
  });
  canvas.addEventListener("wheel", e => {
    if (!sims) return;
    e.preventDefault();
    const S = sims[key], f = e.deltaY < 0 ? 1.12 : 0.89;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    S.tx = x - (x - S.tx) * f; S.ty = y - (y - S.ty) * f; S.scale *= f;
  }, { passive: false });
}

function render() {
  const cand = graphOf("candidacy"), fin = graphOf("final");
  const q = $("filter").value.toLowerCase();
  $("hdr-label").textContent = bases[b];
  const kinds = {};
  Object.values(cand.nodes).forEach(n => kinds[n.type] = (kinds[n.type] || 0) + 1);
  const nTasks = Object.values(cand.nodes).filter(n => quadrant(n) === "task").length;
  $("stats").innerHTML =
    Object.entries(kinds).map(([k, v]) => `<span><b>${v}</b> ${esc(k)}</span>`).join("") +
    `<span><b>${cand.relates.length}</b> relates</span>` +
    `<span><b>${(cand.gaps || []).length}</b> gaps</span>` +
    (fin.implicit ? `<span style="color:var(--star)"><b>${fin.implicit}</b> implicit strategies in final</span>` : "") +
    (fin.voided ? `<span style="color:var(--star)"><b>${fin.voided}</b> subjects voided in final</span>` : "") +
    (!showTasks && nTasks ? `<span style="color:var(--fail)"><b>${nTasks}</b> tasks hidden</span>` : "");
  $("cand-n").textContent = `· ${Object.keys(cand.nodes).length} nodes`;
  $("final-n").textContent = `· ${Object.keys(fin.nodes).length} nodes`;
  $("tree-cand").innerHTML = treeHTML(cand, q);
  $("tree-final").innerHTML = treeHTML(fin, q);
  $("gaps").innerHTML = (cand.gaps || []).length ?
    `<h2>Open questions</h2>` + cand.gaps.map(x =>
      `<div class="gap-q"><span class="anchor">${esc(x.anchor || "")}</span> ${esc(x.question)}</div>`).join("") : "";
  $("foot").textContent = [cand.meta?.doc_sha && "doc " + cand.meta.doc_sha,
    cand.meta?.prompt_sha && "constitution " + cand.meta.prompt_sha,
    cand.meta?.variant, cand.meta?.model, "generated " + DATA.generated_at]
    .filter(Boolean).join(" · ");
  if (mode === "net") { buildSims(); }
}

function setMode(m) {
  mode = m;
  $("vtree").classList.toggle("on", m === "tree");
  $("vnet").classList.toggle("on", m === "net");
  $("vtree").setAttribute("aria-selected", m === "tree");
  $("vnet").setAttribute("aria-selected", m === "net");
  $("treeduo").classList.toggle("hidden", m !== "tree");
  $("netwrap").classList.toggle("hidden", m !== "net");
  $("layoutseg").classList.toggle("hidden", m !== "net");
  if (m === "net") { buildSims(); loop(); }
}
$("vtree").onclick = () => setMode("tree");
$("vnet").onclick = () => setMode("net");
$("vtasks").onclick = () => {
  showTasks = !showTasks;
  $("vtasks").classList.toggle("on", showTasks);
  $("vtasks").setAttribute("aria-pressed", showTasks);
  render();
};
$("lforce").onclick = () => { layout = "force";
  $("lforce").classList.add("on"); $("llayers").classList.remove("on");
  if (sims) Object.values(sims).forEach(S => S.heat = 0.9); };
$("llayers").onclick = () => { layout = "layers";
  $("llayers").classList.add("on"); $("lforce").classList.remove("on");
  if (sims) Object.values(sims).forEach(layerize); };

$("pick").innerHTML = bases.map((x, i) =>
  `<option value="${i}">${esc(x)}</option>`).join("");
$("pick").onchange = e => { b = +e.target.value; netDetail(null); render(); };
$("filter").oninput = render;
bindNet($("net-cand"), "cand");
bindNet($("net-final"), "final");
document.addEventListener("click", e => {
  const t = e.target.closest(".kids-toggle");
  if (t) { const ul = t.closest(".node").querySelector(":scope > ul");
    ul.classList.toggle("hidden");
    t.textContent = ul.classList.contains("hidden") ? "▸" : "▾";
    e.stopPropagation(); return; }
  const r = e.target.closest(".row");
  if (r) r.closest(".node").classList.toggle("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("row"))
    e.target.closest(".node").classList.toggle("open");
});
render();
}
(function start() {
  const go = () => {
    try { __boot(); } catch (e) {
      const pre = document.createElement("pre");
      pre.style.cssText = "color:#c44;padding:12px;white-space:pre-wrap;font-size:12px";
      pre.textContent = "viewer failed to start: " + ((e && e.stack) || e);
      document.body.appendChild(pre);
    }
  };
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", go);
  else go();
})();
</script>
