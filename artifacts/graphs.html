        <span class="glyph g-${st}">${GLY[st] || "?"}</span>

        <span class="ntext">${esc(n.text || n.name || n.recipe || "")}</span>
        ${n.fundamental ? '<span class="star">★</span>' : ""}
        ${n.mode ? `<span class="badge mode">${esc(n.mode)}</span>` : ""}
        ${quadrant(n) ? `<span class="badge q-${quadrant(n)}">${QUAD[quadrant(n)]}</span>` : ""}
        ${n.ascription === "ascribed" ? '<span class="badge ascribed">ascribed</span>' : ""}
        ${n.implicit ? '<span class="badge">implicit</span>' : ""}
        ${n.gap ? `<span class="badge gap">gap</span>` : ""}
        ${kids ? `<button class="kids-toggle" aria-label="collapse">▾</button>` : ""}
      </div>
      <div class="detail">
        <div class="meta-row">${esc(n.type)}${n.subject ? " · subject: " + esc(n.subject) : ""}${n.grade ? " · " + esc(n.grade) : ""}${n.trace ? " · " + esc(n.trace) : ""}${n.observability ? " · " + esc(n.observability) : ""}${n.ascription ? " · " + esc(n.ascription) : ""}${n.pending ? " · pending approval" : ""}</div>
        ${(n.spans || []).map(s => `<div class="quote">“${esc(s.quote)}”<span class="src">${esc(s.source)}</span></div>`).join("")}
        ${(n.proposals || []).map(p => `<div class="proposal"><span class="tag">proposed measurement · ${esc(p.model || "machine")} · not from corpus</span>${esc(p.proposal)}${p.recipe_sketch ? `<div class="rec">${esc(p.recipe_sketch)}${p.cadence ? " · " + esc(p.cadence) : ""}${p.grade_estimate ? " · " + esc(p.grade_estimate) : ""}</div>` : ""}</div>`).join("")}
        ${edgesHTML(id, G)}
      </div>
      ${kids ? `<ul>${kids}</ul>` : ""}</li>`;
  }
  return roots.map(li).join("");
}

// ---- dual network views ----
function mkNet(canvas, G) {
  const ctx = canvas.getContext("2d");
  const S = { G, canvas, ctx, nodes: [], byId: {}, edges: [],
              heat: 1, sel: null, drag: null, tx: 0, ty: 0, scale: 1 };
  const ids = Object.keys(G.nodes).filter(id =>
    showTasks || quadrant(G.nodes[id]) !== "task");
  const W = canvas.clientWidth || 400, H = canvas.clientHeight || 300;
  ids.forEach((id, i) => {
    const a = 2.39996 * i, r = 14 * Math.sqrt(i + 1);
    S.byId[id] = { id, n: G.nodes[id], x: W / 2 + r * Math.cos(a),
                   y: H / 2 + r * Math.sin(a), vx: 0, vy: 0 };
  });
  S.nodes = Object.values(S.byId);
  ids.forEach(p => G.nodes[p].supported_by.forEach(c => {
    if (S.byId[c]) S.edges.push({ a: S.byId[p], b: S.byId[c], kind: "supports" }); }));
  G.relates.forEach(r => { if (S.byId[r.frm] && S.byId[r.to])
    S.edges.push({ a: S.byId[r.frm], b: S.byId[r.to], kind: r.effect }); });
  applyLayout(S);
  return S;
}

function tidy(S) {
  // Crossing-minimizing layout for forest-shaped graphs:
  // 1. split into connected components (all edges)
  // 2. per component: spanning tree (supports edges preferred), tidy
  //    Reingold-Tilford placement — tree edges cross zero times
  // 3. shelf-pack components side by side, then fit the whole scene to view
  const G = S.G, W = S.canvas.clientWidth || 400, H = S.canvas.clientHeight || 300;
  const byId = S.byId;
  const adj = {}, supKids = {}, supParent = new Set();
  S.nodes.forEach(n => adj[n.id] = new Set());
  S.edges.forEach(e => { adj[e.a.id].add(e.b.id); adj[e.b.id].add(e.a.id);
    e._tree = false; });
  Object.keys(G.nodes).forEach(p => (G.nodes[p].supported_by || []).forEach(c => {
    if (byId[p] && byId[c]) { (supKids[p] = supKids[p] || []).push(c); supParent.add(c); }}));
  // components
  const compOf = {}, comps = [];
  S.nodes.forEach(n => {
    if (compOf[n.id] !== undefined) return;
    const comp = []; const stack = [n.id];
    while (stack.length) {
      const x = stack.pop();
      if (compOf[x] !== undefined) continue;
      compOf[x] = comps.length; comp.push(x);
      adj[x].forEach(y => stack.push(y));
    }
    comps.push(comp);
  });
  const HG = 96, VG = 104, PAD = 70;
  const treeEdge = {};
  const boxes = comps.map(comp => {
    const inComp = new Set(comp);
    // root: supports-root with largest reach, else highest degree
    const rootCands = comp.filter(n => (supKids[n] || []).length && !supParent.has(n));
    const root = (rootCands.length ? rootCands : comp)
      .sort((a, b) => (adj[b].size - adj[a].size))[0];
    // spanning tree BFS, supports-children first
    const tree = {}, depthT = {}, seen = new Set([root]), order = [root];
    depthT[root] = 0;
    const queue = [root];
    while (queue.length) {
      const n = queue.shift();
      const supC = (supKids[n] || []).filter(c => inComp.has(c) && !seen.has(c));
      const othC = [...adj[n]].filter(c => !seen.has(c) && !supC.includes(c));
      tree[n] = [...supC, ...othC];
      tree[n].forEach(c => { seen.add(c); depthT[c] = depthT[n] + 1;
        treeEdge[n + ">" + c] = treeEdge[c + ">" + n] = true;
        order.push(c); queue.push(c); });
    }
    // RT-lite: leaves take consecutive slots; internals at mean of children
    let slot = 0;
    const px = {};
    (function place(n) {
      const cs = tree[n] || [];
      if (!cs.length) { px[n] = slot++; return; }
      cs.forEach(place);
      px[n] = cs.reduce((s, c) => s + px[c], 0) / cs.length;
    })(root);
    let maxD = 0;
    comp.forEach(n => maxD = Math.max(maxD, depthT[n] ?? 0));
    comp.forEach(n => {
      byId[n].x = (px[n] ?? 0) * HG;
      byId[n].y = (depthT[n] ?? 0) * VG;
      byId[n].vx = byId[n].vy = 0;
    });
    return { comp, w: Math.max(slot - 1, 0) * HG + PAD, h: maxD * VG + PAD };
  });
  // shelf packing (widest first), target width ~ golden-ish canvas aspect
  const totalA = boxes.reduce((s, b) => s + b.w * b.h, 0);
  const targetW = Math.max(Math.sqrt(totalA * (W / Math.max(H, 1))) * 1.15, 300);
  const idx = boxes.map((_, i) => i).sort((a, b) => boxes[b].h - boxes[a].h);
  let cx = 0, cy = 0, rowH = 0, sceneW = 0;
  idx.forEach(i => {
    const b = boxes[i];
    if (cx > 0 && cx + b.w > targetW) { cy += rowH; cx = 0; rowH = 0; }
    b.comp.forEach(n => { byId[n].x += cx; byId[n].y += cy; });
    cx += b.w; rowH = Math.max(rowH, b.h);
    sceneW = Math.max(sceneW, cx);
  });
  const sceneH = cy + rowH;
  // mark tree edges for drawing
  S.edges.forEach(e => { e._tree = !!treeEdge[e.a.id + ">" + e.b.id]; });
  // fit scene to canvas
  const sc = Math.min((W - 40) / Math.max(sceneW, 1), (H - 50) / Math.max(sceneH, 1), 1.15);
  S.scale = sc;
  S.tx = (W - sceneW * sc) / 2 + 10;
  S.ty = (H - sceneH * sc) / 2 + 14;
  S.heat = 0;
}

function applyLayout(S) {
  if (layout === "tidy") tidy(S);
}

function tick(S) {
  const N = S.nodes, W = S.canvas.clientWidth || 400, H = S.canvas.clientHeight || 300;
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const a = N[i], b2 = N[j];
    let dx = a.x - b2.x, dy = a.y - b2.y, d2 = dx * dx + dy * dy || 1;
    if (d2 < 260 * 260) { const f = 2600 / d2;
      const d = Math.sqrt(d2); dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f; b2.vx -= dx * f; b2.vy -= dy * f; }
  }
  S.edges.forEach(e => {
    const rest = e.kind === "supports" ? 78 : 130,
          k = e.kind === "supports" ? 0.035 : 0.008;
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y,
          d = Math.sqrt(dx * dx + dy * dy) || 1, f = k * (d - rest) / d;
    e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f;
  });
  N.forEach(n => {
    n.vx += (W / 2 - n.x) * 0.004; n.vy += (H / 2 - n.y) * 0.004;
    if (n !== S.drag) { n.x += n.vx * S.heat; n.y += n.vy * S.heat; }
    n.vx *= 0.72; n.vy *= 0.72;
  });
  S.heat = Math.max(0.12, S.heat * 0.995);
}

function draw(S) {
  const cvs = S.canvas, ctx = S.ctx, dpr = devicePixelRatio || 1,
        W = cvs.clientWidth, H = cvs.clientHeight;
  if (!W) return;
  if (cvs.width !== W * dpr) { cvs.width = W * dpr; cvs.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.translate(S.tx, S.ty); ctx.scale(S.scale, S.scale);
  const q = $("filter").value.toLowerCase();
  const hit = n => !q || n.id.toLowerCase().includes(q) ||
    (n.n.text || n.n.name || "").toLowerCase().includes(q);
  const cx0 = W / 2, cy0 = H / 2;
  S.edges.forEach(e => {
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y);
    if (layout === "tidy" && e._tree) {
      const my = (e.a.y + e.b.y) / 2;                 // vertical-tangent cubic
      ctx.bezierCurveTo(e.a.x, my, e.b.x, my, e.b.x, e.b.y);
    } else if (layout === "tidy") {
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;   // non-tree edge: bowed arc
      const mx = (e.a.x + e.b.x) / 2 - dy * 0.22,
            my = (e.a.y + e.b.y) / 2 + dx * 0.22;
      ctx.quadraticCurveTo(mx, my, e.b.x, e.b.y);
    } else {
      ctx.lineTo(e.b.x, e.b.y);
    }
    if (e.kind === "supports") { ctx.setLineDash([]);
      ctx.strokeStyle = cssVar("--ink-dim"); ctx.lineWidth = 1.4; ctx.globalAlpha = .55; }
    else { ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6; ctx.globalAlpha = .8;
      ctx.strokeStyle = cssVar(e.kind === "helps" ? "--pass" : "--fail"); }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (e.kind === "supports") {
      const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2,
            dx = e.a.x - e.b.x, dy = e.a.y - e.b.y, d = Math.hypot(dx, dy) || 1;
      ctx.beginPath(); ctx.moveTo(mx, my);
      ctx.lineTo(mx - (dx / d) * 7 - (dy / d) * 3.5, my - (dy / d) * 7 + (dx / d) * 3.5);
      ctx.lineTo(mx - (dx / d) * 7 + (dy / d) * 3.5, my - (dy / d) * 7 - (dx / d) * 3.5);
      ctx.closePath(); ctx.fillStyle = cssVar("--ink-dim"); ctx.globalAlpha = .55;
      ctx.fill(); ctx.globalAlpha = 1; }
  });
  ctx.font = "10px " + cssVar("--mono").split(",")[0];
  S.nodes.forEach(n => {
    const qd = quadrant(n.n);
    const col = cssVar(qd === "task" ? "--fail" : qd === "fund" ? "--star"
                       : TYPECOL[n.n.type] || "--ink-dim"),
          R = n.n.type === "goal" ? 7 : 5.5;
    ctx.globalAlpha = hit(n) ? 1 : 0.18;
    ctx.beginPath();
    if (qd === "task") ctx.rect(n.x - R + 1, n.y - R + 1, 2 * R - 2, 2 * R - 2);
    else if (qd === "fund") { ctx.moveTo(n.x, n.y - R - 1); ctx.lineTo(n.x + R + 1, n.y);
      ctx.lineTo(n.x, n.y + R + 1); ctx.lineTo(n.x - R - 1, n.y); ctx.closePath(); }
    else ctx.arc(n.x, n.y, R, 0, 7);
    if (n.n.pending) { ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.fillStyle = cssVar("--card"); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = col; ctx.fill(); }
    if (n.n.fundamental) { ctx.beginPath(); ctx.arc(n.x, n.y, R + 3.5, 0, 7);
      ctx.strokeStyle = cssVar("--star"); ctx.lineWidth = 1.5; ctx.stroke(); }
    if (n === S.sel) { ctx.beginPath(); ctx.arc(n.x, n.y, R + 6, 0, 7);
      ctx.strokeStyle = cssVar("--accent"); ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = cssVar(n.n.pending ? "--ink-dim" : "--ink");
    ctx.fillText(n.id, n.x + R + 4, n.y + 3);
    ctx.globalAlpha = 1;
  });
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

let sims = null;
function buildSims() {
  sims = { cand: mkNet($("net-cand"), graphOf("candidacy")),
           final: mkNet($("net-final"), graphOf("final")) };
}
function loop() {
  if (mode !== "net" || !sims) return;
  Object.values(sims).forEach(S => { if (layout === "force") tick(S); draw(S); });
  requestAnimationFrame(loop);
}

function netDetail(n, G) {
  if (!n) { $("netdetail").innerHTML = ""; return; }
  $("netdetail").innerHTML = `<div class="detail">
    <div class="meta-row">${esc(n.id)} · ${esc(n.n.type)}${n.n.subject ? " · " + esc(n.n.subject) : ""}${n.n.trace ? " · " + esc(n.n.trace) : ""}${n.n.observability ? " · " + esc(n.n.observability) : ""}${n.n.ascription ? " · " + esc(n.n.ascription) : ""}${n.n.pending ? " · pending" : ""}</div>
    <div>${esc(n.n.text || n.n.name || n.n.recipe || "")}</div>
    ${(n.n.spans || []).map(s => `<div class="quote">“${esc(s.quote)}”<span class="src">${esc(s.source)}</span></div>`).join("")}
    ${(n.n.proposals || []).map(p => `<div class="proposal"><span class="tag">proposed measurement · ${esc(p.model || "machine")} · not from corpus</span>${esc(p.proposal)}${p.recipe_sketch ? `<div class="rec">${esc(p.recipe_sketch)}</div>` : ""}</div>`).join("")}
    ${edgesHTML(n.id, G)}</div>`;
}

function bindNet(canvas, key) {
  let pointer = null;
  const pick = (x, y) => {
    const S = sims[key], px = (x - S.tx) / S.scale, py = (y - S.ty) / S.scale;
    return S.nodes.find(n => (n.x - px) ** 2 + (n.y - py) ** 2 < 144);
  };
  canvas.addEventListener("pointerdown", e => {
    if (!sims) return;
    const S = sims[key], r = canvas.getBoundingClientRect(),
          x = e.clientX - r.left, y = e.clientY - r.top;
    const n = pick(x, y);
    pointer = { x, y, n, moved: false };
    if (n) { S.drag = n; S.heat = Math.max(S.heat, 0.5); }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!pointer || !sims) return;
    const S = sims[key], r = canvas.getBoundingClientRect(),
          x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.hypot(x - pointer.x, y - pointer.y) > 4) pointer.moved = true;
    if (pointer.n) { pointer.n.x = (x - S.tx) / S.scale; pointer.n.y = (y - S.ty) / S.scale; }
    else { S.tx += x - pointer.x; S.ty += y - pointer.y; pointer.x = x; pointer.y = y; }
  });
  canvas.addEventListener("pointerup", () => {
    if (!sims) return;
    const S = sims[key];
    if (pointer && !pointer.moved) { S.sel = pointer.n || null;
      Object.keys(sims).forEach(k2 => { if (k2 !== key) sims[k2].sel = null; });
      netDetail(S.sel, S.G); }
    S.drag = null; pointer = null;
  });
  canvas.addEventListener("wheel", e => {
    if (!sims) return;
    e.preventDefault();
    const S = sims[key], f = e.deltaY < 0 ? 1.12 : 0.89;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    S.tx = x - (x - S.tx) * f; S.ty = y - (y - S.ty) * f; S.scale *= f;
  }, { passive: false });
}

function render() {
  const cand = graphOf("candidacy"), fin = graphOf("final");
  const q = $("filter").value.toLowerCase();
  $("hdr-label").textContent = bases[b];
  const kinds = {};
  Object.values(cand.nodes).forEach(n => kinds[n.type] = (kinds[n.type] || 0) + 1);
  const nTasks = Object.values(cand.nodes).filter(n => quadrant(n) === "task").length;
  $("stats").innerHTML =
    Object.entries(kinds).map(([k, v]) => `<span><b>${v}</b> ${esc(k)}</span>`).join("") +
    `<span><b>${cand.relates.length}</b> relates</span>` +
    `<span><b>${(cand.gaps || []).length}</b> gaps</span>` +
    (fin.implicit ? `<span style="color:var(--star)"><b>${fin.implicit}</b> implicit strategies in final</span>` : "") +
    (fin.voided ? `<span style="color:var(--star)"><b>${fin.voided}</b> subjects voided in final</span>` : "") +
    (!showTasks && nTasks ? `<span style="color:var(--fail)"><b>${nTasks}</b> tasks hidden</span>` : "");
  $("cand-n").textContent = `· ${Object.keys(cand.nodes).length} nodes`;
  $("final-n").textContent = `· ${Object.keys(fin.nodes).length} nodes`;
  $("tree-cand").innerHTML = treeHTML(cand, q);
  $("tree-final").innerHTML = treeHTML(fin, q);
  $("gaps").innerHTML = (cand.gaps || []).length ?
    `<h2>Open questions</h2>` + cand.gaps.map(x =>
      `<div class="gap-q${x.derived ? "" : " authored"}"><span class="gkind">${x.derived ? "derived" : "authored"} · ${esc(x.kind)}</span><span class="anchor">${esc(x.anchor || "")}</span> ${esc(x.question)}</div>`).join("") : "";
  $("foot").textContent = [cand.meta?.doc_sha && "doc " + cand.meta.doc_sha,
    cand.meta?.prompt_sha && "constitution " + cand.meta.prompt_sha,
    cand.meta?.variant, cand.meta?.model, "generated " + DATA.generated_at]
    .filter(Boolean).join(" · ");
  if (mode === "net") { buildSims(); }
}

function setMode(m) {
  mode = m;
  $("vtree").classList.toggle("on", m === "tree");
  $("vnet").classList.toggle("on", m === "net");
  $("vtree").setAttribute("aria-selected", m === "tree");
  $("vnet").setAttribute("aria-selected", m === "net");
  $("treeduo").classList.toggle("hidden", m !== "tree");
  $("netwrap").classList.toggle("hidden", m !== "net");
  $("layoutseg").classList.toggle("hidden", m !== "net");
  if (m === "net") { buildSims(); loop(); }
}
$("vtree").onclick = () => setMode("tree");
$("vnet").onclick = () => setMode("net");
$("vtasks").onclick = () => {
  showTasks = !showTasks;
  $("vtasks").classList.toggle("on", showTasks);
  $("vtasks").setAttribute("aria-pressed", showTasks);
  render();
};
function setLayout(l) {
  layout = l;
  ["lforce", "ltidy"].forEach((id, i) =>
    $(id).classList.toggle("on", l === ["force", "tidy"][i]));
  if (!sims) return;
  if (l === "force") Object.values(sims).forEach(S => { S.scale = 1; S.tx = 0; S.ty = 0; S.heat = 0.9; });
  else Object.values(sims).forEach(applyLayout);
}
$("lforce").onclick = () => setLayout("force");
$("ltidy").onclick = () => setLayout("tidy");

$("pick").innerHTML = bases.map((x, i) =>
  `<option value="${i}">${esc(x)}</option>`).join("");
$("pick").onchange = e => { b = +e.target.value; netDetail(null); render(); };
$("filter").oninput = render;
bindNet($("net-cand"), "cand");
bindNet($("net-final"), "final");
document.addEventListener("click", e => {
  const t = e.target.closest(".kids-toggle");
  if (t) { const ul = t.closest(".node").querySelector(":scope > ul");
    ul.classList.toggle("hidden");
    t.textContent = ul.classList.contains("hidden") ? "▸" : "▾";
    e.stopPropagation(); return; }
  const r = e.target.closest(".row");
  if (r) r.closest(".node").classList.toggle("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("row"))
    e.target.closest(".node").classList.toggle("open");
});
render();
}
(function start() {
  const go = () => {
    try { __boot(); } catch (e) {
      const pre = document.createElement("pre");
      pre.style.cssText = "color:#c44;padding:12px;white-space:pre-wrap;font-size:12px";
      pre.textContent = "viewer failed to start: " + ((e && e.stack) || e);
      document.body.appendChild(pre);
    }
  };
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", go);
  else go();
})();
